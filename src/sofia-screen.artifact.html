<title>Sofia Gleda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- loaded non-blocking: a stalled font request must never hold up first paint.
     Every rule declares a real fallback stack, so the page is fully usable
     before (or without) the webfonts. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap"></noscript>

<style>
:root{
  --ink:#0C0A0F; --ink-2:#141018; --ink-3:#1C1622; --ink-4:#28202F;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --fg:#F4EFF6; --fg-2:#B6ABBC; --fg-3:#7E7386;
  --crimson:#E0163A; --gild:#D9B23C;
  --accent:var(--crimson); --on-accent:#fff;
  --shadow:0 20px 48px rgba(0,0,0,.55);
  --r:12px; --r-lg:20px;
  color-scheme:dark;
}
:root[data-surface="theatre"]{ --accent:var(--gild); --on-accent:#17110B; }
/* Dark mode is forced — there is no light theme. The former
   `@media (prefers-color-scheme: light)` and `:root[data-theme="light"]` blocks
   were removed so a device set to light does not recolour the app; `color-scheme:dark`
   on :root above keeps native controls, scrollbars, and form fields dark too. */

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; background:var(--ink); color:var(--fg);
  font-family:"Onest","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
.wrap{max-width:none; margin:0; padding-inline:16px}
@media(min-width:900px){ .wrap{padding-inline:40px} }
@media(min-width:1440px){ .wrap{padding-inline:56px} }
/* the header spans the full viewport, content fluid to 100% */
.bar .wrap{padding-inline:14px}
@media(min-width:900px){ .bar .wrap{padding-inline:28px} }
@media(min-width:1440px){ .bar .wrap{padding-inline:40px} }

/* ---------- header ---------- */
/* Desktop: position:sticky, single row. Mobile: two rows (logo centred + controls).
   The logo row is allowed to scroll away; the controls row stays pinned via a
   negative top offset equal to the logo row height (28px logo + 14px padding-block + 10px gap = 52px).
   --logo-row-h is the single source of truth so the pinned offset cannot drift. */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:60;
  background:color-mix(in srgb,var(--ink) 92%,transparent); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding-block:14px}
/* three zones: brand left · search centre · controls right */
.bar-in{display:grid; grid-template-columns:1fr minmax(0,auto) 1fr; align-items:center; gap:18px}
.brand{display:flex; align-items:center; gap:9px; justify-self:start; min-width:0;
  background:none; border:0; padding:0; margin:0; cursor:pointer; font:inherit; -webkit-tap-highlight-color:transparent}
.brand-logo{height:clamp(32px,3.2vw,42px); width:auto; flex:0 1 auto; min-width:0; max-width:100%;
  object-fit:contain; display:block; transition:filter .15s}
.brand:hover .brand-logo{filter:brightness(1.12)}
.brand b{font-family:Oswald,"Arial Narrow",sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,30px);
  letter-spacing:.15em; text-transform:uppercase; color:var(--accent); line-height:1; white-space:nowrap;
  transition:opacity .15s, filter .15s}
.brand:hover b{filter:brightness(1.12)}
.brand:active b{opacity:.7}
.brand span{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap}
.bar-controls{display:flex; align-items:center; gap:8px; justify-self:end}
@media(max-width:820px){ .brand span{display:none} }
/* ── Mobile layout (≤760px) ──
   Row 1: logo centred (scrolls away).
   Row 2: [seg toggle expands] [lang 42px] [search icon 42px] [burger 42px] — one line, never wraps.
   Row 3: full-width search field (only when S.searchOpen).
   --logo-row-h = 28px logo + 14px padding-block-top + 10px gap between rows = 52px.
   The negative top hides the logo row; the controls row is then 8px below safe-area-inset-top. */
/* ── Mobile layout (≤760px) — JS also detects this and renders mobile HTML ── */
/* Row 1: 3-column grid — left placeholder | logo centred | lang button right.
   Row 2: seg toggle (fills width) + search icon.
   Row 3 (optional): full-width open search field when S.searchOpen.
   --logo-row-h = 42px row (the language button is the tallest item) + 14px padding-block-top + 10px gap = 66px. */
@media(max-width:760px){
  :root{ --logo-row-h:66px } /* 42px row (language button) + 14px top padding + 10px gap */
  .bar{top:calc(env(safe-area-inset-top,0px) - var(--logo-row-h) + 8px)}
  .bar-row-logo{display:grid; grid-template-columns:42px 1fr 42px; align-items:center; margin-bottom:10px; gap:0}
  .bar-row-logo .brand{justify-self:center; grid-column:2}
  .bar-row-logo .lang-right{grid-column:3; justify-self:end}
  .bar-row-controls{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; overflow:hidden}
  .bar-row-search{width:100%}
  .brand b{font-size:19px; letter-spacing:.08em}
  .brand-logo{height:28px}
  /* mobile search icon button — inherits .iconb; only expanded override needed here */
  /* mobile open search field */
  .bar-row-search .search{position:relative; width:100%; max-width:none}
  /* mobile period header: date range on its own line, no wrap */
  .phead-title{font-size:clamp(28px,7vw,36px)}
  .phead-dates{display:block!important; white-space:nowrap; font-size:clamp(15px,4.5vw,20px)}
}
/* ── Segmented toggle — FIXED equal halves, language-independent ──
   Total fixed width: 220px desktop / auto-expands on mobile to fill remaining space.
   Height: 44px. Each half: 1fr grid cell with icon + label, accent on active. */
.seg{display:grid; grid-template-columns:1fr 1fr; background:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex:0 0 auto; width:220px}
.seg button{display:flex; align-items:center; justify-content:center; gap:6px; height:40px; border-radius:999px; font-size:13px; font-weight:600; color:var(--fg-2); white-space:nowrap; transition:background .18s,color .18s; padding:0 8px; overflow:hidden}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:700}
.seg button svg{flex:0 0 18px; width:18px; height:18px}
/* mobile: seg fills remaining width (must come AFTER the base width:220px rule) */
@media(max-width:760px){ .seg{flex:1 1 0!important; min-width:0; width:auto!important} }
/* at very narrow viewports, drop the SVG icons from toggle to save space */
@media(max-width:350px){ .seg button svg{display:none} }
/* windowed desktop (761–1439px) with the search open (.seg-q): the toggle shrinks
   to its two icons, in step with the search field, so the logo and the field keep
   their room (below ~1000px the logo was squeezed, at 780px the bar overflowed).
   Full-screen widths keep the labels; mobile opens the search on its own row. */
@media(min-width:761px) and (max-width:1439px){
  .seg{transition:width .22s ease-out}
  .seg button{transition:background .18s,color .18s,gap .22s ease-out}
  .seg .seg-l{display:inline-block; max-width:7em; overflow:hidden; transition:max-width .22s ease-out, opacity .22s ease-out}
  .seg.seg-q{width:98px}
  .seg.seg-q button{gap:0}
  .seg.seg-q .seg-l{max-width:0; opacity:0}
}
.iconb{width:42px; height:42px; flex:0 0 42px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg-2); font-size:13px; font-weight:700; display:grid; place-items:center}
.iconb:hover{border-color:var(--line-2); color:var(--fg)}
.search-icon-btn.expanded{border-color:var(--accent); color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,var(--ink-3))}

/* ---------- controls ---------- */
/* Desktop: search is the expand-on-demand panel, not always visible.
   The iconb search-icon-btn lives in bar-controls (far right-ish).
   When expanded, .desk-search-wrap grows into view from the right side.
   Item 2: smooth animation — opacity fades in with width; JS adds/removes .open */
.desk-search-wrap{display:flex; align-items:center; gap:0; overflow:hidden; max-width:0; opacity:0;
  transition:max-width .22s ease-out, opacity .22s ease-out}
.desk-search-wrap.open{max-width:420px; opacity:1}
/* mobile search row: animated height. Default display:none keeps #q-m out of
   layout (bounding_box()===null for tests). JS sets display:block before adding
   .open to trigger the CSS transition, then restores display:none after close. */
.bar-row-search{display:none; overflow:hidden; max-height:0; opacity:0;
  transition:max-height .22s ease-out, opacity .22s ease-out}
.bar-row-search.sr-visible{display:block} /* JS adds this before animating open */
.bar-row-search.open{max-height:64px; opacity:1}
@media (prefers-reduced-motion:reduce){
  .desk-search-wrap,.bar-row-search{transition:none!important}
}
.desk-search-wrap .search{position:relative; width:420px; max-width:420px; min-width:0}
.search input{width:100%; padding:11px 40px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg); font:inherit; font-size:15px}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{outline:none; border-color:var(--accent)}
.search .mag{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:15px; pointer-events:none}
.search .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:16px;
  width:24px; height:24px; border-radius:50%; display:none; place-items:center}
.search.has .clr{display:grid}
.search.search-mob-open .clr{display:grid}
/* .burger removed — drawer is opened by .fab and period-banner link only */
.drawer-scrim{position:fixed; inset:0; z-index:100; background:rgba(5,3,7,.6); backdrop-filter:blur(3px)}
.drawer{position:fixed; top:0; right:0; bottom:0; z-index:101; width:min(380px,88vw);
  background:var(--ink-2); border-left:1px solid var(--line); overflow-y:auto;
  padding:18px 18px calc(28px + env(safe-area-inset-bottom,0px)); box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer h3{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--fg-3); margin:20px 0 9px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.drawer h3:first-of-type{margin-top:6px}
.drawer-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:4px}
.drawer-top b{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.14em; text-transform:uppercase}
.dclose{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:14px; color:var(--fg-2)}
.chipwrap{display:flex; gap:6px; flex-wrap:wrap}
.mrow{display:flex; gap:6px; margin-bottom:9px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal button{aspect-ratio:1; border-radius:8px; border:1px solid transparent; background:var(--ink-3);
  font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg-2); display:grid; place-items:center; position:relative}
.cal button:hover{border-color:var(--line-2)}
.cal button[disabled]{opacity:.26; cursor:default; background:transparent}
.cal button.has::after{content:""; position:absolute; bottom:4px; width:3px; height:3px; border-radius:50%; background:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.cal button[aria-pressed="true"]::after{background:var(--on-accent)}
.cal button.inrange{background:color-mix(in srgb,var(--accent) 26%,transparent); color:var(--fg-1); border-radius:0}
.cal button.rstart{border-top-left-radius:8px; border-bottom-left-radius:8px}
.cal button.rend{border-top-right-radius:8px; border-bottom-right-radius:8px}
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:8px}
.calmon{font-size:13px; font-weight:600; color:var(--fg-1); text-align:center; flex:1}
.calarrow{width:32px; height:32px; flex:none; border-radius:8px; border:1px solid var(--line-2);
  background:var(--ink-3); color:var(--fg-1); font-size:17px; line-height:1; cursor:pointer; display:grid; place-items:center}
.calarrow:hover:not([disabled]){border-color:var(--accent); color:var(--accent)}
.calarrow[disabled]{opacity:.3; cursor:default}
.calhint{margin-top:9px; font-size:11px; color:var(--fg-3); text-align:center; min-height:14px}
.caldow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px}
.caldow span{text-align:center; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3)}
.applyb{width:100%; margin-top:22px}
.until{font-size:11px; color:var(--fg-3); margin-top:7px; line-height:1.45}
.lastcheck{font-size:10.5px; letter-spacing:.06em; color:var(--fg-3); margin-top:16px; padding-top:12px; border-top:1px solid var(--line)}
.controls{padding-block:14px 4px; display:flex; flex-direction:column; gap:10px}
.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto; min-width:58px; padding:6px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--ink-2); text-align:center; line-height:1.2; transition:border-color .15s,background .15s}
.day:hover{border-color:var(--line-2)}
.day[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.day .dow{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
.day .dnum{display:block; font-family:Oswald,sans-serif; font-size:16px; font-weight:600}
.day .dall{font-family:Oswald,sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.06em}
.fbar{display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
.fbar::-webkit-scrollbar{display:none}
.sbar{position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:10px;
  padding:9px 12px; background:color-mix(in srgb,var(--ink-2) 94%,transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.sback{display:flex; align-items:center; gap:7px; padding:7px 13px 7px 9px; border-radius:999px;
  border:1px solid var(--line-2); font-size:13px; font-weight:600; color:var(--fg)}
.sback:hover{border-color:var(--accent); color:var(--accent)}
.sgrab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:8px auto 0; display:none}
@media(max-width:620px){ .sgrab{display:block} .scrim{padding:0; place-items:end center}
  /* Higher specificity (.scrim .sheet) so these win over the base `.sheet`
     rule, which is defined LATER in the file: without it the base
     `overflow:hidden` overrode `overflow-y:auto` and the bottom sheet could not
     scroll on mobile, clipping everything past 94vh. */
  .scrim .sheet{width:100%; border-radius:18px 18px 0 0; margin-bottom:0; max-height:94vh;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
  /* On a phone, vh is the screen height with the browser's toolbars HIDDEN: while
     they show, a 94vh sheet is taller than the visible area and its last rows (the
     times and ticket links) sit behind the toolbar, out of reach of the sheet's own
     scroll. dvh follows the toolbars (vh stays the fallback for older browsers), and
     the body clears the iPhone home indicator. */
  @supports (height:1dvh){ .scrim .sheet{max-height:94dvh} }
  .scrim .sbody{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))} }
.fchip{padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--ink-2);
  font-size:12px; color:var(--fg-2); transition:border-color .15s,background .15s; white-space:nowrap}
.fchip:hover{border-color:var(--line-2)}
.fchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.fchip.off,.fchip:disabled{opacity:.4; pointer-events:none; text-decoration:line-through; text-decoration-thickness:1px}
.fclear{font-size:11.5px; color:var(--fg-3); text-decoration:underline; text-underline-offset:3px; padding:5px 4px}

/* ---------- hero ---------- */
.hero{position:relative; border-radius:var(--r-lg); overflow:hidden; margin-block:18px 30px;
  min-height:290px; display:flex; align-items:flex-end; border:1px solid var(--line)}
@media(min-width:800px){ .hero{min-height:340px} }
.hero-art{position:absolute; inset:0; z-index:0}
.hero-scrim{position:absolute; inset:0; z-index:1;
  background:linear-gradient(100deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.74) 40%,rgba(0,0,0,.26) 76%,rgba(0,0,0,.5) 100%)}
.hero-body{position:relative; z-index:2; padding:24px 20px; max-width:620px; color:#F4EFF6}
@media(min-width:800px){ .hero-body{padding:38px 42px} }
.eyebrow{font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; font-weight:700;
  color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
[data-surface="theatre"] .eyebrow{color:var(--gild)}
.eyebrow .dot{width:5px; height:5px; border-radius:50%; background:currentColor}
.hero h1{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(28px,5.6vw,52px); line-height:1; margin-bottom:11px}
[data-surface="theatre"] .hero h1{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  font-weight:800; letter-spacing:-.015em; font-size:clamp(26px,5vw,46px); line-height:1.04}
.hero-meta{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:11px; font-size:12.5px; color:#CCC2D0}
.hero-syn{font-size:14px; color:#DBD2DE; margin-bottom:17px; max-width:54ch}
.acts{display:flex; gap:9px; flex-wrap:wrap}
.btn{padding:10px 20px; border-radius:10px; font-weight:600; font-size:13.5px;
  background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); transition:filter .16s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.26); color:#fff; backdrop-filter:blur(6px)}
.btn.sm{padding:7px 14px; font-size:12.5px}

/* ---------- rails ---------- */
.rail{margin-bottom:44px}
.rhead{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.rhead h2{font-family:Oswald,sans-serif; font-weight:600; font-size:clamp(20px,2.2vw,26px);
  letter-spacing:.06em; text-transform:uppercase; color:var(--fg); display:flex; align-items:center; gap:10px}
.rhead h2::before{content:""; display:inline-block; width:4px; height:.9em; border-radius:2px;
  background:var(--accent); flex:0 0 4px}
[data-surface="theatre"] .rhead h2{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  letter-spacing:0; font-size:clamp(24px,2.6vw,30px)}
.rhead .sub{font-size:11.5px; color:var(--fg-3)}
.rscroll{position:relative}
.rtrack{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:6px; scroll-behavior:smooth; scrollbar-width:thin}
.rtrack::-webkit-scrollbar{height:5px}
.rtrack::-webkit-scrollbar-thumb{background:var(--ink-4); border-radius:9px}
.rarrow{position:absolute; top:34%; z-index:5; width:32px; height:62px; border-radius:10px;
  background:color-mix(in srgb,var(--ink) 84%,transparent); border:1px solid var(--line-2);
  display:none; place-items:center; font-size:17px; backdrop-filter:blur(6px)}
@media(min-width:900px){ .rscroll:hover .rarrow{display:grid} }
.rarrow.prev{left:-8px} .rarrow.next{right:-8px}

/* ---------- card + generated poster ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px 12px}
@media(min-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))} }
.card{flex:0 0 auto; width:158px; scroll-snap-align:start; text-align:left; display:flex; flex-direction:column; gap:7px;
  transition:transform .22s cubic-bezier(.22,1,.36,1)}
.grid .card{width:auto}
@media(min-width:760px){ .card{width:180px} }
.card:hover{transform:translateY(-5px)}
.poster{position:relative; aspect-ratio:2/3; max-width:100%; border-radius:var(--r); overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:flex-end;
  padding:11px; color:#fff; isolation:isolate}
.p-art{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.p-real{object-fit:cover; max-width:none}
/* a real poster carries its own title, so the generated lockup steps back */
.poster:has(.p-real) .p-title,.poster:has(.p-real) .p-sub{display:none}
.poster:has(.p-real) .p-grain{background:linear-gradient(to top,rgba(0,0,0,.55),transparent 42%)}
.shero:has(.p-real) .p-real{filter:blur(2px) brightness(.62)}
/* wide event cards (.ebox) are landscape; a real poster fills the box (cover)
   on its own layer above the generated SVG but below the grain + text, with a
   stronger scrim so the badge, title, and date stay legible over the art. */

   trusting the snapshot's start date — otherwise the app forever thinks "today"
   is the day the data was captured and keeps showing screenings that have long
   since passed. Date maths elsewhere stays UTC/ISO-string based (see dUTC). */
const NOW_SOFIA=(()=>{
  try{const p={};
    new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Sofia",year:"numeric",month:"2-digit",
      day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})
      .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
    return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour==="24"?"00":p.hour}:${p.minute}`};
  }catch(e){return{date:SNAPSHOT.window.from,time:"00:00"};}
})();
const NOW_DATE=NOW_SOFIA.date, NOW_TIME=NOW_SOFIA.time;
/* Lower bound clamped into the snapshot so the month/day helpers never run off
   the front of the data; if "now" is already past the window the app simply
   shows an empty, honest programme rather than stale past dates. */
const TODAY=NOW_DATE<SNAPSHOT.window.from?SNAPSHOT.window.from:NOW_DATE;
const LASTDAY=SNAPSHOT.window.to;
/* UTC throughout: parsing as local time and reporting as UTC shifts the date
   in any timezone east of Greenwich. */
const dUTC=iso=>new Date(iso+"T00:00:00Z");
const addDays=(iso,n)=>{const d=dUTC(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
/* Hide what has already happened: whole days in the past, and today's start
   times that are behind the Sofia clock. upcomingRows narrows each showtime
   row's time list; a row left with no upcoming time is dropped entirely. */
const timeIsUpcoming=(d,tm)=>d>NOW_DATE||(d===NOW_DATE&&(!tm||tm>=NOW_TIME));
function upcomingRows(rows){const out=[];for(const r of rows){if(r[2]<NOW_DATE)continue;
  const tms=r[2]===NOW_DATE?r[3].filter(tm=>tm>=NOW_TIME):r[3];
  if(tms.length)out.push([r[0],r[1],r[2],tms]);}return out;}
const upcomingPerfs=ps=>ps.filter(p=>timeIsUpcoming(p[1],p[2]));
const MONTHS=(()=>{
  const out=[],seen=new Set();
  let d=TODAY, guard=0;
  while(d<=LASTDAY && guard++<400){                 /* guard: never hang the page */
    const m=d.slice(0,7); if(!seen.has(m)){seen.add(m);out.push(m);}
    const next=addDays(d,1);
    if(next<=d) break;                               /* refuses to advance — bail out */
    d=next;

function translitBG(s){

  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y",
  "к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u",
  "ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a","ь":"y","ю":"yu","я":"ya"
 };
 /* Handle "ия" at word-end → "ia" */
 s=s.replace(/ия(?=\b|[^а-яА-ЯъьюяЮЯ]|$)/gi,(m,o,str)=>{
  const isUpper=str[o]==="И";return isUpper?"IA":"ia";});
 let out="";
 for(let i=0;i<s.length;i++){
  const c=s[i],lo=c.toLowerCase();
  if(MAP[lo]){

   out+=c===lo?tr:tr[0].toUpperCase()+tr.slice(1);

}

  return`<div class="daystrip">${pills.join("")}</div>`;}

function periodBanner(){
  const L=t();
  /* Build title and date range */
  let mainTitle="",dateStr="",eyebrow=L.pheadEyebrow||"Програмата",showStrip=false;
  if(S.day==="week"){
    mainTitle=L.pheadThisWeek||(S.lang==="bg"?"Тази седмица":"This week");
    dateStr=fmtRange(TODAY,WEEK_END);
    showStrip=true;
  } else if(S.day===TODAY||S.day===NOW_DATE){
    const dT=dUTC(TODAY);
    mainTitle=L.pheadToday||(S.lang==="bg"?"Днес":"Today");
    dateStr=`${L.dows[dT.getUTCDay()]} ${dT.getUTCDate()} ${L.months[dT.getUTCMonth()]}`;
    showStrip=true;
  } else if(S.day==="month"){
    mainTitle=L.pheadThisMonth||(S.lang==="bg"?"Този месец":"This month");
    dateStr=fmtRange(TODAY,lastOfMonth(TODAY));
  } else if(S.day==="all"){
    mainTitle=L.pheadAll||(S.lang==="bg"?"Цялата програма":"Full programme");
    dateStr=`${S.lang==="bg"?"до":"until"} ${fmtDay(LASTDAY,true)}`;
  } else if(S.day==="range"&&S.rFrom){
    mainTitle=L.pheadCustom||(S.lang==="bg"?"Избран период":"Selected period");
    dateStr=S.rTo?fmtRange(S.rFrom,S.rTo):fmtDay(S.rFrom,true);
  } else if(/^\d{4}-\d{2}-\d{2}$/.test(S.day)){
    /* single specific day */
    const dD=dUTC(S.day);
    const dowFull=L.dowsLong[dD.getUTCDay()];
    const cap=dowFull.charAt(0).toUpperCase()+dowFull.slice(1);
    mainTitle=`${cap}`;
    dateStr=`${dD.getUTCDate()} ${L.months[dD.getUTCMonth()]}`;
    /* show strip only if day is within current week */
    const dow=dUTC(TODAY).getUTCDay();
    const weekStart=addDays(TODAY,-(dow===0?6:dow-1));
    const weekEnd=addDays(weekStart,6);
    if(S.day>=weekStart&&S.day<=weekEnd)showStrip=true;
  } else {
    mainTitle=L.pheadThisWeek||(S.lang==="bg"?"Тази седмица":"This week");
    dateStr=fmtRange(TODAY,WEEK_END);
    showStrip=true;
  }
  const strip=showStrip?buildDayStrip():"";
  return`<div class="phead">
    <div class="phead-eyebrow">${esc(eyebrow)}</div>
    <div class="phead-title">${esc(mainTitle)} <span class="phead-dates">${esc(dateStr)}</span></div>
    ${strip}
    <button class="phead-other" data-drawer aria-label="${esc(L.pheadOtherDates||"Друг период")}">${esc(L.pheadOtherDates||"Друг период ›")}</button>
  </div>`;}

     The "За теб днес" today rail passes rowsOverride for per-film today rows but is
     NOT a per-venue context — it should still show "· N кина" when N >= 2.
     rowsOverride for the today rail always comes from the caller with perVenue:true
     when it really is a single-venue context (per-cinema section). */
  const singleVenue=(rowsOverride&&rowsOverride._perVenue===true)||(S.fVenues.length===1);

/* ===================== body ===================== */
/* progressive loading — render the first few rails, stream the rest in on scroll
   via an IntersectionObserver sentinel, so a busy programme doesn't block paint */
let RAILS=[],railIdx=0,railObs=null;
const RAIL_FIRST=4,RAIL_MORE=4,RAIL_LEAD=1200;
/* Materialise a deferred rail descriptor into HTML only when it is needed.
   A descriptor is either {html:thunk} (an arbitrary block, e.g. the full grid)
   or {t,s,items,fn} (a rail whose cards are built lazily from its items). */
function matRail(d){ return d.html?d.html():rail(d.t,d.s,d.items.map(d.fn)); }
const chevSVG=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>`;
/* secToggleHTML: returns the toggle button + an animated wrapper div (sec-body).
   The wrapper starts open or hidden; JS animates it in-place (no render call). */
function secToggleHTML(key,label,count,open){
  return`<button class="sec-toggle" data-sectoggle="${key}" aria-expanded="${open}">
    <span class="sec-toggle-title">${esc(label)}</span>
    ${count!=null?`<span class="sec-toggle-count">${count}</span>`:""}
    <span class="sec-toggle-chev">${chevSVG}</span></button>`;}
/* venueMode: return a venue-mode body (no hero, no curated rails) when
   S.fVenues is non-empty. Shows per-venue grids of films/shows. */
function venueModeBody(){
  const L=t(),day=dayOrAll();
  const isCinema=S.mode==="cinema";
  const venues=isCinema
    ?CINEMAS.filter(c=>S.fVenues.includes(c.id))
    :THEATRES.filter(th=>S.fVenues.includes(th.id));
  /* summary bar with removable chips */
  const chips=venues.map(v=>{
    const name=isCinema?cinName(v):thName(v);
    return`<button class="venue-chip-rm" data-venue="${esc(v.id)}" title="${esc(L.venueRemove||"Премахни")}">${esc(name)}<span class="rm-x" aria-hidden="true">✕</span></button>`;
  }).join("");
  let blocks="";
  venues.forEach(v=>{
    const name=isCinema?cinName(v):thName(v);
    const addr=v.area||"";
    let cards="";
    if(isCinema){
      const vis=filmsAtCinema(v.id).filter(f=>{
        if(S.fGenres.length&&!genreHit(f.genres))return false;
        if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(f,s)))return false;
        return true;});
      if(!vis.length){cards=emptyState();}else{
        cards=`<div class="grid">${vis.map(f=>{
          const cRows=filmTimes(f.id,day).filter(r=>r[1]===v.id);
          if(!cRows.length)return filmCard(f,day,undefined);
          const rv=cRows.slice();rv._perVenue=true;return filmCard(f,day,rv);}).join("")}</div>`;}
    }else{
      const vis=showsAtTheatre(v.id).filter(s=>{
        if(S.fGenres.length&&!genreHit(s.genres))return false;
        return true;});
      if(!vis.length){cards=emptyState();}else{
        cards=`<div class="grid">${vis.map(s=>showCard(s,day)).join("")}</div>`;}
    }
    blocks+=`<div class="venue-block">
      <div class="venue-block-head"><h2>${esc(name)}</h2>${addr?`<div class="sub">${esc(addr)}</div>`:""}</div>
      ${cards}</div>`;
  });
  return`<div class="venue-mode-head">
    <span style="font-size:13px;color:var(--fg-3)">${esc(L.venueShowing||"Програмата на:")}</span>
    <div class="venue-chips">${chips}</div></div>
  ${blocks}`;}
function body(){
  const L=t(),day=dayOrAll(),out=[];
  /* VENUE MODE: S.fVenues non-empty → bypass all curated rails */
  if(S.fVenues.length) return[venueModeBody()];
  /* Events are shown only if not yet ended (to >= today) and overlapping the
     selected range; "active" = already running, "soon" = starts later. The old
     static e.status is ignored so a finished festival never lingers past its end. */
  const [evS,evE]=rangeBounds();
  const evLive=e=>(e.scope==="both"||e.scope===S.mode)&&e.to>=NOW_DATE&&e.from<=evE&&e.to>=evS;
  const act=EVENTS.filter(e=>evLive(e)&&e.from<=TODAY).sort((a,b)=>a.to.localeCompare(b.to));
  const soon=EVENTS.filter(e=>evLive(e)&&e.from>TODAY).sort((a,b)=>a.from.localeCompare(b.from));
  /* push a rail descriptor only if it has content — emptiness is known from the
     item count, so no card HTML is built for empty or not-yet-visible rails */
  const pushRail=(title,sub,items,fn)=>{ if(items&&items.length) out.push({t:title,s:sub,items,fn}); };
  if(S.mode==="cinema"){
    const vis=visibleFilms();
    /* filmRowsInPeriod: screenings for a film within the selected period, filtered by venue */
    const filmRowsInPeriod=fid=>{
      let rows=_frows(fid).filter(r=>inRange(r[2])&&withinHorizon(r[1],r[2]));
      return upcomingRows(rows);};
    /* "За теб днес" = films with a screening still to come TODAY. Decoupled from
       the selected-day filter (scoreFilm returns -1 off the selected day, which
       would wrongly empty the rail on any day but today); the drawer filters
       (venue chain, genre, strand) still apply. Ranked by how many screenings
       remain today, then IMDb. Each card shows only today's remaining times. */
    const todayItems=FILMS.map(f=>{
        let rows=filmTimesToday(f.id);
        return{f,rows};}).filter(o=>o.rows.length)
      .filter(o=>{
        if(S.fGenres.length&&!genreHit(o.f.genres))return false;
        if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(o.f,s)))return false;
        return true;})
      .sort((a,b)=>{const na=a.rows.reduce((n,r)=>n+r[3].length,0),nb=b.rows.reduce((n,r)=>n+r[3].length,0);
        return nb-na||((imdbOf(b.f)||0)-(imdbOf(a.f)||0));}).slice(0,14);
    if(todayItems.length){
      pushRail(L.railToday,fmtDay(NOW_DATE,true),todayItems,x=>filmCard(x.f,false,x.rows));
    } else {
      /* "За теб утре" fallback: same logic, tomorrow's date, only if within data window */
      const TOMORROW=addDays(NOW_DATE,1);
      if(TOMORROW<=LASTDAY){
        const filmTimesTomorrow=fid=>upcomingRows(_frows(fid).filter(r=>r[2]===TOMORROW&&withinHorizon(r[1],r[2])));
        const tomorrowItems=FILMS.map(f=>{
            let rows=filmTimesTomorrow(f.id);
            return{f,rows};}).filter(o=>o.rows.length)
          .filter(o=>{
            if(S.fGenres.length&&!genreHit(o.f.genres))return false;
            if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(o.f,s)))return false;
            return true;})
          .sort((a,b)=>{const na=a.rows.reduce((n,r)=>n+r[3].length,0),nb=b.rows.reduce((n,r)=>n+r[3].length,0);
            return nb-na||((imdbOf(b.f)||0)-(imdbOf(a.f)||0));}).slice(0,14);
        pushRail(L.railTomorrow||"За теб утре",fmtDay(TOMORROW,true),tomorrowItems,x=>filmCard(x.f,false,x.rows));
      }
    }
    /* Event rails hidden when any genre filter is active */
    if(!S.fGenres.length){
      pushRail(L.railLimited,S.lang==="bg"?"само сега — после го няма":"on now — then it's gone",act,eventCard);}
    const top=vis.filter(f=>imdbOf(f)!=null).sort((a,b)=>imdbOf(b)-imdbOf(a)).slice(0,12);
    pushRail(L.railTop,"IMDb",top,f=>filmCard(f,day));
    /* "Популярни тази седмица" — ranked by total screenings in period, then cinema count, then IMDb */
    const popLabel=S.day==="week"?(L.railPopular||"Популярни тази седмица"):(L.railPopularPeriod||"Популярни за периода");
    const popularItems=vis.map(f=>{
        const rows=filmRowsInPeriod(f.id);
        const sc=rows.reduce((n,r)=>n+r[3].length,0);
        const cv=new Set(rows.map(r=>r[1])).size;
        return{f,sc,cv};
      }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||b.cv-a.cv||((imdbOf(b.f)||0)-(imdbOf(a.f)||0))).slice(0,14);
    pushRail(popLabel,L.railPopularSub||"най-много прожекции",popularItems,x=>filmCard(x.f,day));
    /* "Скрити бижута" — IMDb ≥ 7.3, plays at ≤ 2 (filtered) cinemas */
    const gemsItems=vis.filter(f=>{
        const imdb=imdbOf(f); if(imdb==null||imdb<7.3)return false;
        const rows=filmRowsInPeriod(f.id);
        const cv=new Set(rows.map(r=>r[1])).size;
        return cv>=1&&cv<=2;
      }).sort((a,b)=>(imdbOf(b)||0)-(imdbOf(a)||0)).slice(0,14);
    if(gemsItems.length>=3){
      pushRail(L.railGems||"Скрити бижута",L.railGemsSub||"силни оценки, малко прожекции",gemsItems,f=>filmCard(f,day));}
    if(!S.fGenres.length){
      pushRail(L.railSoon,S.lang==="bg"?"извън тази седмица":"beyond this week",soon,eventCard);}
    /* Section A: По жанр — collapsible, CLOSED by default. */
    const visSet=new Set(vis.map(f=>f.id));
    const genreRails=[];
    genresFor("cinema").forEach(g=>{
      if(S.fGenres.length&&!S.fGenres.includes(g.id))return;
      const fs=vis.filter(f=>f.genres.some(x=>g.m.includes(x)));
      if(fs.length)genreRails.push({t:S.lang==="bg"?g.bg:g.en,s:`${fs.length}`,items:fs,fn:f=>filmCard(f,day)});});
    out.push({html:()=>{
      const inner=genreRails.map(r=>rail(r.t,r.s,r.items.map(r.fn))).join("");
      return secToggleHTML("Genres",L.secByGenre||"По жанр",genreRails.length,S.secGenres)
        +`<div id="sec-Genres-content" class="sec-body"${S.secGenres?"":" hidden"}>${inner}</div>`;
    }});
    /* Section B: По кино — collapsible, closed by default; rails not built when closed. */
    out.push({html:()=>{
      let inner="";
      if(S.secVenues){
        const cinsToShow=CINEMAS;
        cinsToShow.forEach(c=>{
          if(S.fStrands.length){const arty=S.fStrands.includes("arthouse"),comm=S.fStrands.includes("commercial");
            if(arty&&!comm&&c.kind!=="independent")return;
            if(comm&&!arty&&c.kind==="independent")return;}
          const fs=filmsAtCinema(c.id).filter(f=>visSet.has(f.id));
          if(fs.length)inner+=rail(cinName(c),c.area,fs.map(f=>{
            const cRows=filmTimes(f.id,day).filter(r=>r[1]===c.id);
            if(!cRows.length)return filmCard(f,day,undefined);
            const rv=cRows.slice(); rv._perVenue=true; return filmCard(f,day,rv);}));
        });
      }
      return secToggleHTML("Venues",L.secByCinema||"По кино",null,S.secVenues)

/* stream deferred category rails in, in batches, ahead of the viewport so the
   scroll never reaches an unbuilt section — building each batch's cards lazily */
function mountProgressive(){
  if(railObs){railObs.disconnect();railObs=null;}
  if(S.fVenues.length)return; /* venue mode: body() already rendered everything */
  const sent=document.getElementById("rail-sentinel");
  if(!sent||railIdx>=RAILS.length)return;
  const pump=()=>{
    /* keep appending batches until the sentinel is pushed below the prefetch
       zone (or everything is mounted) — handles batches shorter than a screen */
    let guard=0;
    while(railIdx<RAILS.length && guard++<=RAILS.length){
      if(sent.getBoundingClientRect().top > window.innerHeight+RAIL_LEAD) break;
      const batch=RAILS.slice(railIdx,railIdx+RAIL_MORE).map(matRail).join("");
      railIdx+=RAIL_MORE;
      sent.insertAdjacentHTML("beforebegin",batch);
    }
    if(railIdx>=RAILS.length && railObs){railObs.disconnect();railObs=null;sent.remove();}
  };
  railObs=new IntersectionObserver(function(entries){
    if(entries.some(en=>en.isIntersecting))pump();
  },{rootMargin:RAIL_LEAD+"px 0px"});
  railObs.observe(sent);
}
/* ---- Section toggle in-place animation (Item 1) ----
   Called instead of render() when a section header is clicked.
   Animates height 0→content (~260ms) or content→0 (~220ms).
   Keeps the header button at the same viewport y throughout. */
function secToggleInPlace(key){
  const btn=document.querySelector(`[data-sectoggle="${key}"]`);
  if(!btn)return false; /* fall back to render() if not in DOM */
  /* capture header position BEFORE any DOM change */
  const btnTop=btn.getBoundingClientRect().top;
  /* keep the header at that viewport y, frame by frame, while the body opens or
     closes below it: with the page scrolled to its very end Chrome still shifts
     the page a few frames in, as the body starts to grow (17px at 1280px, cinema
     "По кино"), so one correction after the first frame is not enough */
  const pinHeader=ms=>{
    const until=performance.now()+ms;
    const pin=()=>{
      /* looked up each frame: after a full render() the header is a new element */
      const cur=document.querySelector(`[data-sectoggle="${key}"]`);
      if(!cur)return; /* section gone (mode switched meanwhile): nothing to hold */
      const delta=cur.getBoundingClientRect().top-btnTop;
      if(Math.abs(delta)>0.5)window.scrollBy({top:delta,behavior:"instant"});
      if(performance.now()<until)requestAnimationFrame(pin);
    };
    requestAnimationFrame(pin);
  };
  const isOpen=btn.getAttribute("aria-expanded")==="true";
  const willOpen=!isOpen;
  /* toggle state */
  if(key==="Genres")S.secGenres=willOpen;
  else if(key==="Venues")S.secVenues=willOpen;
  else if(key==="All")S.secAll=willOpen;
  /* update aria-expanded on button */
  btn.setAttribute("aria-expanded",String(willOpen));
  /* find the sec-body sibling — try both id-based and next-sibling */
  let body=document.getElementById(`sec-${key}-content`);
  if(!body){body=btn.nextElementSibling;if(!body||!body.classList.contains("sec-body"))body=null;}
  if(!body){/* section not yet materialised — need a full render, which also
    restarts the progressive rails above: hold the header while they settle */
    render();pinHeader(400);return true;}
  const reducedMotion=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reducedMotion){
    if(willOpen){
      body.removeAttribute("hidden");body.style.height="";body.style.opacity="";
    }else{
      body.setAttribute("hidden","");body.style.height="";body.style.opacity="";
    }
    /* If opening Venues section but content is empty, materialise it */
    if(willOpen&&key==="Venues"&&!body.innerHTML.trim()){
      /* find the descriptor and render it */
      const desc=RAILS.find(d=>d.html&&d===RAILS.find(r=>r===d));
      render(); /* fallback full render */
    }
    pinHeader(120);
    return true;
  }
  if(willOpen){
    /* Opening: materialise inner content if missing (Section B: Venues) */
    if(!body.innerHTML.trim()){
      /* The RAILS descriptor for this section will re-build content */
      const idMap={Genres:0,Venues:1,All:2};
      /* find the sec descriptor among ALL RAILS by checking which one generates this id */
      /* Simpler: re-render just the body HTML using the existing descriptor */
      const L=t(),day=dayOrAll(),vis=S.mode==="cinema"?visibleFilms():visibleShows();
      if(key==="Venues"){
        if(S.mode==="cinema"){
          const visSet=new Set(vis.map(f=>f.id));
          let inner="";
          CINEMAS.forEach(c=>{
            if(S.fStrands.length){const arty=S.fStrands.includes("arthouse"),comm=S.fStrands.includes("commercial");
              if(arty&&!comm&&c.kind!=="independent")return;
              if(comm&&!arty&&c.kind==="independent")return;}
            const fs=filmsAtCinema(c.id).filter(f=>visSet.has(f.id));
            if(fs.length)inner+=rail(cinName(c),c.area,fs.map(f=>{
              const cRows=filmTimes(f.id,day).filter(r=>r[1]===c.id);
              if(!cRows.length)return filmCard(f,day,undefined);
              const rv=cRows.slice();rv._perVenue=true;return filmCard(f,day,rv);}));
          });
          body.innerHTML=inner;
        }else{
          const visSet=new Set(vis.map(s=>s.id));
          const STATE_KINDS=["national","state","municipal"];
          const allState=THEATRES.filter(th=>STATE_KINDS.includes(th.kind));
          const allIndie=THEATRES.filter(th=>!STATE_KINDS.includes(th.kind));
          let inner="";
          const stateRails=[],indieRails=[];
          allState.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)stateRails.push({th,ss});});
          allIndie.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)indieRails.push({th,ss});});
          if(stateRails.length)inner+=`<div class="sec-subhead">${esc(L.subStateTheatres||"Държавни и общински")}</div>`
            +stateRails.map(({th,ss})=>rail(thName(th),th.area,ss.map(s=>showCard(s,day)))).join("");
          if(indieRails.length)inner+=`<div class="sec-subhead">${esc(L.subIndependent||"Независими")}</div>`
            +indieRails.map(({th,ss})=>rail(thName(th),th.area,ss.map(s=>showCard(s,day)))).join("");
          body.innerHTML=inner;
        }
      } else if(key==="All"){
        /* Materialise "All" content */
        if(vis.length){
          body.innerHTML=`<div class="grid">${vis.slice(0,S.limit).map(x=>S.mode==="cinema"?filmCard(x,day):showCard(x,day)).join("")}</div>`
           +(vis.length>S.limit?`<div style="text-align:center;margin-top:18px"><button class="btn sm" data-more>${esc(L.more)} (${vis.length-S.limit})</button></div>`:"");
        }else{body.innerHTML=emptyState();}
      }
    }
    body.removeAttribute("hidden");
    /* measure full height */
    body.style.height="auto"; body.style.opacity="1";
    const h=body.scrollHeight;
    body.style.height="0"; body.style.opacity="0";
    /* force reflow */
    void body.offsetHeight; // eslint-disable-line no-void
    body.classList.add("sec-anim-ready");
    body.classList.remove("sec-anim-closing");
    body.style.height=h+"px"; body.style.opacity="1";
    const onEnd=()=>{
      body.style.height="auto"; /* allow responsive resize */
      body.classList.remove("sec-anim-ready");};
    body.addEventListener("transitionend",function h(){body.removeEventListener("transitionend",h);onEnd();},{once:true});
    setTimeout(onEnd,320); /* fallback */
  }else{
    /* Closing */
    body.style.height=body.scrollHeight+"px"; body.style.opacity="1";
    void body.offsetHeight;
    body.classList.add("sec-anim-ready","sec-anim-closing");
    body.classList.remove("sec-anim-ready"); /* closing uses sec-anim-closing */
    /* restart: remove ready then add both so closing transition is applied */
    void body.offsetHeight;
    body.classList.add("sec-anim-ready");
    body.style.height="0"; body.style.opacity="0";
    const onEnd2=()=>{
      body.setAttribute("hidden","");
      body.style.height=""; body.style.opacity="";
      body.classList.remove("sec-anim-ready","sec-anim-closing");};
    body.addEventListener("transitionend",function h(){body.removeEventListener("transitionend",h);onEnd2();},{once:true});
    setTimeout(onEnd2,280); /* fallback */
  }
  /* hold the header through the transition (.26s open / .22s close) and its fallback timers */
  pinHeader(willOpen?360:320);
  return true;
}
/* ---- Search animation (Item 2) ----
   Toggle search open/close WITHOUT a full render(). Animate width (desk) or
   height (mobile). On close with a query: animate closed, then clear + render. */
function searchToggleInPlace(){
  const willOpen=!S.searchOpen;
  S.searchOpen=willOpen;
  /* Update button state */
  const btns=document.querySelectorAll("[data-search-open]");
  btns.forEach(b=>{b.setAttribute("aria-expanded",String(willOpen));
    b.classList.toggle("expanded",willOpen);});
  document.querySelectorAll(".seg").forEach(sg=>sg.classList.toggle("seg-q",willOpen));
  const reducedMotion=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  /* Desktop */
  const dw=document.querySelector(".desk-search-wrap");
  if(dw){
    dw.classList.toggle("open",willOpen);
    if(willOpen&&!reducedMotion){/* force reflow handled by CSS transition */}}
  /* Mobile: bar-row-search starts display:none (so #q-m bounding_box()===null).
     Opening: add .sr-visible (display:block) first, then .open for the CSS transition.
     Closing: remove .open; after animation ends remove .sr-visible (display:none again). */
  const mr=document.querySelector(".bar-row-search");
  if(mr){
    if(willOpen){
      mr.classList.add("sr-visible"); /* display:block — make animatable */
      void mr.offsetHeight; /* force reflow so transition sees start state */
      mr.classList.add("open");
    }else{
      mr.classList.remove("open");
      const rmDelay=reducedMotion?0:240;
      setTimeout(()=>{mr.classList.remove("sr-visible");},rmDelay);
    }
  }
  if(willOpen){
    /* focus the visible input */
    const isMob=window.innerWidth<=760;
    const qi=isMob?document.getElementById("q-m"):document.getElementById("q");
    if(qi)setTimeout(()=>{qi.focus();try{qi.setSelectionRange(qi.value.length,qi.value.length);}catch(e){}},50);
  }else if(S.q){
    /* closing with a query: after animation, clear and re-render results */
    const delay=reducedMotion?0:230;
    setTimeout(()=>{S.q="";S.searchOpen=false;render();},delay);
  }
}

function bookUrl(vid,date){
  const b=BOOKING[vid]; if(!b)return null;
  if(b.deep&&date)return b.deep.replace("{date}",date);
  return b.url;}
/* Per-title ticket links: point at the specific film/play/event page (harvested
   from official sites) instead of the venue homepage. Falls back to bookUrl when
   we have no specific page for that title. Accuracy rule: only verified links here. */
const TIX={
  show:{
    "uroci":"https://sofiatheatre.eu/repertoires/120/uroci",
    "posledniyat-strasten":"https://sofiatheatre.eu/repertoires/119/posledniyat-strasten-lyubovnik"
  },
  event:{},
  film:{
    "in-the-mood":"https://www.ndk.bg/en/event/uong-karvai-v-nastroenie-za-liubov-200-eng-sub"
  }
};
/* VLINK_MAP: keyed by "filmId|venueId" → the film-specific page at that venue */
const VLINK_MAP=(()=>{
  const m={};
  if(typeof VLINKS!=="undefined"&&Array.isArray(VLINKS))
    VLINKS.forEach(([fid,vid,u])=>{m[fid+"|"+vid]=u;});
  return m;
})();
/* Film-specific resolver (never uses LINK_MAP — that mapped one global URL per film,
   causing all venues to link to the wrong cinema page).
   Priority: VLINKS entry → BOOKING deep link with date → BOOKING tix → BOOKING url */
function filmTixUrl(filmId,venueId,date){
  const vk=filmId+"|"+venueId;
  if(VLINK_MAP[vk])return VLINK_MAP[vk];
  const b=BOOKING[venueId]; if(!b)return null;
  if(b.deep&&date)return b.deep.replace("{date}",date);
  if(b.tix)return b.tix;
  return b.url||null;
}
function tixUrl(kind,id,venueId,date){
  /* Films: per-venue resolver — never LINK_MAP */
  if(kind==="film")return filmTixUrl(id,venueId,date);
  const specific=LINK_MAP[id]||(TIX[kind]||{})[id];
  return specific||bookUrl(venueId,date);
}

/* task 7 — single scrollable month with ‹ › arrows + from–to range highlight */
function calView(){
  const L=t(),has=datesWith();
  const idx=Math.max(0,Math.min(S.calMonth||0,MONTHS.length-1));
  const m=MONTHS[idx];
  const fd=dUTC(m+"-01");
  const offset=(fd.getUTCDay()+6)%7;
  const dim=new Date(Date.UTC(fd.getUTCFullYear(),fd.getUTCMonth()+1,0)).getUTCDate();
  const lo=S.rFrom, hi=S.rTo, isRange=S.day==="range";
  let cells="";
  for(let i=0;i<offset;i++)cells+=`<button disabled></button>`;
  for(let d=1;d<=dim;d++){
    const iso=`${m}-${String(d).padStart(2,"0")}`;
    const ok=iso>=TODAY&&iso<=LASTDAY;
    let cls=has.has(iso)?"has":"";
    let pressed=false;
    if(isRange&&lo){
      const top=hi||lo;
      if(iso>lo&&iso<top)cls+=" inrange";
      if(iso===lo){pressed=true;cls+=" rstart";if(hi&&hi!==lo)cls+=" inrange";}
      if(iso===top&&top!==lo){pressed=true;cls+=" rend inrange";}
    }else{pressed=S.day===iso;}
    cells+=`<button ${ok?"":"disabled"} class="${cls.trim()}" data-pick="${iso}" aria-pressed="${pressed}">${d}</button>`;
  }
  const dows=S.lang==="bg"?["пн","вт","ср","чт","пт","сб","нд"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const hint=isRange
    ? (lo&&hi?`${fmtDay(lo,true)} – ${fmtDay(hi,true)}`
       : lo?(S.lang==="bg"?"Изберете крайна дата":"Pick an end date")
       : (S.lang==="bg"?"Изберете начална дата":"Pick a start date"))
    : (S.lang==="bg"?"Докоснете начало и край за период":"Tap a start and an end for a range");
  return `<div class="calnav">
      <button class="calarrow" data-calstep="-1" ${idx>0?"":"disabled"} aria-label="prev">‹</button>
      <div class="calmon">${esc(L.months[Number(m.slice(5,7))-1])} ${m.slice(0,4)}</div>
      <button class="calarrow" data-calstep="1" ${idx<MONTHS.length-1?"":"disabled"} aria-label="next">›</button></div>
    <div class="caldow">${dows.map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal">${cells}</div>
    <div class="calhint">${esc(hint)}</div>`;
}

/* ===================== sheet open + animation ===================== */
let sheetOpen=false;
/* which detail entity the open sheet shows — {kind:"film"|"show"|"event",id},
   so the sheet can be regenerated in place when the language is toggled. */
let curSheet=null;
function sheetHTMLFor(c){
  if(!c)return null;
  if(c.kind==="film"&&filmById[c.id])return sheetFilm(filmById[c.id]);
  if(c.kind==="show"&&showById[c.id])return sheetShow(showById[c.id]);
  if(c.kind==="event"){const ev=EVENTS.find(x=>x.id===c.id);if(ev)return sheetEvent(ev);}
  return null;
}
/* Post-render decoration shared by openSheet and the in-place re-render: add the
   back bar + grab handle + swipe-to-close, and collapse read-more toggles whose
   text does not actually overflow. */
function decorateSheet(s){
  const sheet=s.querySelector(".sheet");
  if(sheet&&!sheet.querySelector(".sbar")){
    const bar=document.createElement("div");bar.className="sbar";
    bar.innerHTML=`<button class="sback" data-close>&#8249;&nbsp;${esc(t().back)}</button>`;
    const grab=document.createElement("div");grab.className="sgrab";
    sheet.insertBefore(bar,sheet.firstChild);
    sheet.insertBefore(grab,sheet.firstChild);
    swipeToClose(sheet);
  }
  s.querySelectorAll(".synwrap").forEach(w=>{
    const body=w.querySelector(".synbody"),btn=w.querySelector(".readmore");
    if(body&&btn&&body.scrollHeight<=body.clientHeight+2){btn.style.display="none";w.classList.remove("clamp");}
  });
}
function openSheet(html,fromEl){
  let s=document.getElementById("scrim");
  if(!s){s=document.createElement("div");s.id="scrim";s.className="scrim";document.body.appendChild(s);}
  s.innerHTML=html;s.hidden=false;document.body.style.overflow="hidden";
  /* a detail view must always have a visible way out: the back bar is the
     reliable one, history and swipe are conveniences on top of it */
  decorateSheet(s);
  if(!sheetOpen){try{history.pushState({ss:"sheet"},"");}catch(e){}}
  sheetOpen=true;
  animateOpen(s,fromEl);
}
/* Regenerate the open sheet's contents in the current language without the
   open animation or a new history entry — used by the language toggle so an
   open card flips language (synopsis, weekday, every label) immediately. */
function rerenderOpenSheet(){
  if(!sheetOpen||!curSheet)return;
  const s=document.getElementById("scrim"),html=sheetHTMLFor(curSheet);
  if(s&&html){s.innerHTML=html;decorateSheet(s);}
}
function closeSheet(fromPop){
  const s=document.getElementById("scrim");
  if(s){s.hidden=true;s.innerHTML="";}
  document.body.style.overflow="";curSheet=null;
  const was=sheetOpen; sheetOpen=false;
  if(was&&!fromPop){try{history.back();}catch(e){}}
}
window.addEventListener("popstate",()=>{
  if(sheetOpen){closeSheet(true);return;}
});
/* deep links: #film=id / #show=id / #event=id open the matching detail sheet,
   so a shared URL lands directly on that title */
function openFromHash(){
  const m=/^#(film|show|event)=(.+)$/.exec(location.hash||"");
  if(!m)return false;
  const kind=m[1],id=decodeURIComponent(m[2]);
  let html=null;
  if(kind==="film"&&filmById[id])html=sheetFilm(filmById[id]);
  else if(kind==="show"&&showById[id])html=sheetShow(showById[id]);
  else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);if(ev)html=sheetEvent(ev);}
  if(html){curSheet={kind,id};openSheet(html,null);return true;}
  return false;
}
function shareItem(kind,id,title){
  const url=location.origin+location.pathname+location.search+"#"+kind+"="+encodeURIComponent(id);
  try{history.replaceState(history.state,"",url);}catch(e){}
  const data={title:"Sofia Gleda — "+(title||""),text:title||"",url:url};
  if(navigator.share){navigator.share(data).catch(()=>{});return;}
  const done=()=>toast(S.lang==="bg"?"Копиран линк":"Link copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,()=>toast(url));}
  else toast(url);
}
function toast(msg){
  let el=document.getElementById("sg-toast");
  if(!el){el=document.createElement("div");el.id="sg-toast";el.className="toast";document.body.appendChild(el);}
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200);
}
window.addEventListener("hashchange",()=>{ if(!sheetOpen)openFromHash(); });
function swipeToClose(sheet){
  let y0=null;
  sheet.addEventListener("touchstart",e=>{y0=sheet.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
  sheet.addEventListener("touchmove",e=>{
    if(y0==null)return;
    if(e.touches[0].clientY-y0>90){y0=null;closeSheet();}},{passive:true});
  sheet.addEventListener("touchend",()=>{y0=null;},{passive:true});
}
/* Plain neutral expand: scrim fades in, sheet grows in — no themed effects. */
function animateOpen(scrim,fromEl){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const sheet=scrim.querySelector(".sheet"); if(!sheet)return;
  scrim.animate([{opacity:0},{opacity:1}],{duration:150,easing:"ease-out"});
  /* mobile bottom-sheet: slide up; desktop: opacity + subtle scale */
  const isMobile=innerWidth<=620;
  if(isMobile){
    sheet.animate([{opacity:0,transform:"translateY(32px)"},{opacity:1,transform:"translateY(0)"}],
      {duration:200,easing:"ease-out",fill:"backwards"});
  }else{
    sheet.animate([{opacity:0,transform:"translateY(14px) scale(.96)"},{opacity:1,transform:"none"}],
      {duration:200,easing:"ease-out",fill:"backwards"});
  }
}

/* Track the currently open cal panel {row el, kind, id, venue, date, time} */
let _calPanel=null;

/* DST-correct UTC offset for Europe/Sofia on a given date+time string */
function _sofiaOffset(dateStr,timeStr){
  /* Use Intl to resolve the actual UTC offset for this local moment */
  const dtStr=dateStr+"T"+timeStr+":00";
  /* Intl.DateTimeFormat can tell us the UTC offset via the "timeZoneName: 'shortOffset'" trick */
  try{
    const fmt=new Intl.DateTimeFormat("en",{timeZone:"Europe/Sofia",timeZoneName:"shortOffset",hour:"numeric"});
    /* Create a Date from the ISO string treating it as UTC, then check Sofia offset */
    /* We iterate seconds to find the exact local→UTC mapping */
    /* Simpler approach: parse the date and use formatToParts */
    const [y,mo,d]=dateStr.split("-").map(Number);
    const [hh,mm]=(timeStr||"00:00").split(":").map(Number);
    /* Try UTC offset +2 and +3, pick the one where Sofia local time matches */
    for(const off of [3,2]){
      const utcMs=Date.UTC(y,mo-1,d,hh-off,mm,0);
      const sofParts=new Intl.DateTimeFormat("en",{
        timeZone:"Europe/Sofia",year:"numeric",month:"2-digit",day:"2-digit",
        hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(utcMs));
      const pp=Object.fromEntries(sofParts.map(p=>[p.type,p.value]));
      const mh=pp.hour==="24"?"00":pp.hour;
      if(pp.year===String(y)&&Number(pp.month)===mo&&Number(pp.day)===d&&Number(mh)===hh){
        return off;
      }
    }
  }catch(e){}
  return 3; /* fallback */
}

/* Build a calendar event object from row data */
function calEvent(kind,id,venueId,dateStr,timeStr){
  let title,venue,area,url,runtimeMin;
  if(kind==="film"){
    const f=filmById[id]; if(!f)return null;
    const c=cinById[venueId]; if(!c)return null;
    title=filmTitle(f);
    venue=(S.lang==="bg"?c.name:(c.nameEn||c.name));
    area=(S.lang==="en"?c.areaEn||c.area:c.area)||"";
    url=filmTixUrl(id,venueId,dateStr)||"";
    runtimeMin=f.runtime||120;
  } else {
    const sh=showById[id]; if(!sh)return null;
    const th=thById[sh.theatre]||thById[venueId]; if(!th)return null;
    /* find hall from matching performance row */
    const perf=(PERFORMANCES||[]).find(p=>p[0]===id&&p[1]===dateStr&&p[2]===timeStr);
    title=titleOf(sh);
    const hallRaw=perf&&perf[3]?perf[3]:"";
    const hallSuffix=hallRaw&&hallRaw!==th.name?" — "+(S.lang==="en"?hallDisplay(hallRaw):hallRaw):"";
    venue=(S.lang==="bg"?th.name:(th.nameEn||th.name));
    area=((S.lang==="en"?th.areaEn||th.area:th.area)||"")+hallSuffix;
    url=tixUrl("show",id,sh.theatre)||"";
    runtimeMin=sh.duration||120;
  }
  const fullTitle=title+" — "+venue;
  const location=venue+(area?", "+area:"");
  const prelimNote=typeof PRELIM_FROM==="object"&&PRELIM_FROM&&PRELIM_FROM[venueId]&&dateStr>=PRELIM_FROM[venueId]
    ?(S.lang==="en"?"\nPreliminary: not yet checked against the venue's full programme — subject to change."
                   :"\nПредварителна програма: още не е сверена с пълната програма на мястото — възможни са промени.")
    :"";
  const description=(url?url+"\n":"")+"Sofia Gleda"+prelimNote;
  const off=_sofiaOffset(dateStr,timeStr);
  /* Compute end time */
  const [y,mo,d]=dateStr.split("-").map(Number);
  const [hh,mm]=(timeStr||"00:00").split(":").map(Number);
  const startMs=Date.UTC(y,mo-1,d,hh-off,mm,0);
  const endMs=startMs+runtimeMin*60000;
  function toLocal(ms){
    const dt=new Date(ms);
    /* Recompute offset for end time */
    const eOff=_sofiaOffset(
      [dt.getUTCFullYear(),String(dt.getUTCMonth()+1).padStart(2,"0"),String(dt.getUTCDate()).padStart(2,"0")].join("-"),
      [String(dt.getUTCHours()+off).padStart(2,"0"),String(dt.getUTCMinutes()).padStart(2,"0")].join(":")
    );
    return{
      gcal:()=>{
        const ld=new Date(ms);
        const lh=ld.getUTCHours()+off,lm=ld.getUTCMinutes(),ls=ld.getUTCSeconds();
        return[
          String(ld.getUTCFullYear()),
          String(ld.getUTCMonth()+1).padStart(2,"0"),
          String(ld.getUTCDate()).padStart(2,"0"),
          "T",
          String(lh).padStart(2,"0"),
          String(lm).padStart(2,"0"),
          String(ls).padStart(2,"0")
        ].join("");},
      outlook(){
        const ld=new Date(ms);
        const lh=ld.getUTCHours()+off,lm=ld.getUTCMinutes();
        const eoffStr=(eOff>=0?"+":"-")+String(Math.abs(eOff)).padStart(2,"0")+":00";
        return[
          ld.getUTCFullYear(),"-",
          String(ld.getUTCMonth()+1).padStart(2,"0"),"-",
          String(ld.getUTCDate()).padStart(2,"0"),"T",
          String(lh).padStart(2,"0"),":",
          String(lm).padStart(2,"0"),":00",eoffStr
        ].join("");},
      utcZ(){
        const ld=new Date(ms);
        return[
          String(ld.getUTCFullYear()),
          String(ld.getUTCMonth()+1).padStart(2,"0"),
          String(ld.getUTCDate()).padStart(2,"0"),
          "T",
          String(ld.getUTCHours()).padStart(2,"0"),
          String(ld.getUTCMinutes()).padStart(2,"0"),
          String(ld.getUTCSeconds()).padStart(2,"0"),
          "Z"
        ].join("");}
    };
  }
  const startObj=toLocal(startMs);
  const endObj=toLocal(endMs);
  return{kind,id,venueId,dateStr,timeStr,fullTitle,location,description,url,
    startGcal:startObj.gcal(),endGcal:endObj.gcal(),
    startOutlook:startObj.outlook(),endOutlook:endObj.outlook(),
    startUtcZ:startObj.utcZ(),endUtcZ:endObj.utcZ(),
    off};
}

function calGoogleUrl(ev){
  if(!ev)return"";
  const e=encodeURIComponent;
  return"https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+e(ev.fullTitle)
    +"&dates="+ev.startGcal+"/"+ev.endGcal
    +"&ctz=Europe/Sofia"
    +"&location="+e(ev.location)
    +"&details="+e(ev.description);
}

function calOutlookUrl(ev){
  if(!ev)return"";
  const e=encodeURIComponent;
  return"https://outlook.live.com/calendar/0/action/compose"
    +"?subject="+e(ev.fullTitle)
    +"&startdt="+e(ev.startOutlook)
    +"&enddt="+e(ev.endOutlook)
    +"&location="+e(ev.location)
    +"&body="+e(ev.description);
}

function calIcs(ev){
  if(!ev)return"";
  /* RFC 5545 escaping: \ ; , and newline */
  function rfcEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
  /* RFC 5545 line folding: max 75 octets (UTF-8), fold with CRLF + SPACE */
  function fold(line){
    const out=[];
    let buf="",bytes=0;
    for(const ch of line){
      const enc=new TextEncoder().encode(ch);
      if(bytes+enc.length>75){out.push(buf);buf=" "+ch;bytes=1+enc.length;}
      else{buf+=ch;bytes+=enc.length;}
    }
    if(buf)out.push(buf);
    return out.join("\r\n");
  }
  const now=new Date();
  const dtstamp=[
    String(now.getUTCFullYear()),
    String(now.getUTCMonth()+1).padStart(2,"0"),
    String(now.getUTCDate()).padStart(2,"0"),
    "T",
    String(now.getUTCHours()).padStart(2,"0"),
    String(now.getUTCMinutes()).padStart(2,"0"),
    String(now.getUTCSeconds()).padStart(2,"0"),
    "Z"
  ].join("");
  const uid=ev.kind+"-"+ev.id+"-"+ev.venueId+"-"+ev.dateStr+"-"+(ev.timeStr||"").replace(/:/g,"")+"-sg@sofia-gleda";
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-" + "//Sofia Gleda//BG",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    fold("UID:"+uid),
    "DTSTAMP:"+dtstamp,
    "DTSTART:"+ev.startUtcZ,
    "DTEND:"+ev.endUtcZ,
    fold("SUMMARY:"+rfcEsc(ev.fullTitle)),
    fold("LOCATION:"+rfcEsc(ev.location)),
    fold("DESCRIPTION:"+rfcEsc(ev.description)),
    fold("URL:"+rfcEsc(ev.url)),
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  return lines.join("\r\n")+"\r\n";
}

function _calSvg(){
  return`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
    <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    <line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>`;
}

/* Render the calendar button HTML (not inside an <a>) */
function calBtnHtml(kind,id,venueId,dateStr){
  const L=CAL_T[S.lang];
  return`<button type="button" class="cal-btn" data-cal="${esc(kind+":"+id+"|"+venueId+"|"+dateStr)}" aria-label="${esc(L.addCal)}" title="${esc(L.addCal)}">${_calSvg()}</button>`;
}

/* Render the open panel HTML inside a row */
function calPanelHtml(kind,id,venueId,dateStr,times,selTime){
  const L=CAL_T[S.lang];
  const t=selTime||(times&&times[0])||"";
  const timePicker=times&&times.length>1
    ?`<div class="cal-times">${times.map(tm=>`<button type="button" data-caltm="${esc(tm)}" class="cal-times-btn${tm===t?" sel":""}">${esc(tm)}</button>`).join("")}</div>`
    :"";
  const ev=t?calEvent(kind,id,venueId,dateStr,t):null;
  const gUrl=ev?calGoogleUrl(ev):"";
  const oUrl=ev?calOutlookUrl(ev):"";
  const icsOk=!!ev;
  const icsData=ev?JSON.stringify({kind,id,venueId,dateStr,timeStr:t}):"{}";
  return`<div class="cal-panel">
    <h5>${esc(L.addCal)}<button type="button" class="cal-x" data-calclose aria-label="Затвори">✕</button></h5>
    ${timePicker}
    <div class="cal-apps">
      <button type="button" data-calg href="${esc(gUrl)}" data-calurl="${esc(gUrl)}">${_calSvg()}${esc(L.google)}</button>
      ${icsOk?`<button type="button" data-calics data-calev="${esc(icsData)}" data-calid="${esc(kind+"-"+id+"-"+venueId+"-"+dateStr+"-"+(t||"").replace(/:/g,""))}">${_calSvg()}${esc(L.apple)}</button>`:`<button type="button" disabled>${_calSvg()}${esc(L.apple)}</button>`}
      <button type="button" data-calo data-calurl="${esc(oUrl)}">${_calSvg()}${esc(L.outlook)}</button>
    </div>
  </div>`;
}

/* Open or close the calendar panel for a row */
function toggleCalPanel(btn,kind,id,venueId,dateStr,times){
  /* Close any open panel */
  const prev=document.querySelector(".cal-panel");
  if(prev){
    const wasBtn=_calPanel&&_calPanel.btn;
    prev.remove();
    _calPanel=null;
    if(wasBtn===btn)return; /* toggle off */
  }
  /* Build panel and insert after the vrow */
  const row=btn.closest(".vrow");
  if(!row)return;
  const t=times&&times[0]||"";
  const html=calPanelHtml(kind,id,venueId,dateStr,times,t);
  const wrap=document.createElement("div");
  wrap.innerHTML=html;
  row.after(wrap.firstElementChild);
  _calPanel={btn,kind,id,venueId,dateStr,times,selTime:t};
}

/* Calendar export click handler — own listener, no edits to main handler */
document.addEventListener("click",e=>{
  const q=sel=>e.target.closest(sel);
  /* Cal close button */
  if(q("[data-calclose]")){const p=q(".cal-panel");if(p){p.remove();_calPanel=null;}return;}
  /* Time selector inside panel */
  const tm=q(".cal-times-btn");
  if(tm&&_calPanel){
    _calPanel.selTime=tm.dataset.caltm;
    const panel=tm.closest(".cal-panel");
    if(panel){
      panel.outerHTML=calPanelHtml(_calPanel.kind,_calPanel.id,_calPanel.venueId,_calPanel.dateStr,_calPanel.times,_calPanel.selTime);
      /* re-bind _calPanel to new panel */
      const newP=document.querySelector(".cal-panel");
      if(newP)newP._calState=_calPanel;
    }
    return;
  }
  /* Google Calendar button */
  const cg=q("[data-calg]");
  if(cg){const u=cg.dataset.calurl;if(u)window.open(u,"_blank","noopener");return;}
  /* Outlook button */
  const co=q("[data-calo]");
  if(co){const u=co.dataset.calurl;if(u)window.open(u,"_blank","noopener");return;}
  /* Apple ICS download */
  const ci=q("[data-calics]");
  if(ci){
    try{
      const d=JSON.parse(ci.dataset.calev||"{}");
      const ev=calEvent(d.kind,d.id,d.venueId,d.dateStr,d.timeStr);
      if(!ev)return;
      const ics=calIcs(ev);
      const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      const fname="sofia-gleda-"+d.id+"-"+d.dateStr+"-"+(d.timeStr||"").replace(/:/g,"")+".ics";
      a.download=fname;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }catch(err){console.error("cal ics",err);}
    return;
  }
  /* Calendar open/toggle button */
  const cb=q("[data-cal]");
  if(cb){
    const v=cb.dataset.cal; /* "film:id|venue|date" or "show:id|venue|date" */
    const[kindraw,...rest]=v.split(":");
    const parts=rest.join(":").split("|");
    const kind=kindraw,id=parts[0],venueId=parts[1],dateStr=parts[2];
    /* Gather times for this row */
    let times=[];
    if(kind==="film"){
      const rows=SHOWTIMES.filter(r=>r[0]===id&&r[1]===venueId&&r[2]===dateStr);
      if(rows.length)times=rows[0][3]||[];
    }else{
      times=PERFORMANCES.filter(p=>p[0]===id&&p[1]===dateStr&&(p[0]===id)).map(p=>p[2]).filter((x,i,a)=>a.indexOf(x)===i);
    }
    toggleCalPanel(cb,kind,id,venueId,dateStr,times);
    return;
  }
});

/* ===================== events ===================== */
document.addEventListener("click",e=>{
  const q=sel=>e.target.closest(sel);
  if(q("[data-close]")||e.target.id==="scrim"){_sheetShowAllCinemas=false;closeSheet();return;}
  if(q(".time")||q(".buylink"))return;            /* let real links through */

  const rm=q("[data-readmore]");
  if(rm){const w=rm.closest(".synwrap");if(w){const on=w.classList.toggle("clamp");
    rm.textContent=on?rm.dataset.moreLabel:rm.dataset.lessLabel;}return;}
  const shr=q("[data-share]");
  if(shr){const[kind,...rest]=shr.dataset.share.split(":");const id=rest.join(":");
    let title="";
    if(kind==="film"&&filmById[id])title=filmTitle(filmById[id]);
    else if(kind==="show"&&showById[id])title=showById[id].title;
    else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);title=ev?(S.lang==="bg"?ev.title:ev.titleEn):"";}
    shareItem(kind,id,title);return;}

  if(q("[data-home]")){S.q="";S.qFocus=false;S.searchOpen=false;S.fGenres=[];S.fVenues=[];S.fStrands=[];
    S.day="week";S.rFrom=S.rTo=null;S.calMonth=null;S.limit=30;S.drawer=false;
    if(location.hash)history.replaceState(null,"",location.pathname+location.search);
    save();render();window.scrollTo({top:0,behavior:"smooth"});return;}

  const sw=q("[data-switch]");
  if(sw){S.mode=sw.dataset.switch;S.fGenres=[];S.fVenues=[];S.fStrands=[];S.limit=30;save();render();window.scrollTo({top:0});return;}
  if(q("[data-more]")){S.limit+=30;render();return;}
  if(q("[data-drawer]")){S.drawer=true;S.qFocus=false;render();return;}
  if(q("[data-dclose]")){S.drawer=false;render();return;}
  const rg=q("[data-range]"); if(rg){S.day=rg.dataset.range;S.rFrom=S.rTo=null;S.limit=30;render();return;}
  const cstep=q("[data-calstep]"); if(cstep&&!cstep.disabled){
    S.calMonth=Math.max(0,Math.min((S.calMonth||0)+Number(cstep.dataset.calstep),MONTHS.length-1));render();return;}
  const pk=q("[data-pick]"); if(pk&&!pk.disabled){
    const iso=pk.dataset.pick; S.limit=30;
    /* first tap starts a range, second tap ends it (swap if reversed),
       a tap after a complete range starts fresh */
    if(S.day!=="range"||!S.rFrom||S.rTo){S.day="range";S.rFrom=iso;S.rTo=null;}
    else if(iso<S.rFrom){S.rTo=S.rFrom;S.rFrom=iso;}
    else{S.rTo=iso;}
    render();return;}
  const st=q("[data-strand]"); if(st){const v=st.dataset.strand;S.fStrands=v?toggleArr(S.fStrands,v):[];S.qFocus=false;S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  /* search icon button is a TOGGLE: animate in-place (Item 2) */
  if(q("[data-search-open]")){S.qFocus=false;searchToggleInPlace();return;}
  if(q("[data-qclear-m]")){S.q="";S.qFocus=false;S.searchOpen=false;render();return;}
  if(q("[data-qclear]")){S.q="";S.qFocus=false;render();return;}
  const d=q("[data-day]"); if(d){S.day=d.dataset.day;render();return;}
  const gf=q("[data-genre]"); if(gf){const v=gf.dataset.genre;S.fGenres=v?toggleArr(S.fGenres,v):[];S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  const vf=q("[data-venue]"); if(vf){const v=vf.dataset.venue;S.fVenues=v?toggleArr(S.fVenues,v):[];S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  if(q("[data-clearf]")){S.fGenres=[];S.fVenues=[];S.fStrands=[];S.day="week";S.rFrom=S.rTo=null;render();return;}
  if(q("[data-lang]")){S.lang=S.lang==="bg"?"en":"bg";save();render();rerenderOpenSheet();return;}
  /* collapsible section toggle — animate in-place (Item 1), fall back to render if section not in DOM */
  const st2=q("[data-sectoggle]");
  if(st2){
    const key=st2.dataset.sectoggle;
    if(!secToggleInPlace(key)){
      /* secToggleInPlace returned false: section not in DOM yet, use render() */
      const hdrTop=st2.getBoundingClientRect().top;
      render();
      const newHdr=document.querySelector(`[data-sectoggle="${key}"]`);
      if(newHdr){const delta=newHdr.getBoundingClientRect().top-hdrTop;window.scrollBy({top:delta,behavior:"instant"});}
    }
    return;}

  const sc=q("[data-scroll]");
  if(sc){const tr=sc.parentElement.querySelector(".rtrack");
    tr.scrollBy({left:Number(sc.dataset.scroll)*tr.clientWidth*.82,behavior:"smooth"});return;}

  if(q("[data-sheetshowallcin]")){_sheetShowAllCinemas=true;
    const shBody=document.querySelector(".sheet .sbody");
    if(shBody&&curSheet&&curSheet.kind==="film"&&filmById[curSheet.id]){
      const newSheet=document.createElement("div");newSheet.innerHTML=sheetFilm(filmById[curSheet.id]);
      const newSec=newSheet.querySelector(".sec:last-child");
      const oldSec=shBody.querySelector(".sec:last-child");
      if(oldSec&&newSec)oldSec.replaceWith(newSec);}return;}
  const fc=q("[data-film]"); if(fc){_sheetShowAllCinemas=false;curSheet={kind:"film",id:fc.dataset.film};openSheet(sheetFilm(filmById[fc.dataset.film]),fc);return;}
  const shc=q("[data-show]"); if(shc){curSheet={kind:"show",id:shc.dataset.show};openSheet(sheetShow(showById[shc.dataset.show]),shc);return;}
  const ec=q("[data-event]"); if(ec){curSheet={kind:"event",id:ec.dataset.event};openSheet(sheetEvent(EVENTS.find(x=>x.id===ec.dataset.event)),ec);return;}
});

function fatal(e){
  const msg=(e&&(e.message||e))+"";
  if(window.__sofiaPanel){window.__sofiaPanel(msg);return;}
  const app=document.getElementById("app");
  if(!app)return;
  app.innerHTML=`<div style="max-width:560px;margin:56px auto;padding:0 20px;font:15px/1.6 system-ui;color:#B6ABBC">
    <div style="font:700 13px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:#E0163A;margin-bottom:14px">Sofia Gleda</div>
    <h1 style="font:600 20px/1.3 system-ui;color:#F4EFF6;margin:0 0 10px">Приложението не можа да се зареди</h1>
    <p style="margin:0 0 16px">Най-честата причина са запазени стари настройки. Изчистването им решава проблема и
       зарежда програмата наново.</p>
    <button id="hardreset" style="padding:11px 20px;border-radius:10px;background:#E0163A;color:#fff;border:0;
      font:600 14px system-ui;cursor:pointer">Изчисти и опитай пак</button>
    <details style="margin-top:22px"><summary style="cursor:pointer;font-size:13px">Техническа подробност</summary>
      <pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#7E7386;margin-top:8px">${
        String(msg).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</pre></details>
  </div>`;
  const rb=document.getElementById("hardreset");
  if(rb)rb.onclick=()=>{try{localStorage.removeItem(LS);}catch(e){}location.reload();};
}
/* Part 0b: re-render when the viewport crosses 760 px (mobile ↔ desktop header switch).
   Keep any open drawer/sheet alive; just rebuild the header HTML. */
try{
  const mqMob=window.matchMedia("(max-width:760px)");
  const onMqChange=()=>{ if(!sheetOpen) render(); };
  if(mqMob.addEventListener) mqMob.addEventListener("change",onMqChange);
  else if(mqMob.addListener) mqMob.addListener(onMqChange);
}catch(e){}
function boot(){ render(); }
const origRender=render;
render=function(){
  try{ origRender();mountProgressive(); }
  catch(e){ fatal(e); }
};
try{ boot(); openFromHash(); }catch(e){ fatal(e); }
window.addEventListener("error",e=>{
  const app=document.getElementById("app");
  if(app&&app.innerHTML.indexOf("Зареждане на програмата")>-1) fatal(e.error||e.message);
});
