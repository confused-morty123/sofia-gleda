<title>Sofia Gleda</title>
<!-- Webfonts are self-hosted (fonts/, SIL OFL): no request leaves the site for a
     font. fonts.css only declares the faces (font-display:swap, per-script subsets),
     so a font file never holds up first paint, and every rule declares a real
     fallback stack, so the page is fully usable before (or without) the webfonts. -->
<link rel="stylesheet" href="fonts/fonts.css">

<style>
:root{
  --ink:#0C0A0F; --ink-2:#141018; --ink-3:#1C1622; --ink-4:#28202F;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  /* --fg-3 was #7E7386 (3.5-4.4:1, below WCAG AA on every surface): #958A9C keeps the hue
     and the step below --fg-2, at 6.0:1 on ink, 5.7 on ink-2, 5.4 on ink-3, 4.8 on ink-4 */
  --fg:#F4EFF6; --fg-1:var(--fg); --fg-2:#B6ABBC; --fg-3:#958A9C;
  --crimson:#E0163A; --gild:#D9B23C;
  --accent:var(--crimson); --on-accent:#fff;
  /* the accent as TEXT or a thin outline on ink: crimson #E0163A is only 3.7-4.1:1 there;
     #FF3B5C is 5.1-5.7:1. Fills behind white text keep --accent (white on it 4.8:1). */
  --accent-text:#FF3B5C;
  --shadow:0 20px 48px rgba(0,0,0,.55);
  --r:12px; --r-lg:20px;
  --motion-dur-sm:160ms; --motion-dur-md:380ms;
  --motion-ease-spring:cubic-bezier(.34,1.48,.64,1);
  --motion-ease-out:cubic-bezier(.25,.46,.45,.94);
  /* design phase: one sheet curve (iOS-like, no overshoot), one standard curve */
  --ease-sheet:cubic-bezier(.32,.72,0,1); --ease-std:cubic-bezier(.2,0,0,1);
  --dur-press:90ms; --dur-fade:200ms; --dur-out:280ms; --dur-in:420ms;
  /* type scale (phones; desktop body stays 15): nothing on screen below --t-min */
  --t-xl:34px; --t-l:28px; --t-m:22px; --t-body:16px; --t-sub:15px; --t-fn:13px; --t-cap:12px; --t-min:11px;
  color-scheme:dark;
}
:root[data-surface="theatre"]{ --accent:var(--gild); --on-accent:#17110B; --accent-text:var(--gild); }
/* Dark mode is forced — there is no light theme. The former
   `@media (prefers-color-scheme: light)` and `:root[data-theme="light"]` blocks
   were removed so a device set to light does not recolour the app; `color-scheme:dark`
   on :root above keeps native controls, scrollbars, and form fields dark too. */

*{box-sizing:border-box}
html,body{min-height:100%}
/* the page is pinned (position:fixed) while a sheet is open; a stable gutter keeps it
   from reflowing sideways where scrollbars take up space */
html{scrollbar-gutter:stable; -webkit-text-size-adjust:100%; text-size-adjust:100%}
body{margin:0; background:var(--ink); color:var(--fg);
  font-family:"Onest","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
/* Safe areas: the page asks for the whole screen (viewport-fit=cover), so on a phone it
   is laid out under the rounded corners, the notch or Dynamic Island, the status bar of
   the home-screen app and the home indicator. Every edge of the layout keeps clear of
   those insets (they are 0 on other screens, where nothing changes). */
.wrap{max-width:none; margin:0;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){ .wrap{padding-inline:max(40px,env(safe-area-inset-left,0px)) max(40px,env(safe-area-inset-right,0px))} }
@media(min-width:1440px){ .wrap{padding-inline:max(56px,env(safe-area-inset-left,0px)) max(56px,env(safe-area-inset-right,0px))} }
/* the header spans the full viewport, content fluid to 100% */
.bar .wrap{padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
@media(min-width:900px){ .bar .wrap{padding-inline:max(28px,env(safe-area-inset-left,0px)) max(28px,env(safe-area-inset-right,0px))} }
@media(min-width:1440px){ .bar .wrap{padding-inline:max(40px,env(safe-area-inset-left,0px)) max(40px,env(safe-area-inset-right,0px))} }
/* the status-bar band of an edge-to-edge screen keeps the page colour: neither the pinned
   header's logo row nor the listing shows behind the clock and the Dynamic Island */
body::before{content:""; position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top,0px);
  background:var(--ink); z-index:61; pointer-events:none}

/* ---------- header ---------- */
/* Desktop: position:sticky, single row. Mobile: two rows (logo centred + controls).
   The logo row is allowed to scroll away; the controls row stays pinned via a
   negative top offset equal to the logo row height (28px logo + 14px padding-block + 10px gap = 52px).
   --logo-row-h is the single source of truth so the pinned offset cannot drift. */
/* No backdrop-filter on the pinned header: blurring the page under it cost a render pass
   every scroll frame (2.7 ms a frame at 1440 px where the GPU does not composite), for a
   blur seen through 8% of the colour. Opaque instead: unblurred, even 3% let the titles
   scrolling under it show. */
.bar{position:sticky; top:0; z-index:60;
  background:var(--ink);
  border-bottom:1px solid var(--line); padding-block:calc(14px + env(safe-area-inset-top,0px)) 14px}
/* three zones: brand left · toggle CENTRE · search+lang right
   P3A item 1: toggle moves to true centre column */
.bar-in{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px}
.brand{display:flex; flex-direction:column; align-items:flex-start; justify-self:start; min-width:0;
  background:none; border:0; padding:0; margin:0; cursor:pointer; font:inherit; -webkit-tap-highlight-color:transparent}
@media(max-width:760px){ .brand{align-items:center} }
.brand-logo{height:clamp(32px,3.2vw,42px); width:auto; flex:0 1 auto; min-width:0; max-width:100%;
  object-fit:contain; display:block; transition:filter .15s}
.brand:hover .brand-logo{filter:brightness(1.12)}
.brand b{font-family:Oswald,"Arial Narrow",sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,30px);
  letter-spacing:.15em; text-transform:uppercase; color:var(--accent); line-height:1; white-space:nowrap;
  transition:opacity .15s, filter .15s}
.brand:hover b{filter:brightness(1.12)}
.brand:active b{opacity:.7}
.brand span{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap}
.bar-controls{display:flex; align-items:center; gap:8px; justify-self:end}
@media(max-width:820px){ .brand span{display:none} }
/* ── Mobile layout (≤760px) ──
   Row 1: logo centred (scrolls away).
   Row 2: [seg toggle expands] [lang 42px] [search icon 42px] [burger 42px] — one line, never wraps.
   Row 3: full-width search field (only when S.searchOpen).
   --logo-row-h = 28px logo + 14px padding-block-top + 10px gap between rows = 52px.
   The negative top hides the logo row; the controls row is then 8px below safe-area-inset-top. */
/* ── Mobile layout (≤760px) — JS also detects this and renders mobile HTML ── */
/* Row 1: 3-column grid — left placeholder | logo centred | lang button right.
   Row 2: seg toggle (fills width) + search icon.
   Row 3 (optional): full-width open search field when S.searchOpen.
   --logo-row-h = 45px row (logo 28px + 5px gap + 12px subtext, taller than the 42px language button) + 14px padding-block-top + 10px gap = 69px. */
@media(max-width:760px){
  :root{ --logo-row-h:69px } /* 45px row (logo + subtext) + 14px top padding + 10px gap */
  /* the header's top padding holds the safe-area inset, so pinned, its controls row
     sits 8px below that inset whatever its size */
  .bar{top:calc(8px - var(--logo-row-h))}
  .bar-row-logo{display:grid; grid-template-columns:42px 1fr 42px; align-items:center; margin-bottom:10px; gap:0}
  .bar-row-logo .brand{justify-self:center; grid-column:2}
  .bar-row-logo .lang-right{grid-column:3; justify-self:end}
  .bar-row-controls{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; overflow:hidden}
  .bar-row-search{width:100%}
  .brand b{font-size:19px; letter-spacing:.08em}
  .brand-logo{height:28px}
  /* mobile search icon button — inherits .iconb; only expanded override needed here */
  /* mobile open search field */
  .bar-row-search .search{position:relative; width:100%; max-width:none}
  /* P3A item 4: phone period header — title on one line, dates on own line with spacing */
  .phead-title{font-size:clamp(28px,7vw,36px); display:block}
  .phead-dates{display:block!important; white-space:nowrap; font-size:clamp(15px,4.5vw,20px);
    margin-top:6px; line-height:1.25}
  /* P3A item 4: "Друг период" button — minimum 44px tap target */
  .phead-other{min-height:44px; display:inline-flex; align-items:center; padding-block:4px}
}
/* ── Segmented toggle — FIXED equal halves, language-independent ──
   Desktop: ~300px wide × 50px tall, centred in the middle column (P3A item 1).
   Mobile: fills remaining width in bar-row-controls row.
   Collision-based shrink: when search is open and viewport <1100px the labels
   fade out (JS adds .seg-q class exactly as before, but the threshold is now
   driven by actual layout rather than a fixed breakpoint — see searchToggleInPlace). */
.seg{display:grid; grid-template-columns:1fr 1fr; background:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:4px; gap:2px; flex:0 0 auto; width:300px; justify-self:center}
.seg button{display:flex; align-items:center; justify-content:center; gap:6px; height:42px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--fg-2); white-space:nowrap; transition:background .18s,color .18s; padding:0 10px; overflow:hidden}
.seg button svg{flex:0 0 20px; width:20px; height:20px}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:700}
/* mobile: seg fills remaining width (must come AFTER the base width rule) */
@media(max-width:760px){ .seg{flex:1 1 0!important; min-width:0; width:auto!important} }
/* at very narrow viewports, drop the SVG icons from toggle to save space */
@media(max-width:350px){ .seg button svg{display:none} }
/* collision-based shrink: when search is open AND it would touch the toggle, shrink to icons-only.
   JS sets .seg-q only when getBoundingClientRect detects a collision; removed when no collision. */
.seg{transition:width .22s ease-out}
.seg button{transition:background .18s,color .18s,gap .22s ease-out}
.seg .seg-l{display:inline-block; max-width:7em; overflow:hidden; transition:max-width .22s ease-out, opacity .22s ease-out}
.seg.seg-q{width:100px}
.seg.seg-q button{gap:0}
.seg.seg-q .seg-l{max-width:0; opacity:0}
/* phones: the search opens in its own row below the toggle, so nothing collides and the
   toggle keeps its icons and names while the search opens and closes (JS never sets
   .seg-q there; these rules hold the look even if it did) */
@media(max-width:760px){.seg.seg-q{width:auto!important} .seg.seg-q button{gap:6px}
  .seg.seg-q .seg-l{max-width:7em; opacity:1}}
.iconb{width:42px; height:42px; flex:0 0 42px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg-2); font-size:13px; font-weight:700; display:grid; place-items:center}
.iconb:hover{border-color:var(--line-2); color:var(--fg)}
.search-icon-btn.expanded{border-color:var(--accent); color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,var(--ink-3))}

/* ---------- controls ---------- */
/* Desktop: search is the expand-on-demand panel, not always visible.
   The iconb search-icon-btn lives in bar-controls (far right-ish).
   When expanded, .desk-search-wrap grows into view from the right side.
   Item 2: smooth animation — opacity fades in with width; JS adds/removes .open.
   Closing mirrors opening: the same .22s, with the reversed curve (ease-in for the
   way out, ease-out for the way in; a transition takes the timing of the state it
   goes to). */
.desk-search-wrap{display:flex; align-items:center; gap:0; overflow:hidden; max-width:0; opacity:0;
  transition:max-width .22s ease-in, opacity .22s ease-in}
.desk-search-wrap.open{max-width:420px; opacity:1; transition-timing-function:ease-out}
/* mobile search row: animated height. Default display:none keeps #q-m out of
   layout (bounding_box()===null for tests). JS sets display:block before adding
   .open to trigger the CSS transition, then restores display:none after close.
   The row opens to its own height (--sr-h, measured by JS) rather than a cap above
   it, so no part of either animation is spent where nothing moves. */
.bar-row-search{display:none; overflow:hidden; max-height:0; opacity:0;
  transition:max-height .22s ease-in, opacity .22s ease-in}
.bar-row-search.sr-visible{display:block} /* JS adds this before animating open */
.bar-row-search.open{max-height:var(--sr-h,64px); opacity:1; transition-timing-function:ease-out}
@media (prefers-reduced-motion:reduce){
  .desk-search-wrap,.bar-row-search{transition:none!important}
}
/* 420 px, narrower below 1210 px: open beside the toggle, the field leaves the logo's
   column its room (the lockup's 190 px floor and 12 px clear of the toggle), so nothing
   overflows from 761 px up */
.desk-search-wrap .search{position:relative; width:min(420px,calc(50vw - 185px)); max-width:420px; min-width:0}
.search input{width:100%; padding:11px 40px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg); font:inherit; font-size:15px}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{outline:none; border-color:var(--accent)}
.search .mag{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:15px; pointer-events:none}
.search .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:16px;
  width:24px; height:24px; border-radius:50%; display:none; place-items:center}
.search.has .clr{display:grid}
.search.search-mob-open .clr{display:grid}
/* .burger removed — drawer is opened by .fab and period-banner link only */
.drawer-scrim{position:fixed; inset:0; z-index:100; background:rgba(5,3,7,.6); backdrop-filter:blur(3px)}
.drawer{position:fixed; top:0; right:0; bottom:0; z-index:101; width:min(380px,88vw);
  background:var(--ink-2); border-left:1px solid var(--line); overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px))
    calc(28px + env(safe-area-inset-bottom,0px)) 18px; box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer h3{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--fg-3); margin:20px 0 9px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.drawer h3:first-of-type{margin-top:6px}
.drawer-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:4px}
.drawer-top b,.drawer-top .drawer-title{font-family:Oswald,sans-serif; font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; margin:0}
.dclose{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:14px; color:var(--fg-2)}
.chipwrap{display:flex; gap:6px; flex-wrap:wrap}
.mrow{display:flex; gap:6px; margin-bottom:9px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal button{aspect-ratio:1; border-radius:8px; border:1px solid transparent; background:var(--ink-3);
  font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg-2); display:grid; place-items:center; position:relative}
.cal button:hover{border-color:var(--line-2)}
.cal button[disabled]{opacity:.26; cursor:default; background:transparent}
.cal button.has::after{content:""; position:absolute; bottom:4px; width:3px; height:3px; border-radius:50%; background:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.cal button[aria-pressed="true"]::after{background:var(--on-accent)}
.cal button.inrange{background:color-mix(in srgb,var(--accent) 26%,transparent); color:var(--fg-1); border-radius:0}
.cal button.rstart{border-top-left-radius:8px; border-bottom-left-radius:8px}
.cal button.rend{border-top-right-radius:8px; border-bottom-right-radius:8px}
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:8px}
.calmon{font-size:13px; font-weight:600; color:var(--fg-1); text-align:center; flex:1}
.calarrow{width:32px; height:32px; flex:none; border-radius:8px; border:1px solid var(--line-2);
  background:var(--ink-3); color:var(--fg-1); font-size:17px; line-height:1; cursor:pointer; display:grid; place-items:center}
.calarrow:hover:not([disabled]){border-color:var(--accent); color:var(--accent)}
.calarrow[disabled]{opacity:.3; cursor:default}
.calhint{margin-top:9px; font-size:11px; color:var(--fg-3); text-align:center; min-height:14px}
.caldow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px}
.caldow span{text-align:center; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3)}
.applyb{width:100%; margin-top:22px}
.until{font-size:11px; color:var(--fg-3); margin-top:7px; line-height:1.45}
.lastcheck{font-size:10.5px; letter-spacing:.06em; color:var(--fg-3); margin-top:16px; padding-top:12px; border-top:1px solid var(--line)}
.controls{padding-block:14px 4px; display:flex; flex-direction:column; gap:10px}
.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto; min-width:58px; padding:6px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--ink-2); text-align:center; line-height:1.2; transition:border-color .15s,background .15s}
.day:hover{border-color:var(--line-2)}
.day[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.day .dow{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
.day .dnum{display:block; font-family:Oswald,sans-serif; font-size:16px; font-weight:600}
.day .dall{font-family:Oswald,sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.06em}
.fbar{display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
.fbar::-webkit-scrollbar{display:none}
.sbar{position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:10px;
  padding:9px 12px; background:color-mix(in srgb,var(--ink-2) 94%,transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.sback{display:flex; align-items:center; gap:7px; padding:7px 13px 7px 9px; border-radius:999px;
  border:1px solid var(--line-2); font-size:13px; font-weight:600; color:var(--fg)}
.sback:hover{border-color:var(--accent); color:var(--accent)}
.sgrab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:8px auto 0; display:none}
@media(max-width:620px){ .sgrab{display:block} .scrim{padding:0; place-items:end center}
  /* Higher specificity (.scrim .sheet) so these win over the base `.sheet`
     rule, which is defined LATER in the file: without it the base
     `overflow:hidden` overrode `overflow-y:auto` and the bottom sheet could not
     scroll on mobile, clipping everything past 94vh. */
  .scrim .sheet{width:100%; border-radius:18px 18px 0 0; margin-bottom:0;
    max-height:calc(94vh - env(safe-area-inset-top,0px));
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
  /* On a phone, vh is the screen height with the browser's toolbars HIDDEN: while
     they show, a 94vh sheet is taller than the visible area and its last rows (the
     times and ticket links) sit behind the toolbar, out of reach of the sheet's own
     scroll. dvh follows the toolbars (vh stays the fallback for older browsers), and
     the body clears the iPhone home indicator. */
  /* (and its top, with the back bar, stays below the status bar of an edge-to-edge screen) */
  @supports (height:1dvh){ .scrim .sheet{max-height:calc(94dvh - env(safe-area-inset-top,0px))} }
  .scrim .sbody{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))} }
.fchip{padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--ink-2);
  font-size:12px; color:var(--fg-2); transition:border-color .15s,background .15s; white-space:nowrap}
.fchip:hover{border-color:var(--line-2)}
.fchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.fchip.off,.fchip:disabled{opacity:.4; pointer-events:none; text-decoration:line-through; text-decoration-thickness:1px}
.fclear{font-size:11.5px; color:var(--fg-3); text-decoration:underline; text-underline-offset:3px; padding:5px 4px}

/* ---------- favourites (P3A item 7) ---------- */
.fav-star{background:none; border:none; cursor:pointer; padding:4px 6px; color:var(--fg-3);
  font-size:15px; line-height:1; border-radius:6px; transition:color .15s, transform .15s}
.fav-star:hover{color:var(--fg)}
.fav-star.on{color:var(--accent)}
.fav-star.on:hover{color:var(--accent); transform:scale(1.2)}
.fav-toggle{display:flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--ink-2); font-size:12px; font-weight:600;
  color:var(--fg-2); transition:border-color .15s, color .15s, background .15s}
.fav-toggle:hover{border-color:var(--line-2); color:var(--fg)}
.fav-toggle.on{border-color:var(--accent); color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,var(--ink-2))}
.fav-toggle svg{width:14px; height:14px; flex:0 0 14px}

/* ---------- late-day empty state (P3A item 6) ---------- */
.late-day-card{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
  padding:36px 24px; border-radius:var(--r-lg); border:1px dashed var(--line-2);
  background:var(--ink-2); margin-block:24px 30px}
.late-day-card p{margin:0; font-size:16px; color:var(--fg-2)}
.late-day-card .btn{margin-top:4px}

/* ---------- brand subtext (option A: under logo in header) ---------- */
.brand .brand-sub{display:block; font-family:Onest,sans-serif; font-weight:400;
  font-size:12.5px; color:var(--fg-2); white-space:nowrap; overflow:visible;
  line-height:1; margin-top:5px; text-align:left;
  text-transform:none; letter-spacing:normal}
@media(max-width:760px){
  .brand .brand-sub{font-size:12px; text-align:center} }
/* Desktop (761 px and up): the logo and its line are one lockup that scales as the
   window narrows (owner, 16 Oct 2026: the line used to vanish at 761-1023 px). The
   brand is exactly as wide as the logo would be (its own clamp, 5.153 = logo.svg's
   width/height), never wider than its column; the logo fills that width and the line's
   font is set from it in container units, so the line is 98% of the logo's width in
   either language (Onest: 18.42 font-sizes wide in BG, 15.87 in EN) and stays inside
   the column, clear of the toggle. Below about 1180 px the lockup stops shrinking at
   190 px, where the line is 10.1 px in BG and 11.7 px in EN (the owner's 10 px floor);
   the search field above narrows to leave it that room. Phones keep the centred 12 px
   line above. */
@media(min-width:761px){
  .brand{width:min(100%,max(190px,calc(clamp(32px,3.2vw,42px)*5.153))); container-type:inline-size}
  .brand-logo{width:100%; height:auto; max-width:none}
  .brand .brand-sub{font-size:calc(100cqi*.98/18.42)}
  .brand .brand-sub:lang(en){font-size:calc(100cqi*.98/15.87)}
}

/* ---------- hero ---------- */
.hero{position:relative; border-radius:var(--r-lg); overflow:hidden; margin-block:18px 30px;
  min-height:290px; display:flex; align-items:flex-end; border:1px solid var(--line)}
@media(min-width:800px){ .hero{min-height:340px} }
.hero-art{position:absolute; inset:0; z-index:0}
.hero-scrim{position:absolute; inset:0; z-index:1;
  background:linear-gradient(100deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.74) 40%,rgba(0,0,0,.26) 76%,rgba(0,0,0,.5) 100%)}
.hero-body{position:relative; z-index:2; padding:24px 20px; max-width:620px; color:#F4EFF6}
@media(min-width:800px){ .hero-body{padding:38px 42px} }
.eyebrow{font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; font-weight:700;
  color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
[data-surface="theatre"] .eyebrow{color:var(--gild)}
.eyebrow .dot{width:5px; height:5px; border-radius:50%; background:currentColor}
.hero h1,.hero .hero-title{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(28px,5.6vw,52px); line-height:1; margin-bottom:11px}
[data-surface="theatre"] .hero h1,[data-surface="theatre"] .hero .hero-title{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  font-weight:800; letter-spacing:-.015em; font-size:clamp(26px,5vw,46px); line-height:1.04}
.hero-meta{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:11px; font-size:12.5px; color:#CCC2D0}
.hero-syn{font-size:14px; color:#DBD2DE; margin-bottom:17px; max-width:54ch}
.acts{display:flex; gap:9px; flex-wrap:wrap}
.btn{padding:10px 20px; border-radius:10px; font-weight:600; font-size:13.5px;
  background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); transition:filter .16s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.26); color:#fff; backdrop-filter:blur(6px)}
.btn.sm{padding:7px 14px; font-size:12.5px}

/* ---------- rails ---------- */
.rail{margin-bottom:44px}
.rhead{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.rhead h2{font-family:Oswald,sans-serif; font-weight:600; font-size:clamp(20px,2.2vw,26px);
  letter-spacing:.06em; text-transform:uppercase; color:var(--fg); display:flex; align-items:center; gap:10px}
.rhead h2::before{content:""; display:inline-block; width:4px; height:.9em; border-radius:2px;
  background:var(--accent); flex:0 0 4px}
/* P3A item 3: theatre rails use same Oswald + uppercase rule as cinema (one rule across both surfaces) */
[data-surface="theatre"] .rhead h2{font-family:Oswald,sans-serif; text-transform:uppercase;
  letter-spacing:.06em; font-size:clamp(20px,2.2vw,26px)}
.rhead .sub{font-size:11.5px; color:var(--fg-3)}
.rscroll{position:relative}
.rtrack{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:6px; scroll-behavior:smooth; scrollbar-width:thin}
.rtrack::-webkit-scrollbar{height:5px}
.rtrack::-webkit-scrollbar-thumb{background:var(--ink-4); border-radius:9px}
.rarrow{position:absolute; top:34%; z-index:5; width:32px; height:62px; border-radius:10px;
  background:color-mix(in srgb,var(--ink) 92%,transparent); border:1px solid var(--line-2);
  display:none; place-items:center; font-size:17px}
@media(min-width:900px){ .rscroll:hover .rarrow{display:grid} }
/* While the wheel or trackpad scrolls the page, the cards and rails passing under the
   resting pointer neither lift nor show their arrows: each hover change repainted its
   rail, about two paints and a style pass a frame (the wheel listener by the live search
   sets .sg-wheel) */
html.sg-wheel .card:hover{transform:none}
html.sg-wheel .rscroll:hover .rarrow{display:none}
.rarrow.prev{left:-8px} .rarrow.next{right:-8px}

/* ---------- card + generated poster ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px 12px}
@media(min-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))} }
.card{flex:0 0 auto; width:158px; scroll-snap-align:start; text-align:left; display:flex; flex-direction:column; gap:7px;
  transition:transform .22s cubic-bezier(.22,1,.36,1)}
.grid .card{width:auto}
@media(min-width:760px){ .card{width:180px} }
.card:hover{transform:translateY(-5px)}
.poster{position:relative; aspect-ratio:2/3; max-width:100%; border-radius:var(--r); overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:flex-end;
  padding:11px; color:#fff; isolation:isolate}
.p-art{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.p-real{object-fit:cover; max-width:none}
/* a real poster carries its own title, so the generated lockup steps back */
.poster:has(.p-real) .p-title,.poster:has(.p-real) .p-sub{display:none}
.poster:has(.p-real) .p-grain{background:linear-gradient(to top,rgba(0,0,0,.55),transparent 42%)}
.shero:has(.p-real) .p-real{filter:blur(2px) brightness(.62)}
/* wide event cards (.ebox) are landscape; a real poster fills the box (cover)
   on its own layer above the generated SVG but below the grain + text, with a
   stronger scrim so the badge, title, and date stay legible over the art. */
.ebox .p-real{z-index:1; width:100%; height:100%; object-fit:cover; object-position:center 22%}
.ebox:has(.p-real) .p-grain{background:
  linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.32) 46%,rgba(0,0,0,.08) 78%),
  linear-gradient(to bottom,rgba(0,0,0,.5),transparent 34%)}
/* QA UI-05: when ebox has a real poster, hide the SVG generated art beneath it */
.ebox:has(.p-real) .p-art:not(.p-real){display:none}
.p-grain{position:absolute; inset:0; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
             radial-gradient(130% 80% at 50% 105%,rgba(0,0,0,.72),transparent 62%)}
.p-title{position:relative; z-index:3; font-family:Oswald,sans-serif; font-weight:600; text-transform:uppercase;
  font-size:16px; line-height:1.04; text-shadow:0 2px 14px rgba(0,0,0,.7);
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
[data-surface="theatre"] .p-title{font-family:"Playfair Display",Georgia,serif; text-transform:none; font-weight:600; font-size:18px; line-height:1.12}
.p-sub{position:relative; z-index:3; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; opacity:.8; margin-top:5px}
.p-top{position:absolute; top:9px; left:9px; right:9px; z-index:4; display:flex; justify-content:space-between; align-items:flex-start; gap:6px}
/* the rating badges carry no backdrop-filter: one on every card added a GPU render pass
   per visible card to every scroll frame (12 a frame instead of 2); a darker ground keeps
   the poster's own lettering from showing through, as the blur did */
.score{font-family:Oswald,sans-serif; font-weight:600; font-size:12.5px; padding:2px 7px; border-radius:6px;
  background:rgba(0,0,0,.78); font-variant-numeric:tabular-nums;
  border:1px solid rgba(255,255,255,.18); display:flex; align-items:center; gap:4px; white-space:nowrap; color:#fff}
.score i{font-style:normal; font-size:7.5px; letter-spacing:.1em; opacity:.72; font-family:Onest,sans-serif}
.score.hi{color:#FFD84D} .score.na{color:#A99DAD; font-size:11px}
.score.tmdb{background:linear-gradient(rgba(1,180,228,.16),rgba(1,180,228,.16)),rgba(0,0,0,.8);
  border-color:rgba(1,180,228,.42); color:#01B4E4}
.fest-mark{font-family:Onest,sans-serif; font-weight:600; font-size:9px; padding:2px 6px; border-radius:6px; letter-spacing:.06em; opacity:.9; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.22); color:#fff}
/* a festival mark and a premiere badge stack in the poster's top-right corner */
.p-tags{display:flex; flex-direction:column; align-items:flex-end; gap:4px; min-width:0}
.badge{font-size:8px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; padding:3px 7px;
  border-radius:5px; background:var(--accent); color:var(--on-accent); white-space:nowrap}
.badge.lim{background:linear-gradient(135deg,#E0163A,#7E0C1F); color:#fff}
.badge.free{background:#1B7A4B; color:#fff}
/* P3A item 1/2: premiere badge — gold accent, sentence-case text */
.badge.prem{background:#7A5A00; color:#FFD966; text-transform:none; letter-spacing:.02em}
.cfoot{display:flex; flex-direction:column; gap:2px; padding-inline:2px}
.cf1{font-size:12px; font-weight:500; color:var(--fg-2); line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em}
.cf2{font-size:10.5px; color:var(--fg-3); font-variant-numeric:tabular-nums}

/* event card */
.ecard{flex:0 0 auto; width:290px; scroll-snap-align:start; text-align:left}
@media(min-width:760px){ .ecard{width:344px} }
.ebox{position:relative; border-radius:var(--r); overflow:hidden; border:1px solid var(--line); padding:18px;
  height:184px; display:flex; flex-direction:column; justify-content:space-between; color:#fff; box-shadow:var(--shadow)}
.ebox .p-art{z-index:0} .ebox > :not(.p-art):not(.p-grain){position:relative; z-index:2}
.ebox h3{font-family:Oswald,sans-serif; font-size:18px; font-weight:600; line-height:1.14; text-transform:uppercase;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
[data-surface="theatre"] .ebox h3{font-family:"Playfair Display",Georgia,serif; text-transform:none; font-size:21px}
.edate{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.86; margin-top:7px; font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim[hidden]{display:none!important}
.scrim{position:fixed; inset:0; z-index:90; background:rgba(5,3,7,.8); backdrop-filter:blur(8px);
  display:grid; place-items:start center; overflow-y:auto; overscroll-behavior:contain;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px))
    max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(860px,100%); background:var(--ink-2); border:1px solid var(--line); border-radius:var(--r-lg);
  overflow:hidden; box-shadow:var(--shadow); margin-block:auto}
.shero{position:relative; min-height:210px; display:flex; align-items:flex-end; padding:22px; color:#fff; overflow:hidden}
.shero .hero-scrim{background:linear-gradient(to top,rgba(0,0,0,.93),rgba(0,0,0,.3))}
.sclose{position:absolute; top:8px; right:8px; z-index:6; width:40px; height:40px; border-radius:50%;
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.24); color:#fff; display:grid; place-items:center; font-size:15px}
.sheet h2{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(23px,4.2vw,34px); line-height:1.02; position:relative; z-index:3}
[data-surface="theatre"] .sheet h2{font-family:"Playfair Display",Georgia,serif; text-transform:none; font-weight:800; letter-spacing:-.015em}
.sbody{padding:22px; display:flex; flex-direction:column; gap:19px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:3px 9px; border-radius:999px;
  border:1px solid var(--line-2); color:var(--fg-2);
  transition:background var(--motion-dur-sm) var(--motion-ease-out),
             border-color var(--motion-dur-sm) var(--motion-ease-out),
             color var(--motion-dur-sm) var(--motion-ease-out)}
.chip.solid{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.ratings{display:flex; gap:9px; flex-wrap:wrap}
.rtile{border:1px solid var(--line); border-radius:10px; padding:8px 13px; min-width:82px; background:var(--ink-3)}
.rtile .rl{font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--fg-3)}
.rtile .rv{font-family:Oswald,sans-serif; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.15}
.rtile .rv small{font-size:11px; color:var(--fg-3); font-weight:400}
.rtile.imdb .rv{color:#F5C518}
.sec h3,.sec h4{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--fg-3); margin-bottom:9px;
  padding-bottom:6px; border-bottom:1px solid var(--line)}
.sec p{margin:0 0 8px; color:var(--fg-2); font-size:14px; max-width:68ch}
.facts{margin:0; padding-left:17px; color:var(--fg-2); font-size:13.5px; display:flex; flex-direction:column; gap:5px}
.why{border-left:2px solid var(--accent); padding:3px 0 3px 13px; font-size:14px; color:var(--fg); margin-top:4px}
.credits{display:grid; grid-template-columns:auto 1fr; gap:4px 15px; font-size:13.5px}
.credits dt{color:var(--fg-3); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding-top:3px}
.credits dd{margin:0; color:var(--fg-2)}
.quote{border-left:2px solid var(--line-2); padding:2px 0 2px 13px; margin-bottom:11px; font-size:13.5px; color:var(--fg-2)}
.quote cite{display:block; font-style:normal; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-3); margin-top:5px}
.vrow{border-top:1px solid var(--line); padding-block:11px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start}
.vrow:first-of-type{border-top:none; padding-top:0}
.vname{flex:0 0 100%; font-weight:600; font-size:13px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
@media(min-width:640px){ .vname{flex:0 0 210px} }
.vloc{display:flex; flex-direction:column; gap:1px}
.vloc em{font-style:normal; font-size:10.5px; color:var(--fg-3); font-weight:400}
.time.tix{border-style:dashed; color:var(--fg-3); font-family:Onest,sans-serif; font-size:11px; font-weight:600}
.time.tix:hover{border-style:solid; border-color:var(--accent); color:var(--accent)}
.tpick .tt em{display:block; font-style:normal; font-family:Onest,sans-serif; font-size:9px;
  letter-spacing:.04em; text-transform:none; opacity:.8; font-weight:400; margin-top:3px;
  -webkit-line-clamp:2; overflow:hidden}
.vkind{font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3); border:1px solid var(--line); border-radius:4px; padding:1px 5px}
.vprice{font-family:Onest,sans-serif; font-size:11px; font-weight:600; color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent); border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line)); border-radius:6px; padding:2px 7px; white-space:nowrap}
.vtimes{display:flex; gap:6px; flex-wrap:wrap; flex:1; align-items:flex-start}
.time{font-family:Oswald,sans-serif; font-size:12.5px; font-weight:500; font-variant-numeric:tabular-nums;
  padding:4px 10px; border-radius:7px; border:1px solid var(--line-2); background:var(--ink-3); color:var(--fg); text-decoration:none; display:inline-block}
.time:hover{border-color:var(--accent); color:var(--accent)}
.time.fits{border-color:var(--accent); color:var(--accent)}
.time .th{font-family:Onest,sans-serif; font-size:9px; letter-spacing:.07em; color:var(--fg-3); display:block; text-transform:uppercase}
.dgroup{margin-bottom:13px}
.dg-h{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:8px}
.buybox{border:1px solid var(--accent); border-radius:var(--r); padding:15px 17px; background:color-mix(in srgb,var(--accent) 9%,var(--ink-2));
  display:flex; flex-direction:column; gap:11px}
.buybox .bl{font-size:10px; letter-spacing:.17em; text-transform:uppercase; color:var(--fg-3)}
.buylinks{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.buylink{padding:7px 13px; min-height:40px; border-radius:20px; background:transparent; border:1px solid var(--accent);
  color:var(--accent); font-weight:600; font-size:12.5px; text-decoration:none; display:inline-flex; align-items:center; gap:5px; line-height:1.2}
.buylink:hover{background:color-mix(in srgb,var(--accent) 14%,transparent); filter:none}
.buylink.alt{border-color:var(--line-2); color:var(--fg-2); font-weight:400; font-size:12px; background:transparent}
.buylink.alt:hover{border-color:var(--fg-2); filter:none}
.buylink.inperson{border:none; color:var(--fg-3); font-size:12px; font-weight:400; padding:4px 0; min-height:0; background:transparent}
.buylink.inperson:hover{color:var(--fg-2); filter:none}
.buynote{font-size:11.5px; color:var(--fg-3)}
.no-info-note{font-size:13px; color:var(--fg-3); font-style:italic; margin:0}

/* ---------- opening animation ---------- */
/* Themed open animations removed (Wave D1). Plain neutral expand only. */

/* share button + read-more + toast */
.sshare{position:absolute; top:8px; right:56px; z-index:6; width:40px; height:40px; border-radius:50%;
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.24); color:#fff; display:grid; place-items:center; cursor:pointer}
.sshare:hover{border-color:#fff; background:rgba(0,0,0,.72)}
/* trailer (Option 1, "hero = trailer"): a calm play circle on the key art. A dark
   translucent material with a white ring keeps it legible on light and dark art
   (HIG media controls); 64 pt is well above the 44 pt minimum and the 120x70 px
   YouTube facade minimum is the hero itself. Pressing it turns the header into the
   player: share and close stay above it, the title and "Спри видеото" below it,
   nothing on top of the video (YouTube's required minimum functionality). */
.shero.has-tr{flex-direction:column; align-items:stretch; min-height:260px; padding-top:56px}
@media(min-width:760px){ .shero.has-tr{min-height:300px} }
.shero.has-tr .p-real{filter:brightness(.7)}
.tr-play{position:relative; z-index:4; align-self:center; margin:auto 0; flex:none; width:64px; height:64px;
  border-radius:50%; display:grid; place-items:center; color:#fff; cursor:pointer; padding:0;
  background:rgba(18,14,20,.52); -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3);
  border:1.5px solid rgba(255,255,255,.9); box-shadow:0 2px 16px rgba(0,0,0,.35);
  transition:transform var(--motion-dur-sm) var(--motion-ease-out), background var(--motion-dur-sm) var(--motion-ease-out)}
.tr-play svg{width:26px; height:26px; margin-left:3px}
.tr-play:hover{background:rgba(18,14,20,.7); transform:scale(1.05)}
.tr-play:active{transform:scale(.96)}
.tr-play:focus-visible{outline:2px solid #fff; outline-offset:4px}
.shero.playing{min-height:0; padding:56px 0 18px; background:#000!important}
.shero.playing>.p-art,.shero.playing>.hero-scrim,.shero.playing .tr-play{display:none}
.tr-frame{position:relative; z-index:3; width:100%; aspect-ratio:16/9; min-height:200px; background:#000}
.tr-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.shero.playing .sh-titles{padding:14px 22px 0}
.tr-meta{display:none; margin:6px 0 0; font-size:12px; color:rgba(255,255,255,.72)}
.shero.playing .tr-meta{display:block}
.tr-stop{margin-top:12px; display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px;
  border-radius:999px; background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; font-size:13px; cursor:pointer}
.tr-stop[hidden]{display:none}
.tr-stop:hover{border-color:#fff}
.tr-stop:focus-visible{outline:2px solid #fff; outline-offset:3px}

/* Festivals and limited runs that programata.bg announces (scripts/fetch_events.py ->
   events.json -> EVENTS_AUTO, inlined by inject_data.py) join the hand-curated seed
   here, before anything reads EVENTS: the rails, sheets, search and share links see
   one list. A seed id always wins. Each carries auto:true and url (its source page). */
(function(){
  var auto=(typeof EVENTS_AUTO!=="undefined"&&Array.isArray(EVENTS_AUTO))?EVENTS_AUTO:[];
  var have={};EVENTS.forEach(function(e){have[e.id]=1;});
  auto.forEach(function(e){
    if(e&&e.id&&!have[e.id]&&e.from&&e.to&&Array.isArray(e.g)&&e.g.length===2){have[e.id]=1;EVENTS.push(e);}
  });
})();

   since passed. Date maths elsewhere stays UTC/ISO-string based (see dUTC). */
const NOW_SOFIA=(()=>{
  try{const p={};

      .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
    return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour==="24"?"00":p.hour}:${p.minute}`};
  }catch(e){return{date:SNAPSHOT.window.from,time:"00:00"};}

   shows an empty, honest programme rather than stale past dates. */
const TODAY=NOW_DATE<SNAPSHOT.window.from?SNAPSHOT.window.from:NOW_DATE;

  let s=genreHits(f.genres)*4.5+moodHits(f.genres)*3+tasteHits(f.genres)*2.2+withBonus(f.genres);
  if(rows.some(r=>r[3].some(inWhen)))s+=3;
  {const _im=ratingOf(f);if(_im!=null)s+=(_im-6)*1.5;}
  s+=Math.min(rows.reduce((n,r)=>n+r[3].length,0),12)*0.1;
  if(S.prefs.taste.includes(f.id))s+=6;
  return s;}

  if(p.some(x=>inWhen(x[2])))s+=3;
  if(sh.badge)s+=2;

/* ---- search across the whole three-month window ----

   folded, Cyrillic through translitBG() (the Bulgarian Streamlined System), accents
   dropped, punctuation to spaces; so "pepel" finds "Пепел" and "метрополис" finds
   "Metropolis". The loose key also folds what a Latin typist mixes up (y/j/i, c,
   ph, w, x, q, doubled letters): "fjord" finds "Фиорд", "маика" finds "Майка".
   A festival's name in either script finds the titles in its programme (FESTMARK).

  .replace(/x/g,"ks").replace(/w/g,"v").replace(/q/g,"k").replace(/[yj]/g,"i").replace(/([a-z])\1+/g,"$1");

        [f.director,f.cast,fi.dir,fi.cast,ctry,ctry&&ctryTranslate(ctry),(ART[f.id]||{}).country,...gen(f.genres)]);}),

function searchAll(q){
  const raw=q.trim(); if(raw.length<2)return null;
  const k=searchKey(raw),kl=searchLoose(k),kc=kl.replace(/ /g,"");
  if(!k)return{films:[],shows:[]};
  /* a festival matches its full name in the query, or a query of 5+ letters that
     starts its name ("cinel", "кином"); "kino" alone is too common a word */
  const fests=new Set(Object.keys(FEST_NAMES).filter(id=>[FEST_NAMES[id].bg,FEST_NAMES[id].en,id].some(n=>{
    const cl=searchLoose(searchKey(n)),c=cl.replace(/ /g,"");
    /* whole words ("act", "kino mania"), a name of 5+ letters inside the query
       ("cinelibri2026"), or the start of the name; a short name like "ACT" never
       matches inside a word ("фактор", "пакт") */
    return c&&((" "+kl+" ").includes(" "+cl+" ")||(c.length>=5&&kc.includes(c))||(kc.length>=Math.min(5,c.length)&&c.startsWith(kc)));})));

  const rank=e=>{
    let r=99;

      if(t===k)return 0;
      r=Math.min(r,t.startsWith(k)?1:(" "+t).includes(" "+k)?2:t.includes(k)?3:99);}
    if(r<99)return r;
    if(loose){for(const t of e.tl)r=Math.min(r,t===kl?4:t.startsWith(kl)?5:t.includes(kl)?6:99);
      if(r<99)return r;}

    if(e.x.some(x=>x.includes(k)))return 8;

/* date suffix for section heads — returns a date range for all meaningful cases */
function periodDateOnly(){

  if(/^\d{4}-\d{2}-\d{2}$/.test(S.day))return fmtDay(S.day,true);
  if(S.day==="week")return`${fmtDay(TODAY,false)} – ${fmtDay(WEEK_END,false)}`;
  if(S.day==="month")return`${fmtDay(TODAY,true)} – ${fmtDay(lastOfMonth(TODAY),true)}`;

/* Format a date range including month name; same-month → month at end only.
   fmtDay(iso,false) gives e.g. "ср 7"; fmtDay(iso,true) gives "7 октомври".
   Result: "ср 7 – нд 11 октомври" (same month) or "пн 26 октомври – нд 1 ноември" */
function fmtRange(isoA,isoB){
  const L=t(),dA=dUTC(isoA),dB=dUTC(isoB);
  const mA=dA.getUTCMonth(),mB=dB.getUTCMonth();
  const dowA=L.dows[dA.getUTCDay()],dowB=L.dows[dB.getUTCDay()];
  const mnA=L.months[mA],mnB=L.months[mB];
  if(mA===mB)return`${dowA} ${dA.getUTCDate()} – ${dowB} ${dB.getUTCDate()} ${mnB}`;
  return`${dowA} ${dA.getUTCDate()} ${mnA} – ${dowB} ${dB.getUTCDate()} ${mnB}`;}
/* Period banner text: headline + date subtitle */

/* Build the day-strip for the typographic header.
   Shows "Цялата седмица" + each day from TODAY to the coming Sunday.
   Only shown for S.day==="week" and for a single specific day within the current week. */
function buildDayStrip(){
  const L=t();
  /* Determine the current week: Mon–Sun containing TODAY */
  const dow=dUTC(TODAY).getUTCDay(); /* 0=Sun … 6=Sat */
  const weekStart=addDays(TODAY,-(dow===0?6:dow-1)); /* Monday */
  const weekEnd=addDays(weekStart,6);                 /* Sunday */
  /* Only show the strip when in week or single-day-within-week mode */
  const inWeekDay=S.day!=="week"&&/^\d{4}-\d{2}-\d{2}$/.test(S.day)&&S.day>=weekStart&&S.day<=weekEnd;
  if(S.day!=="week"&&!inWeekDay)return"";
  /* Gather which days have screenings/performances */
  const hasData=datesWith();
  const pills=[];
  /* "Whole week" pill */
  const allPill=`<button class="dspill" data-day="week" aria-pressed="${S.day==="week"}">${esc(L.dsAllWeek||"Цялата седмица")}</button>`;
  pills.push(allPill);
  /* P3A item 5: build day list, rolling over into next week when <3 days remain.
     Rule: show days from TODAY to weekEnd; if that gives <3 days, continue into
     next week until we have 7 day-buttons total (or reach LASTDAY). */
  const daysLeft=weekEnd>=TODAY?Math.round((dUTC(weekEnd)-dUTC(TODAY))/864e5)+1:0;
  const nextWeekStart=addDays(weekEnd,1);
  const needRollover=daysLeft<3&&nextWeekStart<=LASTDAY;
  const totalDays=needRollover?Math.min(7,Math.round((dUTC(LASTDAY)-dUTC(TODAY))/864e5)+1):daysLeft;
  let addedDivider=false;
  for(let i=0;i<totalDays;i++){
    const d=addDays(TODAY,i);
    if(d>LASTDAY)break;
    /* Add divider + "Следващата седмица" pill before first next-week day */
    if(needRollover&&d>weekEnd&&!addedDivider){
      addedDivider=true;
      pills.push(`<span class="dspill-divider" aria-hidden="true"></span>`);
      const nextLabel=S.lang==="bg"?"Следващата седмица":"Next week";
      pills.push(`<span class="ds-next">${esc(nextLabel)}</span>`);
    }
    const active=S.day===d;
    const hasSc=hasData.has(d);
    const isToday=d===TODAY;
    const label=fmtDay(d,false); /* e.g. "ср 7" */
    const todayMark=isToday?` <span class="ds-today">${esc(L.dsToday||"днес")}</span>`:"";
    const dsName=`${label}${isToday?" "+(L.dsToday||"днес"):""}, ${fmtDayDow(d)}`;
    pills.push(`<button class="dspill"${hasSc?"":' disabled'} data-day="${esc(d)}" aria-pressed="${active}" aria-label="${esc(dsName)}">${esc(label)}${todayMark}</button>`);
  }
  return`<div class="daystrip">${pills.join("")}</div>`;}

function periodBanner(){

  const favToggleBtn=S.fav.venues.length>0
    ?`<button class="fav-toggle${S.onlyFav?" on":""}" data-only-fav style="margin-top:8px">${starSVGsm} ${esc(S.onlyFav?(L.favOnlyFavOff||"Всички"):(L.favOnlyFav||"Само любимите"))}</button>`
    :"";
  return`<div class="phead">
    <div class="phead-eyebrow">${esc(eyebrow)}</div>
    <h1 class="phead-title">${esc(mainTitle)} <span class="phead-dates">${esc(dateStr)}</span></h1>
    ${strip}
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="phead-other" data-drawer aria-label="${esc(L.pheadOtherDates||"Друг период")}">${esc(L.pheadOtherDates||"Друг период ›")}</button>

    ${count!=null?`<span class="sec-toggle-count">${count}</span>`:""}
    <span class="sec-toggle-chev">${chevSVG}</span></button>`;}
/* venueMode: return a venue-mode body (no hero, no curated rails) when
   S.fVenues is non-empty. Shows per-venue grids of films/shows. */
function venueModeBody(){
  const L=t(),day=dayOrAll();
  const isCinema=S.mode==="cinema";
  const venues=isCinema
    ?CINEMAS.filter(c=>S.fVenues.includes(c.id))
    :THEATRES.filter(th=>S.fVenues.includes(th.id));
  /* summary bar with removable chips */
  const chips=venues.map(v=>{
    const name=isCinema?cinName(v):thName(v);
    return`<button class="venue-chip-rm" data-venue="${esc(v.id)}" title="${esc(L.venueRemove||"Премахни")}">${esc(name)}<span class="rm-x" aria-hidden="true">✕</span></button>`;
  }).join("");
  let blocks="";
  venues.forEach(v=>{
    const name=isCinema?cinName(v):thName(v);
    const addr=v.area||"";
    let cards="";
    if(isCinema){
      const vis=filmsAtCinema(v.id).filter(f=>{
        if(S.fGenres.length&&!genreHit(f.genres))return false;
        if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(f,s)))return false;
        return true;});
      if(!vis.length){cards=emptyState();}else{
        cards=`<div class="grid">${vis.map(f=>{
          const cRows=filmTimes(f.id,day).filter(r=>r[1]===v.id);
          if(!cRows.length)return filmCard(f,day,undefined);
          const rv=cRows.slice();rv._perVenue=true;return filmCard(f,day,rv);}).join("")}</div>`;}
    }else{
      const vis=showsAtTheatre(v.id).filter(s=>{
        if(S.fGenres.length&&!genreHit(s.genres))return false;
        return true;});
      if(!vis.length){cards=emptyState();}else{
        cards=`<div class="grid">${vis.map(s=>showCard(s,day)).join("")}</div>`;}
    }
    blocks+=`<div class="venue-block">
      <div class="venue-block-head"><h2>${esc(name)}</h2>${addr?`<div class="sub">${esc(addr)}</div>`:""}</div>
      ${cards}</div>`;
  });
  return`<div class="venue-mode-head">
    <span style="font-size:13px;color:var(--fg-3)">${esc(L.venueShowing||"Програмата на:")}</span>
    <div class="venue-chips">${chips}</div></div>
  ${blocks}`;}
/* The late-day card (P3A item 6), on both surfaces: today is selected and nothing is left
   on it, so instead of an empty page it says so and offers tomorrow (the button selects
   that day, as a day pill does). */
function lateDayCard(L){
  const TOMORROW=addDays(NOW_DATE,1);
  const tmwBtn=TOMORROW<=LASTDAY?`<button class="btn" data-day="${esc(TOMORROW)}">${esc(L.lateDayBtn||"Виж програмата за утре ›")}</button>`:"";
  return{html:()=>`<div class="late-day-card"><p>${esc(L.lateDayMsg||"Всичко за днес приключи.")}</p>${tmwBtn}</div>`};
}
function body(){
  const L=t(),day=dayOrAll(),out=[];
  /* VENUE MODE: S.fVenues non-empty → bypass all curated rails */
  if(S.fVenues.length) return[venueModeBody()];
  /* Events (owner, 15 Oct 2026: Киномания must be in "Лимитирано и ексклузивно" when
     the period is November). That rail lists every event not yet ended that overlaps
     the selected period: the running ones first (soonest end first), then the coming
     ones by start date, each with its date badge ("до 8 ноември", "след 28 дни").
     "Предстои скоро" keeps the events that start after the period, up to the last
     listed day, so a festival weeks away still shows from the default week. The
     old static e.status is ignored so a finished festival never lingers past its end. */
  const [evS,evE]=rangeBounds();
  const evOn=e=>(e.scope==="both"||e.scope===S.mode)&&e.to>=NOW_DATE;
  const act=EVENTS.filter(e=>evOn(e)&&e.from<=evE&&e.to>=evS).sort((a,b)=>{
    const ra=evState(a)==="active",rb=evState(b)==="active";
    return ra!==rb?(ra?-1:1):ra?a.to.localeCompare(b.to):a.from.localeCompare(b.from);});
  const soon=EVENTS.filter(e=>evOn(e)&&e.from>evE&&e.from<=LASTDAY).sort((a,b)=>a.from.localeCompare(b.from));
  const actSub=S.lang==="bg"?"текат сега или започват в периода":"on now or starting in this period";
  const soonSub=S.lang==="bg"?"започват след периода":"starting after this period";
  /* push a rail descriptor only if it has content — emptiness is known from the
     item count, so no card HTML is built for empty or not-yet-visible rails */
  const pushRail=(title,sub,items,fn)=>{ if(items&&items.length) out.push({t:title,s:sub,items,fn}); };
  if(S.mode==="cinema"){
    const vis=visibleFilms();
    /* P3A item 7: when onlyFav active, restrict rows to favourite venues */
    const favIds=new Set(S.onlyFav&&S.fav.venues.length?S.fav.venues:[]);
    const venueOkFav=vid=>favIds.size===0||favIds.has(vid);
    /* filmRowsInPeriod: screenings for a film within the selected period, filtered by venue */
    const filmRowsInPeriod=fid=>{
      let rows=_frows(fid).filter(r=>inRange(r[2])&&venueOkFav(r[1]));
      return upcomingRows(rows);};
    /* "За теб днес" = films with a screening still to come TODAY. Decoupled from
       the selected-day filter (scoreFilm returns -1 off the selected day, which
       would wrongly empty the rail on any day but today); the drawer filters
       (venue chain, genre, strand) still apply. Ranked by how many screenings
       remain today, then IMDb. Each card shows only today's remaining times. */
    const todayItems=FILMS.map(f=>{
        /* P3A item 7: when onlyFav, restrict today rows to fav venues */
        let rows=upcomingRows(_frows(f.id).filter(r=>r[2]===NOW_DATE&&venueOkFav(r[1])));
        return{f,rows};}).filter(o=>o.rows.length)
      .filter(o=>{
        if(S.fGenres.length&&!genreHit(o.f.genres))return false;
        if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(o.f,s)))return false;
        return true;})
      .sort((a,b)=>{const na=a.rows.reduce((n,r)=>n+r[3].length,0),nb=b.rows.reduce((n,r)=>n+r[3].length,0);
        return nb-na||((ratingOf(b.f)||0)-(ratingOf(a.f)||0));}).slice(0,14);
    /* P3A item 6: detect late-day state — today selected AND nothing left today */
    const isTodaySelected=(S.day===TODAY||S.day==="week");
    const isLateDayEmpty=isTodaySelected&&!todayItems.length&&
      !SHOWTIMES.some(r=>r[2]===TODAY&&r[3]&&r[3].some(tm=>tm>=NOW_TIME));
    if(isLateDayEmpty){
      out.push(lateDayCard(L));
    } else if(todayItems.length){
      pushRail(L.railFavToday||L.railToday,fmtDay(NOW_DATE,true),todayItems,x=>filmCard(x.f,false,x.rows));
    } else {
      /* "За теб утре" fallback: same logic, tomorrow's date, only if within data window */
      const TOMORROW=addDays(NOW_DATE,1);
      if(TOMORROW<=LASTDAY){
        const filmTimesTomorrow=fid=>upcomingRows(_frows(fid).filter(r=>r[2]===TOMORROW));
        const tomorrowItems=FILMS.map(f=>{
            let rows=filmTimesTomorrow(f.id);
            return{f,rows};}).filter(o=>o.rows.length)
          .filter(o=>{
            if(S.fGenres.length&&!genreHit(o.f.genres))return false;
            if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(o.f,s)))return false;
            return true;})
          .sort((a,b)=>{const na=a.rows.reduce((n,r)=>n+r[3].length,0),nb=b.rows.reduce((n,r)=>n+r[3].length,0);
            return nb-na||((ratingOf(b.f)||0)-(ratingOf(a.f)||0));}).slice(0,14);
        pushRail(L.railTomorrow||"За теб утре",fmtDay(TOMORROW,true),tomorrowItems,x=>filmCard(x.f,false,x.rows));
      }
    }
    /* Event rails hidden when any genre filter is active */
    if(!S.fGenres.length){
      pushRail(L.railLimited,actSub,act,eventCard);}
    /* P3A item 1: cinema premieres — from official CC data.
       PREMIERES maps "film:<filmId>" to an array of YYYY-MM-DD release dates.
       Show films released in the last 7 days (recent) and upcoming.
       Sort: recent (releaseDate < today) first, then upcoming by date asc. */
    const _6ago=addDays(TODAY,-6);
    const premFilms=vis.filter(f=>{
      const dates=PREMIERES["film:"+f.id];
      return dates&&dates.some(d=>d>=_6ago);
    }).sort((a,b)=>{
      const da=(PREMIERES["film:"+a.id]||[]).slice().sort()[0]||"";
      const db=(PREMIERES["film:"+b.id]||[]).slice().sort()[0]||"";
      const aRec=da<TODAY,bRec=db<TODAY;
      if(aRec!==bRec)return aRec?-1:1;/* recent first */
      return da<db?-1:da>db?1:0;
    });
    pushRail(L.railPrem||"Премиери","",premFilms,f=>filmCard(f,day));
    const top=vis.filter(f=>ratingOf(f)!=null).sort((a,b)=>ratingOf(b)-ratingOf(a)).slice(0,12);
    pushRail(L.railTop,"IMDb / TMDB",top,f=>filmCard(f,day));
    /* "Популярни тази седмица" — ranked by total screenings in period, then cinema count, then IMDb */
    const popLabel=S.day==="week"?(L.railPopular||"Популярни тази седмица"):(L.railPopularPeriod||"Популярни за периода");
    const popularItems=vis.map(f=>{
        const rows=filmRowsInPeriod(f.id);
        const sc=rows.reduce((n,r)=>n+r[3].length,0);
        const cv=new Set(rows.map(r=>r[1])).size;
        return{f,sc,cv};
      }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||b.cv-a.cv||((ratingOf(b.f)||0)-(ratingOf(a.f)||0))).slice(0,14);
    pushRail(popLabel,L.railPopularSub||"най-много прожекции",popularItems,x=>filmCard(x.f,day));
    /* "Скрити бижута" — IMDb/TMDB ≥ 7.3, plays at ≤ 2 (filtered) cinemas */
    const gemsItems=vis.filter(f=>{
        const rt=ratingOf(f); if(rt==null||rt<7.3)return false;
        const rows=filmRowsInPeriod(f.id);
        const cv=new Set(rows.map(r=>r[1])).size;
        return cv>=1&&cv<=2;
      }).sort((a,b)=>(ratingOf(b)||0)-(ratingOf(a)||0)).slice(0,14);
    if(gemsItems.length>=3){
      pushRail(L.railGems||"Нишово кино",L.railGemsSub||"силни оценки, малко прожекции",gemsItems,f=>filmCard(f,day));}
    if(!S.fGenres.length){
      pushRail(L.railSoon,soonSub,soon,eventCard);}
    /* late in the day with only today selected the period holds nothing, so the
       collapsible sections would all be empty ("По жанр 0"): the card stands alone */
    if(isLateDayEmpty&&!vis.length)return finishBody(out);
    /* Section A: По жанр — collapsible, CLOSED by default. */
    const visSet=new Set(vis.map(f=>f.id));
    const genreRails=[];
    genresFor("cinema").forEach(g=>{
      if(S.fGenres.length&&!S.fGenres.includes(g.id))return;
      const fs=vis.filter(f=>f.genres.some(x=>g.m.includes(x)));
      if(fs.length)genreRails.push({t:S.lang==="bg"?g.bg:g.en,s:`${fs.length}`,items:fs,fn:f=>filmCard(f,day)});});
    out.push({html:()=>{
      const inner=genreRails.map(r=>rail(r.t,r.s,r.items.map(r.fn))).join("");
      return secToggleHTML("Genres",L.secByGenre||"По жанр",genreRails.length,S.secGenres)
        +`<div id="sec-Genres-content" class="sec-body"${S.secGenres?"":" hidden"}>${inner}</div>`;
    }});
    /* Section B: По кино — collapsible, closed by default; rails not built when closed. */
    out.push({html:()=>{
      let inner="";
      if(S.secVenues){
        const cinsToShow=CINEMAS;
        cinsToShow.forEach(c=>{
          if(S.fStrands.length){const arty=S.fStrands.includes("arthouse"),comm=S.fStrands.includes("commercial");
            if(arty&&!comm&&c.kind!=="independent")return;
            if(comm&&!arty&&c.kind==="independent")return;}
          const fs=filmsAtCinema(c.id).filter(f=>visSet.has(f.id));
          if(fs.length)inner+=rail(cinName(c),c.area,fs.map(f=>{
            const cRows=filmTimes(f.id,day).filter(r=>r[1]===c.id);
            if(!cRows.length)return filmCard(f,day,undefined);
            const rv=cRows.slice(); rv._perVenue=true; return filmCard(f,day,rv);}));
        });
      }
      return secToggleHTML("Venues",L.secByCinema||"По кино",null,S.secVenues)
        +`<div id="sec-Venues-content" class="sec-body"${S.secVenues?"":" hidden"}>${inner}</div>`;
    }});
    /* Section C: Всичко в програмата — collapsible, CLOSED by default (secAll) */
    out.push({html:()=>{
      const inner=S.secAll?(vis.length?`<div class="grid">${vis.slice(0,S.limit).map(f=>filmCard(f,day)).join("")}</div>
        ${vis.length>S.limit?`<div style="text-align:center;margin-top:18px">
          <button class="btn sm" data-more>${esc(L.more)} (${vis.length-S.limit})</button></div>`:""}`:emptyState()):"";
      return`<section class="rail">`
        +secToggleHTML("All",L.allTitles,vis.length,S.secAll)
        +`<div id="sec-All-content" class="sec-body"${S.secAll?"":" hidden"}>${inner}</div></section>`;
    }});
  }else{
    /* ---- theatre mode ---- */
    const vis=visibleShows();
    /* the late-day card, as on the cinema side: today is selected and no performance is
       left on it (filters aside); the empty sections below are left out */
    const isLateDayEmptyT=S.day===TODAY&&!vis.length&&
      !upcomingPerfs(PERFORMANCES.filter(p=>p[1]===NOW_DATE)).length;
    if(isLateDayEmptyT)out.push(lateDayCard(L));
    /* Item 4: "Препоръчани" — scored over the full period (not just today).
       scoreShow uses showPerfs(sid) which already respects inRange. */
    const rk=vis.map(s=>({s,v:scoreShow(s,day)})).sort((a,b)=>b.v-a.v).slice(0,14);
    pushRail(L.railRecommended||"Препоръчани",periodLabel(),rk,x=>showCard(x.s,day));
    /* Event rails hidden when any venue or genre filter is active */
    if(!S.fGenres.length){
      pushRail(L.railLimited,actSub,act,eventCard);}
    /* P3A item 9: theatre premiere rail — from official data only.
       PREMIERES maps "show:<showId>" to an array of YYYY-MM-DD premiere dates.
       Only shows with an upcoming premiere date (>= today) appear in the rail.
       Guest productions keep their badge-based filter. */
    const premShows=vis.filter(s=>{
      const dates=PREMIERES["show:"+s.id];
      return dates&&dates.some(d=>d>=TODAY);
    });
    const guestShows=vis.filter(s=>s.badge==="ГОСТУВАНЕ");
    pushRail(L.railPrem||"Премиери","",premShows,s=>showCard(s,day));
    pushRail(L.railGuestProds||"Гостувания","",guestShows,s=>showCard(s,day));
    /* Item 4a: "Тази вечер" — shows with a performance today at or after NOW_TIME,
       earliest first. Falls back to "Утре вечер" if nothing tonight. */
    (()=>{
      const perfsTonightForShow=sid=>{
        const ps=(_PERFS_BY_SHOW.get(sid)||[]).filter(p=>p[1]===NOW_DATE&&p[2]&&p[2]>=NOW_TIME);
        return ps.sort((a,b)=>a[2]<b[2]?-1:1);
      };
      const tonightItems=vis.map(s=>{
        const ps=perfsTonightForShow(s.id);
        return{s,ps};}).filter(x=>x.ps.length)
        .sort((a,b)=>a.ps[0][2]<b.ps[0][2]?-1:1);
      if(tonightItems.length){
        /* card variant: shows the earliest time in the sub */
        pushRail(L.railTonightT||"Тази вечер",fmtDay(NOW_DATE,true),tonightItems,x=>{
          /* build a showCard augmented with time meta */
          const sh=x.s,p=x.ps,th=thById[sh.theatre],free=sh.badge==="БЕЗПЛАТНО";
          const times=p.slice(0,3).map(r=>r[2]).join(" · ");
          return`<button class="card" data-show="${esc(sh.id)}">
            <div class="poster">${posterArt(sh.id,sh.genres,sh.g,titleOf(sh))}<div class="p-grain"></div>
              <div class="p-top"><span></span>${sh.badge&&sh.badge!=="ПРЕМИЕРА"?`<span class="badge ${free?"free":""}">${esc(badgeDisplay(sh.badge))}</span>`:""}</div>
              <div class="p-title" aria-hidden="true">${esc(titleOf(sh))}</div><div class="p-sub" aria-hidden="true">${esc(sh.genres.slice(0,2).map(genreDisplay).join(" · "))}</div></div>
            <div class="cfoot"><span class="cf1">${esc(titleOf(sh))}</span>
              <span class="cf2">${th?esc(thName(th)):""}${times?" · "+esc(times):""}</span></div></button>`;});
      } else {
        /* "Утре вечер" fallback */
        const TOMORROW=addDays(NOW_DATE,1);
        if(TOMORROW<=LASTDAY){
          const perfsTomForShow=sid=>{
            const ps=(_PERFS_BY_SHOW.get(sid)||[]).filter(p=>p[1]===TOMORROW&&p[2]);
            return ps.sort((a,b)=>a[2]<b[2]?-1:1);
          };
          const tomItems=vis.map(s=>{const ps=perfsTomForShow(s.id);return{s,ps};})
            .filter(x=>x.ps.length&&inRange(TOMORROW))
            .sort((a,b)=>a.ps[0][2]<b.ps[0][2]?-1:1);
          if(tomItems.length){
            pushRail(L.railTonightB||"Утре вечер",fmtDay(TOMORROW,true),tomItems,x=>{
              const sh=x.s,p=x.ps,th=thById[sh.theatre],free=sh.badge==="БЕЗПЛАТНО";
              const times=p.slice(0,3).map(r=>r[2]).join(" · ");
              return`<button class="card" data-show="${esc(sh.id)}">
                <div class="poster">${posterArt(sh.id,sh.genres,sh.g,titleOf(sh))}<div class="p-grain"></div>
                  <div class="p-top"><span></span>${sh.badge&&sh.badge!=="ПРЕМИЕРА"?`<span class="badge ${free?"free":""}">${esc(badgeDisplay(sh.badge))}</span>`:""}</div>
                  <div class="p-title" aria-hidden="true">${esc(titleOf(sh))}</div><div class="p-sub" aria-hidden="true">${esc(sh.genres.slice(0,2).map(genreDisplay).join(" · "))}</div></div>
                <div class="cfoot"><span class="cf1">${esc(titleOf(sh))}</span>
                  <span class="cf2">${th?esc(thName(th)):""}${times?" · "+esc(times):""}</span></div></button>`;});}
        }
      }
    })();
    /* Item 4b: "Този уикенд" — Fri/Sat/Sun of the coming weekend.
       If today is Fri/Sat/Sun, weekend starts today; else starts next Friday.
       Weekend: Fri through the following Sunday. Only within the selected period. */
    (()=>{
      const dow=dUTC(TODAY).getUTCDay(); /* 0=Sun…6=Sat */
      /* daysFriOffset: how many days to the next/current Friday */
      let wkFri,wkSun;
      if(dow===5){wkFri=TODAY;wkSun=addDays(TODAY,2);}       /* today is Fri */
      else if(dow===6){wkFri=addDays(TODAY,-1);wkSun=addDays(TODAY,1);} /* Sat */
      else if(dow===0){wkFri=addDays(TODAY,-2);wkSun=TODAY;} /* Sun */
      else{const dff=5-dow;wkFri=addDays(TODAY,dff);wkSun=addDays(wkFri,2);}
      /* Only show if the weekend is within data window AND intersects selected period */
      if(wkFri>LASTDAY)return;
      const [periodFrom,periodTo]=rangeBounds();
      if(wkSun<periodFrom||wkFri>periodTo)return;
      const actualFri=wkFri<periodFrom?periodFrom:wkFri;
      const actualSun=wkSun>periodTo?periodTo:wkSun;
      /* collect shows with at least one perf on Fri/Sat/Sun */
      const wkPerfs=sid=>{
        return(_PERFS_BY_SHOW.get(sid)||[]).filter(p=>p[1]>=actualFri&&p[1]<=actualSun);};
      const wkItems=vis.map(s=>{const ps=wkPerfs(s.id);return{s,ps};})
        .filter(x=>x.ps.length)
        .sort((a,b)=>{const d=a.ps[0][1].localeCompare(b.ps[0][1]);return d||a.ps[0][2].localeCompare(b.ps[0][2]);});
      if(!wkItems.length)return;
      const wkSub=fmtRange(actualFri,actualSun);
      pushRail(L.railWeekend||"Този уикенд",wkSub,wkItems,x=>showCard(x.s,day));
    })();
    if(!S.fGenres.length){
      pushRail(L.railSoon,soonSub,soon,eventCard);}
    if(isLateDayEmptyT)return finishBody(out);
    const visSet=new Set(vis.map(s=>s.id));
    /* Section A: По жанр — collapsible, CLOSED by default. */
    const genreRails=[];
    genresFor("theatre").forEach(g=>{
      if(S.fGenres.length&&!S.fGenres.includes(g.id))return;
      const ss=vis.filter(s=>s.genres.some(x=>g.m.includes(x)));
      if(ss.length)genreRails.push({t:S.lang==="bg"?g.bg:g.en,s:`${ss.length}`,items:ss,fn:s=>showCard(s,day)});});
    out.push({html:()=>{
      const inner=genreRails.map(r=>rail(r.t,r.s,r.items.map(r.fn))).join("");
      return secToggleHTML("Genres",L.secByGenre||"По жанр",genreRails.length,S.secGenres)
        +`<div id="sec-Genres-content" class="sec-body"${S.secGenres?"":" hidden"}>${inner}</div>`;
    }});
    /* Section B: По театър — closed by default; theatre sub-grouping. */
    out.push({html:()=>{
      let inner="";
      if(S.secVenues){
        const STATE_KINDS=["national","state","municipal"];
        const allState=THEATRES.filter(th=>STATE_KINDS.includes(th.kind));
        const allIndie=THEATRES.filter(th=>!STATE_KINDS.includes(th.kind));
        const thFilter=th=>S.fVenues.length?venueOk(th.id):true;
        const stateTheatres=allState.filter(thFilter),indieTheatres=allIndie.filter(thFilter);
        const stateRails=[],indieRails=[];
        stateTheatres.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)stateRails.push({th,ss});});
        indieTheatres.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)indieRails.push({th,ss});});
        if(stateRails.length)inner+=`<div class="sec-subhead">${esc(L.subStateTheatres||"Държавни и общински")}</div>`

/* stream deferred category rails in, in batches, ahead of the viewport so the
   scroll never reaches an unbuilt section — building each batch's cards lazily */
function mountProgressive(){
  if(railObs){railObs.disconnect();railObs=null;}
  if(S.fVenues.length)return; /* venue mode: body() already rendered everything */
  const sent=document.getElementById("rail-sentinel");
  if(!sent||railIdx>=RAILS.length)return;
  const pump=()=>{
    /* keep appending batches until the sentinel is pushed below the prefetch
       zone (or everything is mounted) — handles batches shorter than a screen */
    let guard=0;
    while(railIdx<RAILS.length && guard++<=RAILS.length){
      if(sent.getBoundingClientRect().top > window.innerHeight+RAIL_LEAD) break;
      const batch=RAILS.slice(railIdx,railIdx+RAIL_MORE).map(matRail).join("");
      railIdx+=RAIL_MORE;
      sent.insertAdjacentHTML("beforebegin",batch);
    }
    if(railIdx>=RAILS.length && railObs){railObs.disconnect();railObs=null;sent.remove();}
  };

    if(entries.some(en=>en.isIntersecting))pump();
  },{rootMargin:RAIL_LEAD+"px 0px"});

/* ---- Section toggle in-place animation (Item 1) ----
   Called instead of render() when a section header is clicked.

function secToggleInPlace(key){
  const btn=document.querySelector(`[data-sectoggle="${key}"]`);
  if(!btn)return false; /* fall back to render() if not in DOM */
  /* capture header position BEFORE any DOM change */
  const btnTop=btn.getBoundingClientRect().top;
  /* keep the header at that viewport y, frame by frame, while the body opens or
     closes below it: with the page scrolled to its very end Chrome still shifts
     the page a few frames in, as the body starts to grow (17px at 1280px, cinema
     "По кино"), so one correction after the first frame is not enough */
  const pinHeader=ms=>{
    const until=performance.now()+ms;
    const pin=()=>{
      /* looked up each frame: after a full render() the header is a new element */
      const cur=document.querySelector(`[data-sectoggle="${key}"]`);
      if(!cur)return; /* section gone (mode switched meanwhile): nothing to hold */
      const delta=cur.getBoundingClientRect().top-btnTop;
      if(Math.abs(delta)>0.5)window.scrollBy({top:delta,behavior:"instant"});
      if(performance.now()<until)requestAnimationFrame(pin);

  else if(key==="All")S.secAll=willOpen;
  /* update aria-expanded on button */
  btn.setAttribute("aria-expanded",String(willOpen));

  let body=document.getElementById(`sec-${key}-content`);
  if(!body){body=btn.nextElementSibling;if(!body||!body.classList.contains("sec-body"))body=null;}
  if(!body){/* section not yet materialised — need a full render, which also
    restarts the progressive rails above: hold the header while they settle */
    render();pinHeader(400);return true;}
  const reducedMotion=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reducedMotion){
    if(willOpen){
      body.removeAttribute("hidden");body.style.height="";body.style.opacity="";
    }else{
      body.setAttribute("hidden","");body.style.height="";body.style.opacity="";
    }
    /* If opening Venues section but content is empty, materialise it */
    if(willOpen&&key==="Venues"&&!body.innerHTML.trim()){
      /* find the descriptor and render it */
      const desc=RAILS.find(d=>d.html&&d===RAILS.find(r=>r===d));

      /* find the sec descriptor among ALL RAILS by checking which one generates this id */
      /* Simpler: re-render just the body HTML using the existing descriptor */

            if(S.fStrands.length){const arty=S.fStrands.includes("arthouse"),comm=S.fStrands.includes("commercial");

              if(comm&&!arty&&c.kind==="independent")return;}

            if(fs.length)inner+=rail(cinName(c),c.area,fs.map(f=>{
              const cRows=filmTimes(f.id,day).filter(r=>r[1]===c.id);
              if(!cRows.length)return filmCard(f,day,undefined);

          allState.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)stateRails.push({th,ss});});

          if(stateRails.length)inner+=`<div class="sec-subhead">${esc(L.subStateTheatres||"Държавни и общински")}</div>`

           +(vis.length>S.limit?`<div style="text-align:center;margin-top:18px"><button class="btn sm" data-more>${esc(L.more)} (${vis.length-S.limit})</button></div>`:"");

    body.classList.add("sec-anim-ready","sec-anim-closing");
    body.classList.remove("sec-anim-ready"); /* closing uses sec-anim-closing */
    /* restart: remove ready then add both so closing transition is applied */
    void body.offsetHeight;
    body.classList.add("sec-anim-ready");
    body.style.height="0"; body.style.opacity="0";
    const onEnd2=()=>{
      body.setAttribute("hidden","");
      body.style.height=""; body.style.opacity="";
      body.classList.remove("sec-anim-ready","sec-anim-closing");};
    body.addEventListener("transitionend",function h(){body.removeEventListener("transitionend",h);onEnd2();},{once:true});
    setTimeout(onEnd2,280); /* fallback */
  }

  pinHeader(willOpen?360:320);

}
/* cb once el's own transition has ended (or after maxMs at the latest; maxMs 0: now) */
function _afterTransition(el,maxMs,cb){

    el.removeEventListener("transitionend",fin);el.removeEventListener("transitioncancel",fin);

/* The phone search row opens to exactly its field's height (--sr-h): with a taller cap

function _srFit(mr){

/* ---- Search animation (Item 2) ----
   Toggle search open/close WITHOUT a full render(). Animate width (desk) or
   height (mobile). On close with a query: animate closed, then clear the query and
   bring the page back in place (refreshPage, the header is never rebuilt). */
function searchToggleInPlace(){
  const willOpen=!S.searchOpen;
  S.searchOpen=willOpen;
  /* Update button state */
  const btns=document.querySelectorAll("[data-search-open]");
  btns.forEach(b=>{b.setAttribute("aria-expanded",String(willOpen));
    b.classList.toggle("expanded",willOpen);});

     the centre toggle. On desktop: measure right column space vs 420px search width.
     At narrow viewports (<~1100px) the column is smaller than 420px → crowded → shrink.
     At wide viewports the column comfortably fits 420px → leave label text visible.
     On phones the search opens in its own row below the toggle: nothing collides, so
     the toggle is left exactly as it is (no shrink, no animation). */
  const reducedMotion=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  /* Desktop */
  const dw=document.querySelector(".desk-search-wrap");
  if(dw){
    dw.classList.toggle("open",willOpen);
    /* closed, the field is invisible: keep it (and its clear button) out of the Tab order */
    _setInert(dw,!willOpen);
    if(!willOpen){
      /* Closing: remove seg-q immediately — search is collapsing */
      document.querySelectorAll(".seg").forEach(sg=>sg.classList.remove("seg-q"));
    }else{
      /* Opening: measure right column space vs search desired width (420px).
         bar-in right edge - seg right edge - 18px gap = right 1fr column width.
         If less than 420px, the search crowds the toggle → add .seg-q.
         We use .bar-in (not .bar-controls) because bar-controls shifts left when
         the search expands inside it, giving a false reading post-open. */
      requestAnimationFrame(()=>{
        const seg=document.querySelector(".seg");
        const barIn=document.querySelector(".bar-in");
        if(!seg||!barIn)return;
        const segR=seg.getBoundingClientRect().right;
        const barInR=barIn.getBoundingClientRect().right;

        const crowded=availableForSearch<420;
        document.querySelectorAll(".seg").forEach(sg=>sg.classList.toggle("seg-q",crowded));
      });
    }

  /* Mobile: bar-row-search starts display:none (so #q-m bounding_box()===null).
     Opening: add .sr-visible (display:block) first, then .open for the CSS transition.
     Closing: remove .open; after animation ends remove .sr-visible (display:none again),
     unless the search was opened again meanwhile. */
  const mr=document.querySelector(".bar-row-search");

    if(willOpen){
      mr.classList.add("sr-visible"); /* display:block — make animatable */

      _srFit(mr);

      mr.classList.remove("open");

         that could cut the end of the closing animation short */
      _afterTransition(mr,reducedMotion?0:320,()=>{if(!S.searchOpen)mr.classList.remove("sr-visible");});
    }
  }
  if(willOpen){
    /* focus the visible input */
    const isMob=window.innerWidth<=760;
    const qi=isMob?document.getElementById("q-m"):document.getElementById("q");
    if(qi)setTimeout(()=>{qi.focus();try{qi.setSelectionRange(qi.value.length,qi.value.length);}catch(e){}},50);
  }else{
    /* the field stays in the page (hidden): let go of it, so the phone keyboard closes */
    const ae=document.activeElement;
    if(ae&&(ae.id==="q"||ae.id==="q-m"))ae.blur();

         (the rebuild never runs while the closing animation still plays) */
      _afterTransition(mr||dw,reducedMotion?0:320,()=>{if(!S.searchOpen)clearSearch();});
    }
  }
}
