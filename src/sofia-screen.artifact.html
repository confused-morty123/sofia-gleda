/* Film-specific resolver (never uses LINK_MAP — that mapped one global URL per film,
   causing all venues to link to the wrong cinema page).
   Priority: VLINKS entry → BOOKING deep link with date → BOOKING tix → BOOKING url */
function filmTixUrl(filmId,venueId,date){
  const vk=filmId+"|"+venueId;
  if(VLINK_MAP[vk])return VLINK_MAP[vk];
  const b=BOOKING[venueId]; if(!b)return null;
  if(b.deep&&date)return b.deep.replace("{date}",date);
  if(b.tix)return b.tix;
  return b.url||null;
}
function tixUrl(kind,id,venueId,date){
  /* Films: per-venue resolver — never LINK_MAP */
  if(kind==="film")return filmTixUrl(id,venueId,date);
  const specific=LINK_MAP[id]||(TIX[kind]||{})[id];
  return specific||bookUrl(venueId,date);
}
/* Festivals / one-off screenings that unambiguously belong to one catalogued
   venue: link the event straight to that venue's own ticketing (verified audit).
   Events with no single host (city-wide festivals, multi-cinema runs) are left
   out and show provenance only — never a generic aggregator. */
const EVENT_VENUE={
  "fizika-na-tagata":"national",
  "lumiere-retro":"lumiere",
  "retro-70mm":"dom-kino",
  "panair-na-kuklite":"kuklen",
  "sneakpeak-fest":"toplo",
  "cirkolyuciya":"toplo"
};
function busiestVenue(rows){
  const tally={}; rows.forEach(r=>tally[r[1]]=(tally[r[1]]||0)+r[3].length);
  return Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];}
/* aggDomain: return the aggregator label when a URL points to a known listing
   aggregator, or null when the URL is a venue's own page. Retained for test
   compatibility; buyBox/filmBuyBox now use AGGLINKS for provenance-based labelling. */
function aggDomain(url){
  if(!url)return null;
  try{const h=new URL(url).hostname.replace(/^www\./,"");
    if(h==="theatre.art.bg"||h.endsWith(".theatre.art.bg"))return"theatre.art.bg";
    if(h==="programata.bg"||h.endsWith(".programata.bg"))return"programata.bg";
  }catch(e){}
  return null;
}
/* Theatre/show buy box (single venue). When AGGLINKS lists the show id as
   aggregator-sourced the label reads "theatre.art.bg ↗" or "programata.bg ↗"
   instead of the venue name; otherwise the venue name is used.
   showId (optional 5th param) is the show id to look up in AGGLINKS. */
function buyBox(vid,date,isCinema,specificUrl,showId){
  const L=t(),b=BOOKING[vid]; if(!b)return"";
  /* a link chosen from an aggregator (AGGLINKS) is labelled with its name, and the note
     says so: "the theatre's own official box office" would not be true */
  const _al=(showId&&typeof AGGLINKS==="object"&&AGGLINKS[showId])||null;
  return`<div class="buybox">
    <div class="bl">${esc(L.buyAt)}</div>
    <div class="buylinks">
      ${(()=>{
        const _su=safeUrl(specificUrl||bookUrl(vid,date));
        if(!_su)return"";
        const _lbl=_al||((S.lang==="en"&&(thById[vid]||{}).nameEn)||(S.lang==="en"&&(cinById[vid]||{}).nameEn)||b.label);
        return`<a class="buylink" href="${esc(_su)}" target="_blank" rel="noopener">${esc(L.buy)}: ${esc(_lbl)} ↗</a>`;
      })()}
    </div>
    <div class="buynote">${esc(_al?L.buyNoteAgg.replace("{agg}",_al):(isCinema?L.buyNoteC:L.buyNoteT))}</div></div>`;}
/* Film buy box: compact pills per cinema, sorted by screening count desc then name.
   When the resolved VLINKS URL is a programata.bg page (preliminary-only pair),
   the pill is labelled "programata.bg ↗" instead of the cinema name. */
function filmBuyBox(f,rows){
  const L=t();
  /* Count screenings per venue */
  const cnt={};
  rows.forEach(r=>{cnt[r[1]]=(cnt[r[1]]||0)+(r[3]?r[3].length:1);});
  const vids=[...new Set(rows.map(r=>r[1]))].sort((a,b)=>{
    const dc=(cnt[b]||0)-(cnt[a]||0); if(dc)return dc;
    const ca=cinById[a],cb=cinById[b];
    const na=(S.lang==="bg"?ca&&ca.name:ca&&(ca.nameEn||ca.name))||a;
    const nb=(S.lang==="bg"?cb&&cb.name:cb&&(cb.nameEn||cb.name))||b;
    return na.localeCompare(nb);
  });
  if(!vids.length)return"";
  let hasEpay=false;
  const items=vids.map(vid=>{
    const b=BOOKING[vid],c=cinById[vid]; if(!b)return"";
    const viaEpay=b.via==="epaygo.bg"&&!VLINK_MAP[f.id+"|"+vid];
    if(viaEpay)hasEpay=true;
    if(b.inPerson){
      const cname=(S.lang==="bg"?c&&c.name:c&&(c.nameEn||c.name))||b.label;
      return`<span class="buylink inperson">${esc(cname)}, ${esc(S.lang==="bg"?"на касата":"box office")}</span>`;
    }
    const u=safeUrl(filmTixUrl(f.id,vid,null)||b.url);
    if(!u)return"";
    const _al=(typeof AGGLINKS==="object"&&AGGLINKS[f.id+"|"+vid])||null;
    const cname=_al||((S.lang==="bg"?c&&c.name:c&&(c.nameEn||c.name))||b.label);
    return`<a class="buylink" href="${esc(u)}" target="_blank" rel="noopener">${esc(cname)} ↗</a>`;
  }).filter(Boolean);
  if(!items.length)return"";
  const epayNote=hasEpay?`<div class="buynote">${esc(S.lang==="bg"?"Кино Люмиер: билети чрез epaygo.bg":"Lumière: tickets via epaygo.bg")}</div>`:"";
  return`<div class="buybox"><div class="bl">${esc(L.buyAt)}</div>
    <div class="buylinks">${items.join("")}</div>
    ${epayNote}</div>`;}

/* isPrelimListing: is this listing preliminary? True on or after PRELIM_FROM[venueId]
   (the venue's own programme does not cover that date yet) or when PRELIM_ROWS lists
   this id at this venue on this date (a festival screening the venue's own programme
   does not list, OR a theatre show with an off-grid ticket-list time). One rule for
   the film sheet, the show sheet, and the calendar. */
function isPrelimListing(kind,id,venueId,dateStr){
  const pf=(typeof PRELIM_FROM==="object"&&PRELIM_FROM)||{};
  if(pf[venueId]&&dateStr>=pf[venueId])return true;
  return typeof PRELIM_ROWS!=="undefined"&&Array.isArray(PRELIM_ROWS)
    &&PRELIM_ROWS.some(x=>x[0]===id&&x[1]===venueId&&x[2]===dateStr);
}
/* Per-sheet state: whether "show all cinemas" has been tapped (reset on every open) */
let _sheetShowAllCinemas=false;
/* Desktop week grid paging: the page each open grid shows, by "film:id" / "show:id", so a
   language redraw keeps it; cleared when the sheet closes. */
const _gridPage={};
const GRID_T={bg:{prev:"Предишни дати",next:"Следващи дати"},en:{prev:"Earlier dates",next:"Later dates"}};
/* P3E day-picker render registry: maps grp slot id → buildVenueList(dateStr) fn */
const _p3DayRenderFns=new Map();

/* One venue row of the phone day list, stacked: the name with the price on its right,
   then the stage (theatre), the address and the preliminary note, each on its own line,
   then the times. For a show the row's price slot carries the stage name. */
function p3eRowHtml(itemKind,v,r,prelim,pills){
  const isShow=itemKind==="show";
  const price=isShow?"":(r.price||v.price||"");
  const stage=isShow?(r.price||""):"";
  return`<div class="p3e-row">
        <div class="p3e-vninfo">
          <div class="p3e-vhead"><div class="p3e-vname">${esc(v.name||r.venueId)}</div>${price?`<span class="p3e-vprice">${esc(price)}</span>`:""}</div>
          ${stage?`<div class="p3e-vsec p3e-vstage">${esc(stage)}</div>`:""}
          ${v.area?`<div class="p3e-vsec p3e-varea">${esc(v.area)}</div>`:""}
          ${prelim?`<div class="p3e-vsec p3e-vprelim"><span class="p3e-ambert"></span><span class="p3e-prelim-line">${esc(t().ssPrelimHead)}</span></div>`:""}
        </div>
        <div class="p3e-pills">${pills}</div>
      </div>`;
}
/* p3eShowtimesHtml: generate the P3E day-picker (phone) + week-grid (desktop)
   showtimes section for a film or show.

   rows is an array of SHOWTIMES rows [filmId, venueId, dateStr, [times], ...]
   or PERFORMANCES rows [showId, dateStr, timeStr, hall, price, ...].
   For films: itemKind="film", itemId=f.id.
   For shows: itemKind="show", itemId=sh.id, fixed venueId=th.id.
   venueMap: function(venueId) → {name, area, price}
   isP: function(venueId, dateStr) → bool
   normalizedRows: [{venueId, dateStr, times:[str], price}]
*/
function p3eShowtimesHtml(itemKind, itemId, normalizedRows, venueMap, isP, defaultDate){
  const L=t();
  if(!normalizedRows||!normalizedRows.length)return`<div class="empty">${esc(L.noData)}</div>`;

  /* collect unique dates and venues */
  const dateSet=new Set(), venueSet=new Set();
  normalizedRows.forEach(r=>{dateSet.add(r.dateStr);venueSet.add(r.venueId);});
  const dates=[...dateSet].sort();
  const venues=[...venueSet];

  /* default selected date */
  const todayIso=(()=>{
    try{const p=new Intl.DateTimeFormat("sv",{timeZone:"Europe/Sofia"}).format(new Date());return p;}catch(e){return"";}
  })();
  const selDate=defaultDate&&dates.includes(defaultDate)?defaultDate
    :(dates.includes(todayIso)?todayIso:dates[0]);

  /* check if any prelim */
  let anyPrelim=false;
  normalizedRows.forEach(r=>{if(isP(r.venueId,r.dateStr))anyPrelim=true;});

  /* ---- PHONE: day-strip + venue list ---- */
  const dayWod=iso=>{
    const dow=["нд","пн","вт","ср","чт","пт","сб"];
    const dowen=["Su","Mo","Tu","We","Th","Fr","Sa"];
    try{
      const d=new Date(iso+"T12:00:00");
      const wd=d.getUTCDay();
      const dn=d.getUTCDate();
      return{abbr:(S.lang==="bg"?dow:dowen)[wd],num:String(dn)};
    }catch(e){return{abbr:"",num:iso.slice(8)};}
  };

  const daysHtml=`<div class="p3e-days" role="group" aria-label="${esc(L.times)}" data-p3dayswrap>
    ${dates.map(d=>{
      const{abbr,num}=dayWod(d);
      return`<button class="p3e-day" type="button" data-p3day="${esc(d)}" aria-pressed="${d===selDate?"true":"false"}"><span>${esc(abbr)}</span><b>${esc(num)}</b></button>`;
    }).join("")}</div>`;

  /* build venue list for a given date */
  const buildVenueList=(dateStr)=>{
    const rows=normalizedRows.filter(r=>r.dateStr===dateStr);
    if(!rows.length)return"";
    /* sort rows by first time */
    rows.sort((a,b)=>(a.times[0]||"").localeCompare(b.times[0]||""));
    return rows.map(r=>{
      const v=venueMap(r.venueId)||{};
      const prelim=isP(r.venueId,dateStr);
      const pills=r.times.map(tm=>{
        const pillKey=`${itemKind}:${itemId}|${r.venueId}|${dateStr}|${tm}`;
        return`<button class="p3e-pill${prelim?" prelim":""}" type="button" data-sspill="${esc(pillKey)}" aria-label="${esc(tm)}">${esc(tm)}</button>`;
      }).join("");
      return p3eRowHtml(itemKind,v,r,prelim,pills);
    }).join("");
  };

  /* Register the venue-list render fn so the global day-chip click handler can call it */
  _p3DayRenderFns.set("p3e-grp-"+itemId,(dateStr,grpEl)=>{grpEl.innerHTML=buildVenueList(dateStr);});
  const initialList=buildVenueList(selDate);
  const grpHtml=`<div class="p3e-grp p3e-grp-slot" id="p3e-grp-${esc(itemId)}" data-p3dates="${esc(dates.join(","))}">${initialList}</div>`;
  const fnHtml=anyPrelim?`<p class="p3e-prelim-fn">${esc(L.ssDashedFn)}</p>`:"";  /* cinema footnote */

  /* ---- DESKTOP: week grid, 7 dates a page ----
     Every page is rendered and only the current one is shown. A page lists only the
     venues with a screening on its own dates (the owner's rule: no empty rows), so its
     height follows its rows; the pager sits above the table and never moves. When the
     dates span more than one month, every column header carries the short month. */
  const PAGE=7;
  const pages=[];
  for(let i=0;i<dates.length;i+=PAGE)pages.push(dates.slice(i,i+PAGE));
  const gkey=itemKind+":"+itemId;
  const cur=Math.max(0,Math.min(_gridPage[gkey]||0,pages.length-1));
  const multiMonth=new Set(dates.map(d=>d.slice(0,7))).size>1;
  const monShort=iso=>(L.monthsShort||[])[parseInt(iso.slice(5,7),10)-1]||"";
  const dayAbbrLong=iso=>{
    const dow=["нд","пн","вт","ср","чт","пт","сб"];
    const dowen=["Su","Mo","Tu","We","Th","Fr","Sa"];
    try{
      const d=new Date(iso+"T12:00:00");
      return{abbr:(S.lang==="bg"?dow:dowen)[d.getUTCDay()],num:String(d.getUTCDate())};
    }catch(e){return{abbr:"",num:iso.slice(8)};}
  };
  /* "15–21 окт", "29 окт – 4 ное": the dates a page shows, for the pager */
  const pageLabel=pd=>{
    const a=pd[0],b=pd[pd.length-1],da=String(parseInt(a.slice(8),10)),db=String(parseInt(b.slice(8),10));
    if(a===b)return da+" "+monShort(a);
    return a.slice(0,7)===b.slice(0,7)?da+"–"+db+" "+monShort(b):da+" "+monShort(a)+" – "+db+" "+monShort(b);
  };

  /* Build row lookup: venueId → dateStr → [times] */
  const gridMap={};
  normalizedRows.forEach(r=>{
    if(!gridMap[r.venueId])gridMap[r.venueId]={};
    gridMap[r.venueId][r.dateStr]=r;
  });
  /* Sort venues by earliest screening overall */
  const venuesSorted=venues.slice().sort((a,b)=>{
    const firstA=Math.min(...Object.keys(gridMap[a]).map(d=>(gridMap[a][d].times[0]||"99:99")));
    const firstB=Math.min(...Object.keys(gridMap[b]).map(d=>(gridMap[b][d].times[0]||"99:99")));
    return String(firstA).localeCompare(String(firstB));
  });

  const headCell=d=>{
    const{abbr,num}=dayAbbrLong(d);
    return`<th data-date="${esc(d)}">${esc(abbr)}<b>${esc(num)}</b>${multiMonth?`<small class="p3e-gmon">${esc(monShort(d))}</small>`:""}</th>`;
  };
  const rowFor=(vid,pd)=>{
    const v=venueMap(vid)||{};
    const price=v.price||"";
    const vcell=`<td class="p3e-vcol">${esc(v.name||vid)}${price?`<small>${esc(price)}</small>`:""}</td>`;
    const dayCells=pd.map(d=>{
      const rr=gridMap[vid]&&gridMap[vid][d];
      if(!rr||!rr.times.length)return`<td></td>`;
      const prelim=isP(vid,d);
      const pillsD=rr.times.map(tm=>{
        const pillKey=`${itemKind}:${itemId}|${vid}|${d}|${tm}`;
        return`<button class="p3e-pill${prelim?" prelim":""}" type="button" data-sspill="${esc(pillKey)}">${esc(tm)}</button>`;
      }).join(" ");
      return`<td>${pillsD}</td>`;
    }).join("");
    return`<tr>${vcell}${dayCells}</tr>`;
  };
  /* the venues with at least one time on a page's dates */
  const venuesOn=pd=>venuesSorted.filter(vid=>pd.some(d=>{const rr=gridMap[vid]&&gridMap[vid][d];return rr&&rr.times.length;}));
  const tables=pages.map((pd,i)=>`<table class="p3e-gt p3e-gpage" role="table" data-gpage="${i}" data-glabel="${esc(pageLabel(pd))}"${i===cur?"":` aria-hidden="true"`}>
        <thead><tr><th></th>${pd.map(headCell).join("")}</tr></thead>
        <tbody>${venuesOn(pd).map(vid=>rowFor(vid,pd)).join("")}</tbody>
      </table>`).join("");
  const GT=GRID_T[S.lang]||GRID_T.bg;
  const pager=pages.length>1?`<div class="p3e-gpager" data-gpager="${esc(gkey)}" data-gcur="${cur}" data-gn="${pages.length}">
        <button type="button" class="p3e-gnav" data-gnav="-1" aria-label="${esc(GT.prev)}" title="${esc(GT.prev)}"${cur===0?" disabled":""}>‹</button>
        <span class="p3e-grange" aria-live="polite">${esc(pageLabel(pages[cur]))}</span>
        <button type="button" class="p3e-gnav" data-gnav="1" aria-label="${esc(GT.next)}" title="${esc(GT.next)}"${cur===pages.length-1?" disabled":""}>›</button>
      </div>`:"";

  const gridHtml=`<div class="p3e-grid-wrap">
    <div class="p3e-grp-desk">
      ${pager}
      <div class="p3e-gpages">${tables}</div>
    </div>
    ${anyPrelim?`<p class="p3e-gt-fn">${esc(L.ssDashedFnT)}</p>`:""}
  </div>`;

  return daysHtml+grpHtml+fnHtml+gridHtml;
}

/* p3eRegisterDayPicker: attach live day-switching to the p3e day strip.
   Called from decorateSheet after the sheet HTML is in the DOM. */
function p3eRegisterDayPicker(container, itemKind, itemId, normalizedRows, venueMap, isP){
  const wrap=container&&container.querySelector("[data-p3dayswrap]");
  const grp=container&&container.querySelector(".p3e-grp-slot");
  if(!wrap||!grp)return;
  const buildList=(dateStr)=>{
    const rows=normalizedRows.filter(r=>r.dateStr===dateStr);
    rows.sort((a,b)=>(a.times[0]||"").localeCompare(b.times[0]||""));
    if(!rows.length){grp.innerHTML="";return;}
    grp.innerHTML=rows.map(r=>{
      const v=venueMap(r.venueId)||{};
      const prelim=isP(r.venueId,dateStr);
      const pills=r.times.map(tm=>{
        const pillKey=`${itemKind}:${itemId}|${r.venueId}|${dateStr}|${tm}`;
        return`<button class="p3e-pill${prelim?" prelim":""}" type="button" data-sspill="${esc(pillKey)}" aria-label="${esc(tm)}">${esc(tm)}</button>`;
      }).join("");
      return p3eRowHtml(itemKind,v,r,prelim,pills);
    }).join("");
  };
  wrap.addEventListener("click",e=>{
    const btn=e.target.closest("[data-p3day]");
    if(!btn)return;
    wrap.querySelectorAll("[data-p3day]").forEach(b=>b.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true");
    buildList(btn.dataset.p3day);
  });
}

function sheetFilm(f){
  const L=t(),x=FILM_EXTRA[f.id]||{};
  const allRows=upcomingRows(SHOWTIMES.filter(r=>r[0]===f.id));
  /* Apply venue filter: show only selected cinemas' rows unless user tapped "show all" */
  const filtered=S.fVenues.length&&!_sheetShowAllCinemas;
  const rows=filtered?allRows.filter(r=>venueOk(r[1])):allRows;
  const byDay={};
  rows.forEach(r=>{(byDay[r[2]]=byDay[r[2]]||[]).push(r);});
  const venues=[...new Set(rows.map(r=>r[1]))];
  /* isPrelim: this film's listing at venue vid on date d is preliminary (isPrelimListing) */
  const isPrelim=(vid,d)=>isPrelimListing("film",f.id,vid,d);
  /* Build normalizedRows for p3eShowtimesHtml */
  const normRows=rows.map(r=>{
    const c=cinById[r[1]];
    const price=PRICES[r[1]]?(L.fromPrice+" "+PRICES[r[1]]):"";
    return{
      venueId:r[1],
      dateStr:r[2],

      name:S.lang==="bg"?c.name:(c.nameEn||c.name),
      area:S.lang==="bg"?c.area:(c.areaEn||c.area),

    };

  const timesHtml=p3eShowtimesHtml("film",f.id,normRows,venueMapFn,isPrelim,null);

  {const mv=mcOf(f);if(mv!=null)rt.push(`<div class="rtile"><div class="rl">Metacritic</div><div class="rv">${mv}<small>/100</small></div></div>`);}

   <div class="sbody">

function calView(){
  const L=t(),has=datesWith();
  const idx=Math.max(0,Math.min(S.calMonth||0,MONTHS.length-1));
  const m=MONTHS[idx];
  const fd=dUTC(m+"-01");
  const offset=(fd.getUTCDay()+6)%7;
  const dim=new Date(Date.UTC(fd.getUTCFullYear(),fd.getUTCMonth()+1,0)).getUTCDate();
  const lo=S.rFrom, hi=S.rTo, isRange=S.day==="range";
  let cells="";
  for(let i=0;i<offset;i++)cells+=`<button disabled></button>`;
  for(let d=1;d<=dim;d++){
    const iso=`${m}-${String(d).padStart(2,"0")}`;
    const ok=iso>=TODAY&&iso<=LASTDAY;
    let cls=has.has(iso)?"has":"";
    let pressed=false;
    if(isRange&&lo){
      const top=hi||lo;
      if(iso>lo&&iso<top)cls+=" inrange";
      if(iso===lo){pressed=true;cls+=" rstart";if(hi&&hi!==lo)cls+=" inrange";}
      if(iso===top&&top!==lo){pressed=true;cls+=" rend inrange";}
    }else{pressed=S.day===iso;}
    cells+=`<button ${ok?"":"disabled"} class="${cls.trim()}" data-pick="${iso}" aria-pressed="${pressed}">${d}</button>`;
  }
  const dows=S.lang==="bg"?["пн","вт","ср","чт","пт","сб","нд"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const hint=isRange
    ? (lo&&hi?`${fmtDay(lo,true)} – ${fmtDay(hi,true)}`
       : lo?(S.lang==="bg"?"Изберете крайна дата":"Pick an end date")
       : (S.lang==="bg"?"Изберете начална дата":"Pick a start date"))
    : (S.lang==="bg"?"Докоснете начало и край за период":"Tap a start and an end for a range");
  return `<div class="calnav">
      <button class="calarrow" data-calstep="-1" ${idx>0?"":"disabled"} aria-label="prev">‹</button>
      <div class="calmon">${esc(L.months[Number(m.slice(5,7))-1])} ${m.slice(0,4)}</div>
      <button class="calarrow" data-calstep="1" ${idx<MONTHS.length-1?"":"disabled"} aria-label="next">›</button></div>
    <div class="caldow">${dows.map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal">${cells}</div>
    <div class="calhint">${esc(hint)}</div>`;
}

  const animated=!!(s&&!s.hidden&&s.querySelector(".sheet")&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches);

    _cancelCloseAnims(s);

    if(!_histDepth&&!_histPending)_scrollRestoreAutoLater();
    /* an animated close shields taps until it ends; an instant one keeps the short shield */
    if(animated)_tapShieldUntil=Math.min(_tapShieldUntil,performance.now());

    if(returnEl&&returnEl.isConnected&&typeof returnEl.focus==="function"){

    }
  }
  if(s&&!s.hidden){
    animateClose(s,returnEl,_finalise);
  } else {
    _finalise();

}

/* ── P3B motion helpers ──────────────────────────────────────────────────── */
/* Reference to the card that last opened a sheet — used by closeSheet to
   animate the sheet back to the card's position. */
let _lastOpenEl=null;
/* CSS selector of the element (FAB or "Друг период" link) that last opened the
   filter drawer — used to return keyboard focus when the drawer closes.
   Stored as a selector rather than a DOM reference because render() re-creates
   the FAB element, making any stored reference stale. */
let _lastDrawerOpener=null;

/* Smoothly animate the drawer (translateX) out, then call cb when done.
   Falls back to instant if reduced-motion is set. */
function animateDrawerClose(cb){
  const dr=document.querySelector(".drawer");
  const ds=document.querySelector(".drawer-scrim");
  if(!dr||window.matchMedia("(prefers-reduced-motion: reduce)").matches){cb();return;}
  const anim=dr.animate([{transform:"translateX(0)",opacity:1},{transform:"translateX(100%)",opacity:0}],
    {duration:260,easing:"cubic-bezier(.55,.0,.1,1)",fill:"forwards"});
  if(ds)ds.animate([{opacity:1},{opacity:0}],{duration:200,easing:"ease-in",fill:"forwards"});
  anim.onfinish=cb;
}

/* iPhone-style pull-to-close on phones.
   - Tracks the sheet position while dragging down (only when scrolled to top).
   - Scales the sheet down toward 0.9 at the close threshold.
   - Fades the backdrop proportionally.
   - Commits close (shrink-to-card) if dy > 25 % of sheet height or velocity > 0.4 px/ms.
   - Springs back otherwise.
   - Non-passive touchstart so we can call preventDefault when we take over. */
function swipeToClose(sheet){
  const THRESHOLD=0.25; /* 25 % of sheet height */
  const VEL_CLOSE=0.4;  /* px/ms flick velocity */
  let y0=null,t0=null,lastY=null,lastT=null;
  const scrim=document.getElementById("scrim");

  sheet.addEventListener("touchstart",e=>{
    if(sheet.scrollTop>2){y0=null;return;}
    y0=e.touches[0].clientY; t0=lastT=Date.now(); lastY=y0;
  },{passive:true});

  sheet.addEventListener("touchmove",e=>{
    if(y0==null)return;
    const dy=e.touches[0].clientY-y0;
    if(dy<0){y0=null;return;} /* upward scroll — hand off */
    const now=Date.now(); lastY=e.touches[0].clientY; lastT=now;
    /* Live transform: sheet follows finger, scrim opacity tracks */
    const h=sheet.getBoundingClientRect().height||600;
    const progress=Math.min(dy/h,1);
    const scale=1-progress*0.1;        /* 1 → 0.9 at threshold */
    const opacity=Math.max(1-progress*1.4,0.15);
    sheet.style.transform=`translateY(${dy}px) scale(${scale})`;
    sheet.style.transformOrigin="center bottom";
    if(scrim)scrim.style.background=`rgba(5,3,7,${(0.8*opacity).toFixed(3)})`;
  },{passive:true});

  function _reset(){
    sheet.style.transform="";
    sheet.style.transformOrigin="";
    if(scrim)scrim.style.background="";
    y0=null;
  }

  sheet.addEventListener("touchend",e=>{
    if(y0==null)return;
    const dy=lastY-y0;
    const dt=lastT-t0;
    const vel=dt>0?dy/dt:0;
    const h=sheet.getBoundingClientRect().height||600;
    if(dy>h*THRESHOLD||vel>VEL_CLOSE){
      /* commit close */
      _reset();
      closeSheet();
    } else {
      /* spring back */
      if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){_reset();return;}
      sheet.animate(
        [{transform:sheet.style.transform||"none"},{transform:"translateY(0) scale(1)"}],
        {duration:320,easing:"cubic-bezier(.34,1.48,.64,1)",fill:"forwards"});
      if(scrim){
        const curAlpha=parseFloat((scrim.style.background||"").match(/[\d.]+\)$/)?
          (scrim.style.background||"").match(/([\d.]+)\)$/)[1]:0.8);
        scrim.animate([{opacity:curAlpha/0.8},{opacity:1}],{duration:260,easing:"ease-out",fill:"forwards"});
        scrim.style.background="";
      }
      sheet.style.transform=""; sheet.style.transformOrigin="";
    }
    y0=null;
  },{passive:true});
}

/* iPhone-style open animation: sheet zooms from the tapped card's rect.
   Falls back to slide-up / scale-in when card rect is unavailable. */
function animateOpen(scrim,fromEl){
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sheet=scrim.querySelector(".sheet"); if(!sheet)return;
  const isMobile=innerWidth<=620;

  /* Always fade the scrim backdrop */
  const bgDur=reduced?1:200;
  scrim.animate([{opacity:0},{opacity:1}],{duration:bgDur,easing:"ease-out"});

  if(reduced){
    /* Instant: no transform animation */
    return;
  }

  const rect=fromEl?fromEl.getBoundingClientRect():null;
  if(rect&&isMobile&&rect.width>0&&rect.height>0){
    /* FLIP: compute where to start so the sheet appears to grow from the card */
    const sheetR=sheet.getBoundingClientRect();
    const sheetH=sheetR.height||window.innerHeight*0.92;
    const sheetW=sheetR.width||window.innerWidth;
    /* origin: card centre relative to sheet centre */
    const ox=(rect.left+rect.width/2)-(sheetR.left+sheetW/2);
    const oy=(rect.top+rect.height/2)-(window.innerHeight*0.97); /* sheet anchors to bottom */
    const sx=rect.width/sheetW;
    const sy=rect.height/sheetH;
    sheet.style.transformOrigin="center bottom";
    sheet.animate([
      {opacity:0,transform:`translate(${ox}px,${oy}px) scale(${sx},${sy})`},
      {opacity:1,transform:"translate(0,0) scale(1)"}
    ],{duration:400,easing:"cubic-bezier(.34,1.48,.64,1)",fill:"backwards"});
  } else if(isMobile){
    /* fallback: slide up from the bottom */
    sheet.animate([{opacity:0,transform:"translateY(40px)"},{opacity:1,transform:"translateY(0)"}],
      {duration:380,easing:"cubic-bezier(.34,1.28,.64,1)",fill:"backwards"});
  } else {
    /* desktop: scale+fade from centre */
    sheet.animate([{opacity:0,transform:"scale(.93) translateY(16px)"},{opacity:1,transform:"none"}],
      {duration:340,easing:"cubic-bezier(.34,1.28,.64,1)",fill:"backwards"});
  }
}

/* Animate the sheet closing back to the card it came from (or centre-fade if unavailable). */
function animateClose(scrim,toEl,cb){
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sheet=scrim?scrim.querySelector(".sheet"):null;

  if(reduced||!sheet){cb();return;}

  const isMobile=innerWidth<=620;
  const rect=toEl?toEl.getBoundingClientRect():null;

  /* Fade the scrim first (kept in _closeAnims so a sheet opened meanwhile can cancel it) */
  _closeAnims.push(scrim.animate([{opacity:1},{opacity:0}],{duration:260,easing:"ease-in",fill:"forwards"}));

  let anim;
  if(rect&&isMobile&&rect.width>0&&rect.height>0&&
     rect.top>-rect.height&&rect.top<window.innerHeight){
    /* Card is in viewport: shrink sheet back to card */
    const sheetR=sheet.getBoundingClientRect();
    const sheetH=sheetR.height||window.innerHeight*0.92;
    const sheetW=sheetR.width||window.innerWidth;
    const ox=(rect.left+rect.width/2)-(sheetR.left+sheetW/2);
    const oy=(rect.top+rect.height/2)-(window.innerHeight*0.97);
    const sx=rect.width/sheetW;
    const sy=rect.height/sheetH;
    sheet.style.transformOrigin="center bottom";
    anim=sheet.animate([
      {opacity:1,transform:"translate(0,0) scale(1)"},
      {opacity:0,transform:`translate(${ox}px,${oy}px) scale(${sx},${sy})`}
    ],{duration:300,easing:"cubic-bezier(.55,.0,.1,1)",fill:"forwards"});
  } else if(isMobile){
    anim=sheet.animate([{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translateY(50px)"}],
      {duration:260,easing:"cubic-bezier(.55,.0,.1,1)",fill:"forwards"});
  } else {
    anim=sheet.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.93) translateY(16px)"}],
      {duration:220,easing:"ease-in",fill:"forwards"});
  }
  if(anim){_closeAnims.push(anim);anim.onfinish=cb;}
  else cb();
}

/* ===================== calendar export ===================== */
const CAL_T={
bg:{addCal:"Добави в календара",google:"Google Календар",apple:"Apple Календар (.ics)",outlook:"Outlook"},
en:{addCal:"Add to calendar",google:"Google Calendar",apple:"Apple Calendar (.ics)",outlook:"Outlook"}
};
/* Track the currently open cal panel {row el, kind, id, venue, date, time} */
let _calPanel=null;

/* DST-correct UTC offset for Europe/Sofia on a given date+time string */
function _sofiaOffset(dateStr,timeStr){
  /* Use Intl to resolve the actual UTC offset for this local moment */
  const dtStr=dateStr+"T"+timeStr+":00";
  /* Intl.DateTimeFormat can tell us the UTC offset via the "timeZoneName: 'shortOffset'" trick */
  try{
    const fmt=new Intl.DateTimeFormat("en",{timeZone:"Europe/Sofia",timeZoneName:"shortOffset",hour:"numeric"});
    /* Create a Date from the ISO string treating it as UTC, then check Sofia offset */
    /* We iterate seconds to find the exact local→UTC mapping */
    /* Simpler approach: parse the date and use formatToParts */
    const [y,mo,d]=dateStr.split("-").map(Number);
    const [hh,mm]=(timeStr||"00:00").split(":").map(Number);
    /* Try UTC offset +2 and +3, pick the one where Sofia local time matches */
    for(const off of [3,2]){
      const utcMs=Date.UTC(y,mo-1,d,hh-off,mm,0);
      const sofParts=new Intl.DateTimeFormat("en",{
        timeZone:"Europe/Sofia",year:"numeric",month:"2-digit",day:"2-digit",
        hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(utcMs));
      const pp=Object.fromEntries(sofParts.map(p=>[p.type,p.value]));
      const mh=pp.hour==="24"?"00":pp.hour;
      if(pp.year===String(y)&&Number(pp.month)===mo&&Number(pp.day)===d&&Number(mh)===hh){
        return off;
      }
    }
  }catch(e){}
  return 3; /* fallback */
}

/* Build a calendar event object from row data */
function calEvent(kind,id,venueId,dateStr,timeStr){
  let title,venue,area,url,runtimeMin;
  if(kind==="film"){
    const f=filmById[id]; if(!f)return null;
    const c=cinById[venueId]; if(!c)return null;
    title=filmTitle(f);
    venue=(S.lang==="bg"?c.name:(c.nameEn||c.name));
    area=(S.lang==="en"?c.areaEn||c.area:c.area)||"";
    url=filmTixUrl(id,venueId,dateStr)||"";
    runtimeMin=f.runtime||120;
  } else {
    const sh=showById[id]; if(!sh)return null;
    const th=thById[sh.theatre]||thById[venueId]; if(!th)return null;
    /* find hall from matching performance row */
    const perf=(PERFORMANCES||[]).find(p=>p[0]===id&&p[1]===dateStr&&p[2]===timeStr);
    title=titleOf(sh);
    const hallRaw=perf&&perf[3]?perf[3]:"";
    const hallSuffix=hallRaw&&hallRaw!==th.name?", "+(S.lang==="en"?hallDisplay(hallRaw):hallRaw):"";
    venue=(S.lang==="bg"?th.name:(th.nameEn||th.name));
    area=((S.lang==="en"?th.areaEn||th.area:th.area)||"")+hallSuffix;
    url=tixUrl("show",id,sh.theatre)||"";
    runtimeMin=sh.duration||120;
  }
  /* Attr suffix for title and description: "(БГ дублаж, 3D)" or "(BG dub, 3D)" */
  const _calAttr=(kind==="film")?showAttrFor(id,venueId,dateStr,timeStr):"";
  const _calAttrSuffix=(()=>{
    if(!_calAttr)return"";
    const _L=T[S.lang];
    const _MAP={dub:_L.bgDub,sub:_L.bgSub,"3d":_L.fmt3d,imax:_L.fmtImax,"4dx":_L.fmt4dx,screenx:_L.fmtScreenx,"d-box":_L.fmtDbox};
    const parts=_calAttr.split(",").map(k=>_MAP[k]).filter(Boolean);
    return parts.length?" ("+parts.join(", ")+")":"";
  })();
  const fullTitle=title+_calAttrSuffix+", "+venue;
  const location=venue+(area?", "+area:"");
  const prelimNote=isPrelimListing(kind,id,venueId,dateStr)
    ?(S.lang==="en"?"\nPreliminary: not yet checked against the venue's full programme. Subject to change."
                   :"\nПредварителна програма: още не е сверена с пълната програма на мястото. Възможни са промени.")
    :"";
  const description=(url?url+"\n":"")+"Sofia Gleda"+_calAttrSuffix+prelimNote;
  const off=_sofiaOffset(dateStr,timeStr);
  /* Compute end time */
  const [y,mo,d]=dateStr.split("-").map(Number);
  const [hh,mm]=(timeStr||"00:00").split(":").map(Number);
  const startMs=Date.UTC(y,mo-1,d,hh-off,mm,0);
  const endMs=startMs+runtimeMin*60000;
  /* Use Intl to extract Sofia local date/time components correctly for any
     instant, including those that cross midnight or fall on a DST boundary.
     This replaces the old lh=UTCHours+off approach which produced hour 24+
     and the wrong calendar date for screenings ending after midnight (CODE-10). */
  function _sofiaLocalParts(ms){
    const dt=new Date(ms);
    const fmt=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Europe/Sofia",
      year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
    });
    const pp=Object.fromEntries(fmt.formatToParts(dt).map(p=>[p.type,p.value]));
    /* hour12:false returns "24" for midnight in some engines; normalise to "00" */
    const h=pp.hour==="24"?"00":pp.hour;
    return{y:pp.year,mo:pp.month,d:pp.day,h,mi:pp.minute,s:pp.second};
  }
  /* Compute the UTC offset at a given UTC instant for Europe/Sofia */
  function _sofiaOffsetAtMs(ms){
    const dt=new Date(ms);
    const fmtOff=new Intl.DateTimeFormat("en",{
      timeZone:"Europe/Sofia",timeZoneName:"shortOffset",hour:"numeric"
    });
    const parts=fmtOff.formatToParts(dt);
    const tzp=parts.find(p=>p.type==="timeZoneName");
    if(tzp){
      const m=tzp.value.match(/GMT([+-])(\d+)(?::(\d+))?/);
      if(m){const sign=m[1]==="+"?1:-1;return sign*(Number(m[2])+(Number(m[3]||0)/60));}
    }
    /* fallback: try +3 / +2 */
    for(const o of [3,2]){
      const lp=_sofiaLocalParts(ms);
      const check=Date.UTC(Number(lp.y),Number(lp.mo)-1,Number(lp.d),Number(lp.h)-o,Number(lp.mi),0);
      if(Math.abs(check-ms)<60000)return o;
    }
    return 3;
  }
  function toLocal(ms){
    const p=_sofiaLocalParts(ms);
    const eOff=_sofiaOffsetAtMs(ms);
    return{
      gcal:()=>[p.y,p.mo,p.d,"T",p.h,p.mi,p.s].join(""),
      outlook(){
        const eoffStr=(eOff>=0?"+":"-")+String(Math.abs(Math.floor(eOff))).padStart(2,"0")+":00";
        return[p.y,"-",p.mo,"-",p.d,"T",p.h,":",p.mi,":00",eoffStr].join("");},
      utcZ(){
        const ld=new Date(ms);
        return[
          String(ld.getUTCFullYear()),
          String(ld.getUTCMonth()+1).padStart(2,"0"),
          String(ld.getUTCDate()).padStart(2,"0"),
          "T",
          String(ld.getUTCHours()).padStart(2,"0"),
          String(ld.getUTCMinutes()).padStart(2,"0"),
          String(ld.getUTCSeconds()).padStart(2,"0"),
          "Z"
        ].join("");}
    };
  }
  const startObj=toLocal(startMs);
  const endObj=toLocal(endMs);
  return{kind,id,venueId,dateStr,timeStr,fullTitle,location,description,url,
    startGcal:startObj.gcal(),endGcal:endObj.gcal(),
    startOutlook:startObj.outlook(),endOutlook:endObj.outlook(),
    startUtcZ:startObj.utcZ(),endUtcZ:endObj.utcZ(),
    off};
}

function calIcs(ev){
  if(!ev)return"";
  /* RFC 5545 escaping: \ ; , and newline */
  function rfcEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
  /* RFC 5545 line folding: max 75 octets (UTF-8), fold with CRLF + SPACE */
  function fold(line){
    const out=[];
    let buf="",bytes=0;
    for(const ch of line){
      const enc=new TextEncoder().encode(ch);
      if(bytes+enc.length>75){out.push(buf);buf=" "+ch;bytes=1+enc.length;}
      else{buf+=ch;bytes+=enc.length;}
    }
    if(buf)out.push(buf);
    return out.join("\r\n");
  }
  const now=new Date();
  const dtstamp=[
    String(now.getUTCFullYear()),
    String(now.getUTCMonth()+1).padStart(2,"0"),
    String(now.getUTCDate()).padStart(2,"0"),
    "T",
    String(now.getUTCHours()).padStart(2,"0"),
    String(now.getUTCMinutes()).padStart(2,"0"),
    String(now.getUTCSeconds()).padStart(2,"0"),
    "Z"
  ].join("");
  const uid=ev.kind+"-"+ev.id+"-"+ev.venueId+"-"+ev.dateStr+"-"+(ev.timeStr||"").replace(/:/g,"")+"-sg@sofia-gleda";
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-" + "//Sofia Gleda//BG",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    fold("UID:"+uid),
    "DTSTAMP:"+dtstamp,
    "DTSTART:"+ev.startUtcZ,
    "DTEND:"+ev.endUtcZ,
    fold("SUMMARY:"+rfcEsc(ev.fullTitle)),
    fold("LOCATION:"+rfcEsc(ev.location)),
    fold("DESCRIPTION:"+rfcEsc(ev.description)),
    fold("URL:"+rfcEsc(ev.url)),
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  return lines.join("\r\n")+"\r\n";
}

/* Open or close the calendar panel for a row */
function toggleCalPanel(btn,kind,id,venueId,dateStr,times){
  /* Close any open panel */
  const prev=document.querySelector(".cal-panel");
  if(prev){
    const wasBtn=_calPanel&&_calPanel.btn;
    prev.remove();
    _calPanel=null;
    if(wasBtn===btn)return; /* toggle off */
  }
  /* Build panel and insert after the vrow */
  const row=btn.closest(".vrow");
  if(!row)return;
  const t=times&&times[0]||"";
  const html=calPanelHtml(kind,id,venueId,dateStr,times,t);
  const wrap=document.createElement("div");
  wrap.innerHTML=html;
  row.after(wrap.firstElementChild);
  _calPanel={btn,kind,id,venueId,dateStr,times,selTime:t};
}

/* Calendar export click handler — own listener, no edits to main handler */
document.addEventListener("click",e=>{
  const q=sel=>e.target.closest(sel);

  if(q("[data-calclose]")){const p=q(".cal-panel");if(p){p.remove();_calPanel=null;}return;}

/* venueMapUrl: build a Google Maps search link for a cinema or theatre.
   Uses the optional "maps" field (a query string or place URL) from the venue
   data when present; otherwise constructs the standard search form. */
function venueMapUrl(venue){
  if(!venue)return"";
  if(venue.maps){
    /* If the override is already a full URL, use it; otherwise treat as a query string */
    if(venue.maps.startsWith("http"))return venue.maps;
    return"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(venue.maps);
  }
  const name=venue.name||"";
  const area=venue.area||"";
  const query=name+(area?", "+area:"")+", София";
  return"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(query);
}

/* ---- Apple Calendar (.ics) ----
   The calendar step's Apple row is a real link to a Blob URL of the event (text/calendar).
   iPhone and iPad Safari open the Calendar "add event" sheet when the user follows such a
   link without a download attribute (a data: URL is blocked there, and a scripted click
   on a download link only saves a file to Downloads); everywhere else the download
   attribute saves sg-<...>.ics. The URL is revoked a minute after the popup moves on. */
let _ssIcsBlobUrl=null;
function _isAppleTouch(){
  const ua=navigator.userAgent||"";
  return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
}
function _ssRevokeIcs(){
  if(!_ssIcsBlobUrl)return;
  const u=_ssIcsBlobUrl;_ssIcsBlobUrl=null;
  setTimeout(()=>{try{URL.revokeObjectURL(u);}catch(e){}},60000);
}
function _ssIcsUrl(ev){
  _ssRevokeIcs();
  if(!ev)return"";
  try{
    _ssIcsBlobUrl=URL.createObjectURL(new Blob([calIcs(ev)],{type:"text/calendar;charset=utf-8"}));
    return _ssIcsBlobUrl;
  }catch(e){return"";}
}

/* ssSwipeToClose: P3B-style drag-to-close wired to the SS inner sheet.
   Uses ssWrap (the #ss-wrap backdrop) for the opacity fade instead of the
   parent scrim, so the parent sheet is unaffected.  Calls closeScreeningSheet()
   on threshold/flick; springs back on short drag. */
function ssSwipeToClose(ssWrap,ssSheet){
  const THRESHOLD=0.25;
  const VEL_CLOSE=0.4;
  let y0=null,t0=null,lastY=null,lastT=null;

  ssSheet.addEventListener("touchstart",e=>{
    if(ssSheet.scrollTop>2){y0=null;return;}
    y0=e.touches[0].clientY; t0=lastT=Date.now(); lastY=y0;
  },{passive:true});

  ssSheet.addEventListener("touchmove",e=>{
    if(y0==null)return;
    const dy=e.touches[0].clientY-y0;
    if(dy<0){y0=null;return;}
    const now=Date.now(); lastY=e.touches[0].clientY; lastT=now;
    const h=ssSheet.getBoundingClientRect().height||400;
    const progress=Math.min(dy/h,1);
    const scale=1-progress*0.1;
    const opacity=Math.max(1-progress*1.4,0.15);
    ssSheet.style.transform=`translateY(${dy}px) scale(${scale})`;
    ssSheet.style.transformOrigin="center bottom";
    ssWrap.style.background=`rgba(0,0,0,${(0.55*opacity).toFixed(3)})`;
  },{passive:true});

  function _ssReset(){
    ssSheet.style.transform="";
    ssSheet.style.transformOrigin="";
    ssWrap.style.background="";
    y0=null;
  }

  ssSheet.addEventListener("touchend",e=>{
    if(y0==null)return;
    const dy=lastY-y0;
    const dt=lastT-t0;
    const vel=dt>0?dy/dt:0;
    const h=ssSheet.getBoundingClientRect().height||400;
    if(dy>h*THRESHOLD||vel>VEL_CLOSE){
      _ssReset();
      closeScreeningSheet();
    } else {
      if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){_ssReset();return;}
      ssSheet.animate(
        [{transform:ssSheet.style.transform||"none"},{transform:"translateY(0) scale(1)"}],
        {duration:320,easing:"cubic-bezier(.34,1.48,.64,1)",fill:"forwards"});
      const curBg=ssWrap.style.background||"";
      const curAlphaM=curBg.match(/([\d.]+)\)$/);
      const curAlpha=curAlphaM?parseFloat(curAlphaM[1]):0.55;
      ssWrap.animate([{opacity:curAlpha/0.55},{opacity:1}],{duration:260,easing:"ease-out",fill:"forwards"});
      ssWrap.style.background="";
      ssSheet.style.transform=""; ssSheet.style.transformOrigin="";
    }
    y0=null;
  },{passive:true});
}

/* ===================== the time popup ("screening sheet") =====================
   Phones, and screens shorter than 520 px (landscape phones): a bottom panel in its own
   overlay #ss-wrap, built once with its listeners. Otherwise a popover card #ss-pop on a
   fixed layer of its own, anchored to the clicked time; when no placement holds the whole
   card it becomes the bottom panel too. Either way it belongs to the open film/show sheet:
   closing the sheet closes it first.
   _ss = {kind,id,venueId,dateStr,timeStr,key,anchor,mode,el,inner,step}. */
let _ss=null;
const SS_GAP=10,SS_MARGIN=12,SS_POP_MIN_VH=520;
function _ssIsPhone(){return window.innerWidth<=760;}
function _ssWantsSheet(){return window.innerWidth<=760||window.innerHeight<SS_POP_MIN_VH;}
function _ssReduced(){return window.matchMedia("(prefers-reduced-motion: reduce)").matches;}
function _ssWrapEl(){
  let w=document.getElementById("ss-wrap");
  if(!w){
    w=document.createElement("div");w.id="ss-wrap";w.className="ss-wrap";w.hidden=true;
    const inner=document.createElement("div");
    inner.className="ss-sheet";inner.setAttribute("role","dialog");inner.setAttribute("aria-modal","true");
    w.appendChild(inner);
    document.body.appendChild(w);
    /* a tap on the dimmed backdrop closes only the popup */
    w.addEventListener("click",e=>{if(!e.target.closest(".ss-sheet")){if(e.detail)_shieldTaps();closeScreeningSheet();}});
    ssSwipeToClose(w,inner);
  }
  return w;
}
/* a time element that is really on screen: not display:none (the phone list on wide
   screens) and not visibility:hidden (the week grid's other pages) */
function _ssShown(el){
  return !!(el&&el.isConnected&&el.getClientRects().length&&getComputedStyle(el).visibility!=="hidden");
}
/* the time element to point at: the clicked one, or after a re-render the shown time
   with the same key */
function _ssFindPill(key){
  const s=document.getElementById("scrim");
  if(!s)return null;
  for(const el of s.querySelectorAll("[data-sspill]")){
    if(el.dataset.sspill===key&&_ssShown(el))return el;
  }
  return null;
}
function _ssAnchor(){
  if(!_ss)return null;
  const a=_ss.anchor;
  if(_ssShown(a))return a;
  _ss.anchor=_ssFindPill(_ss.key);
  return _ss.anchor;
}
function _ssFocusFirst(st,delay){
  setTimeout(()=>{
    if(_ss!==st)return;
    const first=st.inner.querySelector('button,a[href],[tabindex]:not([tabindex="-1"])');
    if(first)first.focus({preventScroll:true});
  },delay);
}
/* Popover placement, in this order: 10 px above the time, 10 px below it, then beside it
   (right, then left) vertically centred on it; centred on the time where it can be, 12 px
   inside the viewport, never over the time and never cut short (no height cap, so every
   button stays in view). Returns false when no placement holds the whole card; the caller
   then uses the bottom panel. Closes the popover once its time scrolls out of view. */
function _ssPlace(){
  if(!_ss||_ss.mode!=="pop")return true;
  const pop=_ss.el;
  if(!pop||!pop.isConnected)return true;
  const vw=document.documentElement.clientWidth||window.innerWidth,vh=window.innerHeight;
  const M=SS_MARGIN,G=SS_GAP,pw=pop.offsetWidth,ph=pop.offsetHeight;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(v,hi));
  const a=_ssAnchor();
  if(!a){
    /* no shown time to point at: a centred card without a caret, if it fits */
    if(pw>vw-2*M||ph>vh-2*M)return false;
    pop.dataset.place="center";
    pop.style.left=Math.round((vw-pw)/2)+"px";
    pop.style.top=Math.round((vh-ph)/2)+"px";
    _ss.placed=true;
    return true;
  }
  let r=a.getBoundingClientRect();
  const out=r.bottom<=0||r.top>=vh||r.right<=0||r.left>=vw;
  if(out&&_ss.placed){closeScreeningSheet({noFocus:true});return true;}
  if(out){a.scrollIntoView({block:"center",inline:"nearest"});r=a.getBoundingClientRect();}
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let place=null,top=0,left=0;
  if(pw<=vw-2*M&&r.top-G-ph>=M){place="above";top=r.top-G-ph;left=clamp(cx-pw/2,M,vw-M-pw);}
  else if(pw<=vw-2*M&&r.bottom+G+ph<=vh-M){place="below";top=r.bottom+G;left=clamp(cx-pw/2,M,vw-M-pw);}
  else if(ph<=vh-2*M&&r.right+G+pw<=vw-M){place="right";left=r.right+G;top=clamp(cy-ph/2,M,vh-M-ph);}
  else if(ph<=vh-2*M&&r.left-G-pw>=M){place="left";left=r.left-G-pw;top=clamp(cy-ph/2,M,vh-M-ph);}
  if(!place)return false;
  pop.style.top=Math.round(top)+"px";
  pop.style.left=Math.round(left)+"px";
  pop.dataset.place=place;
  if(place==="above"||place==="below")pop.style.setProperty("--ss-caret-x",Math.round(clamp(cx-left,22,pw-22))+"px");
  else pop.style.setProperty("--ss-caret-y",Math.round(clamp(cy-top,22,ph-22))+"px");
  _ss.placed=true;
  return true;
}
/* move an open popover into the bottom panel: same time, same step, same history entry */
function _ssToSheet(){
  const st=_ss;
  if(!st||st.mode!=="pop")return;

  inner.innerHTML=screeningSheetHtml(st.kind,st.id,st.venueId,st.dateStr,st.timeStr,st.step);
  inner.scrollTop=0;inner.style.transform="";w.style.background="";

let _ssRaf=0;
function _ssSchedule(){
  if(_ssRaf||!_ss||_ss.mode!=="pop")return;

}
const _ssRO=window.ResizeObserver?new ResizeObserver(()=>_ssSchedule()):null;
/* attached once: follow every scroll (the sheet, the backdrop, the week grid) and resize */
document.addEventListener("scroll",()=>{if(_ss&&_ss.mode==="pop")_ssSchedule();},{capture:true,passive:true});

/* openScreeningSheet: open (or switch) the popup for a time pill of the open sheet. */
function openScreeningSheet(kind,id,venueId,dateStr,timeStr,fromEl){
  if(!sheetOpen)return;
  const html=screeningSheetHtml(kind,id,venueId,dateStr,timeStr,"main");
  if(!html)return;
  const mode=_ssWantsSheet()?"sheet":"pop";
  const key=kind+":"+id+"|"+venueId+"|"+dateStr+"|"+timeStr;
  if(_ss&&_ss.mode!==mode)closeScreeningSheet({silent:true,noHist:true});
  const wasOpen=!!_ss;
  const st={kind,id,venueId,dateStr,timeStr,key,anchor:fromEl||null,mode,step:"main",placed:false};
  const reduced=_ssReduced();
  const slideUp=inner=>{
    if(!wasOpen&&!reduced)inner.animate([{transform:"translateY(60px)",opacity:0},{transform:"none",opacity:1}],
      {duration:320,easing:"cubic-bezier(.34,1.28,.64,1)",fill:"backwards"});
  };
  if(mode==="sheet"){
    const w=_ssWrapEl();
    const inner=w.querySelector(".ss-sheet");
    inner.innerHTML=html;inner.scrollTop=0;inner.style.transform="";w.style.background="";
    w.hidden=false;
    st.el=w;st.inner=inner;
    _ss=st;
    slideUp(inner);
  }else{
    let pop=_ss&&_ss.el;
    if(!pop||!pop.isConnected){
      pop=document.createElement("div");pop.id="ss-pop";pop.className="ss-pop";
      pop.setAttribute("role","dialog");
      pop.innerHTML='<div class="ss-sheet"></div><span class="ss-caret" aria-hidden="true"></span>';
      document.body.appendChild(pop);
    }
    const inner=pop.querySelector(".ss-sheet");
    if(_ss&&_ss.inner&&_ssRO)_ssRO.unobserve(_ss.inner);
    inner.innerHTML=html;inner.scrollTop=0;
    st.el=pop;st.inner=inner;
    _ss=st;
    if(!_ssPlace()){
      /* no placement holds the whole card: the bottom panel instead */
      _ssToSheet();
      slideUp(st.inner);
    }else{
      if(_ss!==st)return;
      if(_ssRO)_ssRO.observe(inner);
      if(!wasOpen&&!reduced){
        const from={above:"translateY(6px)",below:"translateY(-6px)",right:"translateX(-6px)",left:"translateX(6px)"}[pop.dataset.place]||"none";
        pop.animate([{opacity:0,transform:"scale(.96) "+from},{opacity:1,transform:"none"}],
          {duration:200,easing:"ease-out",fill:"backwards"});
      }
    }
  }
  _syncHistory();
  _ssFocusFirst(st,reduced?10:(st.mode==="sheet"?340:220));
}
/* closeScreeningSheet: take the popup down. opts.silent / opts.noFocus: leave focus
   alone (the sheet is closing too, or the user clicked elsewhere); opts.noHist: the
   caller syncs the history itself; opts.fromPop: a back navigation closed it. */
function closeScreeningSheet(opts){
  opts=opts||{};
  const st=_ss;
  if(!st)return;
  _ss=null;
  if(_ssRaf){cancelAnimationFrame(_ssRaf);_ssRaf=0;}
  if(st.mode==="sheet"){
    /* the overlay is reused: drop what a drag or its spring-back left on it */
    [st.el,st.inner].forEach(el=>{if(el&&el.getAnimations)el.getAnimations().forEach(a=>{try{a.cancel();}catch(e){}});});
    if(st.el){st.el.hidden=true;st.el.style.background="";}
    if(st.inner){st.inner.innerHTML="";st.inner.style.transform="";st.inner.style.transformOrigin="";}
  }else{
    if(_ssRO&&st.inner)_ssRO.unobserve(st.inner);
    if(st.el)st.el.remove();
  }
  _ssRevokeIcs();
  if(!opts.silent&&!opts.noFocus){
    const a=(st.anchor&&st.anchor.isConnected)?st.anchor:_ssFindPill(st.key);
    if(a){try{a.focus({preventScroll:true});}catch(e){}}
  }
  if(!opts.noHist)_syncHistory();
}
/* switch the popup between its main step and the calendar step */
function _ssStep(step){
  if(!_ss)return;
  const {kind,id,venueId,dateStr,timeStr}=_ss;
  _ss.inner.innerHTML=screeningSheetHtml(kind,id,venueId,dateStr,timeStr,step);
  _ss.inner.scrollTop=0;
  _ss.step=step;
  if(!_ssPlace())_ssToSheet();

}
function screeningSheetCalStep(){_ssStep("cal");}
/* the language toggle re-renders the sheet: redraw the popup's current step in the new
   language and point it at the re-rendered time */
function _ssRefresh(){
  if(!_ss)return;
  const {kind,id,venueId,dateStr,timeStr,step}=_ss;
  const html=screeningSheetHtml(kind,id,venueId,dateStr,timeStr,step);
  if(!html){closeScreeningSheet({silent:true});return;}
  _ss.inner.innerHTML=html;
  _ss.anchor=null;
  if(!_ssPlace())_ssToSheet();

document.addEventListener("click",e=>{

  if(_ss&&_ss.mode==="pop"&&!q("[data-sspill]")){
    closeScreeningSheet({noFocus:!!q("a[href],button,input,select,textarea,[tabindex]")});
    if(e.target.id==="scrim"){if(e.detail)_shieldTaps();return;}
  }
  if(q("[data-close]")||e.target.id==="scrim"){_sheetShowAllCinemas=false;if(sheetOpen&&e.detail)_shieldTaps();closeSheet();return;}

        w.classList.remove("clamp");

        body.style.overflow="hidden";

          {duration:260,easing:"cubic-bezier(.25,.46,.45,.94)",fill:"forwards"})
          .onfinish=()=>{body.style.overflow="";};
      } else {
        /* Collapsing: animate down then add clamp */

        const anim=body.animate([{maxHeight:start+"px"},{maxHeight:"0px"}],
          {duration:200,easing:"ease-in",fill:"forwards"});

          body.style.maxHeight="";body.style.overflow="";
        };

  const shr=q("[data-share]");
  if(shr){const[kind,...rest]=shr.dataset.share.split(":");const id=rest.join(":");
    let title="";

    else if(kind==="show"&&showById[id])title=showById[id].title;
    else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);title=ev?(S.lang==="bg"?ev.title:ev.titleEn):"";}
    shareItem(kind,id,title);return;}

  if(q("[data-home]")){S.q="";S.qFocus=false;S.searchOpen=false;S.fGenres=[];S.fVenues=[];S.fStrands=[];
    S.day="week";S.rFrom=S.rTo=null;S.calMonth=null;S.limit=30;S.drawer=false;

  if(q("[data-more]")){S.limit+=30;render();return;}

  if(q("[data-dclose]")){const _dsel=_lastDrawerOpener;animateDrawerClose(()=>{S.drawer=false;render();if(_dsel){const _dret=document.querySelector(_dsel);if(_dret&&typeof _dret.focus==="function"){try{_dret.focus({preventScroll:true});}catch(e){}}}});return;}

  const st=q("[data-strand]"); if(st){const v=st.dataset.strand;S.fStrands=v?toggleArr(S.fStrands,v):[];S.qFocus=false;S.limit=30;(S.drawer?renderKeepDrawer():render());return;}

function boot(){ render(); }
const origRender=render;

  try{

       of the lazily built rails to hold the old offset, then put the offset back */
    const keepY=document.querySelector("#app > .drawer")?(window.scrollY||0):null;

function _keepPageY(y){
  let guard=0;
  while(document.documentElement.scrollHeight<y+window.innerHeight&&railIdx<RAILS.length&&guard++<=RAILS.length){
    const sent=document.getElementById("rail-sentinel");
    if(!sent)break;
    sent.insertAdjacentHTML("beforebegin",RAILS.slice(railIdx,railIdx+RAIL_MORE).map(matRail).join(""));
    railIdx+=RAIL_MORE;
  }
  if(railIdx>=RAILS.length){
    if(railObs){railObs.disconnect();railObs=null;}
    const sent=document.getElementById("rail-sentinel");if(sent)sent.remove();
  }
  if(Math.abs((window.scrollY||0)-y)>1)window.scrollTo(0,y);
