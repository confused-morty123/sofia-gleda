    <div class="buylinks">${items.join("")}</div>
    ${epayNote}</div>`;}

/* ===================== sheets ===================== */
/* isPrelimListing: is this listing preliminary? True on or after PRELIM_FROM[venueId]
   (the venue's own programme does not cover that date yet) or when PRELIM_ROWS lists
   this id at this venue on this date (a festival screening the venue's own programme
   does not list, OR a theatre show with an off-grid ticket-list time). One rule for
   the film sheet, the show sheet, and the calendar. */
function isPrelimListing(kind,id,venueId,dateStr){
  const pf=(typeof PRELIM_FROM==="object"&&PRELIM_FROM)||{};
  if(pf[venueId]&&dateStr>=pf[venueId])return true;
  return typeof PRELIM_ROWS!=="undefined"&&Array.isArray(PRELIM_ROWS)
    &&PRELIM_ROWS.some(x=>x[0]===id&&x[1]===venueId&&x[2]===dateStr);
}
/* Per-sheet state: whether "show all cinemas" has been tapped (reset on every open) */
let _sheetShowAllCinemas=false;
/* Desktop week grid paging: the page each open grid shows, by "film:id" / "show:id", so a
   language redraw keeps it; cleared when the sheet closes. */
const _gridPage={};
const GRID_T={bg:{prev:"Предишни дати",next:"Следващи дати"},en:{prev:"Earlier dates",next:"Later dates"}};
/* P3E day-picker render registry: maps grp slot id → buildVenueList(dateStr) fn */
const _p3DayRenderFns=new Map();

/* One venue row of the phone day list, stacked: the name with the price on its right,
   then the stage (theatre), the address and the preliminary note, each on its own line,
   then the times. For a show the row's price slot carries the stage name. */
/* A time's accessible name: the time first (what the pill shows), then where and when, and
   whether it is from a preliminary programme, which the dashed outline shows by sight only. */
function _pillName(tm,venue,dateStr,prelim){
  return `${tm}, ${venue}, ${fmtDayDow(dateStr)}${prelim?", "+t().prelimShort:""}`;
}
function p3eRowHtml(itemKind,v,r,prelim,pills){
  const isShow=itemKind==="show";
  const price=isShow?"":(r.price||v.price||"");
  const stage=isShow?(r.price||""):"";
  return`<div class="p3e-row">
        <div class="p3e-vninfo">
          <div class="p3e-vhead"><div class="p3e-vname">${esc(v.name||r.venueId)}</div>${price?`<span class="p3e-vprice">${esc(price)}</span>`:""}</div>
          ${stage?`<div class="p3e-vsec p3e-vstage">${esc(stage)}</div>`:""}
          ${v.area?`<div class="p3e-vsec p3e-varea">${esc(v.area)}</div>`:""}
          ${prelim?`<div class="p3e-vsec p3e-vprelim"><span class="p3e-ambert"></span><span class="p3e-prelim-line">${esc(t().ssPrelimHead)}</span></div>`:""}
        </div>
        <div class="p3e-pills">${pills}</div>
      </div>`;
}
/* p3eShowtimesHtml: generate the P3E day-picker (phone) + week-grid (desktop)
   showtimes section for a film or show.

   rows is an array of SHOWTIMES rows [filmId, venueId, dateStr, [times], ...]
   or PERFORMANCES rows [showId, dateStr, timeStr, hall, price, ...].
   For films: itemKind="film", itemId=f.id.
   For shows: itemKind="show", itemId=sh.id, fixed venueId=th.id.
   venueMap: function(venueId) → {name, area, price}
   isP: function(venueId, dateStr) → bool
   normalizedRows: [{venueId, dateStr, times:[str], price}]
*/
function p3eShowtimesHtml(itemKind, itemId, normalizedRows, venueMap, isP, defaultDate){
  const L=t();
  if(!normalizedRows||!normalizedRows.length)return`<div class="empty">${esc(L.noData)}</div>`;

  /* collect unique dates and venues */
  const dateSet=new Set(), venueSet=new Set();
  normalizedRows.forEach(r=>{dateSet.add(r.dateStr);venueSet.add(r.venueId);});
  const dates=[...dateSet].sort();
  const venues=[...venueSet];

  /* default selected date */
  const todayIso=(()=>{
    try{const p=new Intl.DateTimeFormat("sv",{timeZone:"Europe/Sofia"}).format(new Date());return p;}catch(e){return"";}
  })();
  const selDate=defaultDate&&dates.includes(defaultDate)?defaultDate
    :(dates.includes(todayIso)?todayIso:dates[0]);

  /* check if any prelim */
  let anyPrelim=false;
  normalizedRows.forEach(r=>{if(isP(r.venueId,r.dateStr))anyPrelim=true;});

  /* ---- PHONE: day-strip + venue list ---- */
  const dayWod=iso=>{
    const dow=["нд","пн","вт","ср","чт","пт","сб"];
    const dowen=["Su","Mo","Tu","We","Th","Fr","Sa"];
    try{
      const d=new Date(iso+"T12:00:00");
      const wd=d.getUTCDay();
      const dn=d.getUTCDate();
      return{abbr:(S.lang==="bg"?dow:dowen)[wd],num:String(dn)};
    }catch(e){return{abbr:"",num:iso.slice(8)};}
  };

  const daysHtml=`<div class="p3e-days" role="group" aria-label="${esc(L.times)}" data-p3dayswrap>
    ${dates.map(d=>{
      const{abbr,num}=dayWod(d);
      return`<button class="p3e-day" type="button" data-p3day="${esc(d)}" aria-pressed="${d===selDate?"true":"false"}" aria-label="${esc(abbr+" "+num+", "+fmtDayDow(d))}"><span>${esc(abbr)}</span> <b>${esc(num)}</b></button>`;
    }).join("")}</div>`;

  /* build venue list for a given date */
  const buildVenueList=(dateStr)=>{
    const rows=normalizedRows.filter(r=>r.dateStr===dateStr);
    if(!rows.length)return"";
    /* sort rows by first time */
    rows.sort((a,b)=>(a.times[0]||"").localeCompare(b.times[0]||""));
    return rows.map(r=>{
      const v=venueMap(r.venueId)||{};
      const prelim=isP(r.venueId,dateStr);
      const pills=r.times.map(tm=>{
        const pillKey=`${itemKind}:${itemId}|${r.venueId}|${dateStr}|${tm}`;
        return`<button class="p3e-pill${prelim?" prelim":""}" type="button" data-sspill="${esc(pillKey)}" aria-label="${esc(_pillName(tm,v.name||r.venueId,dateStr,prelim))}">${esc(tm)}</button>`;
      }).join("");
      return p3eRowHtml(itemKind,v,r,prelim,pills);
    }).join("");
  };

  /* Register the venue-list render fn so the global day-chip click handler can call it */
  _p3DayRenderFns.set("p3e-grp-"+itemId,(dateStr,grpEl)=>{grpEl.innerHTML=buildVenueList(dateStr);});
  const initialList=buildVenueList(selDate);
  const grpHtml=`<div class="p3e-grp p3e-grp-slot" id="p3e-grp-${esc(itemId)}" data-p3dates="${esc(dates.join(","))}">${initialList}</div>`;
  const fnHtml=anyPrelim?`<p class="p3e-prelim-fn">${esc(L.ssDashedFn)}</p>`:"";  /* cinema footnote */

  /* ---- DESKTOP: week grid, 7 dates a page ----
     Every page is rendered and only the current one is shown. A page lists only the
     venues with a screening on its own dates (the owner's rule: no empty rows), so its
     height follows its rows; the pager sits above the table and never moves. When the
     dates span more than one month, every column header carries the short month. */
  const PAGE=7;
  const pages=[];
  for(let i=0;i<dates.length;i+=PAGE)pages.push(dates.slice(i,i+PAGE));
  const gkey=itemKind+":"+itemId;
  const cur=Math.max(0,Math.min(_gridPage[gkey]||0,pages.length-1));
  const multiMonth=new Set(dates.map(d=>d.slice(0,7))).size>1;
  const monShort=iso=>(L.monthsShort||[])[parseInt(iso.slice(5,7),10)-1]||"";
  const dayAbbrLong=iso=>{
    const dow=["нд","пн","вт","ср","чт","пт","сб"];
    const dowen=["Su","Mo","Tu","We","Th","Fr","Sa"];
    try{
      const d=new Date(iso+"T12:00:00");
      return{abbr:(S.lang==="bg"?dow:dowen)[d.getUTCDay()],num:String(d.getUTCDate())};
    }catch(e){return{abbr:"",num:iso.slice(8)};}
  };
  /* "15–21 окт", "29 окт – 4 ное": the dates a page shows, for the pager */
  const pageLabel=pd=>{
    const a=pd[0],b=pd[pd.length-1],da=String(parseInt(a.slice(8),10)),db=String(parseInt(b.slice(8),10));
    if(a===b)return da+" "+monShort(a);
    return a.slice(0,7)===b.slice(0,7)?da+"–"+db+" "+monShort(b):da+" "+monShort(a)+" – "+db+" "+monShort(b);
  };

  /* Build row lookup: venueId → dateStr → [times] */
  const gridMap={};
  normalizedRows.forEach(r=>{
    if(!gridMap[r.venueId])gridMap[r.venueId]={};
    gridMap[r.venueId][r.dateStr]=r;
  });
  /* Sort venues by earliest screening overall */
  const venuesSorted=venues.slice().sort((a,b)=>{
    const firstA=Math.min(...Object.keys(gridMap[a]).map(d=>(gridMap[a][d].times[0]||"99:99")));
    const firstB=Math.min(...Object.keys(gridMap[b]).map(d=>(gridMap[b][d].times[0]||"99:99")));
    return String(firstA).localeCompare(String(firstB));
  });

  const headCell=d=>{
    const{abbr,num}=dayAbbrLong(d);
    return`<th scope="col" data-date="${esc(d)}" aria-label="${esc(fmtDayDow(d))}">${esc(abbr)}<b>${esc(num)}</b>${multiMonth?`<small class="p3e-gmon">${esc(monShort(d))}</small>`:""}</th>`;
  };
  const rowFor=(vid,pd)=>{
    const v=venueMap(vid)||{};
    const price=v.price||"";
    const vcell=`<th scope="row" class="p3e-vcol">${esc(v.name||vid)}${price?`<small>${esc(price)}</small>`:""}</th>`;
    const dayCells=pd.map(d=>{
      const rr=gridMap[vid]&&gridMap[vid][d];
      if(!rr||!rr.times.length)return`<td></td>`;
      const prelim=isP(vid,d);
      const pillsD=rr.times.map(tm=>{
        const pillKey=`${itemKind}:${itemId}|${vid}|${d}|${tm}`;
        return`<button class="p3e-pill${prelim?" prelim":""}" type="button" data-sspill="${esc(pillKey)}" aria-label="${esc(_pillName(tm,v.name||vid,d,prelim))}">${esc(tm)}</button>`;
      }).join(" ");
      return`<td>${pillsD}</td>`;
    }).join("");
    return`<tr>${vcell}${dayCells}</tr>`;
  };
  /* the venues with at least one time on a page's dates */
  const venuesOn=pd=>venuesSorted.filter(vid=>pd.some(d=>{const rr=gridMap[vid]&&gridMap[vid][d];return rr&&rr.times.length;}));
  const pagePrelim=pd=>pd.some(d=>venuesSorted.some(vid=>{const rr=gridMap[vid]&&gridMap[vid][d];return rr&&rr.times.length&&isP(vid,d);}));
  const tables=pages.map((pd,i)=>`<table class="p3e-gt p3e-gpage" role="table" data-gpage="${i}" data-glabel="${esc(pageLabel(pd))}"${pagePrelim(pd)?' data-gprelim="1"':""}${i===cur?"":` aria-hidden="true"`}>
        <thead><tr><th scope="col"><span class="sg-sr">${esc(itemKind==="show"?L.venue:(L.cinemaW||(S.lang==="bg"?"Кино":"Cinema")))}</span></th>${pd.map(headCell).join("")}</tr></thead>
        <tbody>${venuesOn(pd).map(vid=>rowFor(vid,pd)).join("")}</tbody>
      </table>`).join("");
  const GT=GRID_T[S.lang]||GRID_T.bg;
  const pager=pages.length>1?`<div class="p3e-gpager" data-gpager="${esc(gkey)}" data-gcur="${cur}" data-gn="${pages.length}">
        <button type="button" class="p3e-gnav" data-gnav="-1" aria-label="${esc(GT.prev)}" title="${esc(GT.prev)}"${cur===0?" disabled":""}>‹</button>
        <span class="p3e-grange" aria-live="polite">${esc(pageLabel(pages[cur]))}</span>
        <button type="button" class="p3e-gnav" data-gnav="1" aria-label="${esc(GT.next)}" title="${esc(GT.next)}"${cur===pages.length-1?" disabled":""}>›</button>
      </div>`:"";

  const gridHtml=`<div class="p3e-grid-wrap">
    <div class="p3e-grp-desk">
      ${pager}
      <div class="p3e-gpages">${tables}</div>
    </div>
    ${anyPrelim?`<p class="p3e-gt-fn"${pagePrelim(pages[cur])?"":" hidden"}>${esc(L.ssDashedFnT)}</p>`:""}
  </div>`;

  return daysHtml+grpHtml+fnHtml+gridHtml;
}

/* p3eRegisterDayPicker: attach live day-switching to the p3e day strip.
   Called from decorateSheet after the sheet HTML is in the DOM. */
function p3eRegisterDayPicker(container, itemKind, itemId, normalizedRows, venueMap, isP){
  const wrap=container&&container.querySelector("[data-p3dayswrap]");
  const grp=container&&container.querySelector(".p3e-grp-slot");
  if(!wrap||!grp)return;
  const buildList=(dateStr)=>{
    const rows=normalizedRows.filter(r=>r.dateStr===dateStr);
    rows.sort((a,b)=>(a.times[0]||"").localeCompare(b.times[0]||""));
    if(!rows.length){grp.innerHTML="";return;}
    grp.innerHTML=rows.map(r=>{
      const v=venueMap(r.venueId)||{};
      const prelim=isP(r.venueId,dateStr);
      const pills=r.times.map(tm=>{
        const pillKey=`${itemKind}:${itemId}|${r.venueId}|${dateStr}|${tm}`;
        return`<button class="p3e-pill${prelim?" prelim":""}" type="button" data-sspill="${esc(pillKey)}" aria-label="${esc(_pillName(tm,v.name||r.venueId,dateStr,prelim))}">${esc(tm)}</button>`;
      }).join("");
      return p3eRowHtml(itemKind,v,r,prelim,pills);
    }).join("");
  };
  wrap.addEventListener("click",e=>{
    const btn=e.target.closest("[data-p3day]");
    if(!btn)return;
    wrap.querySelectorAll("[data-p3day]").forEach(b=>b.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true");
    buildList(btn.dataset.p3day);
  });
}

function sheetShow(sh){
  const L=t(),th=thById[sh.theatre],x=SHOW_EXTRA[sh.id]||{};
  const perfs=upcomingPerfs(PERFORMANCES.filter(p=>p[0]===sh.id)).sort((a,b)=>(a[1]+a[2]).localeCompare(b[1]+b[2]));
  const thId=sh.theatre;
  const isPrelim=(vid,d)=>isPrelimListing("show",sh.id,vid,d);
  /* Normalize PERFORMANCES rows for p3eShowtimesHtml.
     PERFORMANCES row: [showId, dateStr, timeStr, hall, price, …]
     We treat the single theatre as the "venue" row.
     Hall (sala) may differ per date; store the first hall per date in the price slot
     so it appears as secondary text in the listing row. */
  const normRowsShow=[];
  const byDayMap={};
  const dayHallMap={};
  perfs.forEach(p=>{
    (byDayMap[p[1]]=byDayMap[p[1]]||[]).push(p[2]);
    if(!dayHallMap[p[1]]&&p[3])dayHallMap[p[1]]=p[3];
  });
  Object.keys(byDayMap).sort().forEach(d=>{
    const hallRaw=dayHallMap[d]||"";
    const hallTxt=hallRaw&&hallRaw!==th.name?hallDisplay(hallRaw):"";
    normRowsShow.push({
      venueId:thId,
      dateStr:d,
      times:[...new Set(byDayMap[d])].sort(),
      price:hallTxt
    });
  });
  const venueMapFnShow=(vid)=>{
    const v=thById[vid];
    if(!v)return{name:vid,area:"",price:""};
    return{
      name:S.lang==="bg"?v.name:(v.nameEn||v.name),
      area:S.lang==="bg"?v.area:(v.areaEn||v.area),
      price:""

function calView(){
  const L=t(),has=datesWith();
  const idx=Math.max(0,Math.min(S.calMonth||0,MONTHS.length-1));
  const m=MONTHS[idx];
  const fd=dUTC(m+"-01");
  const offset=(fd.getUTCDay()+6)%7;
  const dim=new Date(Date.UTC(fd.getUTCFullYear(),fd.getUTCMonth()+1,0)).getUTCDate();
  const lo=S.rFrom, hi=S.rTo, isRange=S.day==="range";
  let cells="";
  for(let i=0;i<offset;i++)cells+=`<span class="cal-pad" aria-hidden="true"></span>`;
  for(let d=1;d<=dim;d++){
    const iso=`${m}-${String(d).padStart(2,"0")}`;
    const ok=iso>=TODAY&&iso<=LASTDAY;
    let cls=has.has(iso)?"has":"";
    let pressed=false;
    if(isRange&&lo){
      const top=hi||lo;
      if(iso>lo&&iso<top)cls+=" inrange";
      if(iso===lo){pressed=true;cls+=" rstart";if(hi&&hi!==lo)cls+=" inrange";}
      if(iso===top&&top!==lo){pressed=true;cls+=" rend inrange";}
    }else{pressed=S.day===iso;}
    cells+=`<button ${ok?"":"disabled"} class="${cls.trim()}" data-pick="${iso}" aria-pressed="${pressed}" aria-label="${esc(d+" "+L.months[Number(m.slice(5,7))-1])}">${d}</button>`;
  }
  const dows=S.lang==="bg"?["пн","вт","ср","чт","пт","сб","нд"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const hint=isRange
    ? (lo&&hi?`${fmtDay(lo,true)} – ${fmtDay(hi,true)}`
       : lo?(S.lang==="bg"?"Изберете крайна дата":"Pick an end date")
       : (S.lang==="bg"?"Изберете начална дата":"Pick a start date"))
    : (S.lang==="bg"?"Докоснете начало и край за период":"Tap a start and an end for a range");
  return `<div class="calnav">
      <button class="calarrow" data-calstep="-1" ${idx>0?"":"disabled"} aria-label="${esc(L.prevMonth)}">‹</button>
      <div class="calmon">${esc(L.months[Number(m.slice(5,7))-1])} ${m.slice(0,4)}</div>
      <button class="calarrow" data-calstep="1" ${idx<MONTHS.length-1?"":"disabled"} aria-label="${esc(L.nextMonth)}">›</button></div>
    <div class="caldow">${dows.map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal">${cells}</div>
    <div class="calhint">${esc(hint)}</div>`;
}

/* A selector for a drawer control, so the same control can take focus back after the
   drawer's content is refreshed (its data-* attribute and value identify it). */
function _ctlKey(el,root){
  if(!el||!root||!root.contains(el)||el===root)return null;
  for(const a of el.getAttributeNames()){
    if(a.startsWith("data-")){
      try{return el.tagName.toLowerCase()+"["+a+'="'+CSS.escape(el.getAttribute(a))+'"]';}catch(e){return null;}
    }
  }
  return null;
}

/* Bring the FAB in line with the state; nothing else on the page is touched. */

/* A drawer just put on the page: the iOS backdrop tap, the slide-in, then focus inside. */
function _drawerEnter(app){
  /* iOS sends a click for a tap only to an element that listens for one: without this
     a tap on the dimmed area beside the drawer did nothing on an iPhone */
  const ds0=app.querySelector(":scope > .drawer-scrim");
  if(ds0)ds0.addEventListener("click",()=>{});
  _drawerSwipe(app.querySelector(":scope > .drawer"));
  _drawerInert(true);
  /* P3B: animate drawer entrance when newly opened, then move focus inside */
  requestAnimationFrame(()=>{
    const dr=document.querySelector(".drawer");
    const ds=document.querySelector(".drawer-scrim");
    if(!dr)return;
    const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const delay=reduced?10:340;
    if(!reduced){
      dr.animate([{transform:"translateX(100%)",opacity:0},{transform:"translateX(0)",opacity:1}],
        {duration:320,easing:"cubic-bezier(.25,.46,.45,.94)",fill:"backwards"});
      if(ds)ds.animate([{opacity:0},{opacity:1}],{duration:200,easing:"ease-out",fill:"backwards"});
    }

    setTimeout(()=>{
      const focusable=dr.querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');

/* A tap in the filter drawer: the drawer keeps its node, scroll position and focus (only
   its content is refreshed, so it does not slide in again and the list does not jump to
   the top), and the page behind it is updated in place by refreshPage(). */
function renderKeepDrawer(){

/* ===================== in-place page updates =====================
   A filter tap and a letter typed in the search change only the listing under the
   header, yet render() rebuilt the whole app for them. On every letter the search field
   was a new element (iOS dropped and restored its focus, so the keyboard and the page
   jumped), and on every tap each poster became a new <img>, which paints blank until it
   is decoded, so the page behind the filter drawer blinked. refreshPage() rebuilds <main>
   alone. The new content is laid out off-screen first; the posters it shows in view that
   the page does not show yet are loaded and decoded before the swap (DECODE_CAP ms at
   most, so an update never lags), and every poster already on the page moves into the
   new content instead of being created again. The header, the search field, the drawer
   and the scroll position stay as they are.
   opts.search: only the query changed; opts.toY: scroll there with the update;
   opts.anim: the Кино/Театър switch, which dips the content out and back in. */

    _syncFab();

    const was=main.__sgView||"page",now=sr?"search":"page";
    /* a query of one letter leaves the listing as it is */
    if(opts&&opts.search&&was==="page"&&now==="page")return;
    const y0=window.scrollY||0;
    const mainY=main.getBoundingClientRect().top+y0;
    /* results open at their top, right under the header (from a page scrolled further
       down); leaving them puts the page back where it was */
    /* _searchY0 holds how far into the listing the page was scrolled (from the top of
       <main>), so the same place comes back even if the header changed height meanwhile
       (the search row closing); keepY0 is what it becomes once the swap is done */

/* Reference to the card that last opened a sheet — used by closeSheet to

let _lastOpenEl=null;

   filter drawer — used to return keyboard focus when the drawer closes.
   Stored as a selector rather than a DOM reference because render() re-creates
   the FAB element, making any stored reference stale. */
let _lastDrawerOpener=null;

/* Smoothly animate the drawer (translateX) out, then call cb when done.
   Falls back to instant if reduced-motion is set. */
function animateDrawerClose(cb,fromX){
  const dr=document.querySelector(".drawer");
  const ds=document.querySelector(".drawer-scrim");
  if(!dr||window.matchMedia("(prefers-reduced-motion: reduce)").matches){cb();return;}
  /* from a swipe: on from where the finger left it, over the distance still to go, on a
     curve that starts at speed (the plain close starts slowly) */
  const x0=fromX||0,w=dr.getBoundingClientRect().width||1,rest=Math.max(0,1-x0/w);
  const dsOp=ds?(parseFloat(getComputedStyle(ds).opacity)||0):0;
  const anim=dr.animate([{transform:`translateX(${x0}px)`,opacity:1},{transform:"translateX(100%)",opacity:0}],
    {duration:x0?Math.round(120+140*rest):260,easing:x0?"cubic-bezier(.25,.46,.45,.94)":"cubic-bezier(.55,.0,.1,1)",fill:"forwards"});
  if(ds)ds.animate([{opacity:dsOp},{opacity:0}],{duration:x0?Math.round(100+100*rest):200,easing:"ease-in",fill:"forwards"});
  anim.onfinish=cb;
}
/* Close the drawer and give focus back to what opened it (the FAB or "Друг период"). */
function _closeDrawerFrom(fromX){

  animateDrawerClose(()=>{closeDrawerNow();
    if(sel){const el=document.querySelector(sel);if(el&&typeof el.focus==="function"){try{el.focus({preventScroll:true});}catch(e){}}}},fromX);

/* Swipe the filter drawer away, as the film sheet and the time panel are pulled down
   (swipeToClose, ssSwipeToClose): a drag to the right moves the drawer with the finger
   and fades the dimmed page with it; let go past 30% of its width, or with a flick
   (0.4 px/ms), and it slides on out, otherwise it springs back. Only a drag that is
   clearly sideways is taken: one that starts up or down is the drawer's own scrolling
   and is left alone. Reduced motion: the drawer does not follow the finger; a swipe
   that would have closed it closes it at once. Bound once per drawer node: the node is
   kept across filter taps (renderKeepDrawer), so the listeners stay with it. */
function _drawerSwipe(dr){
  if(!dr||dr._sgSwipe)return;
  dr._sgSwipe=true;
  const THRESHOLD=0.30,VEL_CLOSE=0.4,SLOP=8;
  let x0=null,y0=0,t0=0,lastX=0,lastT=0,dir=0,w=0;   /* dir: 0 undecided, 1 ours, -1 not ours */
  const scrimEl=()=>document.querySelector("#app > .drawer-scrim");
  const reduced=()=>window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clear=()=>{dr.style.transform="";dr.style.willChange="";const s=scrimEl();if(s){s.style.opacity="";s.style.willChange="";}};
  dr.addEventListener("touchstart",e=>{
    if(e.touches.length!==1){x0=null;return;}
    /* a spring-back (or the slide-in) still running would hold the drawer against the finger */
    [dr,scrimEl()].forEach(n=>n&&n.getAnimations&&n.getAnimations().forEach(a=>{try{if(!a.effect||a.effect.getTiming().fill!=="forwards")a.finish();}catch(err){}}));
    const t=e.touches[0];
    x0=lastX=t.clientX;y0=t.clientY;t0=lastT=performance.now();dir=0;
    w=dr.getBoundingClientRect().width||320;
  },{passive:true});
  dr.addEventListener("touchmove",e=>{
    if(x0===null||dir<0)return;
    /* a second finger: not a swipe; a drag already under way springs back */
    if(e.touches.length!==1){if(dir===1)end(true);else dir=-1;return;}
    const t=e.touches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(!dir){
      if(Math.abs(dx)<SLOP&&Math.abs(dy)<SLOP)return;
      if(dx<=0||Math.abs(dx)<=Math.abs(dy)){dir=-1;return;}
      dir=1;
      if(!reduced()){dr.style.willChange="transform";const s=scrimEl();if(s)s.style.willChange="opacity";}
    }
    /* sideways and ours: the list must not scroll under the finger */
    if(e.cancelable)e.preventDefault();
    lastX=t.clientX;lastT=performance.now();
    if(reduced())return;
    const x=Math.max(0,dx);
    dr.style.transform=`translateX(${x}px)`;
    const s=scrimEl();if(s)s.style.opacity=String(Math.max(0,1-x/w).toFixed(3));
  },{passive:false});
  const end=cancelled=>{
    if(x0===null)return;
    const sx=x0,was=dir;x0=null;dir=0;
    if(was!==1)return;
    const dx=Math.max(0,lastX-sx),dt=lastT-t0,vel=dt>0?dx/dt:0;
    if(!cancelled&&(dx>w*THRESHOLD||vel>VEL_CLOSE)){
      if(reduced()){clear();_closeDrawerFrom(0);return;}
      _closeDrawerFrom(dx);
      return;
    }
    /* spring back, on the sheets' curve */
    if(reduced()||!dx){clear();return;}
    const s=scrimEl(),op=s?(parseFloat(s.style.opacity)||0):1;
    clear();
    dr.animate([{transform:`translateX(${dx}px)`},{transform:"translateX(0)"}],
      {duration:320,easing:"cubic-bezier(.34,1.48,.64,1)"});
    if(s)s.animate([{opacity:op},{opacity:1}],{duration:260,easing:"ease-out"});
  };
  dr.addEventListener("touchend",()=>end(false),{passive:true});
  dr.addEventListener("touchcancel",()=>end(true),{passive:true});
}

/* iPhone-style pull-to-close on phones.
   - Tracks the sheet position while dragging down (only when scrolled to top).
   - Scales the sheet down toward 0.9 at the close threshold.
   - Fades the backdrop proportionally.
   - Commits close (shrink-to-card) if dy > 25 % of sheet height or velocity > 0.4 px/ms.
   - Springs back otherwise.
   - Non-passive touchstart so we can call preventDefault when we take over. */
function swipeToClose(sheet){
  const THRESHOLD=0.25; /* 25 % of sheet height */
  const VEL_CLOSE=0.4;  /* px/ms flick velocity */
  let y0=null,t0=null,lastY=null,lastT=null;
  const scrim=document.getElementById("scrim");

  sheet.addEventListener("touchstart",e=>{
    if(sheet.scrollTop>2){y0=null;return;}
    y0=e.touches[0].clientY; t0=lastT=Date.now(); lastY=y0;
  },{passive:true});

  sheet.addEventListener("touchmove",e=>{
    if(y0==null)return;
    const dy=e.touches[0].clientY-y0;
    if(dy<0){y0=null;return;} /* upward scroll — hand off */
    const now=Date.now(); lastY=e.touches[0].clientY; lastT=now;
    /* Live transform: sheet follows finger, scrim opacity tracks */
    const h=sheet.getBoundingClientRect().height||600;
    const progress=Math.min(dy/h,1);
    const scale=1-progress*0.1;        /* 1 → 0.9 at threshold */
    const opacity=Math.max(1-progress*1.4,0.15);
    sheet.style.transform=`translateY(${dy}px) scale(${scale})`;
    sheet.style.transformOrigin="center bottom";
    if(scrim)scrim.style.background=`rgba(5,3,7,${(0.8*opacity).toFixed(3)})`;
  },{passive:true});

  function _reset(){
    sheet.style.transform="";
    sheet.style.transformOrigin="";
    if(scrim)scrim.style.background="";
    y0=null;
  }

  sheet.addEventListener("touchend",e=>{
    if(y0==null)return;
    const dy=lastY-y0;
    const dt=lastT-t0;
    const vel=dt>0?dy/dt:0;
    const h=sheet.getBoundingClientRect().height||600;
    if(dy>h*THRESHOLD||vel>VEL_CLOSE){
      /* commit close */
      _reset();
      closeSheet();
    } else {
      /* spring back */
      if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){_reset();return;}
      sheet.animate(
        [{transform:sheet.style.transform||"none"},{transform:"translateY(0) scale(1)"}],
        {duration:320,easing:"cubic-bezier(.34,1.48,.64,1)",fill:"forwards"});
      if(scrim){
        const curAlpha=parseFloat((scrim.style.background||"").match(/[\d.]+\)$/)?
          (scrim.style.background||"").match(/([\d.]+)\)$/)[1]:0.8);
        scrim.animate([{opacity:curAlpha/0.8},{opacity:1}],{duration:260,easing:"ease-out",fill:"forwards"});
        scrim.style.background="";
      }
      sheet.style.transform=""; sheet.style.transformOrigin="";
    }
    y0=null;
  },{passive:true});
}

/* iPhone-style open animation: sheet zooms from the tapped card's rect.
   Falls back to slide-up / scale-in when card rect is unavailable. */
function animateOpen(scrim,fromEl){
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sheet=scrim.querySelector(".sheet"); if(!sheet)return;
  const isMobile=innerWidth<=620;

  /* Always fade the scrim backdrop */
  const bgDur=reduced?1:200;
  scrim.animate([{opacity:0},{opacity:1}],{duration:bgDur,easing:"ease-out"});

  if(reduced){
    /* Instant: no transform animation */
    return;
  }

  const rect=fromEl?fromEl.getBoundingClientRect():null;
  if(rect&&isMobile&&rect.width>0&&rect.height>0){
    /* FLIP: compute where to start so the sheet appears to grow from the card */
    const sheetR=sheet.getBoundingClientRect();
    const sheetH=sheetR.height||window.innerHeight*0.92;
    const sheetW=sheetR.width||window.innerWidth;
    /* origin: card centre relative to sheet centre */
    const ox=(rect.left+rect.width/2)-(sheetR.left+sheetW/2);
    const oy=(rect.top+rect.height/2)-(window.innerHeight*0.97); /* sheet anchors to bottom */
    const sx=rect.width/sheetW;
    const sy=rect.height/sheetH;
    sheet.style.transformOrigin="center bottom";
    sheet.animate([
      {opacity:0,transform:`translate(${ox}px,${oy}px) scale(${sx},${sy})`},
      {opacity:1,transform:"translate(0,0) scale(1)"}
    ],{duration:400,easing:"cubic-bezier(.34,1.48,.64,1)",fill:"backwards"});
  } else if(isMobile){
    /* fallback: slide up from the bottom */
    sheet.animate([{opacity:0,transform:"translateY(40px)"},{opacity:1,transform:"translateY(0)"}],
      {duration:380,easing:"cubic-bezier(.34,1.28,.64,1)",fill:"backwards"});
  } else {
    /* desktop: scale+fade from centre */
    sheet.animate([{opacity:0,transform:"scale(.93) translateY(16px)"},{opacity:1,transform:"none"}],
      {duration:340,easing:"cubic-bezier(.34,1.28,.64,1)",fill:"backwards"});
  }
}

/* Animate the sheet closing back to the card it came from (or centre-fade if unavailable). */
function animateClose(scrim,toEl,cb){
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sheet=scrim?scrim.querySelector(".sheet"):null;

  if(reduced||!sheet){cb();return;}

  const isMobile=innerWidth<=620;
  const rect=toEl?toEl.getBoundingClientRect():null;

  /* Fade the scrim first (kept in _closeAnims so a sheet opened meanwhile can cancel it) */
  _closeAnims.push(scrim.animate([{opacity:1},{opacity:0}],{duration:260,easing:"ease-in",fill:"forwards"}));

     rect.top>-rect.height&&rect.top<window.innerHeight){
    /* Card is in viewport: shrink sheet back to card */
    const sheetR=sheet.getBoundingClientRect();
    const sheetH=sheetR.height||window.innerHeight*0.92;
    const sheetW=sheetR.width||window.innerWidth;
    const ox=(rect.left+rect.width/2)-(sheetR.left+sheetW/2);
    const oy=(rect.top+rect.height/2)-(window.innerHeight*0.97);
    const sx=rect.width/sheetW;
    const sy=rect.height/sheetH;
    sheet.style.transformOrigin="center bottom";
    anim=sheet.animate([
      {opacity:1,transform:"translate(0,0) scale(1)"},
      {opacity:0,transform:`translate(${ox}px,${oy}px) scale(${sx},${sy})`}
    ],{duration:300,easing:"cubic-bezier(.55,.0,.1,1)",fill:"forwards"});

    anim=sheet.animate([{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translateY(50px)"}],
      {duration:260,easing:"cubic-bezier(.55,.0,.1,1)",fill:"forwards"});
  } else {
    anim=sheet.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.93) translateY(16px)"}],
      {duration:220,easing:"ease-in",fill:"forwards"});
  }
  if(anim){_closeAnims.push(anim);anim.onfinish=cb;}
  else cb();
}

/* DST-correct UTC offset for Europe/Sofia on a given date+time string */
function _sofiaOffset(dateStr,timeStr){
  /* Use Intl to resolve the actual UTC offset for this local moment */
  const dtStr=dateStr+"T"+timeStr+":00";
  /* Intl.DateTimeFormat can tell us the UTC offset via the "timeZoneName: 'shortOffset'" trick */
  try{
    const fmt=new Intl.DateTimeFormat("en",{timeZone:"Europe/Sofia",timeZoneName:"shortOffset",hour:"numeric"});
    /* Create a Date from the ISO string treating it as UTC, then check Sofia offset */
    /* We iterate seconds to find the exact local→UTC mapping */
    /* Simpler approach: parse the date and use formatToParts */
    const [y,mo,d]=dateStr.split("-").map(Number);
    const [hh,mm]=(timeStr||"00:00").split(":").map(Number);
    /* Try UTC offset +2 and +3, pick the one where Sofia local time matches */
    for(const off of [3,2]){
      const utcMs=Date.UTC(y,mo-1,d,hh-off,mm,0);
      const sofParts=new Intl.DateTimeFormat("en",{
        timeZone:"Europe/Sofia",year:"numeric",month:"2-digit",day:"2-digit",
        hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(utcMs));
      const pp=Object.fromEntries(sofParts.map(p=>[p.type,p.value]));
      const mh=pp.hour==="24"?"00":pp.hour;
      if(pp.year===String(y)&&Number(pp.month)===mo&&Number(pp.day)===d&&Number(mh)===hh){
        return off;
      }
    }
  }catch(e){}
  return 3; /* fallback */
}

    const eOff=_sofiaOffsetAtMs(ms);
    return{
      gcal:()=>[p.y,p.mo,p.d,"T",p.h,p.mi,p.s].join(""),
      outlook(){
        const eoffStr=(eOff>=0?"+":"-")+String(Math.abs(Math.floor(eOff))).padStart(2,"0")+":00";
        return[p.y,"-",p.mo,"-",p.d,"T",p.h,":",p.mi,":00",eoffStr].join("");},
      utcZ(){
        const ld=new Date(ms);
        return[
          String(ld.getUTCFullYear()),
          String(ld.getUTCMonth()+1).padStart(2,"0"),
          String(ld.getUTCDate()).padStart(2,"0"),
          "T",
          String(ld.getUTCHours()).padStart(2,"0"),
          String(ld.getUTCMinutes()).padStart(2,"0"),
          String(ld.getUTCSeconds()).padStart(2,"0"),
          "Z"
        ].join("");}
    };
  }
  const startObj=toLocal(startMs);
  const endObj=toLocal(endMs);
  return{kind,id,venueId,dateStr,timeStr,fullTitle,location,description,url,
    startGcal:startObj.gcal(),endGcal:endObj.gcal(),
    startOutlook:startObj.outlook(),endOutlook:endObj.outlook(),
    startUtcZ:startObj.utcZ(),endUtcZ:endObj.utcZ(),
    off};
}

function calGoogleUrl(ev){
  if(!ev)return"";
  const e=encodeURIComponent;
  return"https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+e(ev.fullTitle)
    +"&dates="+ev.startGcal+"/"+ev.endGcal
    +"&ctz=Europe/Sofia"
    +"&location="+e(ev.location)
    +"&details="+e(ev.description);
}

function calOutlookUrl(ev){
  if(!ev)return"";
  const e=encodeURIComponent;
  return"https://outlook.live.com/calendar/0/action/compose"
    +"?subject="+e(ev.fullTitle)
    +"&startdt="+e(ev.startOutlook)
    +"&enddt="+e(ev.endOutlook)
    +"&location="+e(ev.location)
    +"&body="+e(ev.description);
}

function calIcs(ev){
  if(!ev)return"";
  /* RFC 5545 escaping: \ ; , and newline */
  function rfcEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
  /* RFC 5545 line folding: max 75 octets (UTF-8), fold with CRLF + SPACE */
  function fold(line){
    const out=[];
    let buf="",bytes=0;
    for(const ch of line){
      const enc=new TextEncoder().encode(ch);
      if(bytes+enc.length>75){out.push(buf);buf=" "+ch;bytes=1+enc.length;}
      else{buf+=ch;bytes+=enc.length;}
    }
    if(buf)out.push(buf);
    return out.join("\r\n");
  }
  const now=new Date();
  const dtstamp=[
    String(now.getUTCFullYear()),
    String(now.getUTCMonth()+1).padStart(2,"0"),
    String(now.getUTCDate()).padStart(2,"0"),
    "T",
    String(now.getUTCHours()).padStart(2,"0"),
    String(now.getUTCMinutes()).padStart(2,"0"),
    String(now.getUTCSeconds()).padStart(2,"0"),
    "Z"
  ].join("");
  const uid=ev.kind+"-"+ev.id+"-"+ev.venueId+"-"+ev.dateStr+"-"+(ev.timeStr||"").replace(/:/g,"")+"@sofiagleda.com";
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-" + "//Sofia Gleda//BG",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    fold("UID:"+uid),
    "DTSTAMP:"+dtstamp,
    "DTSTART:"+ev.startUtcZ,
    "DTEND:"+ev.endUtcZ,
    fold("SUMMARY:"+rfcEsc(ev.fullTitle)),
    fold("LOCATION:"+rfcEsc(ev.location)),
    fold("DESCRIPTION:"+rfcEsc(ev.description)),
    fold("URL:"+rfcEsc(ev.url)),
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  return lines.join("\r\n")+"\r\n";
}

/* Open or close the calendar panel for a row */
function toggleCalPanel(btn,kind,id,venueId,dateStr,times){
  /* Close any open panel */
  const prev=document.querySelector(".cal-panel");
  if(prev){
    const wasBtn=_calPanel&&_calPanel.btn;
    prev.remove();
    _calPanel=null;
    if(wasBtn===btn)return; /* toggle off */
  }
  /* Build panel and insert after the vrow */
  const row=btn.closest(".vrow");
  if(!row)return;
  const t=times&&times[0]||"";
  const html=calPanelHtml(kind,id,venueId,dateStr,times,t);
  const wrap=document.createElement("div");
  wrap.innerHTML=html;
  row.after(wrap.firstElementChild);
  _calPanel={btn,kind,id,venueId,dateStr,times,selTime:t};
}

/* Calendar export click handler — own listener, no edits to main handler */
document.addEventListener("click",e=>{
  const q=sel=>e.target.closest(sel);
  /* Cal close button */
  if(q("[data-calclose]")){const p=q(".cal-panel");if(p){p.remove();_calPanel=null;}return;}
  /* Time selector inside panel */
  const tm=q(".cal-times-btn");
  if(tm&&_calPanel){
    _calPanel.selTime=tm.dataset.caltm;

    if(panel){
      panel.outerHTML=calPanelHtml(_calPanel.kind,_calPanel.id,_calPanel.venueId,_calPanel.dateStr,_calPanel.times,_calPanel.selTime);
      /* re-bind _calPanel to new panel */
      const newP=document.querySelector(".cal-panel");
      if(newP)newP._calState=_calPanel;
    }

  }
  /* Google Calendar button */
  const cg=q("[data-calg]");

  /* Apple ICS download */

      const ev=calEvent(d.kind,d.id,d.venueId,d.dateStr,d.timeStr);
      if(!ev)return;
      const ics=calIcs(ev);

      a.download=fname;

    const[kindraw,...rest]=v.split(":");

      if(rows.length)times=rows[0][3]||[];

    }
    toggleCalPanel(cb,kind,id,venueId,dateStr,times);
    return;
  }
});

/* venueMapUrl: build a Google Maps search link for a cinema or theatre.
   Uses the optional "maps" field (a query string or place URL) from the venue
   data when present; otherwise constructs the standard search form. */
function venueMapUrl(venue){
  if(!venue)return"";
  if(venue.maps){
    /* If the override is already a full URL, use it (http(s) only); otherwise treat as
       a query string. A URL safeUrl refuses falls back to the name + area search. */
    if(venue.maps.startsWith("http")){const u=safeUrl(venue.maps);if(u)return u;}
    else return"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(venue.maps);
  }
  const name=venue.name||"";
  const area=venue.area||"";
  const query=name+(area?", "+area:"")+", София";
  return"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(query);
}

/* ---- Apple Calendar (.ics) ----
   The calendar step's Apple row is a real link to a Blob URL of the event (text/calendar).
   iPhone and iPad Safari open the Calendar "add event" sheet when the user follows such a
   link without a download attribute (a data: URL is blocked there, and a scripted click
   on a download link only saves a file to Downloads); everywhere else the download
   attribute saves sg-<...>.ics. The URL is revoked a minute after the popup moves on. */
let _ssIcsBlobUrl=null;
function _isAppleTouch(){
  const ua=navigator.userAgent||"";
  return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
}
function _ssRevokeIcs(){
  if(!_ssIcsBlobUrl)return;
  const u=_ssIcsBlobUrl;_ssIcsBlobUrl=null;
  setTimeout(()=>{try{URL.revokeObjectURL(u);}catch(e){}},60000);
}
function _ssIcsUrl(ev){
  _ssRevokeIcs();
  if(!ev)return"";
  try{
    _ssIcsBlobUrl=URL.createObjectURL(new Blob([calIcs(ev)],{type:"text/calendar;charset=utf-8"}));
    return _ssIcsBlobUrl;
  }catch(e){return"";}
}

/* ssSwipeToClose: P3B-style drag-to-close wired to the SS inner sheet.
   Uses ssWrap (the #ss-wrap backdrop) for the opacity fade instead of the
   parent scrim, so the parent sheet is unaffected.  Calls closeScreeningSheet()
   on threshold/flick; springs back on short drag. */
function ssSwipeToClose(ssWrap,ssSheet){
  const THRESHOLD=0.25;
  const VEL_CLOSE=0.4;
  let y0=null,t0=null,lastY=null,lastT=null;

  ssSheet.addEventListener("touchstart",e=>{
    if(ssSheet.scrollTop>2){y0=null;return;}
    y0=e.touches[0].clientY; t0=lastT=Date.now(); lastY=y0;
  },{passive:true});

  ssSheet.addEventListener("touchmove",e=>{
    if(y0==null)return;
    const dy=e.touches[0].clientY-y0;
    if(dy<0){y0=null;return;}
    const now=Date.now(); lastY=e.touches[0].clientY; lastT=now;
    const h=ssSheet.getBoundingClientRect().height||400;
    const progress=Math.min(dy/h,1);
    const scale=1-progress*0.1;
    const opacity=Math.max(1-progress*1.4,0.15);
    ssSheet.style.transform=`translateY(${dy}px) scale(${scale})`;
    ssSheet.style.transformOrigin="center bottom";
    ssWrap.style.background=`rgba(0,0,0,${(0.55*opacity).toFixed(3)})`;
  },{passive:true});

  function _ssReset(){
    ssSheet.style.transform="";
    ssSheet.style.transformOrigin="";
    ssWrap.style.background="";
    y0=null;
  }

  ssSheet.addEventListener("touchend",e=>{
    if(y0==null)return;
    const dy=lastY-y0;
    const dt=lastT-t0;
    const vel=dt>0?dy/dt:0;
    const h=ssSheet.getBoundingClientRect().height||400;
    if(dy>h*THRESHOLD||vel>VEL_CLOSE){
      _ssReset();
      closeScreeningSheet();
    } else {
      if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){_ssReset();return;}
      ssSheet.animate(
        [{transform:ssSheet.style.transform||"none"},{transform:"translateY(0) scale(1)"}],
        {duration:320,easing:"cubic-bezier(.34,1.48,.64,1)",fill:"forwards"});
      const curBg=ssWrap.style.background||"";
      const curAlphaM=curBg.match(/([\d.]+)\)$/);
      const curAlpha=curAlphaM?parseFloat(curAlphaM[1]):0.55;
      ssWrap.animate([{opacity:curAlpha/0.55},{opacity:1}],{duration:260,easing:"ease-out",fill:"forwards"});
      ssWrap.style.background="";
      ssSheet.style.transform=""; ssSheet.style.transformOrigin="";
    }
    y0=null;
  },{passive:true});
}

/* ===================== the time popup ("screening sheet") =====================
   Phones, and screens shorter than 520 px (landscape phones): a bottom panel in its own
   overlay #ss-wrap, built once with its listeners. Otherwise a popover card #ss-pop on a
   fixed layer of its own, anchored to the clicked time; when no placement holds the whole
   card it becomes the bottom panel too. Either way it belongs to the open film/show sheet:

/* Popover placement, in this order: 10 px above the time, 10 px below it, then beside it
   (right, then left) vertically centred on it; centred on the time where it can be, 12 px
   inside the viewport, never over the time and never cut short (no height cap, so every
   button stays in view). Returns false when no placement holds the whole card; the caller
   then uses the bottom panel. Closes the popover once its time scrolls out of view. */
function _ssPlace(){
  if(!_ss||_ss.mode!=="pop")return true;

  else if(pw<=vw-2*M&&r.bottom+G+ph<=vh-M){place="below";top=r.bottom+G;left=clamp(cx-pw/2,M,vw-M-pw);}
  else if(ph<=vh-2*M&&r.right+G+pw<=vw-M){place="right";left=r.right+G;top=clamp(cy-ph/2,M,vh-M-ph);}
  else if(ph<=vh-2*M&&r.left-G-pw>=M){place="left";left=r.left-G-pw;top=clamp(cy-ph/2,M,vh-M-ph);}

}

        const L=t(),nv=grpSlot.querySelectorAll(".p3e-row").length,np=grpSlot.querySelectorAll(".p3e-pill").length;

  }
  /* A card tapped while the search field has focus: the field lets go first, so the
     phone keyboard goes down before the sheet opens. iOS keeps an input focused when a
     button is tapped, so the keyboard used to close only later, under the open sheet,
     moving the viewport while the sheet was being used. */
  if(q("[data-film]")||q("[data-show]")||q("[data-event]"))_releaseSearchField();

  const shc=q("[data-show]"); if(shc){curSheet={kind:"show",id:shc.dataset.show};openSheet(sheetShow(showById[shc.dataset.show]),shc);return;}
  const ec=q("[data-event]"); if(ec){curSheet={kind:"event",id:ec.dataset.event};openSheet(sheetEvent(EVENTS.find(x=>x.id===ec.dataset.event)),ec);return;}
});

/* Wheel or trackpad scrolling: the page moves under a resting pointer, and every card it
   passed lifted and dropped again, each change a repaint of its rail (two paints and a
   style pass a frame, on desktop only). html.sg-wheel holds those hover effects (CSS by
   .rarrow) until 160 ms after the last wheel event, or until the pointer itself moves.
   Clicks are untouched. */
let _wheelT=0;
function _wheelEnd(){clearTimeout(_wheelT);_wheelT=0;document.documentElement.classList.remove("sg-wheel");}
window.addEventListener("wheel",()=>{
  if(!_wheelT)document.documentElement.classList.add("sg-wheel");
  clearTimeout(_wheelT);_wheelT=setTimeout(_wheelEnd,160);
},{passive:true});

/* live search: only the results under the header follow the query (refreshPage); the

/* Part 0b: re-render when the viewport crosses 760 px (mobile ↔ desktop header switch).
   Keep any open drawer/sheet alive; just rebuild the header HTML. */
try{

/* ===================== cookie notice (consent) =====================
   Sofia Gleda sets no cookies. What it keeps in the browser is strictly necessary for what
   the visitor asked for: localStorage "sofia-screen-v2" (language, mode, favourites), the
   record below, and on sofiagleda.com the service worker's caches. So the notice only
   informs: "Разбрах" and "Научи повече", no switches. legal/cookies/ lists every item, and
   verify_build.py fails when a localStorage key the page uses is missing from that list.

   The record: localStorage "sofia-consent" = {v, at, opt}: v is CONSENT_VERSION, at the time
   of the choice (ISO), opt {category id: true|false}. A record with another v, or one that
   does not parse, counts as none. Bump CONSENT_VERSION when the cookie or the privacy policy
   changes (scripts/gen_legal_pages.py prints it as their date) and the notice shows again.
   The footer's "Настройки за бисквитки" and the address #cookies (the legal pages link
   there) open it again.

   Optional scripts (visitor statistics; sign-in in phase 5) start through consentRun() and
   nowhere else:
     1. add the category to CONSENT_OPTIONAL: {id, bg:{name, desc}, en:{name, desc}};
     2. describe it in the cookie policy and bump CONSENT_VERSION;
     3. start the script with consentRun("<id>", () => { ...load it... }).
   The notice then lists a switch per category, off until the visitor turns it on.
   consentRun runs fn once: at once when the category is allowed, otherwise as soon as it
   is. An id that is not in CONSENT_OPTIONAL never runs. Withdrawing a category that has run
   reloads the page, so nothing it started keeps running. */
const CONSENT_KEY="sofia-consent";
/* 2026-10-22: the policies name no contact channel any more (the GitHub page is gone);
   2026-10-23: the privacy and cookie policies describe the YouTube trailer */
const CONSENT_VERSION="2026-10-23";
const CONSENT_OPTIONAL=[];
let _cRec=null,_cWait={},_cRan={},_cBack=null,_cLang=null;
function _consentLoad(){
  try{
    const r=JSON.parse(localStorage.getItem(CONSENT_KEY)||"null");
    if(r&&typeof r==="object"&&r.v===CONSENT_VERSION&&r.opt&&typeof r.opt==="object"&&!Array.isArray(r.opt))return r;
  }catch(e){}
  return null;
}
function consentRun(id,fn){
  if(typeof fn!=="function"||!CONSENT_OPTIONAL.some(c=>c.id===id))return false;
  const rec=_cRec||(_cRec=_consentLoad());
  if(rec&&rec.opt[id]===true){_cRan[id]=true;try{fn();}catch(e){}return true;}
  (_cWait[id]=_cWait[id]||[]).push(fn);
  return false;
}
/* store a choice; false when it withdrew a category that has already run (the page reloads) */
function _consentSave(opt){
  const clean={};
  CONSENT_OPTIONAL.forEach(c=>{clean[c.id]=opt[c.id]===true;});
  _cRec={v:CONSENT_VERSION,at:new Date().toISOString(),opt:clean};
  try{localStorage.setItem(CONSENT_KEY,JSON.stringify(_cRec));}catch(e){}
  if(Object.keys(_cRan).some(id=>!clean[id])){location.reload();return false;}
  Object.keys(_cWait).forEach(id=>{
    if(!clean[id])return;
    const fns=_cWait[id];delete _cWait[id];_cRan[id]=true;
    fns.forEach(f=>{try{f();}catch(e){}});
  });
  return true;
}
function _consentHTML(){
  const L=t(),cats=CONSENT_OPTIONAL,cur=(_cRec&&_cRec.opt)||{};
  const more=S.lang==="en"?"legal/en/cookies/":"legal/cookies/";
  const list=cats.length?`<ul class="consent-cats">
    <li><label class="consent-cat" for="sgc-necessary"><b>${esc(L.consentNecessary)}</b><small>${esc(L.consentNecessaryNote)}</small></label><input type="checkbox" id="sgc-necessary" checked disabled></li>
    ${cats.map(c=>{const n=c[S.lang]||c.bg||{};return`<li><label class="consent-cat" for="sgc-${esc(c.id)}"><b>${esc(n.name)}</b><small>${esc(n.desc)}</small></label><input type="checkbox" id="sgc-${esc(c.id)}" data-consent-cat="${esc(c.id)}"${cur[c.id]===true?" checked":""}></li>`;}).join("")}
  </ul>`:"";
  const btns=cats.length
    ?`<button type="button" class="consent-btn pri" data-consent-all>${esc(L.consentAll)}</button><button type="button" class="consent-btn sec" data-consent-none>${esc(L.consentNone)}</button><button type="button" class="consent-btn sec" data-consent-save>${esc(L.consentSave)}</button>`
    :`<button type="button" class="consent-btn pri" data-consent-ok>${esc(L.consentOk)}</button>`;
  return`<h2 class="consent-t" id="sgc-t">${esc(cats.length?L.consentTitleOpt:L.consentTitle)}</h2>
  <p class="consent-d" id="sgc-d">${esc(cats.length?L.consentTextOpt:L.consentText)}</p>${list}
  <div class="consent-btns">${btns}<a class="consent-more" href="${more}">${esc(L.consentMore)}</a></div>`;
}
/* The notice is the first thing in the page (first in reading and tab order), outside #app
   so a re-render never drops it. It takes the focus only when the visitor asked for it. */
function consentOpen(focus){
  let el=document.getElementById("sg-consent");
  if(!el){
    el=document.createElement("section");
    el.id="sg-consent";el.className="consent";el.tabIndex=-1;
    el.setAttribute("role","region");
    el.setAttribute("aria-labelledby","sgc-t");el.setAttribute("aria-describedby","sgc-d");
    document.body.insertBefore(el,document.body.firstChild);
  }
  el.lang=S.lang;el.innerHTML=_consentHTML();_cLang=S.lang;el.hidden=false;
  _consentPad();
  if(focus){try{el.focus({preventScroll:true});}catch(e){}}
}
function consentClose(){
  const el=document.getElementById("sg-consent");
  if(!el||el.hidden)return;
  const inside=el.contains(document.activeElement);
  el.hidden=true;
  document.documentElement.style.scrollPaddingBottom="";
  if(inside){
    const back=(_cBack&&document.querySelector(_cBack))||document.querySelector("#app [data-home]");
    if(back){try{back.focus({preventScroll:true});}catch(e){}}
  }
  _cBack=null;
}
/* While the notice is up, keyboard focus and scrollIntoView stop above it (WCAG 2.4.11). */
function _consentPad(){
  const el=document.getElementById("sg-consent");
  if(!el||el.hidden)return;
  document.documentElement.style.scrollPaddingBottom=Math.max(0,Math.round(window.innerHeight-el.offsetTop+12))+"px";
}
function _consentSync(){
  const el=document.getElementById("sg-consent");
  if(el&&!el.hidden&&_cLang!==S.lang){el.lang=S.lang;el.innerHTML=_consentHTML();_cLang=S.lang;_consentPad();}
}
function _consentFromHash(){
  if(location.hash!=="#cookies")return false;
  try{history.replaceState(history.state,"",location.pathname+location.search);}catch(e){}
  _cBack=null;consentOpen(true);
  return true;
}
function consentBoot(){
  _cRec=_consentLoad();
  if(!_consentFromHash()&&!_cRec)consentOpen(false);
}
document.addEventListener("click",e=>{
  const q=s=>e.target.closest&&e.target.closest(s);
  if(q("[data-consent-open]")){e.preventDefault();_cBack="footer [data-consent-open]";consentOpen(true);return;}
  if(!q("#sg-consent"))return;
  let opt=null;
  if(q("[data-consent-ok]"))opt=Object.assign({},(_cRec&&_cRec.opt)||{});
  else if(q("[data-consent-all]")){opt={};CONSENT_OPTIONAL.forEach(c=>{opt[c.id]=true;});}
  else if(q("[data-consent-none]"))opt={};
  else if(q("[data-consent-save]")){
    opt={};
    document.querySelectorAll("#sg-consent [data-consent-cat]").forEach(i=>{opt[i.dataset.consentCat]=i.checked;});
  }
  if(opt&&_consentSave(opt))consentClose();
});
window.addEventListener("hashchange",_consentFromHash);
window.addEventListener("resize",_consentPad);

}
function boot(){ render(); }
const origRender=render;
render=function(){
  try{
    /* behind an open (or closing) filter drawer the page keeps its place: mount enough
       of the lazily built rails to hold the old offset, then put the offset back */
    const keepY=document.querySelector("#app > .drawer")?(window.scrollY||0):null;
    origRender();mountProgressive();
    if(keepY!==null)_keepPageY(keepY);
    _consentSync();
  }
  catch(e){ fatal(e); }
};
function _keepPageY(y){
  let guard=0;
  while(document.documentElement.scrollHeight<y+window.innerHeight&&railIdx<RAILS.length&&guard++<=RAILS.length){
    const sent=document.getElementById("rail-sentinel");
    if(!sent)break;
    sent.insertAdjacentHTML("beforebegin",RAILS.slice(railIdx,railIdx+RAIL_MORE).map(matRail).join(""));
    railIdx+=RAIL_MORE;
  }
  if(railIdx>=RAILS.length){
    if(railObs){railObs.disconnect();railObs=null;}
    const sent=document.getElementById("rail-sentinel");if(sent)sent.remove();
  }
  if(Math.abs((window.scrollY||0)-y)>1)window.scrollTo(0,y);
}
try{ _routeSurface(); boot(); _routeBoot(); }catch(e){ fatal(e); }
try{ consentBoot(); }catch(e){}
