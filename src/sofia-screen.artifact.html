<title>Sofia Gleda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- loaded non-blocking: a stalled font request must never hold up first paint.
     Every rule declares a real fallback stack, so the page is fully usable
     before (or without) the webfonts. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap"></noscript>

<style>
:root{
  --ink:#0C0A0F; --ink-2:#141018; --ink-3:#1C1622; --ink-4:#28202F;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --fg:#F4EFF6; --fg-2:#B6ABBC; --fg-3:#7E7386;
  --crimson:#E0163A; --gild:#D9B23C;
  --accent:var(--crimson); --on-accent:#fff;
  --shadow:0 20px 48px rgba(0,0,0,.55);
  --r:12px; --r-lg:20px;
  color-scheme:dark;
}
:root[data-surface="theatre"]{ --accent:var(--gild); --on-accent:#17110B; }
/* Dark mode is forced — there is no light theme. The former
   `@media (prefers-color-scheme: light)` and `:root[data-theme="light"]` blocks
   were removed so a device set to light does not recolour the app; `color-scheme:dark`
   on :root above keeps native controls, scrollbars, and form fields dark too. */

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; background:var(--ink); color:var(--fg);
  font-family:"Onest","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
.wrap{max-width:none; margin:0; padding-inline:16px}
@media(min-width:900px){ .wrap{padding-inline:40px} }
@media(min-width:1440px){ .wrap{padding-inline:56px} }
/* the header spans the full viewport, content fluid to 100% */
.bar .wrap{padding-inline:14px}
@media(min-width:900px){ .bar .wrap{padding-inline:28px} }
@media(min-width:1440px){ .bar .wrap{padding-inline:40px} }

/* ---------- header ---------- */
/* Desktop: position:sticky, single row. Mobile: two rows (logo centred + controls).
   The logo row is allowed to scroll away; the controls row stays pinned via a
   negative top offset equal to the logo row height (28px logo + 14px padding-block + 10px gap = 52px).
   --logo-row-h is the single source of truth so the pinned offset cannot drift. */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:60;
  background:color-mix(in srgb,var(--ink) 92%,transparent); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding-block:14px}
/* three zones: brand left · search centre · controls right */
.bar-in{display:grid; grid-template-columns:1fr minmax(0,auto) 1fr; align-items:center; gap:18px}
.brand{display:flex; align-items:center; gap:9px; justify-self:start; min-width:0;
  background:none; border:0; padding:0; margin:0; cursor:pointer; font:inherit; -webkit-tap-highlight-color:transparent}
.brand-logo{height:clamp(32px,3.2vw,42px); width:auto; flex:0 1 auto; min-width:0; max-width:100%;
  object-fit:contain; display:block; transition:filter .15s}
.brand:hover .brand-logo{filter:brightness(1.12)}
.brand b{font-family:Oswald,"Arial Narrow",sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,30px);
  letter-spacing:.15em; text-transform:uppercase; color:var(--accent); line-height:1; white-space:nowrap;
  transition:opacity .15s, filter .15s}
.brand:hover b{filter:brightness(1.12)}
.brand:active b{opacity:.7}
.brand span{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap}
.bar-controls{display:flex; align-items:center; gap:8px; justify-self:end}
@media(max-width:820px){ .brand span{display:none} }
/* ── Mobile layout (≤760px) ──
   Row 1: logo centred (scrolls away).
   Row 2: [seg toggle expands] [lang 42px] [search icon 42px] [burger 42px] — one line, never wraps.
   Row 3: full-width search field (only when S.searchOpen).
   --logo-row-h = 28px logo + 14px padding-block-top + 10px gap between rows = 52px.
   The negative top hides the logo row; the controls row is then 8px below safe-area-inset-top. */
/* ── Mobile layout (≤760px) — JS also detects this and renders mobile HTML ── */
@media(max-width:760px){
  :root{ --logo-row-h:52px }
  .bar{top:calc(env(safe-area-inset-top,0px) - var(--logo-row-h) + 8px)}
  .bar-row-logo{display:flex; justify-content:center; align-items:center; margin-bottom:10px}
  .bar-row-controls{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; overflow:hidden}
  .bar-row-search{width:100%}
  .brand b{font-size:19px; letter-spacing:.08em}
  .brand-logo{height:28px}
  /* mobile search icon button */
  .search-icon-btn{width:42px; height:42px; flex:0 0 42px; border-radius:999px; border:1px solid var(--line);
    background:var(--ink-3); color:var(--fg-2); display:grid; place-items:center}
  .search-icon-btn:hover{border-color:var(--line-2); color:var(--fg)}
  /* mobile open search field */
  .bar-row-search .search{position:relative; width:100%; max-width:none}
}
/* ── Segmented toggle — FIXED equal halves, language-independent ──
   Total fixed width: 220px desktop / auto-expands on mobile to fill remaining space.
   Height: 44px. Each half: 1fr grid cell with icon + label, accent on active. */
.seg{display:grid; grid-template-columns:1fr 1fr; background:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex:0 0 auto; width:220px}
.seg button{display:flex; align-items:center; justify-content:center; gap:6px; height:40px; border-radius:999px; font-size:13px; font-weight:600; color:var(--fg-2); white-space:nowrap; transition:background .18s,color .18s; padding:0 8px; overflow:hidden}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:700}
.seg button svg{flex:0 0 18px; width:18px; height:18px}
/* mobile: seg fills remaining width (must come AFTER the base width:220px rule) */
@media(max-width:760px){ .seg{flex:1 1 0!important; min-width:0; width:auto!important} }
/* at very narrow viewports, drop the SVG icons from toggle to save space */
@media(max-width:350px){ .seg button svg{display:none} }
.iconb{width:42px; height:42px; flex:0 0 42px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg-2); font-size:13px; font-weight:700; display:grid; place-items:center}
.iconb:hover{border-color:var(--line-2); color:var(--fg)}

/* ---------- controls ---------- */
.search{position:relative; justify-self:center; width:100%; max-width:clamp(420px,52vw,760px); min-width:0}
.search input{width:100%; padding:13px 44px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg); font:inherit; font-size:clamp(15px,1.5vw,17px)}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{outline:none; border-color:var(--accent)}
.search .mag{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:15px; pointer-events:none}
.search .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:16px;
  width:24px; height:24px; border-radius:50%; display:none; place-items:center}
.search.has .clr{display:grid}
.search.search-mob-open .clr{display:grid}
.burger{display:flex; flex-direction:column; gap:3.5px; align-items:center; justify-content:center}
.burger i{display:block; width:18px; height:2px; background:currentColor; border-radius:2px}
.drawer-scrim{position:fixed; inset:0; z-index:100; background:rgba(5,3,7,.6); backdrop-filter:blur(3px)}
.drawer{position:fixed; top:0; right:0; bottom:0; z-index:101; width:min(380px,88vw);
  background:var(--ink-2); border-left:1px solid var(--line); overflow-y:auto;
  padding:18px 18px calc(28px + env(safe-area-inset-bottom,0px)); box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer h3{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--fg-3); margin:20px 0 9px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.drawer h3:first-of-type{margin-top:6px}
.drawer-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:4px}
.drawer-top b{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.14em; text-transform:uppercase}
.dclose{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:14px; color:var(--fg-2)}
.chipwrap{display:flex; gap:6px; flex-wrap:wrap}
.mrow{display:flex; gap:6px; margin-bottom:9px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal button{aspect-ratio:1; border-radius:8px; border:1px solid transparent; background:var(--ink-3);
  font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg-2); display:grid; place-items:center; position:relative}
.cal button:hover{border-color:var(--line-2)}
.cal button[disabled]{opacity:.26; cursor:default; background:transparent}
.cal button.has::after{content:""; position:absolute; bottom:4px; width:3px; height:3px; border-radius:50%; background:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.cal button[aria-pressed="true"]::after{background:var(--on-accent)}
.cal button.inrange{background:color-mix(in srgb,var(--accent) 26%,transparent); color:var(--fg-1); border-radius:0}
.cal button.rstart{border-top-left-radius:8px; border-bottom-left-radius:8px}
.cal button.rend{border-top-right-radius:8px; border-bottom-right-radius:8px}
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:8px}
.calmon{font-size:13px; font-weight:600; color:var(--fg-1); text-align:center; flex:1}
.calarrow{width:32px; height:32px; flex:none; border-radius:8px; border:1px solid var(--line-2);
  background:var(--ink-3); color:var(--fg-1); font-size:17px; line-height:1; cursor:pointer; display:grid; place-items:center}
.calarrow:hover:not([disabled]){border-color:var(--accent); color:var(--accent)}
.calarrow[disabled]{opacity:.3; cursor:default}
.calhint{margin-top:9px; font-size:11px; color:var(--fg-3); text-align:center; min-height:14px}
.caldow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px}
.caldow span{text-align:center; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3)}
.applyb{width:100%; margin-top:22px}
.until{font-size:11px; color:var(--fg-3); margin-top:7px; line-height:1.45}
.lastcheck{font-size:10.5px; letter-spacing:.06em; color:var(--fg-3); margin-top:16px; padding-top:12px; border-top:1px solid var(--line)}
.controls{padding-block:14px 4px; display:flex; flex-direction:column; gap:10px}
.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto; min-width:58px; padding:6px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--ink-2); text-align:center; line-height:1.2; transition:border-color .15s,background .15s}
.day:hover{border-color:var(--line-2)}
.day[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.day .dow{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
.day .dnum{display:block; font-family:Oswald,sans-serif; font-size:16px; font-weight:600}
.day .dall{font-family:Oswald,sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.06em}
.fbar{display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
.fbar::-webkit-scrollbar{display:none}
.sbar{position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:10px;
  padding:9px 12px; background:color-mix(in srgb,var(--ink-2) 94%,transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.sback{display:flex; align-items:center; gap:7px; padding:7px 13px 7px 9px; border-radius:999px;
  border:1px solid var(--line-2); font-size:13px; font-weight:600; color:var(--fg)}
.sback:hover{border-color:var(--accent); color:var(--accent)}
.sgrab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:8px auto 0; display:none}
@media(max-width:620px){ .sgrab{display:block} .scrim{padding:0; place-items:end center}
  /* Higher specificity (.scrim .sheet) so these win over the base `.sheet`
     rule, which is defined LATER in the file: without it the base
     `overflow:hidden` overrode `overflow-y:auto` and the bottom sheet could not
     scroll on mobile, clipping everything past 94vh. */
  .scrim .sheet{width:100%; border-radius:18px 18px 0 0; margin-bottom:0; max-height:94vh;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain} }
.fchip{padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--ink-2);
  font-size:12px; color:var(--fg-2); transition:border-color .15s,background .15s; white-space:nowrap}
.fchip:hover{border-color:var(--line-2)}
.fchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.fchip.off,.fchip:disabled{opacity:.4; pointer-events:none; text-decoration:line-through; text-decoration-thickness:1px}
.fclear{font-size:11.5px; color:var(--fg-3); text-decoration:underline; text-underline-offset:3px; padding:5px 4px}

/* ---------- hero ---------- */
.hero{position:relative; border-radius:var(--r-lg); overflow:hidden; margin-block:18px 30px;
  min-height:290px; display:flex; align-items:flex-end; border:1px solid var(--line)}
@media(min-width:800px){ .hero{min-height:340px} }
.hero-art{position:absolute; inset:0; z-index:0}
.hero-scrim{position:absolute; inset:0; z-index:1;
  background:linear-gradient(100deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.74) 40%,rgba(0,0,0,.26) 76%,rgba(0,0,0,.5) 100%)}
.hero-body{position:relative; z-index:2; padding:24px 20px; max-width:620px; color:#F4EFF6}
@media(min-width:800px){ .hero-body{padding:38px 42px} }
.eyebrow{font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; font-weight:700;
  color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
[data-surface="theatre"] .eyebrow{color:var(--gild)}
.eyebrow .dot{width:5px; height:5px; border-radius:50%; background:currentColor}
.hero h1{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(28px,5.6vw,52px); line-height:1; margin-bottom:11px}
[data-surface="theatre"] .hero h1{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  font-weight:800; letter-spacing:-.015em; font-size:clamp(26px,5vw,46px); line-height:1.04}
.hero-meta{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:11px; font-size:12.5px; color:#CCC2D0}
.hero-syn{font-size:14px; color:#DBD2DE; margin-bottom:17px; max-width:54ch}
.acts{display:flex; gap:9px; flex-wrap:wrap}
.btn{padding:10px 20px; border-radius:10px; font-weight:600; font-size:13.5px;
  background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); transition:filter .16s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.26); color:#fff; backdrop-filter:blur(6px)}
.btn.sm{padding:7px 14px; font-size:12.5px}

/* ---------- rails ---------- */
.rail{margin-bottom:44px}
.rhead{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.rhead h2{font-family:Oswald,sans-serif; font-weight:600; font-size:clamp(20px,2.2vw,26px);
  letter-spacing:.06em; text-transform:uppercase; color:var(--fg); display:flex; align-items:center; gap:10px}
.rhead h2::before{content:""; display:inline-block; width:4px; height:.9em; border-radius:2px;
  background:var(--accent); flex:0 0 4px}
[data-surface="theatre"] .rhead h2{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  letter-spacing:0; font-size:clamp(24px,2.6vw,30px)}
.rhead .sub{font-size:11.5px; color:var(--fg-3)}
.rscroll{position:relative}
.rtrack{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:6px; scroll-behavior:smooth; scrollbar-width:thin}
.rtrack::-webkit-scrollbar{height:5px}
.rtrack::-webkit-scrollbar-thumb{background:var(--ink-4); border-radius:9px}
.rarrow{position:absolute; top:34%; z-index:5; width:32px; height:62px; border-radius:10px;
  background:color-mix(in srgb,var(--ink) 84%,transparent); border:1px solid var(--line-2);
  display:none; place-items:center; font-size:17px; backdrop-filter:blur(6px)}
@media(min-width:900px){ .rscroll:hover .rarrow{display:grid} }
.rarrow.prev{left:-8px} .rarrow.next{right:-8px}

/* ---------- card + generated poster ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px 12px}
@media(min-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))} }
.card{flex:0 0 auto; width:158px; scroll-snap-align:start; text-align:left; display:flex; flex-direction:column; gap:7px;
  transition:transform .22s cubic-bezier(.22,1,.36,1)}
.grid .card{width:auto}
@media(min-width:760px){ .card{width:180px} }
.card:hover{transform:translateY(-5px)}
.poster{position:relative; aspect-ratio:2/3; max-width:100%; border-radius:var(--r); overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:flex-end;
  padding:11px; color:#fff; isolation:isolate}
.p-art{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.p-real{object-fit:cover; max-width:none}
/* a real poster carries its own title, so the generated lockup steps back */
.poster:has(.p-real) .p-title,.poster:has(.p-real) .p-sub{display:none}
.poster:has(.p-real) .p-grain{background:linear-gradient(to top,rgba(0,0,0,.55),transparent 42%)}
.shero:has(.p-real) .p-real{filter:blur(2px) brightness(.62)}
/* wide event cards (.ebox) are landscape; a real poster fills the box (cover)
   on its own layer above the generated SVG but below the grain + text, with a
   stronger scrim so the badge, title, and date stay legible over the art. */
.ebox .p-real{z-index:1; width:100%; height:100%; object-fit:cover; object-position:center 22%}
.ebox:has(.p-real) .p-grain{background:
  linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.32) 46%,rgba(0,0,0,.08) 78%),
  linear-gradient(to bottom,rgba(0,0,0,.5),transparent 34%)}
.p-grain{position:absolute; inset:0; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
             radial-gradient(130% 80% at 50% 105%,rgba(0,0,0,.72),transparent 62%)}
.p-title{position:relative; z-index:3; font-family:Oswald,sans-serif; font-weight:600; text-transform:uppercase;
  font-size:16px; line-height:1.04; text-shadow:0 2px 14px rgba(0,0,0,.7);
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
[data-surface="theatre"] .p-title{font-family:"Playfair Display",Georgia,serif; text-transform:none; font-weight:600; font-size:18px; line-height:1.12}
.p-sub{position:relative; z-index:3; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; opacity:.8; margin-top:5px}
.p-top{position:absolute; top:9px; left:9px; right:9px; z-index:4; display:flex; justify-content:space-between; align-items:flex-start; gap:6px}
.score{font-family:Oswald,sans-serif; font-weight:600; font-size:12.5px; padding:2px 7px; border-radius:6px;
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px); font-variant-numeric:tabular-nums;
  border:1px solid rgba(255,255,255,.18); display:flex; align-items:center; gap:4px; white-space:nowrap; color:#fff}
.score i{font-style:normal; font-size:7.5px; letter-spacing:.1em; opacity:.72; font-family:Onest,sans-serif}
.score.hi{color:#FFD84D} .score.na{color:#A99DAD; font-size:11px}
.badge{font-size:8px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; padding:3px 7px;
  border-radius:5px; background:var(--accent); color:var(--on-accent); white-space:nowrap}
.badge.lim{background:linear-gradient(135deg,#E0163A,#7E0C1F); color:#fff}
.badge.free{background:#1B7A4B; color:#fff}
.cfoot{display:flex; flex-direction:column; gap:2px; padding-inline:2px}
.cf1{font-size:12px; font-weight:500; color:var(--fg-2); line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em}
.cf2{font-size:10.5px; color:var(--fg-3); font-variant-numeric:tabular-nums}

<script>
/* ---- failure trap: installed first, so a bad data.js still shows something ---- */
(function(){
  var LSKEY="sofia-screen-v2";
  /* Optional maps live in their own scripts and can go missing if a build step
     misfires. Falling back to {} keeps the app fully usable (no posters, no
     prices) instead of throwing inside a click handler and looking "frozen". */
  ["POSTERS","TMDBART","SHOWART","SHOWALIAS","FILMINFO","PRICES"].forEach(function(n){
    try{ if(typeof window[n]==="undefined" && !(n in globalThis)) window[n]={}; }catch(e){ window[n]={}; }
  });
  function panel(msg){
    var app=document.getElementById("app"); if(!app)return;
    app.innerHTML='<div style="max-width:560px;margin:56px auto;padding:0 20px;font:15px/1.6 system-ui;color:#B6ABBC">'

    var pre=app.querySelector("pre"); if(pre)pre.textContent=String(msg||"");
    var rb=document.getElementById("hardreset");
    if(rb)rb.onclick=function(){try{localStorage.removeItem(LSKEY);}catch(e){}location.reload();};
  }
  window.__sofiaPanel=panel;
  window.addEventListener("error",function(e){
    var app=document.getElementById("app");
    if(app&&app.innerHTML.indexOf("Зареждане на програмата")>-1)
      panel((e&&(e.message||e.error))||"script error");
  });
  var missing=[];
  ["FILMS","SHOWTIMES","CINEMAS","SHOWS","PERFORMANCES","THEATRES","EVENTS",

  if(has("Куклен")||has("Приказка")||has("Работилница"))return"strings";
  if(has("Съвременен танц")||has("Танц")||has("Пърформанс"))return"arcs";
  if(has("Фестивал")||has("Състезание"))return"rays";
  if(has("Трагедия")||(has("Класика")&&has("Драма")&&!has("Фантастика")))return"columns";
  if(has("Експериментален"))return"blocks";
  if(has("Хорър"))return"drip";
  if(has("Аниме"))return"speed";
  if(has("Фантастика")||has("Фентъзи"))return"orbits";
  if(has("Анимация")||has("Детски")||has("Семеен"))return"orbs";
  if(has("Екшън")||has("Трилър")||has("Криминален"))return"shards";
  if(has("Документален")||has("Музикален")||has("Концерт")||has("Концертен"))return"waves";
  if(has("Класика"))return"strip";
  if(has("Комедия"))return"confetti";
  return"shaft";
}
const POSTER_MAP=(typeof POSTERS==="object"&&POSTERS)||{};
const TMDB_IMG="https://image.tmdb.org/t/p/";
/* Poster aliases: an event/show id that mirrors a catalogue film/show reuses
   that title's verified artwork instead of a separately harvested (and fragile)
   poster. Keeps cross-listed titles from mis-allocating a poster.
   Generated, not hand-written: scripts/inject_data.py recomputes SHOWALIAS from
   the catalogue on every refresh (every cinema-scope event whose title matches a
   film we already list), so a new limited screening is covered the day it
   appears rather than when someone remembers. */
const POSTER_ALIAS=(typeof SHOWALIAS==="object"&&SHOWALIAS)||{};
function realPoster(id,size){
  /* ids are prefixed for the hero ("hero-x") and sheet ("sh-x") variants.
     Priority: alias -> embedded base64/override POSTERS -> TMDB film poster ->
     best-effort theatre poster. Any of these keeps posters visible on a
     hosted/live web-app (remote CDN URLs), else generated SVG is used. */
  const s=String(id);
  let base=s.replace(/^(hero|sh)-/,"");
  if(POSTER_ALIAS[base])base=POSTER_ALIAS[base];
  if(POSTER_MAP[base])return POSTER_MAP[base];
  const m=ART[base];
  if(m){
    /* The hero is wide and full-bleed, so the landscape TMDB backdrop (m.b)
       fills it more crisply than an upscaled portrait poster; the sheet and
       grid cards want the portrait poster (m.p). Fall back either way so a
       title with only one of the two still shows real artwork. */
    if(s.startsWith("hero-")&&m.b)return TMDB_IMG+(size||"w780")+m.b;
    if(m.p)return TMDB_IMG+(size||"w500")+m.p;
    if(m.b)return TMDB_IMG+(size||"w780")+m.b;
  }
  if(SHOWIMG[base])return SHOWIMG[base];
  return null;}
function posterArt(id,genres,g){
  const big=/^(hero|sh)-/.test(String(id));
  /* Full-res on the hero and the open sheet — upscaled w780 looked pixelated on
     wide and retina screens; w342 is plenty for the small grid cards and lighter
     to decode while scrolling. */
  const real=realPoster(id,big?"original":"w342");
  /* Generated SVG is always built as the base layer. When a real poster
     exists it is overlaid on top; onerror removes the <img> and the SVG
     beneath becomes visible again (and .p-title reappears via :has). */
  const svg=genPoster(id,genres,g);
  if(real) return svg+`<img class="p-art p-real" src="${esc(real)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`;
  return svg;
}
function genPoster(id,genres,g){
  const r=rng(id),fam=family(genres),W=300,H=450;
  const w=(a)=>`rgba(255,255,255,${a})`, k=(a)=>`rgba(0,0,0,${a})`;
  let p="";
  const R=(n,f)=>{let s="";for(let i=0;i<n;i++)s+=f(i,r());return s;};
  if(fam==="shards")      p=R(6,(i,x)=>`<polygon points="${-40+i*58},0 ${10+i*58},0 ${-70+i*58+x*40},450 ${-120+i*58},450" fill="${w(.04+x*.07)}"/>`);
  else if(fam==="orbits") p=R(6,(i,x)=>`<circle cx="150" cy="${170+x*20}" r="${28+i*36}" fill="none" stroke="${w(.06+ (6-i)*.026)}" stroke-width="${1+ (i<2?1.4:0)}"/>`)
                            +`<rect x="0" y="330" width="300" height="1.5" fill="${w(.22)}"/><circle cx="150" cy="185" r="16" fill="${w(.2)}"/>`;
  else if(fam==="drip")   p=R(9,(i,x)=>`<path d="M${i*34+6},0 v${40+x*130} a11,11 0 0 0 22,0 v-${40+x*130} z" fill="${k(.2+x*.24)}"/>`)
                            +`<circle cx="150" cy="300" r="${90}" fill="${k(.28)}"/>`;
  else if(fam==="speed")  p=R(16,(i,x)=>`<line x1="${-60+i*30}" y1="0" x2="${60+i*30+x*70}" y2="450" stroke="${w(.05+x*.11)}" stroke-width="${1+x*4}"/>`);
  else if(fam==="orbs")   p=R(11,(i,x)=>`<circle cx="${20+x*260}" cy="${30+((i*97)%400)}" r="${10+x*46}" fill="${w(.05+x*.1)}"/>`);
  else if(fam==="waves")  p=R(22,(i,x)=>{const h=40+x*250;return`<rect x="${6+i*13}" y="${225-h/2}" width="6" height="${h}" rx="3" fill="${w(.09+x*.16)}"/>`;});
  else if(fam==="strip")  p=R(2,(i)=>`<rect x="${i?276:0}" y="0" width="24" height="450" fill="${k(.42)}"/>`)
                            +R(16,(i)=>`<rect x="6" y="${6+i*28}" width="12" height="16" rx="2.5" fill="${w(.16)}"/><rect x="282" y="${6+i*28}" width="12" height="16" rx="2.5" fill="${w(.16)}"/>`)
                            +R(14,(i,x)=>`<line x1="150" y1="215" x2="${150+Math.cos(i/14*6.283)*220}" y2="${215+Math.sin(i/14*6.283)*220}" stroke="${w(.05+x*.06)}" stroke-width="1.5"/>`);
  else if(fam==="confetti")p=R(14,(i,x)=>x>.5
                            ?`<circle cx="${18+x*264}" cy="${20+((i*113)%410)}" r="${5+x*16}" fill="${w(.07+x*.1)}"/>`
                            :`<path d="M${10+x*250},${30+((i*151)%390)} a${28+x*30},${28+x*30} 0 0 1 ${50+x*44},0" fill="none" stroke="${w(.1+x*.11)}" stroke-width="${2+x*4}"/>`);
  else if(fam==="columns")p=R(4,(i,x)=>`<rect x="${26+i*68}" y="70" width="34" height="340" fill="${w(.07+x*.05)}"/><rect x="${20+i*68}" y="60" width="46" height="12" fill="${w(.15)}"/>`)
                            +`<rect x="0" y="408" width="300" height="10" fill="${w(.14)}"/>`;
  else if(fam==="blocks") p=R(7,(i,x)=>`<rect x="${x*180}" y="${(i*63)%370}" width="${70+x*140}" height="${50+x*90}" fill="${w(.05+x*.08)}" transform="rotate(${-6+x*12} 150 225)"/>`);
  else if(fam==="strings")p=R(9,(i,x)=>`<line x1="${18+i*33}" y1="0" x2="${18+i*33}" y2="${150+x*180}" stroke="${w(.13)}" stroke-width="1"/><circle cx="${18+i*33}" cy="${150+x*180}" r="${5+x*11}" fill="${w(.14+x*.1)}"/>`);
  else if(fam==="arcs")   p=R(7,(i,x)=>`<path d="M${-30+i*20},450 Q${150+x*120},${120+x*200} ${330-i*24},${20+x*120}" fill="none" stroke="${w(.06+x*.12)}" stroke-width="${1+x*3.5}"/>`);
  else if(fam==="rays")   p=R(18,(i,x)=>`<polygon points="150,225 ${150+Math.cos(i/18*6.283)*300},${225+Math.sin(i/18*6.283)*300} ${150+Math.cos((i+.42)/18*6.283)*300},${225+Math.sin((i+.42)/18*6.283)*300}" fill="${w(.03+x*.07)}"/>`);
  else                    p=`<polygon points="118,0 182,0 232,450 68,450" fill="${w(.1)}"/><polygon points="136,0 164,0 192,450 108,450" fill="${w(.13)}"/>`;
  /* seeded variation so two films of the same genre never look identical */
  const rot=(r()*44-22).toFixed(1), sc=(0.82+r()*0.5).toFixed(2),
        tx=(r()*90-45).toFixed(0), ty=(r()*90-45).toFixed(0),
        ga=(r()*360).toFixed(0);
  const uid="g"+id.replace(/[^a-zA-Z0-9]/g,"");
  return`<svg class="p-art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs><linearGradient id="${uid}" gradientTransform="rotate(${ga} .5 .5)">
      <stop offset="0" stop-color="${esc(g[0])}"/><stop offset="1" stop-color="${esc(g[1])}"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#${uid})"/>
    <g transform="translate(${tx} ${ty}) rotate(${rot} 150 225) scale(${sc})" transform-origin="150 225">${p}</g>
  </svg>`;
}

function genreHits(genres){let n=0;
  S.prefs.genres.forEach(id=>{const g=GENRES.find(x=>x.id===id);if(g&&g.m.some(m=>genres.includes(m)))n++;});
  return n;}
function moodHits(genres){let n=0;const all=[...MOODS.cinema,...MOODS.theatre];
  S.prefs.mood.forEach(id=>{const m=all.find(x=>x.id===id);if(m&&m.m.some(x=>genres.includes(x)))n++;});
  return n;}
const TASTE_BY_ID=Object.fromEntries([...TASTE_FILMS,...TASTE_SHOWS].map(x=>[x.id,x]));
function tasteHits(genres){
  let n=0;
  S.prefs.taste.forEach(tid=>{
    const o=TASTE_BY_ID[tid]||filmById[tid]||showById[tid]; if(!o)return;
    const og=o.genres||[]; og.forEach(x=>{if(genres.includes(x))n++;});});

function withBonus(genres){const w=S.prefs.with;
  if(w==="kids")return genres.some(g=>["Анимация","Семеен","Детски","Куклен","Приказка","Улично"].includes(g))?5:-4;
  if(w==="date")return genres.some(g=>["Романтика","Драма","Комедия","Музикален"].includes(g))?2:0;
  if(w==="friends")return genres.some(g=>["Комедия","Екшън","Хорър","Концерт","Танц","Фестивал"].includes(g))?2:0;
  if(w==="solo")return genres.some(g=>["Драма","Артхаус","Документален","Класика","Експериментален"].includes(g))?2:0;
  return 0;}
function scoreFilm(f,day){
  const rows=filmTimes(f.id,day); if(!rows.length)return -1;
  let s=genreHits(f.genres)*4.5+moodHits(f.genres)*3+tasteHits(f.genres)*2.2+withBonus(f.genres);
  if(rows.some(r=>r[3].some(inWhen)))s+=3;
  {const _im=imdbOf(f);if(_im!=null)s+=(_im-6)*1.5;}
  s+=Math.min(rows.reduce((n,r)=>n+r[3].length,0),12)*0.1;
  if(S.prefs.taste.includes(f.id))s+=6;
  return s;}
function scoreShow(sh,day){
  const p=showPerfs(sh.id,day); if(!p.length)return -1;
  let s=genreHits(sh.genres)*4.5+moodHits(sh.genres)*3+tasteHits(sh.genres)*2.2+withBonus(sh.genres);
  if(p.some(x=>inWhen(x[2])))s+=3;
  if(sh.badge)s+=2;
  if(sh.reviews&&sh.reviews.length>1)s+=1;
  if(S.prefs.taste.includes(sh.id))s+=6;
  return s;}

/* Format a date range including month name; same-month → month at end only.
   fmtDay(iso,false) gives e.g. "ср 7"; fmtDay(iso,true) gives "7 октомври".
   Result: "ср 7 – нд 11 октомври" (same month) or "пн 26 октомври – нд 1 ноември" */
function fmtRange(isoA,isoB){
  const L=t(),dA=dUTC(isoA),dB=dUTC(isoB);
  const mA=dA.getUTCMonth(),mB=dB.getUTCMonth();
  const dowA=L.dows[dA.getUTCDay()],dowB=L.dows[dB.getUTCDay()];
  const mnA=L.months[mA],mnB=L.months[mB];
  if(mA===mB)return`${dowA} ${dA.getUTCDate()} – ${dowB} ${dB.getUTCDate()} ${mnB}`;
  return`${dowA} ${dA.getUTCDate()} ${mnA} – ${dowB} ${dB.getUTCDate()} ${mnB}`;}

/* progressive loading — render the first few rails, stream the rest in on scroll

let RAILS=[],railIdx=0,railObs=null;
const RAIL_FIRST=4,RAIL_MORE=4,RAIL_LEAD=1200;
/* Materialise a deferred rail descriptor into HTML only when it is needed.
   A descriptor is either {html:thunk} (an arbitrary block, e.g. the full grid)
   or {t,s,items,fn} (a rail whose cards are built lazily from its items). */
function matRail(d){ return d.html?d.html():rail(d.t,d.s,d.items.map(d.fn)); }
const chevSVG=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>`;
function secToggleHTML(key,label,count,open){
  return`<button class="sec-toggle" data-sectoggle="${key}" aria-expanded="${open}">
    <span class="sec-toggle-title">${esc(label)}</span>

    <span class="sec-toggle-chev">${chevSVG}</span></button>`;}
function body(){
  const L=t(),day=dayOrAll(),out=[];
  /* Events are shown only if not yet ended (to >= today) and overlapping the
     selected range; "active" = already running, "soon" = starts later. The old
     static e.status is ignored so a finished festival never lingers past its end. */
  const [evS,evE]=rangeBounds();
  const evLive=e=>(e.scope==="both"||e.scope===S.mode)&&e.to>=NOW_DATE&&e.from<=evE&&e.to>=evS;
  const act=EVENTS.filter(e=>evLive(e)&&e.from<=TODAY).sort((a,b)=>a.to.localeCompare(b.to));
  const soon=EVENTS.filter(e=>evLive(e)&&e.from>TODAY).sort((a,b)=>a.from.localeCompare(b.from));
  /* push a rail descriptor only if it has content — emptiness is known from the
     item count, so no card HTML is built for empty or not-yet-visible rails */
  const pushRail=(title,sub,items,fn)=>{ if(items&&items.length) out.push({t:title,s:sub,items,fn}); };
  if(S.mode==="cinema"){
    const vis=visibleFilms();
    /* "За теб днес" = films with a screening still to come TODAY. Decoupled from
       the selected-day filter (scoreFilm returns -1 off the selected day, which
       would wrongly empty the rail on any day but today); the drawer filters
       (venue chain, genre, strand) still apply. Ranked by how many screenings
       remain today, then IMDb. Each card shows only today's remaining times. */
    const today=FILMS.map(f=>{
        let rows=filmTimesToday(f.id);
        if(S.fVenues.length)rows=rows.filter(r=>venueOk(r[1]));
        return{f,rows};}).filter(o=>o.rows.length)
      .filter(o=>{
        if(S.fGenres.length&&!genreHit(o.f.genres))return false;
        if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(o.f,s)))return false;
        return true;})
      .sort((a,b)=>{const na=a.rows.reduce((n,r)=>n+r[3].length,0),nb=b.rows.reduce((n,r)=>n+r[3].length,0);
        return nb-na||((imdbOf(b.f)||0)-(imdbOf(a.f)||0));}).slice(0,14);
    pushRail(L.railToday,fmtDay(NOW_DATE,true),today,x=>filmCard(x.f,false,x.rows));
    /* Event rails hidden when any venue or genre filter is active */
    if(!S.fVenues.length&&!S.fGenres.length){
      pushRail(L.railLimited,S.lang==="bg"?"само сега — после го няма":"on now — then it's gone",act,eventCard);}
    const top=vis.filter(f=>imdbOf(f)!=null).sort((a,b)=>imdbOf(b)-imdbOf(a)).slice(0,12);
    pushRail(L.railTop,"IMDb",top,f=>filmCard(f,day));
    if(!S.fVenues.length&&!S.fGenres.length){
      pushRail(L.railSoon,S.lang==="bg"?"извън тази седмица":"beyond this week",soon,eventCard);}
    /* Section A: По жанр — collapsible, open by default.
       When genre filter active, show only selected genres' rails. */
    const visSet=new Set(vis.map(f=>f.id));
    const genreRails=[];
    genresFor("cinema").forEach(g=>{
      if(S.fGenres.length&&!S.fGenres.includes(g.id))return;
      const fs=vis.filter(f=>f.genres.some(x=>g.m.includes(x)));
      if(fs.length)genreRails.push({t:S.lang==="bg"?g.bg:g.en,s:`${fs.length}`,items:fs,fn:f=>filmCard(f,day)});});
    out.push({html:()=>{
      const inner=genreRails.map(r=>rail(r.t,r.s,r.items.map(r.fn))).join("");
      return secToggleHTML("Genres",L.secByGenre||"По жанр",genreRails.length,S.secGenres)
        +`<div id="sec-Genres-content" class="sec-content"${S.secGenres?"":" hidden"}>${inner}</div>`;
    }});
    /* Section B: По кино — collapsible, closed by default; rails not built when closed.
       When venue filter active, show only selected cinemas' rails. */
    out.push({html:()=>{
      let inner="";
      if(S.secVenues){
        const cinsToShow=S.fVenues.length?CINEMAS.filter(c=>S.fVenues.includes(c.id)):CINEMAS;
        cinsToShow.forEach(c=>{
          if(S.fStrands.length){const arty=S.fStrands.includes("arthouse"),comm=S.fStrands.includes("commercial");
            if(arty&&!comm&&c.kind!=="independent")return;
            if(comm&&!arty&&c.kind==="independent")return;}
          const fs=filmsAtCinema(c.id).filter(f=>visSet.has(f.id));
          /* pass rowsOverride scoped to this cinema so card counts are per-cinema */
          if(fs.length)inner+=rail(cinName(c),c.area,fs.map(f=>{
            const cRows=filmTimes(f.id,day).filter(r=>r[1]===c.id);
            return filmCard(f,day,cRows.length?cRows:undefined);}));
        });
      }
      return secToggleHTML("Venues",L.secByCinema||"По кино",null,S.secVenues)
        +`<div id="sec-Venues-content" class="sec-content"${S.secVenues?"":" hidden"}>${inner}</div>`;
    }});
    out.push({html:()=>`<section class="rail"><div class="sechead"><h2>${esc(L.allTitles)}</h2>
      <span class="sub">${esc(periodDateOnly())}</span>
      <span class="n">${vis.length}</span></div>
      ${vis.length?`<div class="grid">${vis.slice(0,S.limit).map(f=>filmCard(f,day)).join("")}</div>
      ${vis.length>S.limit?`<div style="text-align:center;margin-top:18px">
        <button class="btn sm" data-more>${esc(L.more)} (${vis.length-S.limit})</button></div>`:""}`:emptyState()}</section>`});
  }else{
    const vis=visibleShows();
    const rk=vis.map(s=>({s,v:scoreShow(s,day)})).sort((a,b)=>b.v-a.v).slice(0,14);
    pushRail(L.railToday,periodLabel(),rk,x=>showCard(x.s,day));
    /* Event rails hidden when any venue or genre filter is active */
    if(!S.fVenues.length&&!S.fGenres.length){
      pushRail(L.railLimited,S.lang==="bg"?"само сега — после го няма":"on now — then it's gone",act,eventCard);}
    const prem=vis.filter(s=>s.badge);
    pushRail(L.railPrem,"",prem,s=>showCard(s,day));
    if(!S.fVenues.length&&!S.fGenres.length){
      pushRail(L.railSoon,S.lang==="bg"?"извън тази седмица":"beyond this week",soon,eventCard);}
    const visSet=new Set(vis.map(s=>s.id));
    /* Section A: По жанр — collapsible, open by default.
       When genre filter active, show only selected genres' rails. */
    const genreRails=[];
    genresFor("theatre").forEach(g=>{
      if(S.fGenres.length&&!S.fGenres.includes(g.id))return;
      const ss=vis.filter(s=>s.genres.some(x=>g.m.includes(x)));
      if(ss.length)genreRails.push({t:S.lang==="bg"?g.bg:g.en,s:`${ss.length}`,items:ss,fn:s=>showCard(s,day)});});
    out.push({html:()=>{
      const inner=genreRails.map(r=>rail(r.t,r.s,r.items.map(r.fn))).join("");
      return secToggleHTML("Genres",L.secByGenre||"По жанр",genreRails.length,S.secGenres)
        +`<div id="sec-Genres-content" class="sec-content"${S.secGenres?"":" hidden"}>${inner}</div>`;
    }});
    /* Section B: По театър — closed by default; rails not built when closed.
       Theatre sub-grouping: state/national/municipal first, then independent.
       When venue filter active, show only selected theatres. */
    out.push({html:()=>{
      let inner="";
      if(S.secVenues){
        const STATE_KINDS=["national","state","municipal"];
        const allState=THEATRES.filter(th=>STATE_KINDS.includes(th.kind));
        const allIndie=THEATRES.filter(th=>!STATE_KINDS.includes(th.kind));
        const thFilter=th=>S.fVenues.length?venueOk(th.id):true;
        const stateTheatres=allState.filter(thFilter),indieTheatres=allIndie.filter(thFilter);
        const stateRails=[],indieRails=[];
        stateTheatres.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)stateRails.push({th,ss});});
        indieTheatres.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)indieRails.push({th,ss});});
        if(stateRails.length)inner+=`<div class="sec-subhead">${esc(L.subStateTheatres||"Държавни и общински")}</div>`
          +stateRails.map(({th,ss})=>rail(thName(th),th.area,ss.map(s=>showCard(s,day)))).join("");
        if(indieRails.length)inner+=`<div class="sec-subhead">${esc(L.subIndependent||"Независими")}</div>`
          +indieRails.map(({th,ss})=>rail(thName(th),th.area,ss.map(s=>showCard(s,day)))).join("");
      }
      return secToggleHTML("Venues",L.secByTheatre||"По театър",null,S.secVenues)
        +`<div id="sec-Venues-content" class="sec-content"${S.secVenues?"":" hidden"}>${inner}</div>`;
    }});
    out.push({html:()=>`<section class="rail"><div class="sechead"><h2>${esc(L.allTitles)}</h2>
      <span class="sub">${esc(periodDateOnly())}</span>
      <span class="n">${vis.length}</span></div>
      ${vis.length?`<div class="grid">${vis.slice(0,S.limit).map(s=>showCard(s,day)).join("")}</div>
      ${vis.length>S.limit?`<div style="text-align:center;margin-top:18px">
        <button class="btn sm" data-more>${esc(L.more)} (${vis.length-S.limit})</button></div>`:""}`:emptyState()}</section>`});
  }
  RAILS=out; railIdx=Math.min(RAIL_FIRST,out.length);
  return out.slice(0,railIdx).map(matRail).join("")
    +(railIdx<out.length?`<div id="rail-sentinel" aria-hidden="true"></div>`:"");
}
/* stream deferred category rails in, in batches, ahead of the viewport so the
   scroll never reaches an unbuilt section — building each batch's cards lazily */
function mountProgressive(){
  if(railObs){railObs.disconnect();railObs=null;}
  const sent=document.getElementById("rail-sentinel");
  if(!sent||railIdx>=RAILS.length)return;
  const pump=()=>{
    /* keep appending batches until the sentinel is pushed below the prefetch
       zone (or everything is mounted) — handles batches shorter than a screen */
    let guard=0;
    while(railIdx<RAILS.length && guard++<=RAILS.length){
      if(sent.getBoundingClientRect().top > window.innerHeight+RAIL_LEAD) break;
      const batch=RAILS.slice(railIdx,railIdx+RAIL_MORE).map(matRail).join("");
      railIdx+=RAIL_MORE;
      sent.insertAdjacentHTML("beforebegin",batch);
    }
    if(railIdx>=RAILS.length && railObs){railObs.disconnect();railObs=null;sent.remove();}
  };
  railObs=new IntersectionObserver(function(entries){
    if(entries.some(en=>en.isIntersecting))pump();
  },{rootMargin:RAIL_LEAD+"px 0px"});
  railObs.observe(sent);
}

/* Festivals / one-off screenings that unambiguously belong to one catalogued

const EVENT_VENUE={

function buyBox(vid,date,isCinema,specificUrl){
  const L=t(),b=BOOKING[vid]; if(!b)return"";

/* task 7 — single scrollable month with ‹ › arrows + from–to range highlight */
function calView(){
  const L=t(),has=datesWith();
  const idx=Math.max(0,Math.min(S.calMonth||0,MONTHS.length-1));
  const m=MONTHS[idx];
  const fd=dUTC(m+"-01");
  const offset=(fd.getUTCDay()+6)%7;
  const dim=new Date(Date.UTC(fd.getUTCFullYear(),fd.getUTCMonth()+1,0)).getUTCDate();
  const lo=S.rFrom, hi=S.rTo, isRange=S.day==="range";
  let cells="";
  for(let i=0;i<offset;i++)cells+=`<button disabled></button>`;
  for(let d=1;d<=dim;d++){
    const iso=`${m}-${String(d).padStart(2,"0")}`;
    const ok=iso>=TODAY&&iso<=LASTDAY;
    let cls=has.has(iso)?"has":"";
    let pressed=false;
    if(isRange&&lo){
      const top=hi||lo;
      if(iso>lo&&iso<top)cls+=" inrange";
      if(iso===lo){pressed=true;cls+=" rstart";if(hi&&hi!==lo)cls+=" inrange";}
      if(iso===top&&top!==lo){pressed=true;cls+=" rend inrange";}
    }else{pressed=S.day===iso;}
    cells+=`<button ${ok?"":"disabled"} class="${cls.trim()}" data-pick="${iso}" aria-pressed="${pressed}">${d}</button>`;
  }
  const dows=S.lang==="bg"?["пн","вт","ср","чт","пт","сб","нд"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const hint=isRange
    ? (lo&&hi?`${fmtDay(lo,true)} – ${fmtDay(hi,true)}`
       : lo?(S.lang==="bg"?"Изберете крайна дата":"Pick an end date")
       : (S.lang==="bg"?"Изберете начална дата":"Pick a start date"))
    : (S.lang==="bg"?"Докоснете начало и край за период":"Tap a start and an end for a range");
  return `<div class="calnav">
      <button class="calarrow" data-calstep="-1" ${idx>0?"":"disabled"} aria-label="prev">‹</button>
      <div class="calmon">${esc(L.months[Number(m.slice(5,7))-1])} ${m.slice(0,4)}</div>
      <button class="calarrow" data-calstep="1" ${idx<MONTHS.length-1?"":"disabled"} aria-label="next">›</button></div>
    <div class="caldow">${dows.map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal">${cells}</div>
    <div class="calhint">${esc(hint)}</div>`;
}

  const activeFilterCount=S.fGenres.length+S.fVenues.length+S.fStrands.length+(S.day!=="week"?1:0);

    <span>${esc(L.fabFilters||L.filters)}</span>
    ${activeFilterCount?`<span class="fab-badge">${activeFilterCount}</span>`:""}</button>`:"";
  document.getElementById("app").innerHTML=`
  <header class="bar"><div class="wrap">

  /* mobile search open: focus the mobile input (id="q-m"); desktop: focus id="q" */
  const qiM=document.getElementById("q-m");
  const qiD=document.getElementById("q");

/* Re-render while keeping the filter drawer where the user left it. The drawer
   lives inside #app, so a plain render() rebuilds it at scrollTop 0 and the list
   jumps to the top on every chip tap — which made multi-selecting genres/venues
   feel broken. Capture and restore the drawer's scroll position across render. */
function renderKeepDrawer(){
  const d=document.querySelector(".drawer");
  const top=d?d.scrollTop:0;
  render();
  const d2=document.querySelector(".drawer");
  if(d2)d2.scrollTop=top;
}

/* ===================== sheet open + animation ===================== */
let sheetOpen=false;
/* which detail entity the open sheet shows — {kind:"film"|"show"|"event",id},
   so the sheet can be regenerated in place when the language is toggled. */
let curSheet=null;
function sheetHTMLFor(c){
  if(!c)return null;
  if(c.kind==="film"&&filmById[c.id])return sheetFilm(filmById[c.id]);
  if(c.kind==="show"&&showById[c.id])return sheetShow(showById[c.id]);
  if(c.kind==="event"){const ev=EVENTS.find(x=>x.id===c.id);if(ev)return sheetEvent(ev);}
  return null;
}
/* Post-render decoration shared by openSheet and the in-place re-render: add the
   back bar + grab handle + swipe-to-close, and collapse read-more toggles whose
   text does not actually overflow. */
function decorateSheet(s){
  const sheet=s.querySelector(".sheet");
  if(sheet&&!sheet.querySelector(".sbar")){
    const bar=document.createElement("div");bar.className="sbar";
    bar.innerHTML=`<button class="sback" data-close>&#8249;&nbsp;${esc(t().back)}</button>`;
    const grab=document.createElement("div");grab.className="sgrab";
    sheet.insertBefore(bar,sheet.firstChild);
    sheet.insertBefore(grab,sheet.firstChild);
    swipeToClose(sheet);
  }
  s.querySelectorAll(".synwrap").forEach(w=>{
    const body=w.querySelector(".synbody"),btn=w.querySelector(".readmore");
    if(body&&btn&&body.scrollHeight<=body.clientHeight+2){btn.style.display="none";w.classList.remove("clamp");}
  });
}
function openSheet(html,fromEl){
  let s=document.getElementById("scrim");
  if(!s){s=document.createElement("div");s.id="scrim";s.className="scrim";document.body.appendChild(s);}
  s.innerHTML=html;s.hidden=false;document.body.style.overflow="hidden";
  /* a detail view must always have a visible way out: the back bar is the
     reliable one, history and swipe are conveniences on top of it */
  decorateSheet(s);
  if(!sheetOpen){try{history.pushState({ss:"sheet"},"");}catch(e){}}
  sheetOpen=true;
  animateOpen(s,fromEl);
}
/* Regenerate the open sheet's contents in the current language without the
   open animation or a new history entry — used by the language toggle so an
   open card flips language (synopsis, weekday, every label) immediately. */
function rerenderOpenSheet(){
  if(!sheetOpen||!curSheet)return;
  const s=document.getElementById("scrim"),html=sheetHTMLFor(curSheet);
  if(s&&html){s.innerHTML=html;decorateSheet(s);}
}
function closeSheet(fromPop){
  const s=document.getElementById("scrim");
  if(s){s.hidden=true;s.innerHTML="";}
  document.body.style.overflow="";curSheet=null;
  const was=sheetOpen; sheetOpen=false;
  if(was&&!fromPop){try{history.back();}catch(e){}}
}
window.addEventListener("popstate",()=>{
  if(sheetOpen){closeSheet(true);return;}
});
/* deep links: #film=id / #show=id / #event=id open the matching detail sheet,
   so a shared URL lands directly on that title */
function openFromHash(){
  const m=/^#(film|show|event)=(.+)$/.exec(location.hash||"");
  if(!m)return false;
  const kind=m[1],id=decodeURIComponent(m[2]);
  let html=null;
  if(kind==="film"&&filmById[id])html=sheetFilm(filmById[id]);
  else if(kind==="show"&&showById[id])html=sheetShow(showById[id]);
  else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);if(ev)html=sheetEvent(ev);}
  if(html){curSheet={kind,id};openSheet(html,null);return true;}
  return false;
}
function shareItem(kind,id,title){
  const url=location.origin+location.pathname+location.search+"#"+kind+"="+encodeURIComponent(id);
  try{history.replaceState(history.state,"",url);}catch(e){}
  const data={title:"Sofia Gleda — "+(title||""),text:title||"",url:url};
  if(navigator.share){navigator.share(data).catch(()=>{});return;}
  const done=()=>toast(S.lang==="bg"?"Копиран линк":"Link copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,()=>toast(url));}
  else toast(url);
}
function toast(msg){
  let el=document.getElementById("sg-toast");
  if(!el){el=document.createElement("div");el.id="sg-toast";el.className="toast";document.body.appendChild(el);}
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200);
}
window.addEventListener("hashchange",()=>{ if(!sheetOpen)openFromHash(); });
function swipeToClose(sheet){
  let y0=null;
  sheet.addEventListener("touchstart",e=>{y0=sheet.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
  sheet.addEventListener("touchmove",e=>{
    if(y0==null)return;
    if(e.touches[0].clientY-y0>90){y0=null;closeSheet();}},{passive:true});
  sheet.addEventListener("touchend",()=>{y0=null;},{passive:true});
}
function animateOpen(scrim,fromEl){
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sheet=scrim.querySelector(".sheet"); if(!sheet)return;
  if(reduce)return;
  scrim.animate([{opacity:0},{opacity:1}],{duration:200,easing:"ease-out"});
  const poster=fromEl&&fromEl.querySelector(".poster");
  const shero=sheet.querySelector(".shero");
  /* mode reveal: curtains for theatre, projector flare for cinema */
  const rev=document.createElement("div");rev.className="reveal";
  if(S.mode==="theatre"){
    rev.innerHTML='<div class="curtain l"></div><div class="curtain r"></div>';
    document.body.appendChild(rev);
    const[l,r]=rev.querySelectorAll(".curtain");
    const opt={duration:620,easing:"cubic-bezier(.66,0,.34,1)"};
    l.animate([{transform:"translateX(-100%)"},{transform:"translateX(0)",offset:.34},{transform:"translateX(-100%)"}],opt);
    r.animate([{transform:"translateX(100%)"},{transform:"translateX(0)",offset:.34},{transform:"translateX(100%)"}],opt)
      .onfinish=()=>rev.remove();
  }else{
    /* cinema: a zoom-lens — the frame focuses in on the poster, a lens ring
       racks open from the poster centre and blooms outward, then clears */
    const rect=(poster||sheet).getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const dim=document.createElement("div");dim.className="cine-dim";
    dim.style.setProperty("--fx",`${(cx/innerWidth*100).toFixed(1)}%`);
    dim.style.setProperty("--fy",`${(cy/innerHeight*100).toFixed(1)}%`);
    const lens=document.createElement("div");lens.className="zlens";
    lens.style.cssText=`left:${cx}px;top:${cy}px`;
    const ring=document.createElement("div");ring.className="zring";
    ring.style.cssText=`left:${cx}px;top:${cy}px`;
    rev.appendChild(dim);rev.appendChild(lens);rev.appendChild(ring);document.body.appendChild(rev);
    dim.animate([{opacity:0},{opacity:.92,offset:.28},{opacity:0}],
      {duration:580,easing:"ease-out"});
    lens.animate([
      {transform:"translate(-50%,-50%) scale(.18)",opacity:0},
      {transform:"translate(-50%,-50%) scale(1)",opacity:.95,offset:.38},
      {transform:"translate(-50%,-50%) scale(7)",opacity:0}
    ],{duration:640,easing:"cubic-bezier(.16,1,.3,1)"});
    ring.animate([
      {transform:"translate(-50%,-50%) scale(.4)",opacity:.9},
      {transform:"translate(-50%,-50%) scale(9)",opacity:0}
    ],{duration:640,easing:"cubic-bezier(.16,1,.3,1)"}).onfinish=()=>rev.remove();
  }
  /* poster flies into the sheet header */
  if(poster&&shero){
    const from=poster.getBoundingClientRect(),to=shero.getBoundingClientRect();
    /* only fly when both rects have laid out — otherwise a zero/NaN destination
       makes the scale factor blow up and the clone shoots off-screen */
    if(from.width&&from.height&&to.width&&to.height){
      const fly=poster.cloneNode(true);fly.className="flyer";
      /* top-left transform-origin so translate+scale map the poster's corner
         exactly onto the header box — with the default centre origin a large
         real-poster scale lands the clone far outside the sheet */
      fly.style.cssText=`left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;transform-origin:0 0`;
      document.body.appendChild(fly);
      const sx=(to.width/from.width).toFixed(4),sy=(to.height/from.height).toFixed(4);
      fly.animate([
        {transform:"translate(0,0) scale(1,1)",opacity:1},
        {transform:`translate(${(to.left-from.left).toFixed(1)}px,${(to.top-from.top).toFixed(1)}px) scale(${sx},${sy})`,opacity:0}
      ],{duration:480,easing:"cubic-bezier(.22,1,.36,1)"}).onfinish=()=>fly.remove();
    }
  }
  sheet.animate([{opacity:0,transform:"translateY(22px) scale(.97)"},{opacity:1,transform:"none"}],
    {duration:420,delay:120,easing:"cubic-bezier(.22,1,.36,1)",fill:"backwards"});
}

/* ===================== events ===================== */
document.addEventListener("click",e=>{
  const q=sel=>e.target.closest(sel);
  if(q("[data-close]")||e.target.id==="scrim"){_sheetShowAllCinemas=false;closeSheet();return;}
  if(q(".time")||q(".buylink"))return;            /* let real links through */

  const rm=q("[data-readmore]");
  if(rm){const w=rm.closest(".synwrap");if(w){const on=w.classList.toggle("clamp");
    rm.textContent=on?rm.dataset.moreLabel:rm.dataset.lessLabel;}return;}
  const shr=q("[data-share]");
  if(shr){const[kind,...rest]=shr.dataset.share.split(":");const id=rest.join(":");
    let title="";
    if(kind==="film"&&filmById[id])title=filmTitle(filmById[id]);
    else if(kind==="show"&&showById[id])title=showById[id].title;
    else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);title=ev?(S.lang==="bg"?ev.title:ev.titleEn):"";}
    shareItem(kind,id,title);return;}

  if(q("[data-home]")){S.q="";S.qFocus=false;S.searchOpen=false;S.fGenres=[];S.fVenues=[];S.fStrands=[];
    S.day="week";S.rFrom=S.rTo=null;S.calMonth=null;S.limit=30;S.drawer=false;
    if(location.hash)history.replaceState(null,"",location.pathname+location.search);
    save();render();window.scrollTo({top:0,behavior:"smooth"});return;}

  const sw=q("[data-switch]");
  if(sw){S.mode=sw.dataset.switch;S.fGenres=[];S.fVenues=[];S.fStrands=[];S.limit=30;save();render();window.scrollTo({top:0});return;}
  if(q("[data-more]")){S.limit+=30;render();return;}
  if(q("[data-drawer]")){S.drawer=true;S.qFocus=false;render();return;}
  if(q("[data-dclose]")){S.drawer=false;render();return;}
  const rg=q("[data-range]"); if(rg){S.day=rg.dataset.range;S.rFrom=S.rTo=null;S.limit=30;render();return;}
  const cstep=q("[data-calstep]"); if(cstep&&!cstep.disabled){
    S.calMonth=Math.max(0,Math.min((S.calMonth||0)+Number(cstep.dataset.calstep),MONTHS.length-1));render();return;}
  const pk=q("[data-pick]"); if(pk&&!pk.disabled){
    const iso=pk.dataset.pick; S.limit=30;
    /* first tap starts a range, second tap ends it (swap if reversed),
       a tap after a complete range starts fresh */
    if(S.day!=="range"||!S.rFrom||S.rTo){S.day="range";S.rFrom=iso;S.rTo=null;}
    else if(iso<S.rFrom){S.rTo=S.rFrom;S.rFrom=iso;}
    else{S.rTo=iso;}
    render();return;}
  const st=q("[data-strand]"); if(st){const v=st.dataset.strand;S.fStrands=v?toggleArr(S.fStrands,v):[];S.qFocus=false;S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  if(q("[data-search-open]")){S.searchOpen=true;S.qFocus=false;render();return;}
  if(q("[data-qclear-m]")){S.q="";S.qFocus=false;S.searchOpen=false;render();return;}
  if(q("[data-qclear]")){S.q="";S.qFocus=false;render();return;}
  const d=q("[data-day]"); if(d){S.day=d.dataset.day;render();return;}
  const gf=q("[data-genre]"); if(gf){const v=gf.dataset.genre;S.fGenres=v?toggleArr(S.fGenres,v):[];S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  const vf=q("[data-venue]"); if(vf){const v=vf.dataset.venue;S.fVenues=v?toggleArr(S.fVenues,v):[];S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  if(q("[data-clearf]")){S.fGenres=[];S.fVenues=[];S.fStrands=[];S.day="week";S.rFrom=S.rTo=null;render();return;}
  if(q("[data-lang]")){S.lang=S.lang==="bg"?"en":"bg";save();render();rerenderOpenSheet();return;}
  /* collapsible section toggle — keep the header button at the same viewport position */
  const st2=q("[data-sectoggle]");
  if(st2){
    const key=st2.dataset.sectoggle;
    const hdrTop=st2.getBoundingClientRect().top;
    if(key==="Genres")S.secGenres=!S.secGenres;
    else if(key==="Venues")S.secVenues=!S.secVenues;
    /* materialise the toggled section before restoring scroll */
    render();
    /* after render, scroll so the toggled header stays at the same viewport y */
    const newHdr=document.querySelector(`[data-sectoggle="${key}"]`);
    if(newHdr){const delta=newHdr.getBoundingClientRect().top-hdrTop;window.scrollBy({top:delta,behavior:"instant"});}
    return;}

  const sc=q("[data-scroll]");
  if(sc){const tr=sc.parentElement.querySelector(".rtrack");
    tr.scrollBy({left:Number(sc.dataset.scroll)*tr.clientWidth*.82,behavior:"smooth"});return;}

  if(q("[data-sheetshowallcin]")){_sheetShowAllCinemas=true;
    const shBody=document.querySelector(".sheet .sbody");
    if(shBody&&curSheet&&curSheet.kind==="film"&&filmById[curSheet.id]){
      const newSheet=document.createElement("div");newSheet.innerHTML=sheetFilm(filmById[curSheet.id]);
      const newSec=newSheet.querySelector(".sec:last-child");
      const oldSec=shBody.querySelector(".sec:last-child");
      if(oldSec&&newSec)oldSec.replaceWith(newSec);}return;}
  const fc=q("[data-film]"); if(fc){_sheetShowAllCinemas=false;curSheet={kind:"film",id:fc.dataset.film};openSheet(sheetFilm(filmById[fc.dataset.film]),fc);return;}
  const shc=q("[data-show]"); if(shc){curSheet={kind:"show",id:shc.dataset.show};openSheet(sheetShow(showById[shc.dataset.show]),shc);return;}
  const ec=q("[data-event]"); if(ec){curSheet={kind:"event",id:ec.dataset.event};openSheet(sheetEvent(EVENTS.find(x=>x.id===ec.dataset.event)),ec);return;}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(document.getElementById("scrim")&&!document.getElementById("scrim").hidden){closeSheet();return;}
  if(S.drawer){S.drawer=false;render();return;}
  if(S.searchOpen){S.searchOpen=false;render();}
});
/* live search */
let qTimer=null;
document.addEventListener("input",e=>{
  if(e.target.id!=="q"&&e.target.id!=="q-m")return;
  S.q=e.target.value; S.qFocus=true;
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>render(),160);
});

function fatal(e){
  const msg=(e&&(e.message||e))+"";
  if(window.__sofiaPanel){window.__sofiaPanel(msg);return;}
  const app=document.getElementById("app");
  if(!app)return;
  app.innerHTML=`<div style="max-width:560px;margin:56px auto;padding:0 20px;font:15px/1.6 system-ui;color:#B6ABBC">
    <div style="font:700 13px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:#E0163A;margin-bottom:14px">Sofia Gleda</div>
    <h1 style="font:600 20px/1.3 system-ui;color:#F4EFF6;margin:0 0 10px">Приложението не можа да се зареди</h1>
    <p style="margin:0 0 16px">Най-честата причина са запазени стари настройки. Изчистването им решава проблема и
       зарежда програмата наново.</p>
    <button id="hardreset" style="padding:11px 20px;border-radius:10px;background:#E0163A;color:#fff;border:0;
      font:600 14px system-ui;cursor:pointer">Изчисти и опитай пак</button>
    <details style="margin-top:22px"><summary style="cursor:pointer;font-size:13px">Техническа подробност</summary>
      <pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#7E7386;margin-top:8px">${
        String(msg).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</pre></details>
  </div>`;
  const rb=document.getElementById("hardreset");
  if(rb)rb.onclick=()=>{try{localStorage.removeItem(LS);}catch(e){}location.reload();};
}
/* Part 0b: re-render when the viewport crosses 760 px (mobile ↔ desktop header switch).
   Keep any open drawer/sheet alive; just rebuild the header HTML. */
try{
  const mqMob=window.matchMedia("(max-width:760px)");
  const onMqChange=()=>{ if(!sheetOpen) render(); };
  if(mqMob.addEventListener) mqMob.addEventListener("change",onMqChange);
  else if(mqMob.addListener) mqMob.addListener(onMqChange);
}catch(e){}
function boot(){ render(); }
const origRender=render;
render=function(){
  try{ origRender();mountProgressive(); }
  catch(e){ fatal(e); }
};
try{ boot(); openFromHash(); }catch(e){ fatal(e); }
window.addEventListener("error",e=>{
  const app=document.getElementById("app");
  if(app&&app.innerHTML.indexOf("Зареждане на програмата")>-1) fatal(e.error||e.message);
});
