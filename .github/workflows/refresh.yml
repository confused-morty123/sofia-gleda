# Sofia Gleda — daily data refresh.
#
# Runs once a day (and whenever you press the manual button), scrapes the
# latest programmes and posters, rebuilds index.html, and commits the result
# back. Because GitHub Pages redeploys automatically on every push to the main
# branch, the live site updates itself with no further action from you.
#
# The only thing you must set up once: a repository secret named TMDB_TOKEN
# (see SETUP.md, step 6). An optional OMDB_TOKEN secret adds genuine IMDb
# ratings; without it, ratings are inherited from the previous run. Everything
# else is automatic.

name: Daily refresh

on:
  schedule:
    # 03:17 UTC daily  ==  06:17 in Sofia (summer EEST +03:00) / 05:17 (winter EET +02:00).
    # GitHub may start scheduled runs a few minutes late under load — that is fine.
    - cron: "17 3 * * *"
  workflow_dispatch: {}          # adds a "Run workflow" button on the Actions tab

# Allow the workflow to commit the refreshed files back to the repository.
permissions:
  contents: write

# Prevent two refreshes from running at the same time.  If a new run starts
# while one is already in progress, the new run waits rather than cancels,
# so no refresh is silently dropped.
concurrency:
  group: sofia-gleda-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the headless browser for the publish gate
        # verify_build.py opens the rebuilt page in real Chromium and clicks a
        # card before anything is allowed to go live. Without the browser binary
        # that gate silently downgrades to a "note" and stops gating — so install
        # it here. --with-deps pulls the system libraries Chromium needs on CI.
        run: python3 -m playwright install --with-deps chromium

      - name: Refresh programmes and posters
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          # Optional: genuine IMDb ratings via OMDb. Absent => ratings inherited
          # from the previous run (never fabricated). See SETUP.md.
          OMDB_TOKEN: ${{ secrets.OMDB_TOKEN }}
          # Optional: DeepL translation key for auto-translating Bulgarian-only
          # synopses and titles. Absent => translations step skips cleanly,
          # previous translations.json cache is kept. See SETUP.md.
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python3 scripts/refresh_all.py

      - name: Print health report
        # Print health.json (written by the pipeline) into the job summary so
        # warnings and errors appear in the Actions UI, and emit ::warning:: /
        # ::error:: annotations so GitHub highlights them on the run page.
        if: always()
        run: |
          if [ ! -f health.json ]; then
            echo "health.json not present — pipeline did not write a health report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## Health report" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat health.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Emit annotations for each entry
          python3 - <<'PYEOF'
          import json, sys
          try:
              items = json.load(open("health.json"))
          except Exception as e:
              print(f"::warning::health.json could not be parsed: {e}", flush=True)
              sys.exit(0)
          for item in items:
              level = str(item.get("level", "warning")).lower()
              venue = item.get("venue", "")
              msg = item.get("message", "")
              annotation = f"::{level}::" + (f"[{venue}] " if venue else "") + msg
              print(annotation, flush=True)
          PYEOF

      - name: Keep the translation cache when the refresh is not published
        # A run that fails the publish gate commits nothing, but the DeepL
        # translations it already paid for are only a cache (translations.json),
        # not site content: keep them, so the next run doesn't spend the monthly
        # quota on the same texts again. index.html stays the last good build.
        if: failure()
        run: |
          git config user.name  "Sofia Gleda bot"
          git config user.email "actions@github.com"
          # Push, rebasing onto anything that landed on main during the run (a
          # release, or GitHub's own CNAME commit when the custom domain is set).
          # These data files are the bot's own; a real conflict aborts the
          # rebase and fails the step rather than overwriting someone's commit.
          push_with_rebase() {
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then return 0; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $attempt failed; retrying"
              sleep 10
            done
            return 1
          }
          [ -f translations.json ] && git add translations.json
          if git diff --cached --quiet; then
            echo "No new translations to keep."
          else
            git commit -m "Keep the translation cache from a refresh that was not published: $(date -u +'%Y-%m-%d')"
            push_with_rebase
          fi

      - name: Commit the refreshed data
        run: |
          git config user.name  "Sofia Gleda bot"
          git config user.email "actions@github.com"
          # Push, rebasing onto anything that landed on main during the run (a
          # release, or GitHub's own CNAME commit when the custom domain is set).
          # These data files are the bot's own; a real conflict aborts the
          # rebase and fails the step rather than overwriting someone's commit.
          push_with_rebase() {
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then return 0; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $attempt failed; retrying"
              sleep 10
            done
            return 1
          }
          # Stage each output only if it exists. A tolerated missing file (e.g.
          # tmdb_films.json when no token is set, or a source that stayed down)
          # must not abort the commit and discard the data that DID refresh.
          # NOTE: changes.json is deliberately absent — it is in .gitignore, and
          # "git add" of an ignored, untracked path exits non-zero, which under
          # the shell's set -e aborted this whole step and discarded the refresh.
          for f in index.html tmdb_films.json theatre_posters.json cinema_films.json theatre_shows.json film_links_posters.json film_info.json build_report.json translations.json official_state.json health.json events.json icons/apple-touch-icon.png; do
            [ -f "$f" ] && git add "$f"
          done
          # Stage per-title share pages and the site share-preview image.
          [ -d film ] && git add film/
          [ -d show ] && git add show/
          [ -d event ] && git add event/
          [ -f share/share-preview.jpg ] && git add share/share-preview.jpg
          # Stage any new or updated poster images (re-hosted from venue websites).
          # This is safe: posters/ is append-only in practice, and the gitignore
          # never excludes it, so only genuinely new files are added here.
          [ -d posters ] && git add posters/
          if git diff --cached --quiet; then
            echo "No changes this run — nothing to commit."
          else
            git commit -m "Scheduled refresh: $(date -u +'%Y-%m-%d')"
            push_with_rebase
          fi
