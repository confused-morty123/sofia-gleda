# Sofia Gleda — daily data refresh.
#
# Runs once a night at about 03:05 Sofia time (and whenever you press the manual
# button), scrapes the latest programmes and posters, rebuilds index.html, and
# commits the result back. Because GitHub Pages redeploys automatically on every
# push to the main branch, the live site updates itself with no further action from you.
#
# The only thing you must set up once: a repository secret named TMDB_TOKEN
# (see SETUP.md, step 6). An optional OMDB_TOKEN secret adds genuine IMDb
# ratings; without it, ratings are inherited from the previous run. Everything
# else is automatic.

name: Daily refresh

on:
  schedule:
    # The refresh should run between 03:00 and 04:00 Sofia time. GitHub starts
    # this repository's scheduled runs hours late (October 2026: a 03:05 cron
    # started at 08:00-09:00 Sofia, a 5-6 h delay, growing; GitHub only promises
    # "may be delayed under high load", and the start of every hour is the
    # busiest). So the workflow fires five times, from the evening before, and the
    # "gate" job below (scripts/schedule_gate.py) decides what each firing does:
    #   - before 03:05 Sofia (from 21:15 on): sleep until 03:05, then refresh;
    #   - from 03:05 to 21:15: refresh now, late, unless today's refresh is done;
    #   - only one refresh per night: a firing stops when an earlier one is already
    #     waiting, and the refresh job checks again that today's refresh is not
    #     done (a bot "Scheduled refresh:" commit on main after 03:00 Sofia).
    # With these five firings the refresh starts at 03:05 whenever GitHub's delay
    # is under 10 h 45 min, and before 04:00 up to 11 h 30 min (scripts/test_schedule.py).
    # The commit message keeps the UTC date: at 03:05 Sofia that is the same day.
    # Each cron is read in Europe/Sofia (the `timezone` key, GitHub changelog
    # 2026-03-19), and the gate itself works in Sofia time (zoneinfo), so summer
    # and winter time and both clock-change nights are handled. Minutes 17 and 47
    # stay off the top of the hour.
    - cron: "17 16 * * *"
      timezone: "Europe/Sofia"
    - cron: "17 18 * * *"
      timezone: "Europe/Sofia"
    - cron: "17 20 * * *"
      timezone: "Europe/Sofia"
    - cron: "17 22 * * *"
      timezone: "Europe/Sofia"
    - cron: "47 0 * * *"
      timezone: "Europe/Sofia"
  workflow_dispatch: {}          # adds a "Run workflow" button; a manual run refreshes at once

# Least privilege: the workflow token can only read by default; the gate job also
# reads the list of this workflow's runs, and the one job that commits the
# refreshed files back gets contents: write (below), nothing else.
permissions:
  contents: read

jobs:
  # Decides whether this firing refreshes, and first sleeps until 03:05 Sofia when
  # it came early (see the schedule above). It holds no lock, so a manual run is
  # never stuck behind a sleeping one.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub's maximum; the gate sleeps at most 350 min
    permissions:
      contents: read
      actions: read               # to see whether an earlier firing is already waiting
    outputs:
      run: ${{ steps.gate.outputs.run }}
      day: ${{ steps.gate.outputs.day }}
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag can be moved to
      # other code; a SHA cannot). To update: take the release's commit from
      # `git ls-remote --tags https://github.com/actions/<name>` and change both the
      # SHA and the version comment.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Wait for 03:05 Sofia, or decide that this firing is not needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/schedule_gate.py --event "$GITHUB_EVENT_NAME"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # This job pushes the refreshed data to main, so it alone may write contents.
    permissions:
      contents: write
    # Prevent two refreshes from running at the same time. If a refresh is already
    # running, the new one waits rather than cancels, so no refresh is silently
    # dropped; when it starts, it checks again (below) that it is still needed.
    concurrency:
      group: sofia-gleda-refresh
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # A scheduled run may start hours after its event: build on main as it
          # is now, not on the commit main was at when GitHub queued the event.
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}

      # Only "is the night the gate chose already refreshed?": never the clock window,
      # so a refresh the gate decided at 21:14 is not dropped at 21:15, and a re-run
      # of a failed refresh (GITHUB_RUN_ATTEMPT > 1) refreshes.
      - name: Check that the night's refresh is still needed
        id: recheck
        env:
          GATE_DAY: ${{ needs.gate.outputs.day }}
        run: python3 scripts/schedule_gate.py --event "$GITHUB_EVENT_NAME" --no-wait --day "$GATE_DAY"

      - name: Set up Python
        if: steps.recheck.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.recheck.outputs.run == 'true'
        # Exact versions (requirements.txt pins every package): a new release of a
        # dependency never reaches the pipeline until it is pinned on purpose.
        run: pip install -r requirements.txt

      - name: Install the headless browser for the publish gate
        if: steps.recheck.outputs.run == 'true'
        # verify_build.py opens the rebuilt page in real Chromium and clicks a
        # card before anything is allowed to go live. Without the browser binary
        # that gate silently downgrades to a "note" and stops gating — so install
        # it here. --with-deps pulls the system libraries Chromium needs on CI.
        run: python3 -m playwright install --with-deps chromium

      - name: Refresh programmes and posters
        if: steps.recheck.outputs.run == 'true'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          # Optional: genuine IMDb ratings via OMDb. Absent => ratings inherited
          # from the previous run (never fabricated). See SETUP.md.
          OMDB_TOKEN: ${{ secrets.OMDB_TOKEN }}
          # Optional: DeepL translation key for auto-translating Bulgarian-only
          # synopses and titles. Absent => translations step skips cleanly,
          # previous translations.json cache is kept. See SETUP.md.
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python3 scripts/refresh_all.py

      - name: Print health report
        # Print health.json (written by the pipeline) into the job summary so
        # warnings and errors appear in the Actions UI, and emit ::warning:: /
        # ::error:: annotations so GitHub highlights them on the run page.
        if: always() && steps.recheck.outputs.run == 'true'
        run: |
          if [ ! -f health.json ]; then
            echo "health.json not present — pipeline did not write a health report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The messages quote other sites (an error text, a URL), so they are data:
          # the summary's code fence is longer than any run of backticks inside it,
          # and each annotation's level is one of GitHub's three and its text is
          # escaped (%, CR, LF), so no message can start a workflow command of its own.
          python3 - <<'PYEOF'
          import json, os, re, sys
          raw = open("health.json", encoding="utf-8").read()
          fence = "`" * max(3, 1 + max((len(m) for m in re.findall(r"`+", raw)), default=0))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"## Health report\n{fence}json\n{raw.rstrip()}\n{fence}\n")
          try:
              items = json.loads(raw)
          except Exception as e:
              print(f"::warning::health.json could not be parsed: {type(e).__name__}", flush=True)
              sys.exit(0)
          LEVELS = {"error": "error", "warning": "warning", "warn": "warning", "notice": "notice", "ok": "notice"}
          def data(s):
              return str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for item in items if isinstance(items, list) else []:
              if not isinstance(item, dict):
                  continue
              level = LEVELS.get(str(item.get("level", "warning")).lower(), "warning")
              venue = item.get("venue", "")
              msg = item.get("message", "")
              print(f"::{level}::" + data((f"[{venue}] " if venue else "") + str(msg)), flush=True)
          # Theatre posters: the shows on stage without one, per theatre (verify_build
          # check 5c2, kept by refresh_all.py in build_report.json["posters"]). Ids are
          # slugs, so the list cannot carry markup or a workflow command.
          try:
              cov = json.load(open("build_report.json", encoding="utf-8")).get("posters") or {}
          except Exception:
              cov = {}
          if cov.get("upcoming"):
              lines = [f"## Theatre posters\n{cov.get('with')}/{cov.get('upcoming')} upcoming shows have a poster\n"]
              for th, t in sorted((cov.get("by_theatre") or {}).items()):
                  miss = [m for m in t.get("missing") or [] if re.fullmatch(r"[a-z0-9-]+", str(m))]
                  if miss:
                      lines.append(f"- {th}: {', '.join(miss)}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          PYEOF

      - name: Keep the translation cache when the refresh is not published
        # A run that fails the publish gate commits nothing, but the DeepL
        # translations it already paid for are only a cache (translations.json),
        # not site content: keep them, so the next run doesn't spend the monthly
        # quota on the same texts again. index.html stays the last good build.
        if: failure() && steps.recheck.outputs.run == 'true'
        run: |
          git config user.name  "Sofia Gleda bot"
          git config user.email "actions@github.com"
          # Push, rebasing onto anything that landed on main during the run (a
          # release, or GitHub's own CNAME commit when the custom domain is set).
          # These data files are the bot's own; a real conflict aborts the
          # rebase and fails the step rather than overwriting someone's commit.
          push_with_rebase() {
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then return 0; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $attempt failed; retrying"
              sleep 10
            done
            return 1
          }
          [ -f translations.json ] && git add translations.json
          if git diff --cached --quiet; then
            echo "No new translations to keep."
          else
            git commit -m "Keep the translation cache from a refresh that was not published: $(date -u +'%Y-%m-%d')"
            push_with_rebase
          fi

      - name: Commit the refreshed data
        if: steps.recheck.outputs.run == 'true'
        run: |
          git config user.name  "Sofia Gleda bot"
          git config user.email "actions@github.com"
          # Push, rebasing onto anything that landed on main during the run (a
          # release, or GitHub's own CNAME commit when the custom domain is set).
          # These data files are the bot's own; a real conflict aborts the
          # rebase and fails the step rather than overwriting someone's commit.
          push_with_rebase() {
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then return 0; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $attempt failed; retrying"
              sleep 10
            done
            return 1
          }
          # Stage each output only if it exists. A tolerated missing file (e.g.
          # tmdb_films.json when no token is set, or a source that stayed down)
          # must not abort the commit and discard the data that DID refresh.
          # NOTE: changes.json is deliberately absent — it is in .gitignore, and
          # "git add" of an ignored, untracked path exits non-zero, which under
          # the shell's set -e aborted this whole step and discarded the refresh.
          for f in index.html tmdb_films.json person_names.json theatre_posters.json cinema_films.json film_merges.json theatre_shows.json film_links_posters.json film_info.json build_report.json translations.json official_state.json health.json events.json event_posters.json icons/apple-touch-icon.png; do
            [ -f "$f" ] && git add "$f"
          done
          # Stage per-title share pages and the site share-preview image.
          [ -d film ] && git add film/
          [ -d show ] && git add show/
          [ -d event ] && git add event/
          [ -d home ] && git add home/
          [ -f share/share-preview.jpg ] && git add share/share-preview.jpg
          # Stage any new or updated poster images (re-hosted from venue websites).
          # This is safe: posters/ is append-only in practice, and the gitignore
          # never excludes it, so only genuinely new files are added here.
          [ -d posters ] && git add posters/
          if git diff --cached --quiet; then
            echo "No changes this run — nothing to commit."
          else
            git commit -m "Scheduled refresh: $(date -u +'%Y-%m-%d')"
            push_with_rebase
          fi
