# Sofia Gleda: the test suites, on GitHub's machines instead of the owner's Mac.
#
# Runs on every push (any branch), on pull requests, and from the "Run workflow"
# button. It never publishes anything and never scrapes: the page is rebuilt offline
# from the listings already committed (scripts/dev_build.py --from HEAD), exactly as
# the README's "Making a UI change" build, and then tested.
#
#   unit  the offline build + share and legal pages + CSP, the publish gate, and
#         test_parsers, test_theatres, test_verify, test_schedule.
#         Every test runs even when an earlier one fails, so all failures show.
#   security  test_security, one runner per engine (Chromium, WebKit), in parallel
#         with the rest: it is the longest offline suite (~11 min both engines in one).
#   plan  splits the UI waves of scripts/test_ui.py into shards (scripts/ci_waves.py).
#   ui    one runner per shard, Chromium and WebKit, in parallel.
#
# The nightly refresh's own commits do not start this workflow: GitHub never starts a
# workflow from a push made with the workflow token (refresh.yml pushes that way), and
# the jobs also skip a push whose head commit is a bot refresh commit, in case that
# ever changes. "[skip ci]" in a commit message skips the run (GitHub's own rule).
#
# A subset of waves (smoke run): the "Run workflow" button's "waves" field, or a line
# "CI-Waves: HF1 HS1" (and optionally "CI-Browsers: webkit") in the pushed commit's
# message. See README, "Tests in GitHub Actions".

name: Tests

on:
  push:
    paths-ignore:
      - "**.md"                   # a text-only change has nothing to test
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      waves:
        description: "UI waves to run, e.g. 'HF1 HS1 B24' (empty = all waves)"
        required: false
        default: ""
        type: string
      browsers:
        description: "Engines for the UI waves"
        required: false
        default: both
        type: choice
        options: [both, chromium, webkit]
      unit:
        description: "Also run the unit job (build, gate, offline tests)"
        required: false
        default: true
        type: boolean

# Least privilege: the jobs only read the repository. Caches and artifacts use the
# runner's own token, not this one.
permissions:
  contents: read

# A newer push to the same branch (or PR) cancels the older run of it.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # The suites run on the owner's Mac, in Sofia: the runners' UTC clock zone and POSIX
  # locale would move every "today", "tomorrow" and midnight a Python check computes
  # (the pages themselves get Europe/Sofia and bg-BG from each browser context).
  TZ: Europe/Sofia
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # SOFIA_SKIP_FRESHNESS is NOT set here: test_verify checks that a stale or missing
  # "generated" fails the gate, and an inherited flag would turn those checks red. It is
  # set only on the publish-gate step below and by ci_waves.py for the UI waves.

jobs:
  unit:
    # Skip the nightly bot's own commits (see the top) and a dispatch with unit unticked.
    if: >-
      !(github.event_name == 'push' && github.event.head_commit != null &&
        github.event.head_commit.author.name == 'Sofia Gleda bot') &&
      (github.event_name != 'workflow_dispatch' || inputs.unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # Third-party actions are pinned to a full commit SHA, as in refresh.yml (a tag can
      # be moved to other code; a SHA cannot). To update: take the release's commit from
      # `git ls-remote --tags https://github.com/actions/<name>` and change both the SHA
      # and the version comment.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"            # the version refresh.yml runs
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # The same exact pins the refresh installs (requirements.txt).
        run: pip install -r requirements.txt

      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # requirements.txt pins the playwright version, which fixes the browser builds
          key: playwright-ubuntu-24.04-${{ hashFiles('requirements.txt') }}-chromium-webkit

      - name: Install the browsers
        # The gate and test_verify open Chromium (WebKit too, kept so the cache key is shared).
        # On a cache hit only the system libraries are installed (they are not cached).
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        # apt on a runner can stall (2026-11-04: one shard sat 30 min in this step, others
        # 6-12 min, where it takes 25 s). The runner's own apt timers are stopped (they hold
        # the dpkg lock at boot), apt gives up on a silent connection after 20 s and retries,
        # and each try is cut at 4 min, its apt processes stopped and dpkg repaired, three
        # tries in all; a failed try leaves the end of its output as an annotation.
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service \
            apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "120";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-net > /dev/null
          for try in 1 2 3; do
            if [ "$CACHE_HIT" = "true" ]; then
              timeout -k 10 240 python3 -m playwright install-deps chromium webkit > /tmp/pw-install.log 2>&1 && break
            else
              timeout -k 10 240 python3 -m playwright install --with-deps chromium webkit > /tmp/pw-install.log 2>&1 && break
            fi
            tail -n 12 /tmp/pw-install.log
            { echo "try $try failed or timed out; the end of its output:"; tail -n 6 /tmp/pw-install.log | cut -c1-200
              echo "apt/dpkg running:"; pgrep -a 'apt|dpkg|unattended' | cut -c1-120 | head -n 4; } \
              | python3 -c 'import sys; t = sys.stdin.read().strip(); print("::warning title=Browser install::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            [ "$try" = 3 ] && exit 1
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          cat /tmp/pw-install.log | tail -n 5

      - name: Build the page offline (src/ + the committed listings)
        id: build
        run: |
          python3 scripts/dev_build.py --from HEAD --out index.html
          python3 scripts/gen_share_pages.py
          python3 scripts/gen_legal_pages.py
          python3 scripts/csp.py

      # From here on every step runs when the build worked, even after a failed test, so
      # one run shows every failure. A failure is not hidden: the step goes red and
      # the job fails with it.
      - name: Publish gate (verify_build.py)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # The gate's freshness check (SNAPSHOT older than 36 h) is about the live data,
        # which the nightly refresh's own gate enforces; here the listings are whatever
        # was last committed, so a branch a few days old must not fail on its age.
        env:
          SOFIA_SKIP_FRESHNESS: "1"
        run: SOFIA_HTML=index.html python3 scripts/verify_build.py

      - name: test_parsers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/test_parsers.py

      - name: test_theatres
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/test_theatres.py

      - name: test_verify
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/test_verify.py

      - name: test_schedule
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/test_schedule.py

  security:
    # Same skips as unit.
    if: >-
      !(github.event_name == 'push' && github.event.head_commit != null &&
        github.event.head_commit.author.name == 'Sofia Gleda bot') &&
      (github.event_name != 'workflow_dispatch' || inputs.unit)
    name: security (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      # Third-party actions are pinned to a full commit SHA, as in refresh.yml (a tag can
      # be moved to other code; a SHA cannot). To update: take the release's commit from
      # `git ls-remote --tags https://github.com/actions/<name>` and change both the SHA
      # and the version comment.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"            # the version refresh.yml runs
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # The same exact pins the refresh installs (requirements.txt).
        run: pip install -r requirements.txt

      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # requirements.txt pins the playwright version, which fixes the browser builds
          key: playwright-ubuntu-24.04-${{ hashFiles('requirements.txt') }}-chromium-webkit

      - name: Install the browsers
        # The gate and test_verify open Chromium (WebKit too, kept so the cache key is shared).
        # On a cache hit only the system libraries are installed (they are not cached).
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        # apt on a runner can stall (2026-11-04: one shard sat 30 min in this step, others
        # 6-12 min, where it takes 25 s). The runner's own apt timers are stopped (they hold
        # the dpkg lock at boot), apt gives up on a silent connection after 20 s and retries,
        # and each try is cut at 4 min, its apt processes stopped and dpkg repaired, three
        # tries in all; a failed try leaves the end of its output as an annotation.
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service \
            apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "120";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-net > /dev/null
          for try in 1 2 3; do
            if [ "$CACHE_HIT" = "true" ]; then
              timeout -k 10 240 python3 -m playwright install-deps chromium webkit > /tmp/pw-install.log 2>&1 && break
            else
              timeout -k 10 240 python3 -m playwright install --with-deps chromium webkit > /tmp/pw-install.log 2>&1 && break
            fi
            tail -n 12 /tmp/pw-install.log
            { echo "try $try failed or timed out; the end of its output:"; tail -n 6 /tmp/pw-install.log | cut -c1-200
              echo "apt/dpkg running:"; pgrep -a 'apt|dpkg|unattended' | cut -c1-120 | head -n 4; } \
              | python3 -c 'import sys; t = sys.stdin.read().strip(); print("::warning title=Browser install::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            [ "$try" = 3 ] && exit 1
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          cat /tmp/pw-install.log | tail -n 5

      - name: Build the page offline (src/ + the committed listings)
        run: |
          python3 scripts/dev_build.py --from HEAD --out index.html
          python3 scripts/gen_share_pages.py
          python3 scripts/gen_legal_pages.py
          python3 scripts/csp.py

      - name: test_security (${{ matrix.browser }})
        env:
          SOFIA_HTML: index.html
          SOFIA_BROWSER: ${{ matrix.browser }}
        run: python3 scripts/test_security.py

  plan:
    if: >-
      !(github.event_name == 'push' && github.event.head_commit != null &&
        github.event.head_commit.author.name == 'Sofia Gleda bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Split the UI waves into shards
        id: plan
        # Inputs and the commit message reach the script as environment variables only,
        # never pasted into the shell line, so no text in them can run as a command.
        env:
          CI_WAVES: ${{ inputs.waves }}
          CI_BROWSERS: ${{ inputs.browsers }}
          CI_COMMIT_MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
        run: python3 scripts/ci_waves.py matrix --github-output

  ui:
    needs: plan
    if: ${{ needs.plan.outputs.count != '' && needs.plan.outputs.count != '0' }}
    name: ui (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false            # one failing shard must not cancel the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Fetch origin/main (wave B24 compares the service worker's shell with the release)
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main || echo "origin/main not fetched; B24 skips that check"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ hashFiles('requirements.txt') }}-chromium-webkit

      - name: Install the browsers
        # Both engines in every shard: waves J and P3B open WebKit inside the Chromium run.
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        # apt on a runner can stall (2026-11-04: one shard sat 30 min in this step, others
        # 6-12 min, where it takes 25 s). The runner's own apt timers are stopped (they hold
        # the dpkg lock at boot), apt gives up on a silent connection after 20 s and retries,
        # and each try is cut at 4 min, its apt processes stopped and dpkg repaired, three
        # tries in all; a failed try leaves the end of its output as an annotation.
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service \
            apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "120";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-net > /dev/null
          for try in 1 2 3; do
            if [ "$CACHE_HIT" = "true" ]; then
              timeout -k 10 240 python3 -m playwright install-deps chromium webkit > /tmp/pw-install.log 2>&1 && break
            else
              timeout -k 10 240 python3 -m playwright install --with-deps chromium webkit > /tmp/pw-install.log 2>&1 && break
            fi
            tail -n 12 /tmp/pw-install.log
            { echo "try $try failed or timed out; the end of its output:"; tail -n 6 /tmp/pw-install.log | cut -c1-200
              echo "apt/dpkg running:"; pgrep -a 'apt|dpkg|unattended' | cut -c1-120 | head -n 4; } \
              | python3 -c 'import sys; t = sys.stdin.read().strip(); print("::warning title=Browser install::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            [ "$try" = 3 ] && exit 1
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          cat /tmp/pw-install.log | tail -n 5

      - name: Build the page offline (src/ + the committed listings)
        run: |
          python3 scripts/dev_build.py --from HEAD --out index.html
          python3 scripts/gen_share_pages.py
          python3 scripts/gen_legal_pages.py
          python3 scripts/csp.py

      - name: "UI waves, ${{ matrix.browser }}: ${{ matrix.waves }}"
        env:
          SOFIA_HTML: index.html
          BROWSER: ${{ matrix.browser }}
          WAVES: ${{ matrix.waves }}
        # One test_ui.py process per wave; a wave that fails on the known 30 s page-load
        # timeout is re-run once. Results table: the run's summary page.
        run: python3 scripts/ci_waves.py run --browser "$BROWSER" --log-dir ci-logs $WAVES

      - name: Keep the logs and screenshots of a failed shard
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-logs-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            ci-logs/
            /tmp/sg-shots/
          retention-days: 14
          if-no-files-found: ignore
