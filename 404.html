<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sofia Gleda</title>
<!-- GitHub Pages serves this page for any address that does not exist. A title's
     address (/film/<id>/, /show/<id>/, /event/<id>/) whose share page is not there
     still opens the app at that title; anything else gets the note below. -->
<script>(function(){var m=/^\/(film|show|event)\/([^\/?#]+)\/?(?:index\.html)?$/.exec(location.pathname);if(m)location.replace("/?"+m[1]+"="+m[2]);})();</script>
<style>
body{font-family:system-ui,sans-serif;background:#0C0A0F;color:#F4EFF6;
     display:flex;flex-direction:column;align-items:center;justify-content:center;
     min-height:100vh;margin:0;padding:1.5rem;text-align:center;box-sizing:border-box}
.brand{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#E0163A;margin:0 0 14px}
h1{font-size:24px;line-height:1.25;margin:0 0 8px;font-weight:700}
.sub{color:#B6ABBC;margin:0 0 22px}
.open{display:inline-block;padding:11px 20px;border-radius:10px;background:#E0163A;color:#fff;
      font-weight:600;text-decoration:none}
.en{margin-top:12px;font-size:14px}
.en a{color:#B6ABBC}
</style>
</head>
<body>
<p class="brand">Sofia Gleda</p>
<h1>Страницата не е намерена</h1>
<p class="sub" lang="en">Page not found</p>
<p><a class="open" href="/">Към програмата</a></p>
<p class="en" lang="en"><a href="/">Go to the listings</a></p>
</body>
</html>
