<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A0F">
<meta name="color-scheme" content="dark">
<meta name="description" content="Sofia Gleda — what's on in Sofia: cinema and theatre in one place.">
<link rel="manifest" href="manifest.webmanifest">
<!-- icon.svg uses embedded data: PNG tiles inside masks; browsers block nested
     data: URIs in SVG favicons (opaque origin restriction) — SVG renders blank.
     make_icons.py composites those tiles correctly into real PNGs, used here. -->
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sofia Gleda">
<title>Sofia Gleda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- loaded non-blocking: a stalled font request must never hold up first paint.
     Every rule declares a real fallback stack, so the page is fully usable
     before (or without) the webfonts. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap"></noscript>

<style>
:root{
  --ink:#0C0A0F; --ink-2:#141018; --ink-3:#1C1622; --ink-4:#28202F;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --fg:#F4EFF6; --fg-2:#B6ABBC; --fg-3:#7E7386;
  --crimson:#E0163A; --gild:#D9B23C;
  --accent:var(--crimson); --on-accent:#fff;
  --shadow:0 20px 48px rgba(0,0,0,.55);
  --r:12px; --r-lg:20px;
  color-scheme:dark;
}
:root[data-surface="theatre"]{ --accent:var(--gild); --on-accent:#17110B; }
/* Dark mode is forced — there is no light theme. The former
   `@media (prefers-color-scheme: light)` and `:root[data-theme="light"]` blocks
   were removed so a device set to light does not recolour the app; `color-scheme:dark`
   on :root above keeps native controls, scrollbars, and form fields dark too. */

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; background:var(--ink); color:var(--fg);
  font-family:"Onest","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
.wrap{max-width:none; margin:0; padding-inline:16px}
@media(min-width:900px){ .wrap{padding-inline:40px} }
@media(min-width:1440px){ .wrap{padding-inline:56px} }
/* the header spans the full viewport, content fluid to 100% */
.bar .wrap{padding-inline:14px}
@media(min-width:900px){ .bar .wrap{padding-inline:28px} }
@media(min-width:1440px){ .bar .wrap{padding-inline:40px} }

/* ---------- header ---------- */
/* Desktop: position:sticky, single row. Mobile: two rows (logo centred + controls).
   The logo row is allowed to scroll away; the controls row stays pinned via a
   negative top offset equal to the logo row height (28px logo + 14px padding-block + 10px gap = 52px).
   --logo-row-h is the single source of truth so the pinned offset cannot drift. */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:60;
  background:color-mix(in srgb,var(--ink) 92%,transparent); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding-block:14px}
/* three zones: brand left · search centre · controls right */
.bar-in{display:grid; grid-template-columns:1fr minmax(0,auto) 1fr; align-items:center; gap:18px}
.brand{display:flex; align-items:center; gap:9px; justify-self:start; min-width:0;
  background:none; border:0; padding:0; margin:0; cursor:pointer; font:inherit; -webkit-tap-highlight-color:transparent}
.brand-logo{height:clamp(32px,3.2vw,42px); width:auto; flex:0 1 auto; min-width:0; max-width:100%;
  object-fit:contain; display:block; transition:filter .15s}
.brand:hover .brand-logo{filter:brightness(1.12)}
.brand b{font-family:Oswald,"Arial Narrow",sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,30px);
  letter-spacing:.15em; text-transform:uppercase; color:var(--accent); line-height:1; white-space:nowrap;
  transition:opacity .15s, filter .15s}
.brand:hover b{filter:brightness(1.12)}
.brand:active b{opacity:.7}
.brand span{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap}
.bar-controls{display:flex; align-items:center; gap:8px; justify-self:end}
@media(max-width:820px){ .brand span{display:none} }
/* ── Mobile layout (≤760px) ──
   Row 1: logo centred (scrolls away).
   Row 2: [seg toggle expands] [lang 42px] [search icon 42px] [burger 42px] — one line, never wraps.
   Row 3: full-width search field (only when S.searchOpen).
   --logo-row-h = 28px logo + 14px padding-block-top + 10px gap between rows = 52px.
   The negative top hides the logo row; the controls row is then 8px below safe-area-inset-top. */
/* ── Mobile layout (≤760px) — JS also detects this and renders mobile HTML ── */
/* Row 1: 3-column grid — left placeholder | logo centred | lang button right.
   Row 2: seg toggle (fills width) + search icon.
   Row 3 (optional): full-width open search field when S.searchOpen.
   --logo-row-h = 42px row (the language button is the tallest item) + 14px padding-block-top + 10px gap = 66px. */
@media(max-width:760px){
  :root{ --logo-row-h:66px } /* 42px row (language button) + 14px top padding + 10px gap */
  .bar{top:calc(env(safe-area-inset-top,0px) - var(--logo-row-h) + 8px)}
  .bar-row-logo{display:grid; grid-template-columns:42px 1fr 42px; align-items:center; margin-bottom:10px; gap:0}
  .bar-row-logo .brand{justify-self:center; grid-column:2}
  .bar-row-logo .lang-right{grid-column:3; justify-self:end}
  .bar-row-controls{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; overflow:hidden}
  .bar-row-search{width:100%}
  .brand b{font-size:19px; letter-spacing:.08em}
  .brand-logo{height:28px}
  /* mobile search icon button — inherits .iconb; only expanded override needed here */
  /* mobile open search field */
  .bar-row-search .search{position:relative; width:100%; max-width:none}
  /* mobile period header: date range on its own line, no wrap */
  .phead-title{font-size:clamp(28px,7vw,36px)}
  .phead-dates{display:block!important; white-space:nowrap; font-size:clamp(15px,4.5vw,20px)}
}
/* ── Segmented toggle — FIXED equal halves, language-independent ──
   Total fixed width: 220px desktop / auto-expands on mobile to fill remaining space.
   Height: 44px. Each half: 1fr grid cell with icon + label, accent on active. */
.seg{display:grid; grid-template-columns:1fr 1fr; background:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex:0 0 auto; width:220px}
.seg button{display:flex; align-items:center; justify-content:center; gap:6px; height:40px; border-radius:999px; font-size:13px; font-weight:600; color:var(--fg-2); white-space:nowrap; transition:background .18s,color .18s; padding:0 8px; overflow:hidden}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:700}
.seg button svg{flex:0 0 18px; width:18px; height:18px}
/* mobile: seg fills remaining width (must come AFTER the base width:220px rule) */
@media(max-width:760px){ .seg{flex:1 1 0!important; min-width:0; width:auto!important} }
/* at very narrow viewports, drop the SVG icons from toggle to save space */
@media(max-width:350px){ .seg button svg{display:none} }
/* windowed desktop (761–1439px) with the search open (.seg-q): the toggle shrinks
   to its two icons, in step with the search field, so the logo and the field keep
   their room (below ~1000px the logo was squeezed, at 780px the bar overflowed).
   Full-screen widths keep the labels; mobile opens the search on its own row. */
@media(min-width:761px) and (max-width:1439px){
  .seg{transition:width .22s ease-out}
  .seg button{transition:background .18s,color .18s,gap .22s ease-out}
  .seg .seg-l{display:inline-block; max-width:7em; overflow:hidden; transition:max-width .22s ease-out, opacity .22s ease-out}
  .seg.seg-q{width:98px}
  .seg.seg-q button{gap:0}
  .seg.seg-q .seg-l{max-width:0; opacity:0}
}
.iconb{width:42px; height:42px; flex:0 0 42px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg-2); font-size:13px; font-weight:700; display:grid; place-items:center}
.iconb:hover{border-color:var(--line-2); color:var(--fg)}
.search-icon-btn.expanded{border-color:var(--accent); color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,var(--ink-3))}

/* ---------- controls ---------- */
/* Desktop: search is the expand-on-demand panel, not always visible.
   The iconb search-icon-btn lives in bar-controls (far right-ish).
   When expanded, .desk-search-wrap grows into view from the right side.
   Item 2: smooth animation — opacity fades in with width; JS adds/removes .open */
.desk-search-wrap{display:flex; align-items:center; gap:0; overflow:hidden; max-width:0; opacity:0;
  transition:max-width .22s ease-out, opacity .22s ease-out}
.desk-search-wrap.open{max-width:420px; opacity:1}
/* mobile search row: animated height. Default display:none keeps #q-m out of
   layout (bounding_box()===null for tests). JS sets display:block before adding
   .open to trigger the CSS transition, then restores display:none after close. */
.bar-row-search{display:none; overflow:hidden; max-height:0; opacity:0;
  transition:max-height .22s ease-out, opacity .22s ease-out}
.bar-row-search.sr-visible{display:block} /* JS adds this before animating open */
.bar-row-search.open{max-height:64px; opacity:1}
@media (prefers-reduced-motion:reduce){
  .desk-search-wrap,.bar-row-search{transition:none!important}
}
.desk-search-wrap .search{position:relative; width:420px; max-width:420px; min-width:0}
.search input{width:100%; padding:11px 40px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg); font:inherit; font-size:15px}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{outline:none; border-color:var(--accent)}
.search .mag{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:15px; pointer-events:none}
.search .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:16px;
  width:24px; height:24px; border-radius:50%; display:none; place-items:center}
.search.has .clr{display:grid}
.search.search-mob-open .clr{display:grid}
/* .burger removed — drawer is opened by .fab and period-banner link only */
.drawer-scrim{position:fixed; inset:0; z-index:100; background:rgba(5,3,7,.6); backdrop-filter:blur(3px)}
.drawer{position:fixed; top:0; right:0; bottom:0; z-index:101; width:min(380px,88vw);
  background:var(--ink-2); border-left:1px solid var(--line); overflow-y:auto;
  padding:18px 18px calc(28px + env(safe-area-inset-bottom,0px)); box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer h3{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--fg-3); margin:20px 0 9px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.drawer h3:first-of-type{margin-top:6px}
.drawer-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:4px}
.drawer-top b{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.14em; text-transform:uppercase}
.dclose{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:14px; color:var(--fg-2)}
.chipwrap{display:flex; gap:6px; flex-wrap:wrap}
.mrow{display:flex; gap:6px; margin-bottom:9px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal button{aspect-ratio:1; border-radius:8px; border:1px solid transparent; background:var(--ink-3);
  font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg-2); display:grid; place-items:center; position:relative}
.cal button:hover{border-color:var(--line-2)}
.cal button[disabled]{opacity:.26; cursor:default; background:transparent}
.cal button.has::after{content:""; position:absolute; bottom:4px; width:3px; height:3px; border-radius:50%; background:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.cal button[aria-pressed="true"]::after{background:var(--on-accent)}
.cal button.inrange{background:color-mix(in srgb,var(--accent) 26%,transparent); color:var(--fg-1); border-radius:0}
.cal button.rstart{border-top-left-radius:8px; border-bottom-left-radius:8px}
.cal button.rend{border-top-right-radius:8px; border-bottom-right-radius:8px}
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:8px}
.calmon{font-size:13px; font-weight:600; color:var(--fg-1); text-align:center; flex:1}
.calarrow{width:32px; height:32px; flex:none; border-radius:8px; border:1px solid var(--line-2);
  background:var(--ink-3); color:var(--fg-1); font-size:17px; line-height:1; cursor:pointer; display:grid; place-items:center}
.calarrow:hover:not([disabled]){border-color:var(--accent); color:var(--accent)}
.calarrow[disabled]{opacity:.3; cursor:default}
.calhint{margin-top:9px; font-size:11px; color:var(--fg-3); text-align:center; min-height:14px}
.caldow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px}
.caldow span{text-align:center; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3)}
.applyb{width:100%; margin-top:22px}
.until{font-size:11px; color:var(--fg-3); margin-top:7px; line-height:1.45}
.lastcheck{font-size:10.5px; letter-spacing:.06em; color:var(--fg-3); margin-top:16px; padding-top:12px; border-top:1px solid var(--line)}
.controls{padding-block:14px 4px; display:flex; flex-direction:column; gap:10px}
.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto; min-width:58px; padding:6px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--ink-2); text-align:center; line-height:1.2; transition:border-color .15s,background .15s}
.day:hover{border-color:var(--line-2)}
.day[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.day .dow{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
.day .dnum{display:block; font-family:Oswald,sans-serif; font-size:16px; font-weight:600}
.day .dall{font-family:Oswald,sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.06em}
.fbar{display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
.fbar::-webkit-scrollbar{display:none}
.sbar{position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:10px;
  padding:9px 12px; background:color-mix(in srgb,var(--ink-2) 94%,transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.sback{display:flex; align-items:center; gap:7px; padding:7px 13px 7px 9px; border-radius:999px;
  border:1px solid var(--line-2); font-size:13px; font-weight:600; color:var(--fg)}
.sback:hover{border-color:var(--accent); color:var(--accent)}
.sgrab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:8px auto 0; display:none}
@media(max-width:620px){ .sgrab{display:block} .scrim{padding:0; place-items:end center}
  /* Higher specificity (.scrim .sheet) so these win over the base `.sheet`
     rule, which is defined LATER in the file: without it the base
     `overflow:hidden` overrode `overflow-y:auto` and the bottom sheet could not
     scroll on mobile, clipping everything past 94vh. */
  .scrim .sheet{width:100%; border-radius:18px 18px 0 0; margin-bottom:0; max-height:94vh;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
  /* On a phone, vh is the screen height with the browser's toolbars HIDDEN: while
     they show, a 94vh sheet is taller than the visible area and its last rows (the
     times and ticket links) sit behind the toolbar, out of reach of the sheet's own
     scroll. dvh follows the toolbars (vh stays the fallback for older browsers), and
     the body clears the iPhone home indicator. */
  @supports (height:1dvh){ .scrim .sheet{max-height:94dvh} }
  .scrim .sbody{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))} }
.fchip{padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--ink-2);
  font-size:12px; color:var(--fg-2); transition:border-color .15s,background .15s; white-space:nowrap}
.fchip:hover{border-color:var(--line-2)}
.fchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.fchip.off,.fchip:disabled{opacity:.4; pointer-events:none; text-decoration:line-through; text-decoration-thickness:1px}
.fclear{font-size:11.5px; color:var(--fg-3); text-decoration:underline; text-underline-offset:3px; padding:5px 4px}

/* ---------- hero ---------- */
.hero{position:relative; border-radius:var(--r-lg); overflow:hidden; margin-block:18px 30px;
  min-height:290px; display:flex; align-items:flex-end; border:1px solid var(--line)}
@media(min-width:800px){ .hero{min-height:340px} }
.hero-art{position:absolute; inset:0; z-index:0}
.hero-scrim{position:absolute; inset:0; z-index:1;
  background:linear-gradient(100deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.74) 40%,rgba(0,0,0,.26) 76%,rgba(0,0,0,.5) 100%)}
.hero-body{position:relative; z-index:2; padding:24px 20px; max-width:620px; color:#F4EFF6}
@media(min-width:800px){ .hero-body{padding:38px 42px} }
.eyebrow{font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; font-weight:700;
  color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
[data-surface="theatre"] .eyebrow{color:var(--gild)}
.eyebrow .dot{width:5px; height:5px; border-radius:50%; background:currentColor}
.hero h1{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(28px,5.6vw,52px); line-height:1; margin-bottom:11px}
[data-surface="theatre"] .hero h1{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  font-weight:800; letter-spacing:-.015em; font-size:clamp(26px,5vw,46px); line-height:1.04}
.hero-meta{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:11px; font-size:12.5px; color:#CCC2D0}
.hero-syn{font-size:14px; color:#DBD2DE; margin-bottom:17px; max-width:54ch}
.acts{display:flex; gap:9px; flex-wrap:wrap}
.btn{padding:10px 20px; border-radius:10px; font-weight:600; font-size:13.5px;
  background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); transition:filter .16s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.26); color:#fff; backdrop-filter:blur(6px)}
.btn.sm{padding:7px 14px; font-size:12.5px}

/* ---------- rails ---------- */
.rail{margin-bottom:44px}
.rhead{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.rhead h2{font-family:Oswald,sans-serif; font-weight:600; font-size:clamp(20px,2.2vw,26px);
  letter-spacing:.06em; text-transform:uppercase; color:var(--fg); display:flex; align-items:center; gap:10px}
.rhead h2::before{content:""; display:inline-block; width:4px; height:.9em; border-radius:2px;
  background:var(--accent); flex:0 0 4px}
[data-surface="theatre"] .rhead h2{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  letter-spacing:0; font-size:clamp(24px,2.6vw,30px)}
.rhead .sub{font-size:11.5px; color:var(--fg-3)}
.rscroll{position:relative}
.rtrack{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:6px; scroll-behavior:smooth; scrollbar-width:thin}
.rtrack::-webkit-scrollbar{height:5px}
.rtrack::-webkit-scrollbar-thumb{background:var(--ink-4); border-radius:9px}
.rarrow{position:absolute; top:34%; z-index:5; width:32px; height:62px; border-radius:10px;
  background:color-mix(in srgb,var(--ink) 84%,transparent); border:1px solid var(--line-2);
  display:none; place-items:center; font-size:17px; backdrop-filter:blur(6px)}
@media(min-width:900px){ .rscroll:hover .rarrow{display:grid} }
.rarrow.prev{left:-8px} .rarrow.next{right:-8px}

/* ---------- card + generated poster ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px 12px}
@media(min-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))} }
.card{flex:0 0 auto; width:158px; scroll-snap-align:start; text-align:left; display:flex; flex-direction:column; gap:7px;
  transition:transform .22s cubic-bezier(.22,1,.36,1)}
.grid .card{width:auto}
@media(min-width:760px){ .card{width:180px} }

/* ---- calendar export panel ---- */
.cal-btn{display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;min-width:40px;border-radius:8px;border:1px solid var(--line-2);
  background:rgba(255,255,255,.05);color:var(--fg-2);cursor:pointer;
  flex-shrink:0;transition:background .15s,color .15s;vertical-align:middle;margin-left:6px}
.cal-btn:hover,.cal-btn:focus-visible{background:rgba(255,255,255,.12);color:var(--fg)}
.cal-btn svg{pointer-events:none}
.cal-panel{background:var(--ink-3);border:1px solid var(--line-2);border-radius:12px;
  padding:14px 16px 16px;margin:6px 0 2px;animation:calIn .15s ease-out both}
@keyframes calIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cal-panel h5{margin:0 0 10px;font:600 13px/1.4 "Onest","Segoe UI",system-ui;
  color:var(--fg);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.cal-panel h5 button.cal-x{margin-left:auto;width:26px;height:26px;min-width:26px;border-radius:6px;
  border:none;background:transparent;color:var(--fg-2);font-size:16px;cursor:pointer;
  display:grid;place-items:center;padding:0;line-height:1;transition:background .12s,color .12s}
.cal-panel h5 button.cal-x:hover{background:rgba(255,255,255,.1);color:var(--fg)}
.cal-times{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.cal-times button{padding:4px 10px;border-radius:8px;border:1px solid var(--line-2);
  background:transparent;color:var(--fg-2);font:500 13px/1.4 "Onest","Segoe UI",system-ui;
  cursor:pointer;min-height:34px;transition:background .12s,color .12s,border-color .12s}
.cal-times button.sel,.cal-times button:hover{background:rgba(255,255,255,.1);
  color:var(--fg);border-color:var(--line-2)}
.cal-times button.sel{border-color:var(--accent);color:var(--fg)}
.cal-apps{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.cal-apps button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:10px;border:1px solid var(--line-2);background:rgba(255,255,255,.06);
  color:var(--fg);font:500 13px/1 "Onest","Segoe UI",system-ui;cursor:pointer;
  min-height:40px;transition:background .15s,border-color .15s}
.cal-apps button:hover,.cal-apps button:focus-visible{background:rgba(255,255,255,.12);
  border-color:var(--line-2)}
.cal-apps button svg{flex-shrink:0}
</style>
</head>

const EVENTS=[{"id":"den-na-sofia","kind":"city","scope":"both","status":"active","title":"Ден на София — 17 септември","titleEn":"Sofia Day — 17 September","from":"2026-09-17","to":"2026-09-17","g":["#B3122D","#2A0308"],"blurbBg":"Празникът на града: свободен вход във всички общински музеи и галерии за целия ден, тържествена сесия на Столичния общински съвет, водосвет пред „Св. София“, танцов спектакъл в парк „Заимов“ (17:30), концерт и огнено шоу на сцената на ул. „Алабин“ (19:00) и визуален танцов спектакъл „Граници на реалността“ в Западната порта на Сердика (20:30).","blurbEn":"The city's feast day: free entry to every municipal museum and gallery all day, a solemn session of the City Council, a water blessing at St Sofia, a dance spectacle in Zaimov Park (17:30), a concert and fire show on the Alabin Street stage (19:00), and the visual dance piece Boundaries of Reality at the Western Gate of Serdica (20:30).","tag":"ЕДИН ДЕН В ГОДИНАТА","source":"БТА / Столична община"},{"id":"az-sam-sofia","kind":"festival","scope":"theatre","status":"active","title":"Фестивал „Аз съм София“","titleEn":"\"I Am Sofia\" Festival","from":"2026-09-17","to":"2026-09-23","g":["#C9A227","#2A2003"],"blurbBg":"Седем дни програма в парка на НДК около празника на града — улична сцена, концерти, детски и спортни формати. Започва на 17 септември.","blurbEn":"Seven days of programming in NDK Park around the city's feast day — a street stage, concerts, children's and sports formats. Opens 17 September.","tag":"7 ДНИ","source":"Столична община"},{"id":"panair-na-kuklite","kind":"festival","scope":"theatre","status":"active","title":"Панаир на куклите","titleEn":"The Puppet Fair","from":"2026-09-15","to":"2026-09-17","g":["#7E22CE","#180420"],"blurbBg":"Столичен куклен театър изнася куклите на улицата: гигантски „Жирафи“ и „Фалшивият оркестър“ със свободен достъп, творчески работилници за деца и родители, и гостуване на гръцката компания Hop Signor със спектакъла „Синьо“.","blurbEn":"Sofia Puppet Theatre takes its puppets outdoors: the giant Giraffes and The Fake Orchestra with free entry, workshops for children and parents, and Greek company Hop Signor guesting with BLUE.","tag":"СВОБОДЕН ДОСТЪП","source":"Столичен куклен театър / theatre.art.bg"},{"id":"sneakpeak-fest","kind":"festival","scope":"theatre","status":"active","title":"SNEAKPEAK FEST'26","titleEn":"SNEAKPEAK FEST'26","from":"2026-09-19","to":"2026-09-19","g":["#BE123C","#22050D"],"blurbBg":"Един ден в Топлоцентрала за спектакли в процес на работа — млади хореографи и режисьори показват незавършени неща пред публика. Зала 1, от 13:00.","blurbEn":"One day at Toplocentrala for work in progress — young choreographers and directors show unfinished pieces to an audience. Hall 1, from 13:00.","tag":"ЕДИН ДЕН","source":"Топлоцентрала"},{"id":"oasis-screening","kind":"limited","scope":"cinema","status":"active","title":"Oasis: Don't Look Back In Anger","titleEn":"Oasis: Don't Look Back In Anger","from":"2026-09-15","to":"2026-09-17","g":["#166534","#04150B"],"blurbBg":"Концертно-документален филм за завръщането на Oasis, в ограничен брой прожекции — Cinema City Sofia и Paradise, Cine Grand Ring и Дом на киното.","blurbEn":"The Oasis reunion concert documentary, on a limited run — Cinema City Sofia and Paradise, Cine Grand Ring and Cinema House.","tag":"ОГРАНИЧЕНИ ПРОЖЕКЦИИ","source":"programata.bg"},{"id":"retro-70mm","kind":"limited","scope":"cinema","status":"active","title":"Класики на голям екран","titleEn":"Classics on the Big Screen","from":"2026-09-15","to":"2026-09-17","g":["#155E75","#04141A"],"blurbBg":"„Терминатор 2: Страшният съд“ и „2001: Една одисея в космоса“ се връщат в салоните, а „Колите“ върви в юбилейно издание за 20 години от премиерата. Дом на киното показва 2001 на 15 септември в 20:01.","blurbEn":"Terminator 2 and 2001: A Space Odyssey return to cinemas, and Cars runs in a 20th-anniversary edition. Cinema House screens 2001 on 15 September at 20:01.","tag":"РЕТРОСПЕКТИВА","source":"programata.bg / domnakinoto.com"},{"id":"cinelibri","kind":"festival","scope":"cinema","status":"upcoming","title":"Синелибри 2026 — „Цивилизация на зрелището“","titleEn":"CineLibri 2026 — \"Civilization of the Spectacle\"","from":"2026-10-15","to":"2026-11-08","g":["#B3122D","#26040A"],"blurbBg":"Кино-литературният фестивал се връща с над 70 заглавия от около 30 държави под мотото „Цивилизация на зрелището“ по есето на Марио Варгас Льоса. Открива на 15 октомври в Зала 1 на НДК. В програмата: документални филми за Керуак, Достоевски, Салман Рушди, Сири Хуствет и Хавиер Серкас, и официална премиера на „Ангеловото петокнижие“ за Анжел Вагенщайн. Прожекции в София и шест други града.","blurbEn":"The film-and-literature festival returns with 70+ titles from around 30 countries under the motto \"Civilization of the Spectacle\", after Mario Vargas Llosa's essay. Opens 15 October in NDK Hall 1. Documentaries on Kerouac, Dostoevsky, Salman Rushdie, Siri Hustvedt and Javier Cercas, and the official premiere of Angelov Pentateuch on Angel Wagenstein. Sofia plus six other cities.","tag":"СЛЕД 30 ДНИ","source":"sofialive.bg"},{"id":"cirkolyuciya","kind":"festival","scope":"theatre","status":"upcoming","title":"ЦИРКОЛЮЦИЯ 2026","titleEn":"CIRCOLUTION 2026","from":"2026-09-25","to":"2026-09-27","g":["#EA580C","#2B0E02"],"blurbBg":"Три дни съвременен цирк в Топлоцентрала: „От девет до пет“ на Асаф Мор (Франция), „Магичното шоу“ на Дани Белев, „Да умреш от смях“ на Открития театър и LUMO.","blurbEn":"Three days of contemporary circus at Toplocentrala: Asaf Mor's Nine to Five (France), Dani Belev's Magic Show, Dying of Laughter in the Open Theatre, and LUMO.","tag":"СЛЕД 10 ДНИ","source":"toplocentrala.bg"},{"id":"fizika-na-tagata","kind":"premiere","scope":"theatre","status":"upcoming","title":"„Физика на тъгата“ — Народен театър","titleEn":"\"The Physics of Sorrow\" — National Theatre","from":"2026-10-06","to":"2026-10-07","g":["#1F3A5F","#060D17"],"blurbBg":"Премиера по романа на Георги Господинов в постановка на словенеца Йерней Лоренци, с Валентин Ганев, Теодора Духовникова и Параскева Джукелова. 6 и 7 октомври.","blurbEn":"Premiere of Georgi Gospodinov's novel staged by Slovenian director Jernej Lorenci, with Valentin Ganev, Teodora Duhovnikova and Paraskeva Djukelova. 6 and 7 October.","tag":"ПРЕМИЕРА ПРЕЗ ОКТОМВРИ","source":"paragraf.bg"},{"id":"lumiere-retro","kind":"limited","scope":"cinema","status":"active","title":"Ретроспекции в Кино Люмиер","titleEn":"Retrospectives at Lumiere Cinema","from":"2026-09-17","to":"2026-10-11","g":["#1C1917","#000000"],"blurbBg":"Авторска поредица в Зала 11 на НДК — по един режисьор на прожекция, 19:00. Започва на 17 септември с „Рашомон“ на Акира Куросава (1950). Следват: Дейвид Линч, „Изгубена магистрала“ (24 септември), Уонг Кар-уай, „Любовно настроение“ (2 октомври, с английски субтитри), Пак Чан-ук, „Прислужницата“ (4 октомври), и два Ходоровски — „Къртицата“ (10 октомври) и „Свещената планина“ (11 октомври).","blurbEn":"An auteur series in NDK's Hall 11 — one director per screening, 19:00. Opens 17 September with Kurosawa's Rashomon (1950), followed by Lynch's Lost Highway (24 Sept), Wong Kar-wai's In the Mood for Love (2 Oct, English subtitles), Park Chan-wook's The Handmaiden (4 Oct), and two Jodorowsky nights — El Topo (10 Oct) and The Holy Mountain (11 Oct).","tag":"ПОРЕДИЦА · 6 ВЕЧЕРИ","source":"ndk.bg"}];

avior before the disaster he's unleashed destroys everything.","country":"United States of America","dir":"Alejandro G. Iñárritu","cast":"Tom Cruise, Riz Ahmed, John Goodman, Sandra Hüller, Michael Stuhlbarg","ovBg":"Най-могъщият човек в света се впуска в отчаяна мисия, за да докаже, че е спасителят на човечеството, преди бедствието, което е предизвикал, да унищожи всичко."},"matriarhat":{"p":"/wpEPG3xIj3DzF8UHucsKNlIt4aN.jpg","b":"/mElTh9Za1q88oCpdzVHAAmf0KGz.jpg","ov":"The film belongs to the 'migration cycle' in the Bulgarian cinema. It is about the drama of a group of women who have been left alone in their 'female kingdom' - a village deserted by its entire men folk.","country":"Bulgaria","imdb":6.7,"imdbVotes":"126","dir":"Lyudmil Kirkov","cast":"Nevena Kokanova, Katya Paskaleva, Katya Chukova, Milka Tuykova, Emilia Radeva","ovBg":"Малко селце в края на седемдесетте. Ганета (Невена Коканова) е съпруга на местния кръчмар, който системно и незаконно забогатява. Въпреки че пробутва хубавата си жена на ревизора шансовете за затвор са твърде големи. Станка (Катя Паскалева) има желание да се премести в града, но не може да се разбере с мъжа си (Велко Кънев), който непрекъснато е на път и никой не знае точно какъв му е случая. Бона (Катя Чукова) си няма мъж и се закача с кмета - единствения свестен мъж наоколо. Баба Йорданка има сериозен здравословен проблем и се опитва мимоходом да се съветва в ветеринаря."},"moralat-e-dobroto":{"p":"/A1WSId17IBAPlNAQIxED45MZrbW.jpg","ov":"The documentary chronicles the life of Christian Takov amid the historical events of the last decades in Bulgaria. The film features a number of meticulously sourced and never before published footage and documents, as well as a series of interviews with the family, colleagues, friends and associates of Takov.","country":"Bulgaria","imdb":9.1,"imdbVotes":"172","dir":"Veselin Dimanov","cast":"Christian Takov","ovBg":"От детската стая, през ученическия чин и студентска скамейка, до преподавателската an journalist Philip Winter has a case of writer’s block when trying to write an article about the United States. He decides to return to Germany, and while trying to book a flight, encounters a German woman and her nine year old daughter Alice doing the same. The three become friends (almost out of necessity) and while the mother asks Winter to mind Alice temporarily, it quickly becomes apparent that Alice will be his responsibility for longer than he expected.","country":"Germany","dir":"Wim Wenders","cast":"Rüdiger Vogler, Yella Rottländer, Lisa Kreuzer, Edda Köchl, Ernest Boehm","ovBg":"Германският журналист Филип преживява творческа криза, докато се опитва да напише статия за Щатите, и решава да се прибере в родината си. На летището среща Лиза - хубава немкиня, която току-що е напуснала съпруга си, и нейната 9-годишна дъщеря Алис. В последната минута преди заминаването Лиза изчезва, но преди това успява да помоли Филип да отведе Алис в Амстердам. Когато Лиза не се появява и в Амстердам, Филип най-сетне успява да изкопчи от Алис някоя и друга дума за баба й."},"evropeyski-kinoklasiki-moyat-lyav-krak-1989":{"p":"/GRAAl0bMQFoFIjV3aunc5jsM5u.jpg","b":"/zjKg04EquTcnVZUfjHboXnXzjcF.jpg","en":"My Left Foot: The Story of Christy Brown","ov":"No one expects much from Christy Brown, a boy with cerebral palsy born into a working-class Irish family. Though Christy is a spastic quadriplegic and essentially paralyzed, a miraculous event occurs when, at the age of 5, he demonstrates control of his left foot by using chalk to scrawl a word on the floor. With the help of his steely mother — and no shortage of grit and determination — Christy overcomes his infirmity to become a painter, poet and author.","country":"Ireland","dir":"Jim Sheridan","cast":"Daniel Day-Lewis, Brenda Fricker, Alison Whelan, Kirsten Sheridan, Declan Croghan","ovBg":"Филмът проследява историята на Кристи Браун - ирландски писател и художник, роден на 5 юли 1932 г. в католическо, бедно, многодетно, но любящо семейство в един от мизерните квартали на Дъблин. Страдащ по рождение от детска церебрална парализа, през първите десет години от живота му всички смятат, че той е бавно развиващ се. Цялото му тяло е в бунт срещу него с изключение на левия му крак, с който един ден Кристи взима парче тебешир и написва цяла дума на пода. Следващите \"стъпки\" са поезия, романи, картини и една болезнено лирична автобиография. Кристи Браун е гений, култивирал себе си на границата на човешките възможности, едновременно недъгав и надарен от Бога."},"sinelibri-2026-pepel":{"p":"/fcAxAWVm2IjxA8z9CG5qs06rhGZ.jpg","b":"/9KSGUPHZpqhqkRXE2eebu701ONU.jpg","en":"Ash","ov":"On the mysterious planet of Ash, Riya awakens to find her crew slaughtered. When a man named Brion arrives to rescue her, an ordeal of psychological and physical terror ensues while Riya and Brion must decide if they can trust one another to survive.","country":"United States of America","dir":"Flying Lotus","cast":"Eiza González, Aaron Paul, Iko Uwais, Kate Elliott, Beulah Koale","ovBg":"Една жена се събужда на отдалечена планета и открива, че екипажът на нейната космическа станция е брутално убит. Разследването ѝ на случилото се отприщва ужасяваща верига от събития."},"sinelibri-2026-metropolis":{"p":"/h6J6Q6Mlp1kJbGeyG9r9DjRLq7q.jpg","b":"/eeMoFKxjjiCi6iep2GEZtSAMYIr.jpg","ov":"In a futuristic city sharply divided between the rich and the poor, the son of the city's mastermind meets a prophet who predicts the coming of a savior to mediate their differences.","country":"Germany","dir":"Fritz Lang","cast":"Gustav Fröhlich, Brigitte Helm, Alfred Abel, Rudolf Klein-Rogge, Theodor Loos","ovBg":"Не може ума и ръцете да бъдат едно, освен ако сърцето не им е посредник. В едно фантастично бъдеще Работещите се изправят срещу Мислещите, за да открият, че биха могли да вървят напред единствено ако са заедно."},"akira-kurosava-sanishta-1990":{"p":"/deukbAigTrh4aQo6LrU0HgH5Zke.jpg","b":"/g2Y4A9qgkHhecPBnYMaAIzTlmcN.jpg","ov":"Eight visually rich vignettes drawn from Kurosawa’s own dreams—fox weddings and vanished orchards, a soldier’s ghosts, a walk through Van Gogh’s canvases, nuclear nightmares, and a water-mill utopia—meditate on childhood, art, mortality, and humanity’s uneasy bond with nature.","country":"Japan","dir":"Akira Kurosawa","cast":"Akira Terao, Mitsuko Baisho, Toshie Negishi, Mieko Harada, Mitsunori Isaki","ovBg":"Филмът е съставен от няколко съня, сънувани лично от Куросава и описани от него. Сънищата са осем, разделени на части по следния ред: Слънчев лъч по време на дъжд, Градината с праскови, Снежната буря, Тунелът, Гарвани, Планината Фуджи в червено, Плачещият демон, Селцето на мелниците."},"doni-darko":{"p":"/j2AtZFsflxiluaNtajMTI0Avm8C.jpg","b":"/msCHK5Kh1YbdZ0zPJ2nzPUhhSN9.jpg","en":"Donnie Darko","ov":"After narrowly escaping a bizarre accident, a troubled teenager is plagued by visions of a large bunny rabbit that manipulates him to commit a series of crimes.","country":"United States of America","imdb":8.0,"imdbVotes":"922.1K","dir":"Richard Kelly","cast":"Jake Gyllenhaal, Jena Malone, James Duval, Drew Barrymore, Beth Grant","ovBg":"Една вечер, по време на президентските избори през 1988, тийнейджър на име Дони Дарко, излиза от къщата си, докато спи, и вижда огромен, демоничен заек на име Франк. Заекът му казва, че светът ще свърши след 28 дни, 6 часа, 42 минути и 12 секунди.  Дони се връща у дома на следващата сутрин и намира разбит джет в стаята му. Докато се опитва да разбере как е оцелял, да оправи проблемите си с училищния побойник и със здравния му учител, заекът Франк продължава да контролира Дони, като го кара да върши вандалски постъпки и по-лошо."},"tayni-i-lazhi":{"p":"/zQBuRQ3hrLhkEsXcxteUxuxLrvs.jpg","b":"/oLh3r9BhrymkMjKtI2geTGkKMif.jpg","en":"Secrets & Lies","ov":"After her adoptive mother dies, Hortense, a successful black optometrist, seeks out her birth mother. She's shocked when her research leads her to Cynthia, a working class white woman.","coun gate a mysterious creature wreaking havoc on the community. But all is not as it seems, and perceptions can be misleading. What begins as ignorance plants the seed of disaster, escalating through human conflict into a tragedy of cosmic proportions.","country":"South Korea","imdb":6.9,"imdbVotes":"4.4K","dir":"Na Hong-jin","cast":"Hwang Jung-min, Zo In-sung, Hoyeon, Alicia Vikander, Michael Fassbender","ovBg":"В отдалеченото южнокорейско селце Хоуп Харбър полицейският началник Бъм-сок и неговата колежка Сън-е са извикани да разследват появата на мистериозно същество, сеещо хаос. В близките гори група местни ловци тръгват по следите на звяра, но бързо разбират, че от преследвачи са се превърнали в плячка."},"kes":{"p":"/r1FMq75irhsQBVGjXhPU4xA9SDo.jpg","b":"/eWvxOS5g67B1b46Cff9TlYuJleY.jpg","en":"Kes","ov":"Bullied at school and ignored and abused at home by his indifferent mother and older brother, Billy Casper, a 15-year-old working-class Yorkshire boy, tames and trains his pet kestrel falcon whom he names Kes. Helped and encouraged by his English teacher and his fellow students, Billy finally finds a positive purpose to his unhappy existence.","country":"United Kingdom","imdb":7.9,"imdbVotes":"26.7K","dir":"Ken Loach","cast":"David Bradley, Freddie Fletcher, Lynne Perrie, Colin Welland, Brian Glover","ovBg":"Филмът разказва историята на малкия Били Каспър, който не намира топлина и близост в родния си дом и училище и се принуждава да ги търси извън тях, в сближаване с животните. Той се заема с дресировката на едно соколче, което нарича Кес и си създава собствен свят, в който намира душевен комфорт и развлечение. Но това трае само до момента, в който брутално му отнемат соколчето. Били отново остава сам лице в лице с тежката си съдба..."},"da-zhivee-balgariya":{"p":"/xgkVi2ePKLToDb5VttfP3c9ss3r.jpg","ov":"In the course of three years we traced several young people with a strongly developed patriotic feeling, who define themselves as nationalists. They cross the thin d over in a secret location deep in the California desert. The problem continues, as the survivor isn't alone, as another deadly spiders climbs out of him and goes on a rampage around the ship. Curious reporter Marci Eyre must now survive, escape and warn everyone before the spider reaches outside the desert.","country":"United States of America","dir":"Gary Jones","cast":"Lana Parrilla, Josh Green, Oliver Macready, Simona Williams, Mark Phelan","ovBg":"На наскоро излетяла совалка на НАСА се извършва строго секретен експеримент с рядък вид паяци. Всичко протича без проблеми до момента в който внезапен метеоритен дъжд почти разрушава совалката и само един член на екипажа оцелява. След като е открит, той е отведен в секретно помещение, намиращо се дълбоко в калифорнийската пустиня."},"always-lalisa":{"p":"/pOZnrUX1UMblLiqq9ZtZUde3cQV.jpg","b":"/wJwTuwy1ZajIA6ivGjoe0Ee08XN.jpg","en":"Always Lalisa","ov":"Documentary following global superstar LISA during a transformative year away from BLACKPINK, the K-pop phenomenon that made her one of the world's most recognizable performers. Documenting a year of risk, reinvention, and self-discovery as LISA begins to define her next chapter.","country":"United States of America","dir":"Sue Kim","cast":"LISA"},"portokal-s-chasovnikov-mehanizam":{"p":"/u1C0lVOVaj0qUHaY2GKGW2Frr5B.jpg","b":"/nLFxvLokHe3bQmrmAfljIfax2jQ.jpg","en":"A Clockwork Orange","ov":"In a near-future Britain, young Alexander DeLarge and his pals get their kicks beating and raping anyone they please. When not destroying the lives of others, Alex swoons to the music of Beethoven. The state, eager to crack down on juvenile crime, gives an incarcerated Alex the option to undergo an invasive procedure that'll rob him of all personal agency. In a time when conscience is a commodity, can Alex change his tune?","country":"United Kingdom","dir":"Stanley Kubrick","cast":"Malcolm McDowell, Patrick Magee, Carl Duering, Michael Bates, Warren Clarke","ovBg":"Демоничният главатар на банда Алекс се забавлява с отвличания, кражби и убийства, но той е и момче, което харесва деветата симфония на Бетовен. По стечение на обстоятелствата Алекс е включен в експеримент за промиване на мозъци, чиято цел е да премахне насилието от улиците и да го впрегне в служба на правителството."},"shrek":{"p":"/iL4u0fGsi5InY1DFjGN1ZD0qgHl.jpg","b":"/w0eKUOEog2ImtktCHAMUZws8qif.jpg","en":"Shrek","ov":"It ain't easy bein' green -- especially if you're a likable (albeit smelly) ogre named Shrek. On a mission to retrieve a gorgeous princess from the clutches of a fire-breathing dragon, Shrek teams up with an unlikely compatriot -- a wisecracking donkey.","country":"United States of America","dir":"Andrew Adamson, Vicky Jenson","cast":"Mike Myers, Eddie Murphy, Cameron Diaz, John Lithgow, Vincent Cassel","ovBg":"Имало едно време в едно затънтено блато един обикновен Огър на име Шрек, чието скъпоценно усамотение неочаквано бива нарушено от нашествието на досадни приказни герои, прогонени от царството си от злия лорд Фаркуад. С твърдото намерение да спаси дома им – и най-вече своя, Шрек сключва сделка с Фаркуад и тръгва да спасява красивата принцеса Фиона, бъдеща булка на злодея."},"samo-lyubovnitsite-ostavat-zhivi":{"p":"/6siwECwpRbNX70ybF8iqZqnspGP.jpg","b":"/dwFvtGZ6fUsU9YRWHXbAOXwNQkq.jpg","en":"Only Lovers Left Alive","ov":"A depressed musician reunites with his lover. However, their romance, already played over several centuries, is disrupted by the arrival of her uncontrollable younger sister.","country":"United Kingdom","dir":"Jim Jarmusch","cast":"Tilda Swinton, Tom Hiddleston, Anton Yelchin, Mia Wasikowska, Jeffrey Wright","ovBg":"Иконата на американското независимо кино Джим Джармъш се насочва към вампирския жанр, съхранявайки всички черти на своя неподражаем стил: изтънчен, ерудиран и саркастичен в равни дози. Героите на Само любовниците остават живи населяват упоителен нощен свят, както подобава на вампири, отдадени на своята саможивост. Преживели векове, те са видели какво ли не, и сега просто искат да бъдат оставени на мира да се наслаждават на вечните си животи.Адам е необщителна рок звезда, напомняща Дейвид Боуи на външен вид, чието единствено желание е да отбягва феновете си, за да композира и свири на спокойствие. Ева е неговата любима, която оставя най-близкия си приятел - Кристофър Марлоу, да се скита по света, за да бъде с Адам в неговото студио в предградията на Детройт. Музиката, както винаги при Джармъш, е важен акцент във филма. Но културните препратки тук са много повече."},"oldboy":{"p":"/bodeIgq1nTCcNLZYtUblHjZo9h4.jpg","b":"/rwf5SUTiEsmfkXAgy15R0UtJUtv.jpg","ov":"With no clue how he came to be imprisoned, drugged and tortured for 15 years, a desperate man seeks revenge on his captors.","country":"South Korea","dir":"Park Chan-wook","cast":"Choi Min-sik, Yoo Ji-tae, Kang Hye-jung, Kim Byeong-ok, Ji Dae-han","ovBg":"Втора част от трилогията „Мъст”.\r Красив и брутален 'Oldboy (2003)' е историята на Дае-Су, мъж, отвлечен от телефонна кабина и тикнат в \"затвор\" за 15 години. Дае-Су умолява своите похитители да му обяснят какво е сторил, но без отговори и информация относно 'провинението' му или колко дълго ще бъде държан затворен, той започва да провежда боеве, които гледа по телевизията, в своята килия. След 15 години на заточение, той е освободен и са му дадени 5 дни, за да разбере истината по въпроса защо е бил държан в плен и от кого..."},"muha":{"p":"/3uV9eLPrUt06O6Qv3pn2bvVTvPc.jpg","b":"/gNr7XehVLVCUCuW1jkWTqZDfmQB.jpg","ov":"The trucker Fyodor Mukhin is an inveterate bachelor. Women love him, and he does not even remember everyone with whom fate brought him together. He also does not remember the teacher Masha from a small Ural town, from whom one day he receives a telegram asking him to come urgently. Something makes Fedor respond.","country":"Russia","dir":"Vladimir Kott","cast":"Aleksei Kravchenko, Sergei Selin, Evgeniya Dobrovolskaya, Aleksandr Golubkov, Sergei Serov","ovBg":"Муха е прякорът на Вера Мухина, 16-годишна ученичка от малко руско градче. Муха тренира бокс и сама решава проблемите си, като не прощава грешките нито на връстници, нито на възрастни. След смъртта на майка й в живота на Муха внезапно нахлува нейният баща. Фьодор Мухин, шофьор, отключва вратата със свой ключ, слага си четката за зъби в чаша и заживява в нейната къща. Значи баща й не е изгорял жив в танка, както мама й е разказвала. Той просто все не се е появявал по-рано. И това е достатъчен повод за Муха да му обяви война. Филмът е разказ за избора, пред който всеки се изправя в даден момент от живота си: избора между свободата и отговорността за друго човешко същество. Бащата трябва да докаже, че дъщеря му има нужда от него; и да намери ключа към жестокия свят на тийнейджърите, в който чуждите не се приемат, а своите не са пощадени..."},"rammstein-live-in-mexico-city":{"p":"/jWASRyL51gUMeQJuZLdgDC3rTKa.jpg","b":"/cBJmuSvyJlFBYhhoJOIrAK7Mr1K.jpg","ov":"A three-night compilation that captures their spectacular October 2022 shows at the Foro Sol Stadium in Mexico City during the Stadium Tour era. This live has become the band's most massive and longest one of their entire career.","country":"Germany","dir":"Paul Dugdale","cast":"Till Lindemann, Richard Kruspe, Christoph Schneider, Paul Landers, Oliver Riedel"},"bts-world-tour-arirang-in-buenos-aires-live-viewing":{"p":"/kK5wiFE800cMVIjsj2TTyLCQqZo.jpg","b":"/4gQEWmkkUQWnBqteqav8eWkdb2k.jpg","en":"BTS World Tour 'Arirang'  in Buenos Aires: Live Viewing"},"hybe-cine-fest-2026-tomorrow-x-together-world-tour-act-tomor":{"p":"/4ZwJBQP0dV22lh4AlPdhyQQCUIC.jpg","ov":"ACT:TOMORROW is the fourth world tour by TOMORROW X TOGETHER. The tour commenced on August 22, 2025 in Seoul, South Korea.","country":"South Korea","dir":"Taehwan Yum","cast":"Choi Soo-bin, Choi Yeon-jun, Choi Beom-gyu, Kang Tae-hyun, Huening Kai"},"hybe-cine-fest-2026-seventeen-world-tour-new":{"p":"/aourQLTQ57XHpElS299J0X6TETb.jpg","ov":"'NEW_' Encore was held both offline and online through live streaming at Incheon Asiad Main Stadium on April 4-5 2026.","cast":"S.Coups, Joshua Hong, Jun, The8, Kim Min-gyu"},"hybe-cine-fest-2026-enhypen-world-tour-blood-saga":{"ov":"ENHYPEN brings the Seoul opening of its BLOOD SAGA world tour to cinema screens, combining tightly synchronized choreography, a dark fantasy stage design and a powerful band-style concert sound."},"cheburashka":{"p":"/9EOpD2DSyzRmWFW7mDkJvZLILuf.jpg","b":"/6ze90Ci3cAXL4xLtlDyPgxV8yVQ.jpg","ov":"Second animation about Gena and Cheburashka. Cheburashka wishes Gena the Crocodile a happy birthday and gives him a toy helicopter as a gift. After meeting some pioneers, they decide to be pioneers themselves. They build a playground for the local children and collect scrap metal, after which they become pioneers.","country":"Soviet Union","dir":"Roman Kachanov","cast":"Vasiliy Livanov, Klara Rumyanova, Tamara Dmitrieva, Vladimir Ferapontov"},"charli-superkucheto":{"p":"/aPq6Hfe810hCOn6lEEW8LKFcGgb.jpg","b":"/2skPNvhiF3B0pUigNm1L5KLWvrk.jpg","en":"Charlie the Wonderdog","ov":"Nine-year-old Danny teams up with his beloved family dog Charlie, who gets abducted by aliens and returns with superpowers, to thwart a plan by the neighbor's sinister cat Puddy to destroy humanity.","country":"Canada","dir":"Shea Wageman","cast":"Owen Wilson, Ruairi MacDonald, Dawson Littman, Tabitha St. Germain, Vincent Tong","ovBg":"Светът на срамежливото хлапе Дани се променя из основи, след като кучето му Чарли е отвлечено от извънземни, придобива суперсили и се превръща в Чарли Суперкучето - най-великият супергерой, когото светът някога е виждал!"},"milen":{"p":"/sHJwnvzp80rkx1VVzftuSs8JnQ0.jpg","b":"/vAT8qoLjcDuVJT5on5zTUEkIQp1.jpg","ov":"The documentary film follows the life and career of Milen Tsvetkov against the backdrop of historical events in Bulgaria that have transformed journalism and the media market in the country since 1989.","country":"Bulgaria","dir":"Veselin Dimanov, Dimitar Stafidov","cast":"Milen Tsvetkov","ovBg":"\"Милен\" е документален филм, проследяващ живота и професионалния път на Милен Цветков на фона на историческите събития в България, променили публицистиката и пазара на медиите в страната, след 1989 година. Лентата цели да разкаже на обществото за развитието на публицистиката през последните десетилетия, кои са хората, променили средата, какви са грешките, които са допуснати, кои са постиженията. Основна тема във филма е борбата за свобода на словото в България."},"vlastelinat-na-prastenite-zadrugata-na-prastena":{"p":"/4WlVLp55zgBlgMTKcHK14sZFaMH.jpg","b":"/z51Wzj94hvAIsWfknifKTqKJRwp.jpg","en":"The Lord of the Rings: The Fellowship of the Ring","ov":"Young hobbit Frodo Baggins, after inheriting a mysterious ring from his uncle Bilbo, must leave his home in order to keep it from falling into the hands of its evil creator. Along the way, a fellowship is formed to protect the ringbearer and make sure that the ring arrives at its final destination: Mt. Doom, the only place where it can be destroyed.","country":"New Zealand","dir":"Peter Jackson","cast":"Elijah Wood, Ian McKellen, Viggo Mortensen, Sean Astin, Ian Holm","ovBg":"Младият хобит Фродо и смелата задруга от приятели и съюзници се впускат в опасна мисия, за да унищожат легендарния Единствен пръстен. По петите им са слугите на злия Саурон, Господарят на мрака и създател на Пръстена.  Ако Саурон си върне Пръстена, Средната земя е обречена. Тази епична история за доброто, злото, приятелството и саможертвата, носител на четири награди Оскар, ще ви пренесе в свят, който надминава и най-смелите ви фантазии."},"tri-tsvyata-cherveno":{"p":"/eP2uU63jgqrpVLOR9xahKVgAkV0.jpg","b":"/xkk7cqXFzY4aCCG5AYWZCFQFbIX.jpg","ov":"Part-time model Valentine unexpectedly befriends a retired judge after she runs over his dog. At first, the grumpy man shows no concern about the dog, and Valentine decides to keep it. But the two form a bond when she returns to his house and catches him listening to his neighbors’ phone calls.","country":"France","dir":"Krzysztof Kieślowski","cast":"Irène Jacob, Jean-Louis Trintignant, Frédérique Feder, Jean-Pierre Lorit, Samuel Le Bihan","ovBg":"Последна част от трилогията на Кешловски. Действието е ситуирано в Женева. След като тръгва след едно куче, младата манекенка Валантин /Ирен Жакоб/ попада на стопанина му - саможив, пенсиониран съдия /Жан-Луи Трентинян/, който подслушва чужди телефонни разговори, най-често между студент по право и любовницата му, която представя прогнозата за времето.\r Най-успешният от трите филма, успял да попадне дори сред номинираните за „Оскар” в три категории – за режисура, сценарий и операгорско майсторство. Награда „Независим дух” за най-добър чуждоезичен филм."},"tri-tsvyata-sinyo":{"p":"/70O1cudvYiEWpKW2Sb1FPAdaqjf.jpg","b":"/pXvYw0QOPbHJVvwGbZfrSNY2vnB.jpg","ov":"The wife of a famous composer survives a car accident that kills her husband and daughter. Now alone, she shakes off her old identity and explores her newfound freedom but finds that she is unbreakably bound to other humans, including her husband’s mistress, whose existence she never suspected.","country":"France","dir":"Krzysztof Kieślowski","cast":"Juliette Binoche, Benoît Régent, Florence Pernel, Charlotte Véry, Hélène Vincent","ovBg":"Жюли (Жулиет Бинош) е на ръба на самоубийство, след като губи съпруга си и дъщеря си в автомобилна катастрофа. Страхът, обаче взема надмощие и вместо това, младата жена решава да започне да гради живота си отначало. „Три цвята: синьо” е първият филм от трилогията на Кшищоф Кешловски, която той заимства идеята на националния трибагреник на Франция - свобода, равенство, братство.\r Филмът е носител на множество международни награди, включително и „Златен лъв” от фестивала във Венеция."},"tri-tsvyata-byalo":{"p":"/8ULEPWAcqljAG7YBwbZqTkGXm8e.jpg","b":"/b1CVjSYinzm6tx1TGA7c75W8X9k.jpg","ov":"Polish immigrant Karol Karol finds himself out of a marriage, a job and a country when his French wife, Dominique, divorces him after six months due to his impotence. Forced to leave France after losing the business they jointly owned, Karol enlists fellow Polish expatriate Mikołaj to smuggle him back to their homeland.","country":"France","dir":"Krzysztof Kieślowski","cast":"Zbigniew Zamachowski, Julie Delpy, Janusz Gajos, Jerzy Stuhr, Grzegorz Warchoł","ovBg":"Втората част от трилогията на Кешловски, за която режисьорът е отличен със „Сребърна мечка” на фестивала в Берлин.\r Сюжетът се върти около отчаянието и желанието за отмъщение на полския фризьор Карол /Збигнев Замачовски/, изоставен в Париж от френската си съпруга Доминик /Жюли Делпи/ след шестмесечен брак. Загубил всичко, той няма идея какво да прави с живота си. Но след като с помощта на познатия му емигрант Миколай се завръща обратно в родината той започва наново своя подземен бизнес, с надеждата, че ще привлече отново вниманието на своята бивша съпруга."},"nyama-myasto-za-starite-kucheta":{"p":"/28MYAJYqVg1fLm4jdyZWWGkhOIN.jpg","b":"/gddUsvfyySrM5k8B8wwJy2VRlBx.jpg","en":"No Country for Old Men","ov":"Llewelyn Moss stumbles upon dead bodies, $2 million and a hoard of heroin in a Texas desert, but methodical killer Anton Chigurh comes looking for it, with local sheriff Ed Tom Bell hot on his trail. The roles of prey and predator blur as the violent pursuit of money and justice collide.","country":"United States of America","dir":"Joel Coen, Ethan Coen","cast":"Javier Bardem, Tommy Lee Jones, Josh Brolin, Woody Harrelson, Kelly Macdonald","ovBg":"Трилърът разказва за внезапно преобърнатия живот в малко крайгранично градче в Тексас през 1980 г. Жителите на тази изолирана земя живеят в мир и спокойствие през всичките години, през които шериф Бел се грижи за реда в нея. Необмислената и глупава постъпка на един от жителите на градчето обаче, ще привлече крайно нежеланото внимание на един от най-зловещите психопати, бродещи в отмиращия Див запад, и ще застраши живота на всички."},"nebesa":{"p":"/gO0tAmjfzA3vvrU0eh9eNKC9iO0.jpg","ov":"Osoaviahimovets (volounteer military trainee) Andron organizes an aviation circle on his Volna collective farm and plans to build a parachute tower. Pilot Oreshkin, in love with Varenka, the daughter of the collective farm chairman, who is categorically opposed to aviation in the village, promises the guys to bring a parachute soon. And no matter how cunning the chairman is, young people still manage to convince him.","country":"Soviet Union","dir":"Yuri Tarich","cast":"Anatoly Alekseev, Nikolay Makarenko, Nina Nikitina, Lidia Kartashova, Ivan Chuvelyov"},"legendi-za-strastta":{"p":"/IrSrQb1yiRZEJjxeNPKDgpIa7j.jpg","b":"/eVIuBKpeLB8rkozkj8bVmxDuAsp.jpg","en":"Legends of the Fall","ov":"In early 20th-century Montana, Col. William Ludlow lives on a ranch in the wilderness with his sons, Alfred, Tristan, and Samuel. Eventually, the unconventional but close-knit family are bound by loyalty, tested by war, and torn apart by love, as told over the course of several decades in this epic saga.","country":"United States of America","dir":"Edward Zwick","cast":"Brad Pitt, Anthony Hopkins, Aidan Quinn, Julia Ormond, Henry Thomas","ovBg":"Пламенно пътешествие в най-тъмните тайни на любовта, предателството и неразрушимите връзки на кръвта."},"kratak-film-za-lyubovta":{"p":"/ymx57aOHCwfIvZGmaGQFJ1HD32i.jpg","b":"/mvPL6z8QFhmk67n6o7sNmU2J1fd.jpg","ov":"19-year-old Tomek whiles away his lonely life by spying on his opposite neighbour Magda through binoculars. She's an artist in her mid-thirties, and appears to have everything - not least a constant stream of men at her beck and call. But when the two finally meet, they discover that they have a lot more in common than appeared at first sight...","country":"Poland","dir":"Krzysztof Kieślowski","cast":"Grażyna Szapołowska, Olaf Lubaszenko, Stefania Iwińska, Piotr Machalica, Artur Barciś","ovBg":"Създаден най-напред като 6-а част от 10-часовата поредица \"Декалог\", тази удължена игрална версия предлага по-дълъг финал, който допълва завладяващата красота на по-краткия оригинал. Акцентирайки върху уникалната позиция на персонажите относно това какво всъщност е истинската любов, Кешловски предлага прочувствено изследване на всеки аспект на емоцията"},"tayniyat-svyat-na-arieti":{"p":"/sUSkcFebnw9AoXldXeSM4vmtELV.jpg","b":"/7Z7WVzJsSReG8B0CaPk0bvWD7tK.jpg","ov":"14-year-old Arrietty and the rest of the Clock family live in peaceful anonymity as they make their own home from items \"borrowed\" from the house's human inhabitants. However, life changes for the Clocks when a human boy discovers Arrietty.","country":"France","dir":"Hiromasa Yonebayashi","cast":"Mirai Shida, Ryunosuke Kamiki, Tomokazu Miura, Keiko Takeshita, Kirin Kiki","ovBg":"Героите са семейство дребни човечета, високи около 10 см, които живеят под дъските на пода и “заемат” всякакви домакински предмети от къщата.  Един ден мъничката 14-годишна Ариети случайно среща младия Шо - момче, дошло да се възстановява в дома на баба си, и между двамата пламва любов от пръв поглед въпреки разликата в размерите."},"parvi-kontakt":{"p":"/aUtoCAgK7yRxRRsXoADRhXFqqw0.jpg","b":"/8MUZz7oPXQftFTslZpRP3CVMOoq.jpg","en":"Arrival","ov":"Taking place after alien crafts land around the world, an expert linguist is recruited by the military to determine whether they come in peace or are a threat.","country":"United States of America","dir":"Denis Villeneuve","cast":"Amy Adams, Jeremy Renner, Forest Whitaker, Michael Stuhlbarg, Mark O'Brien","ovBg":"След като извънземни екипи кацат по цял свят с необичайните си кораби, експертката-лингвист д-р Луиз Банкс е наета от военните, за да разбере дали пришълците са дошли с мир или представляват заплаха. Докато човечеството смята, че е на ръба на глобална война, екипът на Банкс се бори с времето, за да получи отговори. За тези отговори тя рискува не само живота си, но и човешкия си образ... В нейния екип са математикът Иън Донъли и полковникът от армията Уебър, изправени пред голямото предизвикателство, което const FILMINFO = {"odiseya":{"synBg":"Този юли легендите не се разказват – те се преживяват! Ненадминатият майстор на епичния киноспектакъл Кристофър Нолан пренася на големия екран един от най-великите митологични разкази в човешката история – Одисея на Омир. С характерния си визуален размах, Нолан комбинира мит и човешка драма в мащабен епос за оцеляването, паметта и завръщането и обещава едно от най-паметните филмови събития на десетилетието.","dir":"Кристофър Нолан","cast":"Мат Деймън, Том Холанд, Зендея, Ан Хатауей, Робърт Патинсън","src":"https://programata.bg/kino/filmi/odiseya/","genres":["Драма"],"pv":5},"spider-man":{"synBg":"Четири години след събитията в Няма път към дома, вече съзрелият Питър живее изцяло сам, след като доброволно е изтрил себе си от живота и спомените на любимите си хора. Превърнал се в защитник на Ню Йорк, където никой вече не го познава, той отдава целия си живот на опазването на града. Но интензивността на задачите води до изненадваща физическа еволюция, която застрашава съществуването му, докато мистериозна вълна от престъпления поражда един от най-мощните противници, с които някога се е срещал.","dir":"Дестин Даниъл Кретън","cast":"Том Холанд, Зендeя, Сейди Синк, Джейкъб Баталон, Джон Бърнтал","src":"https://programata.bg/kino/filmi/spajdar-men-nov-den/","pv":5},"koyota":{"synBg":"Койота срещу Акме проследява забавните приключения на Уили Койота, който след безброй неуспешни опити да залови Бързоходеца решава най-накрая да потърси сметка от Акме – компанията, чиито шантави изобретения непрекъснато се провалят. Заедно с млад адвокат той се впуска в щура и изпълнена с обрати битка срещу могъщата корпорация, разкривайки тайни, неочаквани съюзници и куп забавни изненади по пътя.","dir":"Дейв Грийн","src":"https://programata.bg/kino/filmi/kojota-sresthu-akme/","genres":["Анимация","Комедия"],"pv":5},"kurierat":{"synBg":"Ханк Малоун е опитен куриер, който трябва да достави донорски орган до болница в рамките на три часа, за да спаси живо
