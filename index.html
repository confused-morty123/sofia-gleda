<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A0F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F2F6" media="(prefers-color-scheme: light)">
<meta name="description" content="Sofia Gleda — what's on in Sofia: cinema and theatre in one place.">
<link rel="manifest" href="manifest.webmanifest">
<!-- icon.svg uses embedded data: PNG tiles inside masks; browsers block nested
     data: URIs in SVG favicons (opaque origin restriction) — SVG renders blank.
     make_icons.py composites those tiles correctly into real PNGs, used here. -->
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sofia Gleda">
<title>Sofia Gleda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- loaded non-blocking: a stalled font request must never hold up first paint.
     Every rule declares a real fallback stack, so the page is fully usable
     before (or without) the webfonts. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap"></noscript>

<style>
:root{
  --ink:#0C0A0F; --ink-2:#141018; --ink-3:#1C1622; --ink-4:#28202F;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --fg:#F4EFF6; --fg-2:#B6ABBC; --fg-3:#7E7386;
  --crimson:#E0163A; --gild:#D9B23C;
  --accent:var(--crimson); --on-accent:#fff;
  --shadow:0 20px 48px rgba(0,0,0,.55);
  --r:12px; --r-lg:20px;
  color-scheme:dark;
}
:root[data-surface="theatre"]{ --accent:var(--gild); --on-accent:#17110B; }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ink:#F5F2F6; --ink-2:#FFFFFF; --ink-3:#ECE7EE; --ink-4:#DFD8E2;
    --line:rgba(26,16,32,.11); --line-2:rgba(26,16,32,.20);
    --fg:#190F1F; --fg-2:#584C60; --fg-3:#847888;
    --crimson:#B3122D; --gild:#7A5E0C;
    --shadow:0 16px 38px rgba(40,20,50,.15); color-scheme:light;
  }
  :root:not([data-theme="dark"])[data-surface="theatre"]{ --on-accent:#fff; }
}
:root[data-theme="light"]{
  --ink:#F5F2F6; --ink-2:#FFFFFF; --ink-3:#ECE7EE; --ink-4:#DFD8E2;
  --line:rgba(26,16,32,.11); --line-2:rgba(26,16,32,.20);
  --fg:#190F1F; --fg-2:#584C60; --fg-3:#847888;
  --crimson:#B3122D; --gild:#7A5E0C;
  --shadow:0 16px 38px rgba(40,20,50,.15); color-scheme:light;
}
:root[data-theme="light"][data-surface="theatre"]{ --on-accent:#fff; }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; background:var(--ink); color:var(--fg);
  font-family:"Onest","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
.wrap{max-width:none; margin:0; padding-inline:16px}
@media(min-width:900px){ .wrap{padding-inline:40px} }
@media(min-width:1440px){ .wrap{padding-inline:56px} }
/* the header spans the full viewport, content fluid to 100% */
.bar .wrap{padding-inline:14px}
@media(min-width:900px){ .bar .wrap{padding-inline:28px} }
@media(min-width:1440px){ .bar .wrap{padding-inline:40px} }

/* ---------- header ---------- */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:60;
  background:color-mix(in srgb,var(--ink) 92%,transparent); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding-block:14px}
/* three zones: brand left · search centre · controls right */
.bar-in{display:grid; grid-template-columns:1fr minmax(0,auto) 1fr; align-items:center; gap:18px}
.brand{display:flex; align-items:center; gap:9px; justify-self:start; min-width:0;
  background:none; border:0; padding:0; margin:0; cursor:pointer; font:inherit; -webkit-tap-highlight-color:transparent}
.brand-logo{height:clamp(32px,3.2vw,42px); width:auto; flex:0 1 auto; min-width:0; max-width:100%;
  object-fit:contain; display:block; transition:filter .15s}
.brand:hover .brand-logo{filter:brightness(1.12)}
.brand b{font-family:Oswald,"Arial Narrow",sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,30px);
  letter-spacing:.15em; text-transform:uppercase; color:var(--accent); line-height:1; white-space:nowrap;
  transition:opacity .15s, filter .15s}
.brand:hover b{filter:brightness(1.12)}
.brand:active b{opacity:.7}
.brand span{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap}
.bar-controls{display:flex; align-items:center; gap:12px; justify-self:end}
@media(max-width:820px){ .brand span{display:none} }
/* on narrow screens the search drops to its own full-width row so the brand,
   mode toggle, language and menu never collide */
@media(max-width:760px){
  .bar-in{display:flex; flex-wrap:wrap; gap:10px; row-gap:10px}
  .brand{order:1; margin-right:auto}
  .bar-controls{order:2}
  .search{order:3; flex:1 1 100%; max-width:none}
  .brand b{font-size:19px; letter-spacing:.08em}
  .brand-logo{height:28px}
  .seg button{padding:7px 14px; font-size:13px}
}
.seg{display:flex; background:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex:0 0 auto}
.seg button{padding:9px clamp(16px,1.8vw,24px); border-radius:999px; font-size:clamp(13px,1.4vw,15px); font-weight:600; color:var(--fg-2); white-space:nowrap; transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.iconb{width:clamp(40px,4.4vw,46px); height:clamp(40px,4.4vw,46px); flex:0 0 auto; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg-2); font-size:clamp(12px,1.3vw,13px); font-weight:700; display:grid; place-items:center}
.iconb:hover{border-color:var(--line-2); color:var(--fg)}

/* ---------- controls ---------- */
.search{position:relative; justify-self:center; width:100%; max-width:clamp(420px,52vw,760px); min-width:0}
.search input{width:100%; padding:13px 44px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg); font:inherit; font-size:clamp(15px,1.5vw,17px)}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{outline:none; border-color:var(--accent)}
.search .mag{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:15px; pointer-events:none}
.search .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:16px;
  width:24px; height:24px; border-radius:50%; display:none; place-items:center}
.search.has .clr{display:grid}
.strands{display:flex; gap:6px; padding-block:12px 2px; overflow-x:auto; scrollbar-width:none}
.strands::-webkit-scrollbar{display:none}
.burger{display:flex; flex-direction:column; gap:3.5px; align-items:center; justify-content:center}
.burger i{display:block; width:18px; height:2px; background:currentColor; border-radius:2px}
.drawer-scrim{position:fixed; inset:0; z-index:100; background:rgba(5,3,7,.6); backdrop-filter:blur(3px)}
.drawer{position:fixed; top:0; right:0; bottom:0; z-index:101; width:min(380px,88vw);
  background:var(--ink-2); border-left:1px solid var(--line); overflow-y:auto;
  padding:18px 18px calc(28px + env(safe-area-inset-bottom,0px)); box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer h3{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--fg-3); margin:20px 0 9px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.drawer h3:first-of-type{margin-top:6px}
.drawer-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:4px}
.drawer-top b{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.14em; text-transform:uppercase}
.dclose{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:14px; color:var(--fg-2)}
.chipwrap{display:flex; gap:6px; flex-wrap:wrap}
.mrow{display:flex; gap:6px; margin-bottom:9px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal button{aspect-ratio:1; border-radius:8px; border:1px solid transparent; background:var(--ink-3);
  font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg-2); display:grid; place-items:center; position:relative}
.cal button:hover{border-color:var(--line-2)}
.cal button[disabled]{opacity:.26; cursor:default; background:transparent}
.cal button.has::after{content:""; position:absolute; bottom:4px; width:3px; height:3px; border-radius:50%; background:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.cal button[aria-pressed="true"]::after{background:var(--on-accent)}
.cal button.inrange{background:color-mix(in srgb,var(--accent) 26%,transparent); color:var(--fg-1); border-radius:0}
.cal button.rstart{border-top-left-radius:8px; border-bottom-left-radius:8px}
.cal button.rend{border-top-right-radius:8px; border-bottom-right-radius:8px}
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:8px}
.calmon{font-size:13px; font-weight:600; color:var(--fg-1); text-align:center; flex:1}
.calarrow{width:32px; height:32px; flex:none; border-radius:8px; border:1px solid var(--line-2);
  background:var(--ink-3); color:var(--fg-1); font-size:17px; line-height:1; cursor:pointer; display:grid; place-items:center}
.calarrow:hover:not([disabled]){border-color:var(--accent); color:var(--accent)}
.calarrow[disabled]{opacity:.3; cursor:default}
.calhint{margin-top:9px; font-size:11px; color:var(--fg-3); text-align:center; min-height:14px}
.caldow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px}
.caldow span{text-align:center; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3)}
.applyb{width:100%; margin-top:22px}
.until{font-size:11px; color:var(--fg-3); margin-top:7px; line-height:1.45}
.lastcheck{font-size:10.5px; letter-spacing:.06em; color:var(--fg-3); margin-top:16px; padding-top:12px; border-top:1px solid var(--line)}
.controls{padding-block:14px 4px; display:flex; flex-direction:column; gap:10px}
.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto; min-width:58px; padding:6px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--ink-2); text-align:center; line-height:1.2; transition:border-color .15s,background .15s}
.day:hover{border-color:var(--line-2)}
.day[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.day .dow{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
.day .dnum{display:block; font-family:Oswald,sans-serif; font-size:16px; font-weight:600}
.day .dall{font-family:Oswald,sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.06em}
.fbar{display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
.fbar::-webkit-scrollbar{display:none}
.sbar{position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:10px;
  padding:9px 12px; background:color-mix(in srgb,var(--ink-2) 94%,transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.sback{display:flex; align-items:center; gap:7px; padding:7px 13px 7px 9px; border-radius:999px;
  border:1px solid var(--line-2); font-size:13px; font-weight:600; color:var(--fg)}
.sback:hover{border-color:var(--accent); color:var(--accent)}
.sgrab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:8px auto 0; display:none}
@media(max-width:620px){ .sgrab{display:block} .scrim{padding:0; place-items:end center}
  .sheet{width:100%; border-radius:18px 18px 0 0; margin-bottom:0; max-height:94vh; overflow-y:auto} }
.fchip{padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--ink-2);
  font-size:12px; color:var(--fg-2); transition:border-color .15s,background .15s; white-space:nowrap}
.fchip:hover{border-color:var(--line-2)}
.fchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.fchip.off,.fchip:disabled{opacity:.4; pointer-events:none; text-decoration:line-through; text-decoration-thickness:1px}
.rangechip{border-style:dashed; color:var(--fg); margin-left:auto}
.rangechip::before{content:"◔ "; color:var(--fg-3)}
.fclear{font-size:11.5px; color:var(--fg-3); text-decoration:underline; text-underline-offset:3px; padding:5px 4px}

/* ---------- hero ---------- */
.hero{position:relative; border-radius:var(--r-lg); overflow:hidden; margin-block:18px 30px;
  min-height:290px; display:flex; align-items:flex-end; border:1px solid var(--line)}
@media(min-width:800px){ .hero{min-height:340px} }
.hero-art{position:absolute; inset:0; z-index:0}
.hero-scrim{position:absolute; inset:0; z-index:1;
  background:linear-gradient(100deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.74) 40%,rgba(0,0,0,.26) 76%,rgba(0,0,0,.5) 100%)}
.hero-body{position:relative; z-index:2; padding:24px 20px; max-width:620px; color:#F4EFF6}
@media(min-width:800px){ .hero-body{padding:38px 42px} }
.eyebrow{font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; font-weight:700;
  color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
[data-surface="theatre"] .eyebrow{color:var(--gild)}
.eyebrow .dot{width:5px; height:5px; border-radius:50%; background:currentColor}
.hero h1{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(28px,5.6vw,52px); line-height:1; margin-bottom:11px}
[data-surface="theatre"] .hero h1{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  font-weight:800; letter-spacing:-.015em; font-size:clamp(26px,5vw,46px); line-height:1.04}
.hero-meta{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:11px; font-size:12.5px; color:#CCC2D0}
.hero-syn{font-size:14px; color:#DBD2DE; margin-bottom:17px; max-width:54ch}
.acts{display:flex; gap:9px; flex-wrap:wrap}
.btn{padding:10px 20px; border-radius:10px; font-weight:600; font-size:13.5px;
  background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); transition:filter .16s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.26); color:#fff; backdrop-filter:blur(6px)}
.btn.sm{padding:7px 14px; font-size:12.5px}

/* ---------- rails ---------- */
.rail{margin-bottom:30px}
.rhead{display:flex; align-items:baseline; gap:10px; margin-bottom:11px; flex-wrap:wrap}
.rhead h2{font-family:Oswald,sans-serif; font-weight:600; font-size:15.5px; letter-spacing:.08em; text-transform:uppercase}
[data-surface="theatre"] .rhead h2{font-family:"Playfair Display",Georgia,serif; text-transform:none; letter-spacing:0; font-size:20px}
.rhead .sub{font-size:11.5px; color:var(--fg-3)}
.rscroll{position:relative}
.rtrack{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:6px; scroll-behavior:smooth; scrollbar-width:thin}
.rtrack::-webkit-scrollbar{height:5px}
.rtrack::-webkit-scrollbar-thumb{background:var(--ink-4); border-radius:9px}
.rarrow{position:absolute; top:34%; z-index:5; width:32px; height:62px; border-radius:10px;
  background:color-mix(in srgb,var(--ink) 84%,transparent); border:1px solid var(--line-2);
  display:none; place-items:center; font-size:17px; backdrop-filter:blur(6px)}
@media(min-width:900px){ .rscroll:hover .rarrow{display:grid} }
.rarrow.prev{left:-8px} .rarrow.next{right:-8px}

/* ---------- card + generated poster ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px 12px}
@media(min-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))} }
.card{flex:0 0 auto; width:158px; scroll-snap-align:start; text-align:left; display:flex; flex-direction:column; gap:7px;
  transition:transform .22s cubic-bezier(.22,1,.36,1)}
.grid .card{width:auto}
@media(min-width:760px){ .card{width:180px} }
.card:hover{transform:translateY(-5px)}
.poster{position:relative; aspect-ratio:2/3; max-width:100%; border-radius:var(--r); overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:flex-end;
  padding:11px; color:#fff; isolation:isolate}
.p-art{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.p-real{object-fit:cover; max-width:none}
/* a real poster carries its own title, so the generated lockup steps back */
.poster:has(.p-real) .p-title,.poster:has(.p-real) .p-sub{display:none}
.poster:has(.p-real) .p-grain{background:linear-gradient(to top,rgba(0,0,0,.55),transparent 42%)}
.shero:has(.p-real) .p-real{filter:blur(2px) brightness(.62)}
/* wide event cards (.ebox) are landscape; a real poster fills the box (cover)
   on its own layer above the generated SVG but below the grain + text, with a
   stronger scrim so the badge, title, and date stay legible over the art. */
.ebox .p-real{z-index:1; width:100%; height:100%; object-fit:cover; object-position:center 22%}
.ebox:has(.p-real) .p-grain{background:
  linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.32) 46%,rgba(0,0,0,.08) 78%),
  linear-gradient(to bottom,rgba(0,0,0,.5),transparent 34%)}
.p-grain{position:absolute; inset:0; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
             radial-gradient(130% 80% at 50% 105%,rgba(0,0,0,.72),transparent 62%)}
.p-title{position:relative; z-index:3; font-family:Oswald,sans-serif; font-weight:600; text-transform:uppercase;
  font-size:16px; line-height:1.04; text-shadow:0 2px 14px rgba(0,0,0,.7);
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
[data-surface="theatre"] .p-title{font-family:"Playfair Display",Georgia,serif; text-transform:none; font-weight:600; font-size:18px; line-height:1.12}
.p-sub{position:relative; z-index:3; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; opacity:.8; margin-top:5px}
.p-top{position:absolute; top:9px; left:9px; right:9px; z-index:4; display:flex; justify-content:space-between; align-items:flex-start; gap:6px}
.score{font-family:Oswald,sans-serif; font-weight:600; font-size:12.5px; padding:2px 7px; border-radius:6px;
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px); font-variant-numeric:tabular-nums;
  border:1px solid rgba(255,255,255,.18); display:flex; align-items:center; gap:4px; white-space:nowrap; color:#fff}
.score i{font-style:normal; font-size:7.5px; letter-spacing:.1em; opacity:.72; font-family:Onest,sans-serif}
.score.hi{color:#FFD84D} .score.na{color:#A99DAD; font-size:11px}
.badge{font-size:8px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; padding:3px 7px;
  border-radius:5px; background:var(--accent); color:var(--on-accent); white-space:nowrap}
.badge.lim{background:linear-gradient(135deg,#E0163A,#7E0C1F); color:#fff}
.badge.free{background:#1B7A4B; color:#fff}
.cfoot{display:flex; flex-direction:column; gap:2px; padding-inline:2px}
.cf1{font-size:12px; font-weight:500; color:var(--fg-2); line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em}
.cf2{font-size:10.5px; color:var(--fg-3); font-variant-numeric:tabular-nums}

/* event card */
.ecard{flex:0 0 auto; width:290px; scroll-snap-align:start; text-align:left}
@media(min-width:760px){ .ecard{width:344px} }
.ebox{position:relative; border-radius:var(--r); overflow:hidden; border:1px solid var(--line); padding:18px;
  height:184px; display:flex; flex-direction:column; justify-content:space-between; color:#fff; box-shadow:var(--shadow)}
.ebox .p-art{z-index:0} .ebox > :not(.p-art):not(.p-grain){position:relative; z-index:2}
.ebox h3{font-family:Oswald,sans-serif; font-size:18px; font-weight:600; line-height:1.14; text-transform:uppercase;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
[data-surface="theatre"] .ebox h3{font-family:"Playfair Display",Georgia,serif; text-transform:none; font-size:21px}
.edate{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.86; margin-top:7px; font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim[hidden]{display:none!important}
.scrim{position:fixed; inset:0; z-index:90; background:rgba(5,3,7,.8); backdrop-filter:blur(8px);
  display:grid; place-items:start center; padding:16px; overflow-y:auto}
.sheet{width:min(860px,100%); background:var(--ink-2); border:1px solid var(--line); border-radius:var(--r-lg);
  overflow:hidden; box-shadow:var(--shadow); margin-block:auto}
.shero{position:relative; min-height:210px; display:flex; align-items:flex-end; padding:22px; color:#fff; overflow:hidden}
.shero .hero-scrim{background:linear-gradient(to top,rgba(0,0,0,.93),rgba(0,0,0,.3))}
.sclose{position:absolute; top:12px; right:12px; z-index:6; width:32px; height:32px; border-radius:50%;
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.24); color:#fff; display:grid; place-items:center; font-size:15px}
.sheet h2{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(23px,4.2vw,34px); line-height:1.02; position:relative; z-index:3}
[data-surface="theatre"] .sheet h2{font-family:"Playfair Display",Georgia,serif; text-transform:none; font-weight:800; letter-spacing:-.015em}
.sbody{padding:22px; display:flex; flex-direction:column; gap:19px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:3px 9px; border-radius:999px;
  border:1px solid var(--line-2); color:var(--fg-2)}
.chip.solid{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.ratings{display:flex; gap:9px; flex-wrap:wrap}
.rtile{border:1px solid var(--line); border-radius:10px; padding:8px 13px; min-width:82px; background:var(--ink-3)}
.rtile .rl{font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--fg-3)}
.rtile .rv{font-family:Oswald,sans-serif; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.15}
.rtile .rv small{font-size:11px; color:var(--fg-3); font-weight:400}
.rtile.imdb .rv{color:#F5C518}
.sec h4{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--fg-3); margin-bottom:9px;
  padding-bottom:6px; border-bottom:1px solid var(--line)}
.sec p{margin:0 0 8px; color:var(--fg-2); font-size:14px; max-width:68ch}
.facts{margin:0; padding-left:17px; color:var(--fg-2); font-size:13.5px; display:flex; flex-direction:column; gap:5px}
.why{border-left:2px solid var(--accent); padding:3px 0 3px 13px; font-size:14px; color:var(--fg); margin-top:4px}
.credits{display:grid; grid-template-columns:auto 1fr; gap:4px 15px; font-size:13.5px}
.credits dt{color:var(--fg-3); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding-top:3px}
.credits dd{margin:0; color:var(--fg-2)}
.quote{border-left:2px solid var(--line-2); padding:2px 0 2px 13px; margin-bottom:11px; font-size:13.5px; color:var(--fg-2)}
.quote cite{display:block; font-style:normal; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-3); margin-top:5px}
.vrow{border-top:1px solid var(--line); padding-block:11px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start}
.vrow:first-of-type{border-top:none; padding-top:0}
.vname{flex:0 0 100%; font-weight:600; font-size:13px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
@media(min-width:640px){ .vname{flex:0 0 210px} }
.vloc{display:flex; flex-direction:column; gap:1px}
.vloc em{font-style:normal; font-size:10.5px; color:var(--fg-3); font-weight:400}
.time.tix{border-style:dashed; color:var(--fg-3); font-family:Onest,sans-serif; font-size:11px; font-weight:600}
.time.tix:hover{border-style:solid; border-color:var(--accent); color:var(--accent)}
.tpick .tt em{display:block; font-style:normal; font-family:Onest,sans-serif; font-size:9px;
  letter-spacing:.04em; text-transform:none; opacity:.8; font-weight:400; margin-top:3px;
  -webkit-line-clamp:2; overflow:hidden}
.vkind{font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3); border:1px solid var(--line); border-radius:4px; padding:1px 5px}
.vprice{font-family:Onest,sans-serif; font-size:11px; font-weight:600; color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent); border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line)); border-radius:6px; padding:2px 7px; white-space:nowrap}
.vtimes{display:flex; gap:6px; flex-wrap:wrap; flex:1; align-items:flex-start}
.time{font-family:Oswald,sans-serif; font-size:12.5px; font-weight:500; font-variant-numeric:tabular-nums;
  padding:4px 10px; border-radius:7px; border:1px solid var(--line-2); background:var(--ink-3); color:var(--fg); text-decoration:none; display:inline-block}
.time:hover{border-color:var(--accent); color:var(--accent)}
.time.fits{border-color:var(--accent); color:var(--accent)}
.time .th{font-family:Onest,sans-serif; font-size:9px; letter-spacing:.07em; color:var(--fg-3); display:block; text-transform:uppercase}
.dgroup{margin-bottom:13px}
.dg-h{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:8px}
.buybox{border:1px solid var(--accent); border-radius:var(--r); padding:15px 17px; background:color-mix(in srgb,var(--accent) 9%,var(--ink-2));
  display:flex; flex-direction:column; gap:11px}
.buybox .bl{font-size:10px; letter-spacing:.17em; text-transform:uppercase; color:var(--fg-3)}
.buylinks{display:flex; gap:8px; flex-wrap:wrap}
.buylink{padding:9px 16px; border-radius:9px; background:var(--accent); color:var(--on-accent);
  font-weight:600; font-size:13px; text-decoration:none; display:inline-flex; align-items:center; gap:7px}
.buylink:hover{filter:brightness(1.12)}
.buylink.alt{background:transparent; border:1px solid var(--line-2); color:var(--fg-2); font-weight:500}
.buylink.alt:hover{border-color:var(--accent); color:var(--accent); filter:none}
.buynote{font-size:11.5px; color:var(--fg-3)}

/* ---------- opening animation ---------- */
.flyer{position:fixed; z-index:200; border-radius:var(--r); overflow:hidden; pointer-events:none; box-shadow:var(--shadow)}
.reveal{position:fixed; inset:0; z-index:150; pointer-events:none; overflow:hidden}
.curtain{position:absolute; top:0; bottom:0; width:52%;
  background:linear-gradient(90deg,#4A0A16,#8A1024 40%,#6B0C1B 70%,#3A0710);
  box-shadow:0 0 60px rgba(0,0,0,.6)}
[data-surface="theatre"] .curtain{background:linear-gradient(90deg,#3A2A06,#7A5E0C 40%,#A8871F 70%,#2A1E04)}
.curtain::after{content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.34) 0 10px,rgba(255,255,255,.07) 10px 22px)}
.curtain.l{left:0} .curtain.r{right:0}
.cine-dim{position:absolute; inset:0; background:radial-gradient(120% 120% at var(--fx,50%) var(--fy,50%),rgba(10,4,12,.55),rgba(6,2,8,.92))}
.flare{position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.98),rgba(224,22,58,.7) 34%,rgba(224,22,58,.15) 60%,transparent 74%); mix-blend-mode:screen}
/* cinema zoom-lens: a rack-focus ring that blooms out from the poster centre */
.zlens{position:absolute; width:190px; height:190px; border-radius:50%; mix-blend-mode:screen;
  border:3px solid rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 2px rgba(224,22,58,.55), inset 0 0 40px rgba(255,255,255,.28), 0 0 70px rgba(224,22,58,.4);
  background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.04) 55%,transparent 66%)}
.zring{position:absolute; width:150px; height:150px; border-radius:50%; border:2px solid rgba(255,255,255,.4)}

/* share button + read-more + toast */
.sshare{position:absolute; top:12px; right:52px; z-index:6; width:32px; height:32px; border-radius:50%;
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.24); color:#fff; display:grid; place-items:center; cursor:pointer}
.sshare:hover{border-color:#fff; background:rgba(0,0,0,.72)}
.synwrap{position:relative}
.synwrap.clamp .synbody{display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.synbody p{margin:0 0 8px; color:var(--fg-2); font-size:14px; max-width:68ch}
.synbody p:last-child{margin-bottom:0}
.readmore{margin-top:4px; background:none; border:0; padding:0; cursor:pointer;
  color:var(--accent); font:inherit; font-size:13px; font-weight:600; letter-spacing:.02em}
.readmore:hover{text-decoration:underline}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); z-index:300;
  background:var(--ink-2); border:1px solid var(--line-2); color:var(--fg); border-radius:10px;
  padding:11px 18px; font-size:13.5px; box-shadow:var(--shadow); opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; max-width:86vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- onboarding ---------- */
.onb{position:fixed; inset:0; z-index:120; background:var(--ink); overflow-y:auto}
.onb-art{position:fixed; inset:0; z-index:0; opacity:.46;
  background:radial-gradient(58% 52% at 10% 6%,rgba(224,22,58,.42),transparent 62%),
             radial-gradient(52% 48% at 92% 94%,rgba(217,178,60,.3),transparent 62%),
             radial-gradient(70% 60% at 50% 50%,rgba(104,36,158,.22),transparent 72%)}
.onb-in{position:relative; z-index:2; width:min(880px,100%); margin:0 auto; padding:34px 16px 60px}
.pbar{height:2px; background:var(--ink-4); border-radius:2px; margin-bottom:26px; overflow:hidden}
.pbar i{display:block; height:100%; background:var(--accent); transition:width .32s cubic-bezier(.22,1,.36,1)}
.onb h1{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(25px,5.2vw,40px); line-height:1.02; margin-bottom:9px}
.onb .lede{color:var(--fg-2); font-size:14.5px; max-width:54ch; margin-bottom:24px}
.qh{font-family:Oswald,sans-serif; font-size:16px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin-bottom:4px}
.qs{font-size:12.5px; color:var(--fg-3); margin-bottom:14px}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px}
.opt{border:1px solid var(--line); background:var(--ink-2); border-radius:var(--r); padding:13px 15px; text-align:left;
  transition:border-color .15s,background .15s; display:flex; flex-direction:column; gap:3px; position:relative}
.opt:hover{border-color:var(--line-2)}
.opt[aria-pressed="true"]{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 13%,var(--ink-2))}
.opt b{font-size:14px; font-weight:600}
.opt span{font-size:11.5px; color:var(--fg-3); line-height:1.4}
.opt .tick{position:absolute; top:10px; right:11px; width:16px; height:16px; border-radius:50%;
  background:var(--accent); color:var(--on-accent); font-size:10px; display:none; place-items:center; font-weight:700}
.opt[aria-pressed="true"] .tick{display:grid}
.tastehead{display:flex; align-items:baseline; gap:10px; margin:22px 0 10px; flex-wrap:wrap}
.tastehead h3{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-2)}
.tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px}
@media(min-width:700px){ .tgrid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))} }
.tpick{position:relative; border-radius:10px; overflow:hidden; aspect-ratio:2/3; border:2px solid transparent;
  transition:border-color .15s,transform .18s; display:flex; flex-direction:column; justify-content:flex-end;
  padding:9px; color:#fff; text-align:left}
.tpick:hover{transform:translateY(-3px)}
.tpick[aria-pressed="true"]{border-color:var(--accent)}
.tpick .tt{position:relative; z-index:3; font-family:Oswald,sans-serif; font-size:12px; font-weight:600;
  text-transform:uppercase; line-height:1.08; text-shadow:0 2px 10px rgba(0,0,0,.75)}
.tpick .tn{position:absolute; top:7px; right:7px; z-index:4; width:20px; height:20px; border-radius:50%;
  background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:700; display:none; place-items:center}
.tpick[aria-pressed="true"] .tn{display:grid}
.counter{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.1em; color:var(--accent); font-variant-numeric:tabular-nums}
.onb-foot{position:sticky; bottom:0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:28px;
  padding-block:16px; border-top:1px solid var(--line); background:linear-gradient(to top,var(--ink) 72%,transparent)}
.onb-foot .prog{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--fg-3); margin-right:auto; font-variant-numeric:tabular-nums}
.linkb{font-size:12.5px; color:var(--fg-3); text-decoration:underline; text-underline-offset:3px}
.linkb:hover{color:var(--fg)}
button[disabled]{opacity:.4; cursor:not-allowed}

/* ---------- misc ---------- */
.note{border:1px solid var(--line); border-left:2px solid var(--accent); border-radius:10px;
  background:var(--ink-2); padding:11px 15px; font-size:12px; color:var(--fg-2); margin-bottom:24px}
.note b{color:var(--fg)}
.sechead{display:flex; align-items:baseline; gap:10px; margin-bottom:13px; flex-wrap:wrap; padding-top:8px}
.sechead h2{font-family:Oswald,sans-serif; font-weight:600; font-size:15.5px; letter-spacing:.08em; text-transform:uppercase}
[data-surface="theatre"] .sechead h2{font-family:"Playfair Display",Georgia,serif; text-transform:none; letter-spacing:0; font-size:20px}
.sechead .n{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-3); border:1px solid var(--line);
  border-radius:999px; padding:2px 9px; font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--line); margin-top:44px; padding-block:24px 40px; font-size:11.5px; color:var(--fg-3)}
footer .srcs{display:flex; flex-wrap:wrap; gap:5px 13px; margin-top:7px}
.empty{padding:26px; border:1px dashed var(--line-2); border-radius:var(--r); color:var(--fg-3); font-size:13px; text-align:center}
</style>

uppet Theatre takes its puppets outdoors: the giant Giraffes and The Fake Orchestra with free entry, workshops for children and parents, and Greek company Hop Signor guesting with BLUE.","tag":"СВОБОДЕН ДОСТЪП","source":"Столичен куклен театър / theatre.art.bg"},{"id":"sneakpeak-fest","kind":"festival","scope":"theatre","status":"active","title":"SNEAKPEAK FEST'26","titleEn":"SNEAKPEAK FEST'26","from":"2026-09-19","to":"2026-09-19","g":["#BE123C","#22050D"],"blurbBg":"Един ден в Топлоцентрала за спектакли в процес на работа — млади хореографи и режисьори показват незавършени неща пред публика. Зала 1, от 13:00.","blurbEn":"One day at Toplocentrala for work in progress — young choreographers and directors show unfinished pieces to an audience. Hall 1, from 13:00.","tag":"ЕДИН ДЕН","source":"Топлоцентрала"},{"id":"oasis-screening","kind":"limited","scope":"cinema","status":"active","title":"Oasis: Don't Look Back In Anger","titleEn":"Oasis: Don't Look Back In Anger","from":"2026-09-15","to":"2026-09-17","g":["#166534","#04150B"],"blurbBg":"Концертно-документален филм за завръщането на Oasis, в ограничен брой прожекции — Cinema City Sofia и Paradise, Cine Grand Ring и Дом на киното.","blurbEn":"The Oasis reunion concert documentary, on a limited run — Cinema City Sofia and Paradise, Cine Grand Ring and Cinema House.","tag":"ОГРАНИЧЕНИ ПРОЖЕКЦИИ","source":"programata.bg"},{"id":"retro-70mm","kind":"limited","scope":"cinema","status":"active","title":"Класики на голям екран","titleEn":"Classics on the Big Screen","from":"2026-09-15","to":"2026-09-17","g":["#155E75","#04141A"],"blurbBg":"„Терминатор 2: Страшният съд“ и „2001: Една одисея в космоса“ се връщат в салоните, а „Колите“ върви в юбилейно издание за 20 години от премиерата. Дом на киното показва 2001 на 15 септември в 20:01.","blurbEn":"Terminator 2 and 2001: A Space Odyssey return to cinemas, and Cars runs in a 20th-anniversary edition. Cinema House screens 2001 on 15 September at 20:01.","tag":"РЕТРОСПЕКТИВА","source":"programata.bg / domnakinoto.com"},{"id":"cinelibri","kind":"festival","scope":"cinema","status":"upcoming","title":"Синелибри 2026 — „Цивилизация на зрелището“","titleEn":"CineLibri 2026 — \"Civilization of the Spectacle\"","from":"2026-10-15","to":"2026-11-08","g":["#B3122D","#26040A"],"blurbBg":"Кино-литературният фестивал се връща с над 70 заглавия от около 30 държави под мотото „Цивилизация на зрелището“ по есето на Марио Варгас Льоса. Открива на 15 октомври в Зала 1 на НДК. В програмата: документални филми за Керуак, Достоевски, Салман Рушди, Сири Хуствет и Хавиер Серкас, и официална премиера на „Ангеловото петокнижие“ за Анжел Вагенщайн. Прожекции в София и шест други града.","blurbEn":"The film-and-literature festival returns with 70+ titles from around 30 countries under the motto \"Civilization of the Spectacle\", after Mario Vargas Llosa's essay. Opens 15 October in NDK Hall 1. Documentaries on Kerouac, Dostoevsky, Salman Rushdie, Siri Hustvedt and Javier Cercas, and the official premiere of Angelov Pentateuch on Angel Wagenstein. Sofia plus six other cities.","tag":"СЛЕД 30 ДНИ","source":"sofialive.bg"},{"id":"cirkolyuciya","kind":"festival","scope":"theatre","status":"upcoming","title":"ЦИРКОЛЮЦИЯ 2026","titleEn":"CIRCOLUTION 2026","from":"2026-09-25","to":"2026-09-27","g":["#EA580C","#2B0E02"],"blurbBg":"Три дни съвременен цирк в Топлоцентрала: „От девет до пет“ на Асаф Мор (Франция), „Магичното шоу“ на Дани Белев, „Да умреш от смях“ на Открития театър и LUMO.","blurbEn":"Three days of contemporary circus at Toplocentrala: Asaf Mor's Nine to Five (France), Dani Belev's Magic Show, Dying of Laughter in the Open Theatre, and LUMO.","tag":"СЛЕД 10 ДНИ","source":"toplocentrala.bg"},{"id":"fizika-na-tagata","kind":"premiere","scope":"theatre","status":"upcoming","title":"„Физика на тъгата“ — Народен театър","titleEn":"\"The Physics of Sorrow\" — National Theatre","from":"2026-10-06","to":"2026-10-07","g":["#1F3A5F","#060D17"],"blurbBg":"Премиера по романа на Георги Господинов в постановка на словенеца Йерней Лоренци, с Валентин Ганев, Теодора Духовникова и Параскева Джукелова. 6 и 7 октомври.","blurbEn":"Premiere of Georgi Gospodinov's novel staged by Slovenian director Jernej Lorenci, with Valentin Ganev, Teodora Duhovnikova and Paraskeva Djukelova. 6 and 7 October.","tag":"ПРЕМИЕРА ПРЕЗ ОКТОМВРИ","source":"paragraf.bg"},{"id":"lumiere-retro","kind":"limited","scope":"cinema","status":"active","title":"Ретроспекции в Кино Люмиер","titleEn":"Retrospectives at Lumiere Cinema","from":"2026-09-17","to":"2026-10-11","g":["#1C1917","#000000"],"blurbBg":"Авторска поредица в Зала 11 на НДК — по един режисьор на прожекция, 19:00. Започва на 17 септември с „Рашомон“ на Акира Куросава (1950). Следват: Дейвид Линч, „Изгубена магистрала“ (24 септември), Уонг Кар-уай, „Любовно настроение“ (2 октомври, с английски субтитри), Пак Чан-ук, „Прислужницата“ (4 октомври), и два Ходоровски — „Къртицата“ (10 октомври) и „Свещената планина“ (11 октомври).","blurbEn":"An auteur series in NDK's Hall 11 — one director per screening, 19:00. Opens 17 September with Kurosawa's Rashomon (1950), followed by Lynch's Lost Highway (24 Sept), Wong Kar-wai's In the Mood for Love (2 Oct, English subtitles), Park Chan-wook's The Handmaiden (4 Oct), and two Jodorowsky nights — El Topo (10 Oct) and The Holy Mountain (11 Oct).","tag":"ПОРЕДИЦА · 6 ВЕЧЕРИ","source":"ndk.bg"}];

<script>
/* ---- failure trap: installed first, so a bad data.js still shows something ---- */
(function(){
  var LSKEY="sofia-screen-v2";
  /* Optional maps live in their own scripts and can go missing if a build step
     misfires. Falling back to {} keeps the app fully usable (no posters, no
     prices) instead of throwing inside a click handler and looking "frozen". */
  ["POSTERS","TMDBART","SHOWART","SHOWALIAS","PRICES"].forEach(function(n){
    try{ if(typeof window[n]==="undefined" && !(n in globalThis)) window[n]={}; }catch(e){ window[n]={}; }
  });
  function panel(msg){
    var app=document.getElementById("app"); if(!app)return;
    app.innerHTML='<div style="max-width:560px;margin:56px auto;padding:0 20px;font:15px/1.6 system-ui;color:#B6ABBC">'
     +'<div style="font:700 13px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:#E0163A;margin-bottom:14px">Sofia Gleda</div>'
     +'<h1 style="font:600 20px/1.3 system-ui;color:#F4EFF6;margin:0 0 10px">Приложението не можа да се зареди</h1>'
     +'<p style="margin:0 0 16px">Опитай да презаредиш. Ако се повтаря, изчистването на запазените настройки обикновено помага.</p>'
     +'<button id="hardreset" style="padding:11px 20px;border-radius:10px;background:#E0163A;color:#fff;border:0;font:600 14px system-ui;cursor:pointer">Изчисти и опитай пак</button>'
     +'<details style="margin-top:22px"><summary style="cursor:pointer;font-size:13px">Техническа подробност</summary>'
     +'<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#7E7386;margin-top:8px"></pre></details></div>';
    var pre=app.querySelector("pre"); if(pre)pre.textContent=String(msg||"");
    var rb=document.getElementById("hardreset");
    if(rb)rb.onclick=function(){try{localStorage.removeItem(LSKEY);}catch(e){}location.reload();};
  }
  window.__sofiaPanel=panel;
  window.addEventListener("error",function(e){
    var app=document.getElementById("app");
    if(app&&app.innerHTML.indexOf("Зареждане на програмата")>-1)
      panel((e&&(e.message||e.error))||"script error");
  });
  var missing=[];
  ["FILMS","SHOWTIMES","CINEMAS","SHOWS","PERFORMANCES","THEATRES","EVENTS",
   "BOOKING","TICKET_HUBS","TASTE_FILMS","TASTE_SHOWS","SNAPSHOT"].forEach(function(n){
    try{ if(typeof window[n]==="undefined"&&typeof eval("typeof "+n)==="undefined")missing.push(n); }
    catch(err){ missing.push(n); }
  });
  if(missing.length){ panel("Данните не се заредиха: "+missing.join(", ")); throw new Error("data missing"); }
})();

  else if(fam==="confetti")p=R(14,(i,x)=>x>.5

                            :`<path d="M${10+x*250},${30+((i*151)%390)} a${28+x*30},${28+x*30} 0 0 1 ${50+x*44},0" fill="none" stroke="${w(.1+x*.11)}" stroke-width="${2+x*4}"/>`);

/* ===================== scoring ===================== */
function genreHits(genres){let n=0;
  S.prefs.genres.forEach(id=>{const g=GENRES.find(x=>x.id===id);if(g&&g.m.some(m=>genres.includes(m)))n++;});
  return n;}
function moodHits(genres){let n=0;const all=[...MOODS.cinema,...MOODS.theatre];
  S.prefs.mood.forEach(id=>{const m=all.find(x=>x.id===id);if(m&&m.m.some(x=>genres.includes(x)))n++;});
  return n;}
const TASTE_BY_ID=Object.fromEntries([...TASTE_FILMS,...TASTE_SHOWS].map(x=>[x.id,x]));
function tasteHits(genres){
  let n=0;
  S.prefs.taste.forEach(tid=>{
    const o=TASTE_BY_ID[tid]||filmById[tid]||showById[tid]; if(!o)return;
    const og=o.genres||[]; og.forEach(x=>{if(genres.includes(x))n++;});});
  return n;}
function withBonus(genres){const w=S.prefs.with;
  if(w==="kids")return genres.some(g=>["Анимация","Семеен","Детски","Куклен","Приказка","Улично"].includes(g))?5:-4;
  if(w==="date")return genres.some(g=>["Романтика","Драма","Комедия","Музикален"].includes(g))?2:0;
  if(w==="friends")return genres.some(g=>["Комедия","Екшън","Хорър","Концерт","Танц","Фестивал"].includes(g))?2:0;
  if(w==="solo")return genres.some(g=>["Драма","Артхаус","Документален","Класика","Експериментален"].includes(g))?2:0;
  return 0;}
function scoreFilm(f,day){
  const rows=filmTimes(f.id,day); if(!rows.length)return -1;
  let s=genreHits(f.genres)*4.5+moodHits(f.genres)*3+tasteHits(f.genres)*2.2+withBonus(f.genres);
  if(rows.some(r=>r[3].some(inWhen)))s+=3;
  if(f.imdb!=null)s+=(f.imdb-6)*1.5;
  s+=Math.min(rows.reduce((n,r)=>n+r[3].length,0),12)*0.1;
  if(S.prefs.taste.includes(f.id))s+=6;
  return s;}
function scoreShow(sh,day){
  const p=showPerfs(sh.id,day); if(!p.length)return -1;
  let s=genreHits(sh.genres)*4.5+moodHits(sh.genres)*3+tasteHits(sh.genres)*2.2+withBonus(sh.genres);
  if(p.some(x=>inWhen(x[2])))s+=3;
  if(sh.badge)s+=2;
  if(sh.reviews&&sh.reviews.length>1)s+=1;
  if(S.prefs.taste.includes(sh.id))s+=6;
  return s;}

const chainOf=vid=>(cinById[vid]||{}).chain;

function genreHit(genres){/* OR across selected genres */ return S.fGenres.some(gid=>{const g=GENRES.find(x=>x.id===gid);return g&&g.m.some(m=>genres.includes(m));});}
function visibleFilms(){const day=dayOrAll();
  return FILMS.filter(f=>{
    let rows=filmTimes(f.id,day); if(!rows.length)return false;
    if(S.fVenues.length&&!rows.some(r=>S.fVenues.includes(chainOf(r[1]))))return false;
    if(S.fGenres.length&&!genreHit(f.genres))return false;
    if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(f,s)))return false;

function visibleShows(){const day=dayOrAll();
  return SHOWS.filter(s=>{

    if(S.fVenues.length&&!S.fVenues.includes(s.theatre))return false;
    if(S.fGenres.length&&!genreHit(s.genres))return false;

  const pct=Math.round((S.step/(steps.length-1))*100);
  let content;
  if(st.taste){
    const tile=o=>{const i=p.taste.indexOf(o.id);
      return`<button class="tpick" aria-pressed="${i>-1}" data-taste="${esc(o.id)}" title="${esc(o.sub)}">
        ${posterArt(o.id,o.genres,o.g)}<div class="p-grain"></div>
        <span class="tn">${i>-1?i+1:""}</span>
        <span class="tt">${esc(o.title)}<em>${esc(o.sub)}</em></span></button>`;};
    content=`<div class="tastehead"><h3>${esc(L.films20)}</h3>
        <span class="counter">${p.taste.length}/5 ${esc(L.selected)}</span></div>
      <div class="tgrid">${TASTE_FILMS.map(tile).join("")}</div>
      <div class="tastehead"><h3>${esc(L.shows20)}</h3></div>
      <div class="tgrid">${TASTE_SHOWS.map(tile).join("")}</div>`;
  }else{
    const on=v=>st.multi?p[st.key].includes(v):p[st.key]===v;
    content=`<div class="qh">${esc(st.h)}</div><div class="qs">${esc(st.s)}</div>
      <div class="opts">${st.opts.map(o=>`<button class="opt" aria-pressed="${on(o.v)}" data-onb="${esc(o.v)}">
        <span class="tick">✓</span><b>${esc(o.b)}</b><span>${esc(o.d)}</span></button>`).join("")}</div>`;
  }
  const ok=st.taste?p.taste.length>=5:(st.multi?p[st.key].length>=(st.min||1):!!p[st.key]);
  return`<div class="onb"><div class="onb-art"></div><div class="onb-in">
    <div class="pbar"><i style="width:${pct}%"></i></div>
    ${S.step===0?`<h1>${esc(L.onbT)}</h1><p class="lede">${esc(L.onbL)}</p>`:""}
    ${content}
    <div class="onb-foot">
      <span class="prog">${esc(L.step)} ${S.step+1} ${esc(L.of)} ${steps.length}</span>
      ${S.step>0?`<button class="linkb" data-onb-back>${esc(L.back)}</button>`:`<button class="linkb" data-onb-skip>${esc(L.skip)}</button>`}
      <button class="btn" data-onb-next ${ok?"":"disabled"}>${S.step===steps.length-1?esc(L.start):esc(L.next)}</button>
    </div></div></div>`;
}

  return m?`${m[3]}.${m[2]}.${m[1]}`:"";}

/* ===================== body ===================== */
/* progressive loading — render the first few rails, stream the rest in on scroll
   via an IntersectionObserver sentinel, so a busy programme doesn't block paint */
let RAILS=[],railIdx=0,railObs=null;
const RAIL_FIRST=4,RAIL_MORE=4,RAIL_LEAD=1200;
/* Materialise a deferred rail descriptor into HTML only when it is needed.
   A descriptor is either {html:thunk} (an arbitrary block, e.g. the full grid)
   or {t,s,items,fn} (a rail whose cards are built lazily from its items). */
function matRail(d){ return d.html?d.html():rail(d.t,d.s,d.items.map(d.fn)); }
function body(){
  const L=t(),day=dayOrAll(),out=[];
  /* Events are shown only if not yet ended (to >= today) and overlapping the
     selected range; "active" = already running, "soon" = starts later. The old
     static e.status is ignored so a finished festival never lingers past its end. */
  const [evS,evE]=rangeBounds();
  const evLive=e=>(e.scope==="both"||e.scope===S.mode)&&e.to>=NOW_DATE&&e.from<=evE&&e.to>=evS;
  const act=EVENTS.filter(e=>evLive(e)&&e.from<=TODAY).sort((a,b)=>a.to.localeCompare(b.to));
  const soon=EVENTS.filter(e=>evLive(e)&&e.from>TODAY).sort((a,b)=>a.from.localeCompare(b.from));
  /* push a rail descriptor only if it has content — emptiness is known from the
     item count, so no card HTML is built for empty or not-yet-visible rails */
  const pushRail=(title,sub,items,fn)=>{ if(items&&items.length) out.push({t:title,s:sub,items,fn}); };
  if(S.mode==="cinema"){
    const vis=visibleFilms();
    /* "За теб днес" = films with a screening still to come TODAY. Decoupled from
       the selected-day filter (scoreFilm returns -1 off the selected day, which
       would wrongly empty the rail on any day but today); the drawer filters
       (venue chain, genre, strand) still apply. Ranked by how many screenings
       remain today, then IMDb. Each card shows only today's remaining times. */
    const today=FILMS.map(f=>({f,rows:filmTimesToday(f.id)})).filter(o=>o.rows.length)
      .filter(o=>{
        if(S.fVenues.length&&!o.rows.some(r=>S.fVenues.includes(chainOf(r[1]))))return false;
        if(S.fGenres.length&&!genreHit(o.f.genres))return false;
        if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(o.f,s)))return false;
        return true;})
      .sort((a,b)=>{const na=a.rows.reduce((n,r)=>n+r[3].length,0),nb=b.rows.reduce((n,r)=>n+r[3].length,0);
        return nb-na||((b.f.imdb||0)-(a.f.imdb||0));}).slice(0,14);
    pushRail(L.railToday,fmtDay(NOW_DATE,true),today,x=>filmCard(x.f,false,x.rows));
    pushRail(L.railLimited,S.lang==="bg"?"само сега — после го няма":"on now — then it's gone",act,eventCard);
    const top=vis.filter(f=>f.imdb!=null).sort((a,b)=>b.imdb-a.imdb).slice(0,12);
    pushRail(L.railTop,"IMDb",top,f=>filmCard(f,day));
    pushRail(L.railSoon,S.lang==="bg"?"извън тази седмица":"beyond this week",soon,eventCard);
    /* task 11 — one rail per genre */
    const visSet=new Set(vis.map(f=>f.id));
    genresFor("cinema").forEach(g=>{
      const fs=vis.filter(f=>f.genres.some(x=>g.m.includes(x)));
      pushRail(S.lang==="bg"?g.bg:g.en,S.lang==="bg"?"по жанр":"by genre",fs,f=>filmCard(f,day));});
    /* task 6 — one rail per cinema, showing what that cinema is playing.
       Under a strand filter, only that strand's cinemas get a rail. */
    CINEMAS.forEach(c=>{
      if(S.fStrands.length){const arty=S.fStrands.includes("arthouse"),comm=S.fStrands.includes("commercial");
        if(arty&&!comm&&c.kind!=="independent")return;
        if(comm&&!arty&&c.kind==="independent")return;}
      const fs=filmsAtCinema(c.id).filter(f=>visSet.has(f.id));
      pushRail(cinName(c),c.area,fs,f=>filmCard(f,day));});
    out.push({html:()=>`<section class="rail"><div class="sechead"><h2>${esc(L.allTitles)} ${esc(periodDateOnly())}</h2>
      <span class="n">${vis.length}</span></div>
      ${vis.length?`<div class="grid">${vis.slice(0,S.limit).map(f=>filmCard(f,day)).join("")}</div>
      ${vis.length>S.limit?`<div style="text-align:center;margin-top:18px">
        <button class="btn sm" data-more>${esc(L.more)} (${vis.length-S.limit})</button></div>`:""}`:emptyState()}</section>`});
  }else{
    const vis=visibleShows();
    const rk=vis.map(s=>({s,v:scoreShow(s,day)})).sort((a,b)=>b.v-a.v).slice(0,14);
    pushRail(L.railToday,periodLabel(),rk,x=>showCard(x.s,day));
    pushRail(L.railLimited,S.lang==="bg"?"само сега — после го няма":"on now — then it's gone",act,eventCard);
    const prem=vis.filter(s=>s.badge);
    pushRail(L.railPrem,"",prem,s=>showCard(s,day));
    pushRail(L.railSoon,S.lang==="bg"?"извън тази седмица":"beyond this week",soon,eventCard);
    /* theatre categories first — one rail per theatre, showing what it stages */
    const visSet=new Set(vis.map(s=>s.id));
    THEATRES.forEach(th=>{
      const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));
      pushRail(thName(th),th.area,ss,s=>showCard(s,day));});
    /* then one rail per genre of play */
    genresFor("theatre").forEach(g=>{
      const ss=vis.filter(s=>s.genres.some(x=>g.m.includes(x)));
      pushRail(S.lang==="bg"?g.bg:g.en,S.lang==="bg"?"по жанр":"by genre",ss,s=>showCard(s,day));});
    out.push({html:()=>`<section class="rail"><div class="sechead"><h2>${esc(L.allTitles)} ${esc(periodDateOnly())}</h2>
      <span class="n">${vis.length}</span></div>
      ${vis.length?`<div class="grid">${vis.slice(0,S.limit).map(s=>showCard(s,day)).join("")}</div>
      ${vis.length>S.limit?`<div style="text-align:center;margin-top:18px">
        <button class="btn sm" data-more>${esc(L.more)} (${vis.length-S.limit})</button></div>`:""}`:emptyState()}</section>`});
  }
  RAILS=out; railIdx=Math.min(RAIL_FIRST,out.length);
  return out.slice(0,railIdx).map(matRail).join("")
    +(railIdx<out.length?`<div id="rail-sentinel" aria-hidden="true"></div>`:"");
}
/* stream deferred category rails in, in batches, ahead of the viewport so the
   scroll never reaches an unbuilt section — building each batch's cards lazily */
function mountProgressive(){
  if(railObs){railObs.disconnect();railObs=null;}
  const sent=document.getElementById("rail-sentinel");
  if(!sent||railIdx>=RAILS.length)return;
  const pump=()=>{
    /* keep appending batches until the sentinel is pushed below the prefetch
       zone (or everything is mounted) — handles batches shorter than a screen */
    let guard=0;
    while(railIdx<RAILS.length && guard++<=RAILS.length){
      if(sent.getBoundingClientRect().top > window.innerHeight+RAIL_LEAD) break;
      const batch=RAILS.slice(railIdx,railIdx+RAIL_MORE).map(matRail).join("");
      railIdx+=RAIL_MORE;
      sent.insertAdjacentHTML("beforebegin",batch);
    }
    if(railIdx>=RAILS.length && railObs){railObs.disconnect();railObs=null;sent.remove();}
  };
  railObs=new IntersectionObserver(function(entries){
    if(entries.some(en=>en.isIntersecting))pump();
  },{rootMargin:RAIL_LEAD+"px 0px"});
  railObs.observe(sent);
}

/* ===================== ticketing ===================== */
function bookUrl(vid,date){
  const b=BOOKING[vid]; if(!b)return null;
  if(b.deep&&date)return b.deep.replace("{date}",date);
  return b.url;}
/* Per-title ticket links: point at the specific film/play/event page (harvested
   from official sites) instead of the venue homepage. Falls back to bookUrl when
   we have no specific page for that title. Accuracy rule: only verified links here. */
const TIX={
  show:{
    "uroci":"https://sofiatheatre.eu/repertoires/120/uroci",
    "posledniyat-strasten":"https://sofiatheatre.eu/repertoires/119/posledniyat-strasten-lyubovnik"
  },
  event:{},
  film:{
    "in-the-mood":"https://www.ndk.bg/en/event/uong-karvai-v-nastroenie-za-liubov-200-eng-sub"
  }
};
function tixUrl(kind,id,venueId,date){
  const specific=LINK_MAP[id]||(TIX[kind]||{})[id];
  return specific||bookUrl(venueId,date);
}
/* Festivals / one-off screenings that unambiguously belong to one catalogued
   venue: link the event straight to that venue's own ticketing (verified audit).
   Events with no single host (city-wide festivals, multi-cinema runs) are left
   out and show provenance only — never a generic aggregator. */
const EVENT_VENUE={
  "fizika-na-tagata":"national",
  "lumiere-retro":"lumiere",
  "retro-70mm":"dom-kino",
  "panair-na-kuklite":"kuklen",
  "sneakpeak-fest":"toplo",
  "cirkolyuciya":"toplo"
};
function busiestVenue(rows){
  const tally={}; rows.forEach(r=>tally[r[1]]=(tally[r[1]]||0)+r[3].length);
  return Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];}
function buyBox(vid,date,isCinema,specificUrl){
  const L=t(),b=BOOKING[vid]; if(!b)return"";
  /* Only the venue's own ticketing — never generic aggregators. A verified audit
     of every Sofia venue found none that genuinely resell through theatre.art.bg,
     ticket.bg or Eventim; each sells on its own site or at its own box office. */
  return`<div class="buybox">
    <div class="bl">${esc(L.buyAt)}</div>
    <div class="buylinks">
      <a class="buylink" href="${esc(specificUrl||bookUrl(vid,date))}" target="_blank" rel="noopener">${esc(L.buy)} — ${esc(b.label)} ↗</a>
    </div>
    <div class="buynote">${esc(isCinema?L.buyNoteC:L.buyNoteT)}</div></div>`;}

function calView(){
  const L=t(),has=datesWith();
  const idx=Math.max(0,Math.min(S.calMonth||0,MONTHS.length-1));
  const m=MONTHS[idx];
  const fd=dUTC(m+"-01");
  const offset=(fd.getUTCDay()+6)%7;
  const dim=new Date(Date.UTC(fd.getUTCFullYear(),fd.getUTCMonth()+1,0)).getUTCDate();
  const lo=S.rFrom, hi=S.rTo, isRange=S.day==="range";
  let cells="";
  for(let i=0;i<offset;i++)cells+=`<button disabled></button>`;
  for(let d=1;d<=dim;d++){
    const iso=`${m}-${String(d).padStart(2,"0")}`;
    const ok=iso>=TODAY&&iso<=LASTDAY;
    let cls=has.has(iso)?"has":"";
    let pressed=false;
    if(isRange&&lo){
      const top=hi||lo;
      if(iso>lo&&iso<top)cls+=" inrange";
      if(iso===lo){pressed=true;cls+=" rstart";if(hi&&hi!==lo)cls+=" inrange";}
      if(iso===top&&top!==lo){pressed=true;cls+=" rend inrange";}
    }else{pressed=S.day===iso;}
    cells+=`<button ${ok?"":"disabled"} class="${cls.trim()}" data-pick="${iso}" aria-pressed="${pressed}">${d}</button>`;
  }
  const dows=S.lang==="bg"?["пн","вт","ср","чт","пт","сб","нд"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const hint=isRange
    ? (lo&&hi?`${fmtDay(lo,true)} – ${fmtDay(hi,true)}`
       : lo?(S.lang==="bg"?"Изберете крайна дата":"Pick an end date")
       : (S.lang==="bg"?"Изберете начална дата":"Pick a start date"))
    : (S.lang==="bg"?"Докоснете начало и край за период":"Tap a start and an end for a range");
  return `<div class="calnav">
      <button class="calarrow" data-calstep="-1" ${idx>0?"":"disabled"} aria-label="prev">‹</button>
      <div class="calmon">${esc(L.months[Number(m.slice(5,7))-1])} ${m.slice(0,4)}</div>

}

/* ===================== sheet open + animation ===================== */
let sheetOpen=false;
function openSheet(html,fromEl){
  let s=document.getElementById("scrim");
  if(!s){s=document.createElement("div");s.id="scrim";s.className="scrim";document.body.appendChild(s);}
  s.innerHTML=html;s.hidden=false;document.body.style.overflow="hidden";
  /* a detail view must always have a visible way out: the back bar is the
     reliable one, history and swipe are conveniences on top of it */
  const sheet=s.querySelector(".sheet");
  if(sheet&&!sheet.querySelector(".sbar")){
    const bar=document.createElement("div");bar.className="sbar";
    bar.innerHTML=`<button class="sback" data-close>&#8249;&nbsp;${esc(t().back)}</button>`;
    const grab=document.createElement("div");grab.className="sgrab";
    sheet.insertBefore(bar,sheet.firstChild);
    sheet.insertBefore(grab,sheet.firstChild);
    swipeToClose(sheet);
  }
  if(!sheetOpen){try{history.pushState({ss:"sheet"},"");}catch(e){}}
  sheetOpen=true;
  /* read-more: hide the toggle when the clamped synopsis does not actually overflow */
  s.querySelectorAll(".synwrap").forEach(w=>{
    const body=w.querySelector(".synbody"),btn=w.querySelector(".readmore");
    if(body&&btn&&body.scrollHeight<=body.clientHeight+2){btn.style.display="none";w.classList.remove("clamp");}
  });
  animateOpen(s,fromEl);
}
function closeSheet(fromPop){
  const s=document.getElementById("scrim");
  if(s){s.hidden=true;s.innerHTML="";}
  document.body.style.overflow="";
  const was=sheetOpen; sheetOpen=false;
  if(was&&!fromPop){try{history.back();}catch(e){}}
}

/* deep links: #film=id / #show=id / #event=id open the matching detail sheet,

function openFromHash(){
  const m=/^#(film|show|event)=(.+)$/.exec(location.hash||"");
  if(!m)return false;
  const kind=m[1],id=decodeURIComponent(m[2]);
  let html=null;
  if(kind==="film"&&filmById[id])html=sheetFilm(filmById[id]);
  else if(kind==="show"&&showById[id])html=sheetShow(showById[id]);
  else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);if(ev)html=sheetEvent(ev);}

function shareItem(kind,id,title){
  const url=location.origin+location.pathname+location.search+"#"+kind+"="+encodeURIComponent(id);
  try{history.replaceState(history.state,"",url);}catch(e){}
  const data={title:"Sofia Gleda — "+(title||""),text:title||"",url:url};
  if(navigator.share){navigator.share(data).catch(()=>{});return;}
  const done=()=>toast(S.lang==="bg"?"Копиран линк":"Link copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,()=>toast(url));}
  else toast(url);
}
function toast(msg){
  let el=document.getElementById("sg-toast");
  if(!el){el=document.createElement("div");el.id="sg-toast";el.className="toast";document.body.appendChild(el);}
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200);
}

function swipeToClose(sheet){
  let y0=null;
  sheet.addEventListener("touchstart",e=>{y0=sheet.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
  sheet.addEventListener("touchmove",e=>{
    if(y0==null)return;
    if(e.touches[0].clientY-y0>90){y0=null;closeSheet();}},{passive:true});
  sheet.addEventListener("touchend",()=>{y0=null;},{passive:true});
}
function animateOpen(scrim,fromEl){
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sheet=scrim.querySelector(".sheet"); if(!sheet)return;
  if(reduce)return;
  scrim.animate([{opacity:0},{opacity:1}],{duration:200,easing:"ease-out"});
  const poster=fromEl&&fromEl.querySelector(".poster");
  const shero=sheet.querySelector(".shero");
  /* mode reveal: curtains for theatre, projector flare for cinema */
  const rev=document.createElement("div");rev.className="reveal";
  if(S.mode==="theatre"){
    rev.innerHTML='<div class="curtain l"></div><div class="curtain r"></div>';
    document.body.appendChild(rev);
    const[l,r]=rev.querySelectorAll(".curtain");
    const opt={duration:620,easing:"cubic-bezier(.66,0,.34,1)"};
    l.animate([{transform:"translateX(-100%)"},{transform:"translateX(0)",offset:.34},{transform:"translateX(-100%)"}],opt);
    r.animate([{transform:"translateX(100%)"},{transform:"translateX(0)",offset:.34},{transform:"translateX(100%)"}],opt)
      .onfinish=()=>rev.remove();
  }else{
    /* cinema: a zoom-lens — the frame focuses in on the poster, a lens ring
       racks open from the poster centre and blooms outward, then clears */
    const rect=(poster||sheet).getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const dim=document.createElement("div");dim.className="cine-dim";
    dim.style.setProperty("--fx",`${(cx/innerWidth*100).toFixed(1)}%`);
    dim.style.setProperty("--fy",`${(cy/innerHeight*100).toFixed(1)}%`);
    const lens=document.createElement("div");lens.className="zlens";
    lens.style.cssText=`left:${cx}px;top:${cy}px`;
    const ring=document.createElement("div");ring.className="zring";
    ring.style.cssText=`left:${cx}px;top:${cy}px`;
    rev.appendChild(dim);rev.appendChild(lens);rev.appendChild(ring);document.body.appendChild(rev);
    dim.animate([{opacity:0},{opacity:.92,offset:.28},{opacity:0}],
      {duration:580,easing:"ease-out"});
    lens.animate([
      {transform:"translate(-50%,-50%) scale(.18)",opacity:0},
      {transform:"translate(-50%,-50%) scale(1)",opacity:.95,offset:.38},
      {transform:"translate(-50%,-50%) scale(7)",opacity:0}
    ],{duration:640,easing:"cubic-bezier(.16,1,.3,1)"});
    ring.animate([
      {transform:"translate(-50%,-50%) scale(.4)",opacity:.9},
      {transform:"translate(-50%,-50%) scale(9)",opacity:0}
    ],{duration:640,easing:"cubic-bezier(.16,1,.3,1)"}).onfinish=()=>rev.remove();
  }
  /* poster flies into the sheet header */
  if(poster&&shero){
    const from=poster.getBoundingClientRect(),to=shero.getBoundingClientRect();
    /* only fly when both rects have laid out — otherwise a zero/NaN destination
       makes the scale factor blow up and the clone shoots off-screen */
    if(from.width&&from.height&&to.width&&to.height){
      const fly=poster.cloneNode(true);fly.className="flyer";
      /* top-left transform-origin so translate+scale map the poster's corner
         exactly onto the header box — with the default centre origin a large
         real-poster scale lands the clone far outside the sheet */
      fly.style.cssText=`left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;transform-origin:0 0`;
      document.body.appendChild(fly);
      const sx=(to.width/from.width).toFixed(4),sy=(to.height/from.height).toFixed(4);
      fly.animate([
        {transform:"translate(0,0) scale(1,1)",opacity:1},
        {transform:`translate(${(to.left-from.left).toFixed(1)}px,${(to.top-from.top).toFixed(1)}px) scale(${sx},${sy})`,opacity:0}
      ],{duration:480,easing:"cubic-bezier(.22,1,.36,1)"}).onfinish=()=>fly.remove();
    }
  }
  sheet.animate([{opacity:0,transform:"translateY(22px) scale(.97)"},{opacity:1,transform:"none"}],
    {duration:420,delay:120,easing:"cubic-bezier(.22,1,.36,1)",fill:"backwards"});
}

/* ===================== events ===================== */
document.addEventListener("click",e=>{
  const q=sel=>e.target.closest(sel);
  if(q("[data-close]")||e.target.id==="scrim"){closeSheet();return;}
  if(q(".time")||q(".buylink"))return;            /* let real links through */

  const rm=q("[data-readmore]");
  if(rm){const w=rm.closest(".synwrap");if(w){const on=w.classList.toggle("clamp");
    rm.textContent=on?rm.dataset.moreLabel:rm.dataset.lessLabel;}return;}
  const shr=q("[data-share]");
  if(shr){const[kind,...rest]=shr.dataset.share.split(":");const id=rest.join(":");
    let title="";
    if(kind==="film"&&filmById[id])title=filmTitle(filmById[id]);
    else if(kind==="show"&&showById[id])title=showById[id].title;
    else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);title=ev?(S.lang==="bg"?ev.title:ev.titleEn):"";}
    shareItem(kind,id,title);return;}

  const o=q("[data-onb]");
  if(o){const st=onbSteps()[S.step],v=o.dataset.onb;
    if(st.multi){const i=S.prefs[st.key].indexOf(v);i>-1?S.prefs[st.key].splice(i,1):S.prefs[st.key].push(v);}
    else{S.prefs[st.key]=v;if(st.key==="track")S.prefs.genres=[],S.prefs.mood=[];}
    render();return;}
  const tp=q("[data-taste]");
  if(tp){const v=tp.dataset.taste,i=S.prefs.taste.indexOf(v);
    if(i>-1)S.prefs.taste.splice(i,1);else if(S.prefs.taste.length<5)S.prefs.taste.push(v);
    render();return;}
  if(q("[data-onb-next]")){const n=onbSteps().length;
    if(S.step<n-1){S.step++;try{history.pushState({ss:"step"+S.step},"");}catch(e){}}
    else{S.onb=false;S.step=0;S.mode=S.prefs.track==="theatre"?"theatre":"cinema";save();}
    render();window.scrollTo({top:0});return;}
  if(q("[data-onb-back]")){S.step--;render();window.scrollTo({top:0});return;}
  if(q("[data-onb-skip]")){S.onb=false;S.step=0;
    if(!S.prefs.track)S.prefs.track="both";
    if(!S.prefs.when)S.prefs.when="any";
    save();render();return;}

  if(q("[data-home]")){S.q="";S.qFocus=false;S.fGenres=[];S.fVenues=[];S.fStrands=[];
    S.day="week";S.rFrom=S.rTo=null;S.calMonth=null;S.limit=30;S.drawer=false;
    if(location.hash)history.replaceState(null,"",location.pathname+location.search);
    save();render();window.scrollTo({top:0,behavior:"smooth"});return;}

  const sw=q("[data-switch]");
  if(sw){S.mode=sw.dataset.switch;S.fGenres=[];S.fVenues=[];S.fStrands=[];S.limit=30;save();render();window.scrollTo({top:0});return;}
  if(q("[data-more]")){S.limit+=30;render();return;}
  if(q("[data-drawer]")){S.drawer=true;S.qFocus=false;render();return;}
  if(q("[data-dclose]")){S.drawer=false;render();return;}
  const rg=q("[data-range]"); if(rg){S.day=rg.dataset.range;S.rFrom=S.rTo=null;S.limit=30;render();return;}
  const cstep=q("[data-calstep]"); if(cstep&&!cstep.disabled){
    S.calMonth=Math.max(0,Math.min((S.calMonth||0)+Number(cstep.dataset.calstep),MONTHS.length-1));render();return;}
  const pk=q("[data-pick]"); if(pk&&!pk.disabled){
    const iso=pk.dataset.pick; S.limit=30;
    /* first tap starts a range, second tap ends it (swap if reversed),
       a tap after a complete range starts fresh */
    if(S.day!=="range"||!S.rFrom||S.rTo){S.day="range";S.rFrom=iso;S.rTo=null;}
    else if(iso<S.rFrom){S.rTo=S.rFrom;S.rFrom=iso;}
    else{S.rTo=iso;}
    render();return;}
  const st=q("[data-strand]"); if(st){const v=st.dataset.strand;S.fStrands=v?toggleArr(S.fStrands,v):[];S.qFocus=false;S.limit=30;render();return;}
  if(q("[data-qclear]")){S.q="";S.qFocus=false;render();return;}
  const d=q("[data-day]"); if(d){S.day=d.dataset.day;render();return;}
  const gf=q("[data-genre]"); if(gf){const v=gf.dataset.genre;S.fGenres=v?toggleArr(S.fGenres,v):[];S.limit=30;render();return;}
  const vf=q("[data-venue]"); if(vf){const v=vf.dataset.venue;S.fVenues=v?toggleArr(S.fVenues,v):[];S.limit=30;render();return;}
  if(q("[data-clearf]")){S.fGenres=[];S.fVenues=[];S.fStrands=[];render();return;}
  if(q("[data-lang]")){S.lang=S.lang==="bg"?"en":"bg";save();render();return;}
  if(q("[data-reset]")){S.onb=true;S.step=0;render();window.scrollTo({top:0});return;}

  const sc=q("[data-scroll]");
  if(sc){const tr=sc.parentElement.querySelector(".rtrack");
    tr.scrollBy({left:Number(sc.dataset.scroll)*tr.clientWidth*.82,behavior:"smooth"});return;}

  const fc=q("[data-film]"); if(fc){openSheet(sheetFilm(filmById[fc.dataset.film]),fc);return;}
  const shc=q("[data-show]"); if(shc){openSheet(sheetShow(showById[shc.dataset.show]),shc);return;}
  const ec=q("[data-event]"); if(ec){openSheet(sheetEvent(EVENTS.find(x=>x.id===ec.dataset.event)),ec);return;}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(document.getElementById("scrim")&&!document.getElementById("scrim").hidden){closeSheet();return;}
  if(S.drawer){S.drawer=false;render();}
});
/* live search */
let qTimer=null;
document.addEventListener("input",e=>{
  if(e.target.id!=="q")return;
  S.q=e.target.value; S.qFocus=true;
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>render(),160);
});

function fatal(e){
  const msg=(e&&(e.message||e))+"";
  if(window.__sofiaPanel){window.__sofiaPanel(msg);return;}
  const app=document.getElementById("app");
  if(!app)return;
  app.innerHTML=`<div style="max-width:560px;margin:56px auto;padding:0 20px;font:15px/1.6 system-ui;color:#B6ABBC">
    <div style="font:700 13px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:#E0163A;margin-bottom:14px">Sofia Gleda</div>
    <h1 style="font:600 20px/1.3 system-ui;color:#F4EFF6;margin:0 0 10px">Приложението не можа да се зареди</h1>
    <p style="margin:0 0 16px">Най-честата причина са запазени стари настройки. Изчистването им решава проблема и ще
       те върне към първоначалните въпроси.</p>
    <button id="hardreset" style="padding:11px 20px;border-radius:10px;background:#E0163A;color:#fff;border:0;
      font:600 14px system-ui;cursor:pointer">Изчисти и опитай пак</button>
    <details style="margin-top:22px"><summary style="cursor:pointer;font-size:13px">Техническа подробност</summary>
      <pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#7E7386;margin-top:8px">${
        String(msg).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</pre></details>
  </div>`;
  const rb=document.getElementById("hardreset");
  if(rb)rb.onclick=()=>{try{localStorage.removeItem(LS);}catch(e){}location.reload();};
}
function boot(){ if(S.onb){document.documentElement.setAttribute("data-surface","cinema");
    document.getElementById("app").innerHTML=renderOnb();} else render(); }
const origRender=render;
render=function(){
  try{
    if(S.onb){document.documentElement.setAttribute("data-surface",S.prefs.track==="theatre"?"theatre":"cinema");
      document.getElementById("app").innerHTML=renderOnb();}
    else {origRender();mountProgressive();}
  }catch(e){ fatal(e); }
};
try{ boot(); if(!S.onb)openFromHash(); }catch(e){ fatal(e); }
window.addEventListener("error",e=>{
  const app=document.getElementById("app");
  if(app&&app.innerHTML.indexOf("Зареждане на програмата")>-1) fatal(e.error||e.message);
});
</script>

<script>
/* Register the service worker: instant repeat loads + offline. Non-fatal on
   failure — the app works without it. Registered after load so it never
   competes with first paint. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
