<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A0F">
<meta name="color-scheme" content="dark">
<meta name="description" content="Sofia Gleda — what's on in Sofia: cinema and theatre in one place.">
<link rel="manifest" href="manifest.webmanifest">
<!-- icon.svg uses embedded data: PNG tiles inside masks; browsers block nested
     data: URIs in SVG favicons (opaque origin restriction) — SVG renders blank.
     make_icons.py composites those tiles correctly into real PNGs, used here. -->
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sofia Gleda">
<title>Sofia Gleda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- loaded non-blocking: a stalled font request must never hold up first paint.
     Every rule declares a real fallback stack, so the page is fully usable
     before (or without) the webfonts. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Onest:wght@400;500;600;700&display=swap"></noscript>

<style>
:root{
  --ink:#0C0A0F; --ink-2:#141018; --ink-3:#1C1622; --ink-4:#28202F;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --fg:#F4EFF6; --fg-2:#B6ABBC; --fg-3:#7E7386;
  --crimson:#E0163A; --gild:#D9B23C;
  --accent:var(--crimson); --on-accent:#fff;
  --shadow:0 20px 48px rgba(0,0,0,.55);
  --r:12px; --r-lg:20px;
  color-scheme:dark;
}
:root[data-surface="theatre"]{ --accent:var(--gild); --on-accent:#17110B; }
/* Dark mode is forced — there is no light theme. The former
   `@media (prefers-color-scheme: light)` and `:root[data-theme="light"]` blocks
   were removed so a device set to light does not recolour the app; `color-scheme:dark`
   on :root above keeps native controls, scrollbars, and form fields dark too. */

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; background:var(--ink); color:var(--fg);
  font-family:"Onest","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
.wrap{max-width:none; margin:0; padding-inline:16px}
@media(min-width:900px){ .wrap{padding-inline:40px} }
@media(min-width:1440px){ .wrap{padding-inline:56px} }
/* the header spans the full viewport, content fluid to 100% */
.bar .wrap{padding-inline:14px}
@media(min-width:900px){ .bar .wrap{padding-inline:28px} }
@media(min-width:1440px){ .bar .wrap{padding-inline:40px} }

/* ---------- header ---------- */
/* Desktop: position:sticky, single row. Mobile: two rows (logo centred + controls).
   The logo row is allowed to scroll away; the controls row stays pinned via a
   negative top offset equal to the logo row height (28px logo + 14px padding-block + 10px gap = 52px).
   --logo-row-h is the single source of truth so the pinned offset cannot drift. */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:60;
  background:color-mix(in srgb,var(--ink) 92%,transparent); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding-block:14px}
/* three zones: brand left · search centre · controls right */
.bar-in{display:grid; grid-template-columns:1fr minmax(0,auto) 1fr; align-items:center; gap:18px}
.brand{display:flex; align-items:center; gap:9px; justify-self:start; min-width:0;
  background:none; border:0; padding:0; margin:0; cursor:pointer; font:inherit; -webkit-tap-highlight-color:transparent}
.brand-logo{height:clamp(32px,3.2vw,42px); width:auto; flex:0 1 auto; min-width:0; max-width:100%;
  object-fit:contain; display:block; transition:filter .15s}
.brand:hover .brand-logo{filter:brightness(1.12)}
.brand b{font-family:Oswald,"Arial Narrow",sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,30px);
  letter-spacing:.15em; text-transform:uppercase; color:var(--accent); line-height:1; white-space:nowrap;
  transition:opacity .15s, filter .15s}
.brand:hover b{filter:brightness(1.12)}
.brand:active b{opacity:.7}
.brand span{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap}
.bar-controls{display:flex; align-items:center; gap:8px; justify-self:end}
@media(max-width:820px){ .brand span{display:none} }
/* ── Mobile layout (≤760px) ──
   Row 1: logo centred (scrolls away).
   Row 2: [seg toggle expands] [lang 42px] [search icon 42px] [burger 42px] — one line, never wraps.
   Row 3: full-width search field (only when S.searchOpen).
   --logo-row-h = 28px logo + 14px padding-block-top + 10px gap between rows = 52px.
   The negative top hides the logo row; the controls row is then 8px below safe-area-inset-top. */
/* ── Mobile layout (≤760px) — JS also detects this and renders mobile HTML ── */
/* Row 1: 3-column grid — left placeholder | logo centred | lang button right.
   Row 2: seg toggle (fills width) + search icon.
   Row 3 (optional): full-width open search field when S.searchOpen.
   --logo-row-h = 42px row (the language button is the tallest item) + 14px padding-block-top + 10px gap = 66px. */
@media(max-width:760px){
  :root{ --logo-row-h:66px } /* 42px row (language button) + 14px top padding + 10px gap */
  .bar{top:calc(env(safe-area-inset-top,0px) - var(--logo-row-h) + 8px)}
  .bar-row-logo{display:grid; grid-template-columns:42px 1fr 42px; align-items:center; margin-bottom:10px; gap:0}
  .bar-row-logo .brand{justify-self:center; grid-column:2}
  .bar-row-logo .lang-right{grid-column:3; justify-self:end}
  .bar-row-controls{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; overflow:hidden}
  .bar-row-search{width:100%}
  .brand b{font-size:19px; letter-spacing:.08em}
  .brand-logo{height:28px}
  /* mobile search icon button — inherits .iconb; only expanded override needed here */
  /* mobile open search field */
  .bar-row-search .search{position:relative; width:100%; max-width:none}
  /* mobile period header: date range on its own line, no wrap */
  .phead-title{font-size:clamp(28px,7vw,36px)}
  .phead-dates{display:block!important; white-space:nowrap; font-size:clamp(15px,4.5vw,20px)}
}
/* ── Segmented toggle — FIXED equal halves, language-independent ──
   Total fixed width: 220px desktop / auto-expands on mobile to fill remaining space.
   Height: 44px. Each half: 1fr grid cell with icon + label, accent on active. */
.seg{display:grid; grid-template-columns:1fr 1fr; background:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex:0 0 auto; width:220px}
.seg button{display:flex; align-items:center; justify-content:center; gap:6px; height:40px; border-radius:999px; font-size:13px; font-weight:600; color:var(--fg-2); white-space:nowrap; transition:background .18s,color .18s; padding:0 8px; overflow:hidden}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:700}
.seg button svg{flex:0 0 18px; width:18px; height:18px}
/* mobile: seg fills remaining width (must come AFTER the base width:220px rule) */
@media(max-width:760px){ .seg{flex:1 1 0!important; min-width:0; width:auto!important} }
/* at very narrow viewports, drop the SVG icons from toggle to save space */
@media(max-width:350px){ .seg button svg{display:none} }
.iconb{width:42px; height:42px; flex:0 0 42px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg-2); font-size:13px; font-weight:700; display:grid; place-items:center}
.iconb:hover{border-color:var(--line-2); color:var(--fg)}
.search-icon-btn.expanded{border-color:var(--accent); color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,var(--ink-3))}

/* ---------- controls ---------- */
/* Desktop: search is the expand-on-demand panel, not always visible.
   The iconb search-icon-btn lives in bar-controls (far right-ish).
   When expanded, .desk-search-wrap grows into view from the right side. */
.desk-search-wrap{display:flex; align-items:center; gap:0; overflow:hidden; max-width:0; transition:max-width .2s ease-out}
.desk-search-wrap.open{max-width:420px}
.desk-search-wrap .search{position:relative; width:420px; max-width:420px; min-width:0}
.search input{width:100%; padding:11px 40px; border-radius:999px; border:1px solid var(--line);
  background:var(--ink-3); color:var(--fg); font:inherit; font-size:15px}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{outline:none; border-color:var(--accent)}
.search .mag{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:15px; pointer-events:none}
.search .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--fg-3); font-size:16px;
  width:24px; height:24px; border-radius:50%; display:none; place-items:center}
.search.has .clr{display:grid}
.search.search-mob-open .clr{display:grid}
/* .burger removed — drawer is opened by .fab and period-banner link only */
.drawer-scrim{position:fixed; inset:0; z-index:100; background:rgba(5,3,7,.6); backdrop-filter:blur(3px)}
.drawer{position:fixed; top:0; right:0; bottom:0; z-index:101; width:min(380px,88vw);
  background:var(--ink-2); border-left:1px solid var(--line); overflow-y:auto;
  padding:18px 18px calc(28px + env(safe-area-inset-bottom,0px)); box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer h3{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--fg-3); margin:20px 0 9px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.drawer h3:first-of-type{margin-top:6px}
.drawer-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:4px}
.drawer-top b{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.14em; text-transform:uppercase}
.dclose{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:14px; color:var(--fg-2)}
.chipwrap{display:flex; gap:6px; flex-wrap:wrap}
.mrow{display:flex; gap:6px; margin-bottom:9px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal button{aspect-ratio:1; border-radius:8px; border:1px solid transparent; background:var(--ink-3);
  font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg-2); display:grid; place-items:center; position:relative}
.cal button:hover{border-color:var(--line-2)}
.cal button[disabled]{opacity:.26; cursor:default; background:transparent}
.cal button.has::after{content:""; position:absolute; bottom:4px; width:3px; height:3px; border-radius:50%; background:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.cal button[aria-pressed="true"]::after{background:var(--on-accent)}
.cal button.inrange{background:color-mix(in srgb,var(--accent) 26%,transparent); color:var(--fg-1); border-radius:0}
.cal button.rstart{border-top-left-radius:8px; border-bottom-left-radius:8px}
.cal button.rend{border-top-right-radius:8px; border-bottom-right-radius:8px}
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:8px}
.calmon{font-size:13px; font-weight:600; color:var(--fg-1); text-align:center; flex:1}
.calarrow{width:32px; height:32px; flex:none; border-radius:8px; border:1px solid var(--line-2);
  background:var(--ink-3); color:var(--fg-1); font-size:17px; line-height:1; cursor:pointer; display:grid; place-items:center}
.calarrow:hover:not([disabled]){border-color:var(--accent); color:var(--accent)}
.calarrow[disabled]{opacity:.3; cursor:default}
.calhint{margin-top:9px; font-size:11px; color:var(--fg-3); text-align:center; min-height:14px}
.caldow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px}
.caldow span{text-align:center; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3)}
.applyb{width:100%; margin-top:22px}
.until{font-size:11px; color:var(--fg-3); margin-top:7px; line-height:1.45}
.lastcheck{font-size:10.5px; letter-spacing:.06em; color:var(--fg-3); margin-top:16px; padding-top:12px; border-top:1px solid var(--line)}
.controls{padding-block:14px 4px; display:flex; flex-direction:column; gap:10px}
.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto; min-width:58px; padding:6px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--ink-2); text-align:center; line-height:1.2; transition:border-color .15s,background .15s}
.day:hover{border-color:var(--line-2)}
.day[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.day .dow{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
.day .dnum{display:block; font-family:Oswald,sans-serif; font-size:16px; font-weight:600}
.day .dall{font-family:Oswald,sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.06em}
.fbar{display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
.fbar::-webkit-scrollbar{display:none}
.sbar{position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:10px;
  padding:9px 12px; background:color-mix(in srgb,var(--ink-2) 94%,transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.sback{display:flex; align-items:center; gap:7px; padding:7px 13px 7px 9px; border-radius:999px;
  border:1px solid var(--line-2); font-size:13px; font-weight:600; color:var(--fg)}
.sback:hover{border-color:var(--accent); color:var(--accent)}
.sgrab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:8px auto 0; display:none}
@media(max-width:620px){ .sgrab{display:block} .scrim{padding:0; place-items:end center}
  /* Higher specificity (.scrim .sheet) so these win over the base `.sheet`
     rule, which is defined LATER in the file: without it the base
     `overflow:hidden` overrode `overflow-y:auto` and the bottom sheet could not
     scroll on mobile, clipping everything past 94vh. */
  .scrim .sheet{width:100%; border-radius:18px 18px 0 0; margin-bottom:0; max-height:94vh;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain} }
.fchip{padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--ink-2);
  font-size:12px; color:var(--fg-2); transition:border-color .15s,background .15s; white-space:nowrap}
.fchip:hover{border-color:var(--line-2)}
.fchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.fchip.off,.fchip:disabled{opacity:.4; pointer-events:none; text-decoration:line-through; text-decoration-thickness:1px}
.fclear{font-size:11.5px; color:var(--fg-3); text-decoration:underline; text-underline-offset:3px; padding:5px 4px}

/* ---------- hero ---------- */
.hero{position:relative; border-radius:var(--r-lg); overflow:hidden; margin-block:18px 30px;
  min-height:290px; display:flex; align-items:flex-end; border:1px solid var(--line)}
@media(min-width:800px){ .hero{min-height:340px} }
.hero-art{position:absolute; inset:0; z-index:0}
.hero-scrim{position:absolute; inset:0; z-index:1;
  background:linear-gradient(100deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.74) 40%,rgba(0,0,0,.26) 76%,rgba(0,0,0,.5) 100%)}
.hero-body{position:relative; z-index:2; padding:24px 20px; max-width:620px; color:#F4EFF6}
@media(min-width:800px){ .hero-body{padding:38px 42px} }
.eyebrow{font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; font-weight:700;
  color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
[data-surface="theatre"] .eyebrow{color:var(--gild)}
.eyebrow .dot{width:5px; height:5px; border-radius:50%; background:currentColor}
.hero h1{font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(28px,5.6vw,52px); line-height:1; margin-bottom:11px}
[data-surface="theatre"] .hero h1{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  font-weight:800; letter-spacing:-.015em; font-size:clamp(26px,5vw,46px); line-height:1.04}
.hero-meta{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:11px; font-size:12.5px; color:#CCC2D0}
.hero-syn{font-size:14px; color:#DBD2DE; margin-bottom:17px; max-width:54ch}
.acts{display:flex; gap:9px; flex-wrap:wrap}
.btn{padding:10px 20px; border-radius:10px; font-weight:600; font-size:13.5px;
  background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); transition:filter .16s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.26); color:#fff; backdrop-filter:blur(6px)}
.btn.sm{padding:7px 14px; font-size:12.5px}

/* ---------- rails ---------- */
.rail{margin-bottom:44px}
.rhead{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.rhead h2{font-family:Oswald,sans-serif; font-weight:600; font-size:clamp(20px,2.2vw,26px);
  letter-spacing:.06em; text-transform:uppercase; color:var(--fg); display:flex; align-items:center; gap:10px}
.rhead h2::before{content:""; display:inline-block; width:4px; height:.9em; border-radius:2px;
  background:var(--accent); flex:0 0 4px}
[data-surface="theatre"] .rhead h2{font-family:"Playfair Display",Georgia,serif; text-transform:none;
  letter-spacing:0; font-size:clamp(24px,2.6vw,30px)}
.rhead .sub{font-size:11.5px; color:var(--fg-3)}
.rscroll{position:relative}
.rtrack{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:6px; scroll-behavior:smooth; scrollbar-width:thin}
.rtrack::-webkit-scrollbar{height:5px}
.rtrack::-webkit-scrollbar-thumb{background:var(--ink-4); border-radius:9px}
.rarrow{position:absolute; top:34%; z-index:5; width:32px; height:62px; border-radius:10px;
  background:color-mix(in srgb,var(--ink) 84%,transparent); border:1px solid var(--line-2);
  display:none; place-items:center; font-size:17px; backdrop-filter:blur(6px)}
@media(min-width:900px){ .rscroll:hover .rarrow{display:grid} }
.rarrow.prev{left:-8px} .rarrow.next{right:-8px}

/* ---------- card + generated poster ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px 12px}
@media(min-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))} }
.card{flex:0 0 auto; width:158px; scroll-snap-align:start; text-align:left; display:flex; flex-direction:column; gap:7px;
  transition:transform .22s cubic-bezier(.22,1,.36,1)}
.grid .card{width:auto}
@media(min-width:760px){ .card{width:180px} }
.card:hover{transform:translateY(-5px)}
.poster{position:relative; aspect-ratio:2/3; max-width:100%; border-radius:var(--r); overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:flex-end;
  padding:11px; color:#fff; isolation:isolate}
.p-art{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.p-real{object-fit:cover; max-width:none}
/* a real poster carries its own title, so the generated lockup steps back */
.poster:has(.p-real) .p-title,.poster:has(.p-real) .p-sub{display:none}
.poster:has(.p-real) .p-grain{background:linear-gradient(to top,rgba(0,0,0,.55),transparent 42%)}
.shero:has(.p-real) .p-real{filter:blur(2px) brightness(.62)}
/* wide event cards (.ebox) are landscape; a real poster fills the box (cover)
   on its own layer above the generated SVG but below the grain + text, with a
   stronger scrim so the badge, title, and date stay legible over the art. */
.ebox .p-real{z-index:1; width:100%; height:100%; object-fit:cover; object-position:center 22%}
.ebox:has(.p-real) .p-grain{background:
  linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.32) 46%,rgba(0,0,0,.08) 78%),
  linear-gradient(to bottom,rgba(0,0,0,.5),transparent 34%)}
.p-grain{position:absolute; inset:0; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
             radial-gradient(130% 80% at 50% 105%,rgba(0,0,0,.72),transparent 62%)}
.p-title{position:relative; z-index:3; font-family:Oswald,sans-serif; font-weight:600; text-transform:uppercase;
  font-size:16px; line-height:1.04; text-shadow:0 2px 14px rgba(0,0,0,.7);

const EVENTS=[{"id":"den-na-sofia","kind":"city","scope":"both","status":"active","title":"Ден на София — 17 септември","titleEn":"Sofia Day — 17 September","from":"2026-09-17","to":"2026-09-17","g":["#B3122D","#2A0308"],"blurbBg":"Празникът на града: свободен вход във всички общински музеи и галерии за целия ден, тържествена сесия на Столичния общински съвет, водосвет пред „Св. София“, танцов спектакъл в парк „Заимов“ (17:30), концерт и огнено шоу на сцената на ул. „Алабин“ (19:00) и визуален танцов спектакъл „Граници на реалността“ в Западната порта на Сердика (20:30).","blurbEn":"The city's feast day: free entry to every municipal museum and gallery all day, a solemn session of the City Council, a water blessing at St Sofia, a dance spectacle in Zaimov Park (17:30), a concert and fire show on the Alabin Street stage (19:00), and the visual dance piece Boundaries of Reality at the Western Gate of Serdica (20:30).","tag":"ЕДИН ДЕН В ГОДИНАТА","source":"БТА / Столична община"},{"id":"az-sam-sofia","kind":"festival","scope":"theatre","status":"active","title":"Фестивал „Аз съм София“","titleEn":"\"I Am Sofia\" Festival","from":"2026-09-17","to":"2026-09-23","g":["#C9A227","#2A2003"],"blurbBg":"Седем дни програма в парка на НДК около празника на града — улична сцена, концерти, детски и спортни формати. Започва на 17 септември.","blurbEn":"Seven days of programming in NDK Park around the city's feast day — a street stage, concerts, children's and sports formats. Opens 17 September.","tag":"7 ДНИ","source":"Столична община"},{"id":"panair-na-kuklite","kind":"festival","scope":"theatre","status":"active","title":"Панаир на куклите","titleEn":"The Puppet Fair","from":"2026-09-15","to":"2026-09-17","g":["#7E22CE","#180420"],"blurbBg":"Столичен куклен театър изнася куклите на улицата: гигантски „Жирафи“ и „Фалшивият оркестър“ със свободен достъп, творчески работилници за деца и родители, и гостуване на гръцката компания Hop Signor със спектакъла „Синьо“.","blurbEn":"Sofia Puppet Theatre takes its puppets outdoors: the giant Giraffes and The Fake Orchestra with free entry, workshops for children and parents, and Greek company Hop Signor guesting with BLUE.","tag":"СВОБОДЕН ДОСТЪП","source":"Столичен куклен театър / theatre.art.bg"},{"id":"sneakpeak-fest","kind":"festival","scope":"theatre","status":"active","title":"SNEAKPEAK FEST'26","titleEn":"SNEAKPEAK FEST'26","from":"2026-09-19","to":"2026-09-19","g":["#BE123C","#22050D"],"blurbBg":"Един ден в Топлоцентрала за спектакли в процес на работа — млади хореографи и режисьори показват незавършени неща пред публика. Зала 1, от 13:00.","blurbEn":"One day at Toplocentrala for work in progress — young choreographers and directors show unfinished pieces to an audience. Hall 1, from 13:00.","tag":"ЕДИН ДЕН","source":"Топлоцентрала"},{"id":"oasis-screening","kind":"limited","scope":"cinema","status":"active","title":"Oasis: Don't Look Back In Anger","titleEn":"Oasis: Don't Look Back In Anger","from":"2026-09-15","to":"2026-09-17","g":["#166534","#04150B"],"blurbBg":"Концертно-документален филм за завръщането на Oasis, в ограничен брой прожекции — Cinema City Sofia и Paradise, Cine Grand Ring и Дом на киното.","blurbEn":"The Oasis reunion concert documentary, on a limited run — Cinema City Sofia and Paradise, Cine Grand Ring and Cinema House.","tag":"ОГРАНИЧЕНИ ПРОЖЕКЦИИ","source":"programata.bg"},{"id":"retro-70mm","kind":"limited","scope":"cinema","status":"active","title":"Класики на голям екран","titleEn":"Classics on the Big Screen","from":"2026-09-15","to":"2026-09-17","g":["#155E75","#04141A"],"blurbBg":"„Терминатор 2: Страшният съд“ и „2001: Една одисея в космоса“ се връщат в салоните, а „Колите“ върви в юбилейно издание за 20 години от премиерата. Дом на киното показва 2001 на 15 септември в 20:01.","blurbEn":"Terminator 2 and 2001: A Space Odyssey return to cinemas, and Cars runs in a 20th-anniversary edition. Cinema House screens 2001 on 15 September at 20:01.","tag":"РЕТРОСПЕКТИВА","source":"programata.bg / domnakinoto.com"},{"id":"cinelibri","kind":"festival","scope":"cinema","status":"upcoming","title":"Синелибри 2026 — „Цивилизация на зрелището“","titleEn":"CineLibri 2026 — \"Civilization of the Spectacle\"","from":"2026-10-15","to":"2026-11-08","g":["#B3122D","#26040A"],"blurbBg":"Кино-литературният фестивал се връща с над 70 заглавия от около 30 държави под мотото „Цивилизация на зрелището“ по есето на Марио Варгас Льоса. Открива на 15 октомври в Зала 1 на НДК. В програмата: документални филми за Керуак, Достоевски, Салман Рушди, Сири Хуствет и Хавиер Серкас, и официална премиера на „Ангеловото петокнижие“ за Анжел Вагенщайн. Прожекции в София и шест други града.","blurbEn":"The film-and-literature festival returns with 70+ titles from around 30 countries under the motto \"Civilization of the Spectacle\", after Mario Vargas Llosa's essay. Opens 15 October in NDK Hall 1. Documentaries on Kerouac, Dostoevsky, Salman Rushdie, Siri Hustvedt and Javier Cercas, and the official premiere of Angelov Pentateuch on Angel Wagenstein. Sofia plus six other cities.","tag":"СЛЕД 30 ДНИ","source":"sofialive.bg"},{"id":"cirkolyuciya","kind":"festival","scope":"theatre","status":"upcoming","title":"ЦИРКОЛЮЦИЯ 2026","titleEn":"CIRCOLUTION 2026","from":"2026-09-25","to":"2026-09-27","g":["#EA580C","#2B0E02"],"blurbBg":"Три дни съвременен цирк в Топлоцентрала: „От девет до пет“ на Асаф Мор (Франция), „Магичното шоу“ на Дани Белев, „Да умреш от смях“ на Открития театър и LUMO.","blurbEn":"Three days of contemporary circus at Toplocentrala: Asaf Mor's Nine to Five (France), Dani Belev's Magic Show, Dying of Laughter in the Open Theatre, and LUMO.","tag":"СЛЕД 10 ДНИ","source":"toplocentrala.bg"},{"id":"fizika-na-tagata","kind":"premiere","scope":"theatre","status":"upcoming","title":"„Физика на тъгата“ — Народен театър","titleEn":"\"The Physics of Sorrow\" — National Theatre","from":"2026-10-06","to":"2026-10-07","g":["#1F3A5F","#060D17"],"blurbBg":"Премиера по романа на Георги Господинов в постановка на словенеца Йерней Лоренци, с Валентин Ганев, Теодора Духовникова и Параскева Джукелова. 6 и 7 октомври.","blurbEn":"Premiere of Georgi Gospodinov's novel staged by Slovenian director Jernej Lorenci, with Valentin Ganev, Teodora Duhovnikova and Paraskeva Djukelova. 6 and 7 October.","tag":"ПРЕМИЕРА ПРЕЗ ОКТОМВРИ","source":"paragraf.bg"},{"id":"lumiere-retro","kind":"limited","scope":"cinema","status":"active","title":"Ретроспекции в Кино Люмиер","titleEn":"Retrospectives at Lumiere Cinema","from":"2026-09-17","to":"2026-10-11","g":["#1C1917","#000000"],"blurbBg":"Авторска поредица в Зала 11 на НДК — по един режисьор на прожекция, 19:00. Започва на 17 септември с „Рашомон“ на Акира Куросава (1950). Следват: Дейвид Линч, „Изгубена магистрала“ (24 септември), Уонг Кар-уай, „Любовно настроение“ (2 октомври, с английски субтитри), Пак Чан-ук, „Прислужницата“ (4 октомври), и два Ходоровски — „Къртицата“ (10 октомври) и „Свещената планина“ (11 октомври).","blurbEn":"An auteur series in NDK's Hall 11 — one director per screening, 19:00. Opens 17 September with Kurosawa's Rashomon (1950), followed by Lynch's Lost Highway (24 Sept), Wong Kar-wai's In the Mood for Love (2 Oct, English subtitles), Park Chan-wook's The Handmaiden (4 Oct), and two Jodorowsky nights — El Topo (10 Oct) and The Holy Mountain (11 Oct).","tag":"ПОРЕДИЦА · 6 ВЕЧЕРИ","source":"ndk.bg"}];

const FILMINFO = {"odiseya":{"synBg":"Този юли легендите не се разказват – те се преживяват! Ненадминатият майстор на епичния киноспектакъл Кристофър Нолан пренася на големия екран един от най-великите митологични разкази в човешката история – Одисея на Омир. С характерния си визуален размах, Нолан комбинира мит и човешка драма в мащабен епос за оцеляването, паметта и завръщането и обещава едно от най-паметните филмови събития на десетилетието.","dir":"Кристофър Нолан","cast":"Мат Деймън, Том Холанд, Зендея, Ан Хатауей, Робърт Патинсън","src":"https://programata.bg/kino/filmi/odiseya/","genres":["Драма"],"pv":4},"spider-man":{"synBg":"Четири години след събитията в Няма път към дома, вече съзрелият Питър живее изцяло сам, след като доброволно е изтрил себе си от живота и спомените на любимите си хора. Превърнал се в защитник на Ню Йорк, където никой вече не го познава, той отдава целия си живот на опазването на града. Но интензивността на задачите води до изненадваща физическа еволюция, която застрашава съществуването му, докато мистериозна вълна от престъпления поражда един от най-мощните противници, с които някога се е срещал.","dir":"Дестин Даниъл Кретън","cast":"Том Холанд, Зендeя, Сейди Синк, Джейкъб Баталон, Джон Бърнтал","src":"https://programata.bg/kino/filmi/spajdar-men-nov-den/","pv":4},"koyota":{"synBg":"Койота срещу Акме проследява забавните приключения на Уили Койота, който след безброй неуспешни опити да залови Бързоходеца решава най-накрая да потърси сметка от Акме – компанията, чиито шантави изобретения непрекъснато се провалят. Заедно с млад адвокат той се впуска в щура и изпълнена с обрати битка срещу могъщата корпорация, разкривайки тайни, неочаквани съюзници и куп забавни изненади по пътя.","dir":"Дейв Грийн","src":"https://programata.bg/kino/filmi/kojota-sresthu-akme/","genres":["Анимация","Комедия"],"pv":4},"kurierat":{"synBg":"Ханк Малоун е опитен куриер, който трябва да достави донорски орган до болница в рамките на три часа, за да спаси живота на седемгодишно момиче, нуждаещо се от спешна трансплантация. Привидно рутинната мисия бързо се превръща в смъртоносна, след като лидерът на опасен престъпен синдикат решава на всяка цена да се сдобие с органа. В надпреварата се включва и Бен Бишъп – медицински куриер, когото Ханк е принуден да придружава и защитава…","dir":"Скот Уо","cast":"Алън Ричсън, Оуен Уилсън, Лейла Джордж, Родриго Санторо, Пета Сержант","src":"https://programata.bg/kino/filmi/kurierat/","genres":["Екшън","Комедия"],"pv":4},"prilozhna-2":{"synBg":"Приложна магия 2 ни пренася в свят на лунни тайнства и могъщи древни заклинания. Сестрите Оуенс отново трябва да се изправят срещу мрачното проклятие, което заплашва да унищожи семейството им завинаги. Очаква ни едно вълшебно изживяване, изпълнено с много смях, магия и семеен уют.","dir":"Сузане Биер","cast":"Сандра Бълок, Никол Кидман, Джоуи Кинг, Мейзи Уилямс, Даян Уийст","src":"https://programata.bg/kino/filmi/prilozhna-magiya-2/","pv":4},"insidious":{"synBg":"На 21 август франчайзът, който обсеби едно поколение, се преобръща из основи. След повече от петнайсет години, в които Коварен капан ни отвеждаше в Отвъдното и обитаваше кошмарите ни, емблематичната хорър поредица се завръща в кината с най-страшната и съдбоносна история досега – Коварен капан: Бягство от отвъдното . Правилата вече не важат, защото злото е намерило начин да избяга.","dir":"Джейкъб Чейс","cast":"Амелия Ив, Лин Шей, Брандън Переа, Мейзи Ричардсън-Селърс, Сам Спруел","src":"https://programata.bg/kino/filmi/kovaren-kapan-byagstvo-ot-otvadnoto/","pv":4},"pes-patrul":{"synBg":"В разгара на лятото в кината ни очаква филмово събитие с праисторически размери! На 14 август обичаният от милиони деца по света феномен Пес патрул се завръща на големия екран с ново, гигантско приключение отвъд Адвенчър бей. Пес патрул: Дино филмът отвежда любимите четириноги герои до мистериозен остров, където от тяхната мисия зависи оцеляването на цял един Изгубен свят.","src":"https://programata.bg/kino/filmi/pes-patrul-dino-filmat/","genres":["Анимация"],"pv":4},"buntovnikat":{"synBg":"Коул Рийд e енигматичен мъж със силно чувство за дълг и лоялност, който попада в центъра на международен заговор, след като неговият работодател е убит пред очите му. Обвинен несправедливо и превърнат в издирван беглец, той е принуден да действа извън закона, докато постепенно разкрива мрежа от престъпни интереси, корупция и трафик на хора. В хода на своето бягство, Коул се превръща в човек с ясна цел – да извади истината наяве, независимо от цената.","dir":"Жан-Франсоа Рише","cast":"Джейсън Стейтъм, Анабел Уолис, Роланд Мьолер, Джейсън Уонг","src":"https://programata.bg/kino/filmi/buntovnikat/","genres":["Екшън"],"pv":4},"padane-2":{"synBg":"Съкрушена от смъртта на сестра си Хънтър, Джакс (Хариет Слейтър) се сближава с безстрашната ѝ приятелка Лус (Арсема Томас).","dir":"Майкъл Спириг, Питър Спириг","cast":"Хариет Слейтър, Арсема Томас, Том Бритни","src":"https://programata.bg/kino/filmi/padane-2-martva-tochka/","genres":["Драма","Приключенски","Трилър"],"pv":4},"terminator-2":{"synBg":"През 1997 г. оцелелите от ядрения апокалипсис водят безмилостна война срещу роботите и машините, които сами са създали. За да убият окончателно Джон Конър — водача на човешката съпротива — в миналото са изпратени два „киборга“. Тяхната мисия е да убият Конър, докато той все още е дете. Първият модел от серията „Терминатор“ се проваля през 1984 г. Вторият модел, изграден от променящ се течен метал, е много по-напреднал и започва преследване на детето и неговата майка Сара през 90-те години. Хората от бъдещето изпращат Терминатор, който да защити младия Конър. Двубоят между двата робота придобива титанични измерения. Докато момчето учи Терминатора на човечност, майка му се опитва да предотврати създаването на първите интелигентни машини. Заедно с Терминатора, когото са научили на човешки ценности, те ще се борят, за да променят бъдещето.","dir":"Джеймс Камерън","cast":"Арнолд Шварценегер, Линда Хамилтън, Едуард Фърлонг, Робърт Патрик, Ърл Боен","src":"https://programata.bg/kino/filmi/terminator-2-strashniyat-sad/","genres":["Екшън"],"pv":4},"kolite":{"synBg":"Първокласната състезателна кола – новобранец Маккуин светкавицата живее живот на бързи обороти, докато не се отклонява по пътя към най-важното състезание в живота си. Заседнал в Радиатор спрингс, забравен град по стария маршрут 66, той среща Сали, Матю, Док Хъдсън и множество странни същества, които му помагат да открие, че животът е нещо повече от трофеи и слава…","dir":"John Lasseter","src":"https://programata.bg/kino/filmi/kolite-20-godini-ot-premierata/","genres":["Анимация"],"pv":4},"prada-2":{"synBg":"Този април едно от най-емблематичните заглавия на XXI век се завръща на големия екран. Дяволът носи Прада 2 отново ни отвежда в безкомпромисния свят на висшата мода – място, където стилът е оръжие, амбицията е валута, а всяко решение има своята цена. Продължението на модерната класика от 2006 г. обещава нов поглед към познатата вселена, в която блясъкът върви ръка за ръка с напрежението, а успехът никога не идва без жертви.","dir":"Дейвид Франкел","cast":"Мерил Стрийп, Ан Хатауей, Емили Блънт, Станли Тучи, Джъстин Теру","src":"https://programata.bg/kino/filmi/dyavolat-nosi-prada-2/","genres":["Комедия"],"pv":4},"minoni":{"synBg":"Този юли в кината пристига най-новото щуро приключение от любимата анимационна поредица – Миньони & чудовища . Филмът ни връща назад във времето – в бляскавия Холивуд на 20-е години, когато киното тепърва се превръща в глобален феномен. Именно тогава миньоните откриват мечтаното място за своя хаос и не след дълго се превръщат в истински сензации на големия екран. Но както винаги при тях, пътят към славата бързо излиза извън контрол и води до поредица от катастрофални последствия.","dir":"Пиер Кофен","cast":"български дублаж: Весела Манолова, Георги Стоянов, Даниел Кукушев, Елена Бойчева, Константин Икономов и др","src":"https://programata.bg/kino/filmi/minoni-i-chudovistha/","pv":4},"naslednikat":{"synBg":"В изолиран аристократичен вампирски орден осемнадесетгодишният Виктор Мордем е откъснат от човешкия си живот и хвърлен в древен ритуал, който определя кой е достоен да наследи властта. Неподготвен и презиран като „смеска“, той трябва да оцелее в три изпитания, където съюзите са крехки, предателството е неизбежно, а животът няма стойност. Докато благородната фасада на традицията започва да се пропуква, Виктор разбира, че зад езика на честта и морала се крие система, създадена да пази привилегиите на „чистите“. В свят, в който оцеляването изисква съучастие, той трябва да избере какво е готов да изгуби – живота си или човечността си.","dir":"Денислав Димчев","cast":"Башар Рахал, Йоана Буковска, Асен Блатечки, Калин Врачански, Китодар Тодоров","src":"https://programata.bg/kino/filmi/naslednikat/","genres":["Български"],"pv":4},"sablezab":{"synBg":"Капитан Саблезъб и неговата весела шайка пирати се завръщат в ново приключение, изпълнено с още повече обрати, още повече смях и още повече забавление за цялото семейство. И разбира се, с още повече ПИРАТСКИ ПЕСНИ!!!","dir":"Are Austnes, Yaprak Morali и Rasmus A. Sivertsen","cast":"Дублаж - Христо Узунов, Симона Стоянова, Даниела Йорданова, Варвара Панкова, Елисавета Господинова","src":"https://programata.bg/kino/filmi/kapitan-sablezab-i-grafinyata-na-grel/","genres":["Анимация"],"pv":4},"spa-uikend":{"synBg":"В духа на Палави мамчета и Последният ергенски запой , Спа уикенд е едновременно смешна и трогателна комедия за четири приятелки от детинство, които осъзнават, че някъде между кариерите, връзките, семействата и ежедневните отговорности са забравили как да се грижат за себе си и една за друга.","dir":"Скот Мур, Джон Лукас","cast":"Ясмин Касим, Мишел Буто, Лесли Ман, Айла Фишер, Ана Фарис","src":"https://programata.bg/kino/filmi/spa-uikend/","genres":["Комедия"],"pv":4},"palestina-36":{"synBg":"Редки архивни кадри подготвят разгръщането на сюжета и представляват удивителен контрапункт на драматичното действие: животът на смесица от народи в Йерусалим след разпадането на Османската империя, миграцията на европейските евреи, бягащи от нацистите, и британските опити да наложат колониално управление.","dir":"Анемари Жасир","cast":"Джереми Айрънс, Робърт Арамайо, Лиъм Кънингам, Хиам Абас, Били Хаул","src":"https://programata.bg/kino/filmi/palestina-36/","pv":4},"sasedite":{"synBg":"Бракът на Джо и Анджела е на ръба на пропастта.  Идва момент, в който всичко може да се срине тотално – денят, в който съседите от горния етаж идват на гости за вечеря. Ден, в който всичко, което може да се обърка, се обърква още повече…","cast":"Оливия Уайлд, Пенелопе Крус, Сет Роугън, Едуард Нортън","src":"https://programata.bg/kino/filmi/sasedite-otgore/","dir":"В ролите: О","genres":["Драма","Комедия","Романтика"],"pv":4},"gorchiva-koleda":{"synBg":"Елза е арт директор в рекламна агенция, чиято майка умира по време на дългата коледна ваканция. Погълната от работа и непрекъснато темпо, тя не си дава време да осъзнае и преживее загубата. След лична криза Елза решава да замине за остров Лансароте заедно със своята приятелка Патриша, която също има нужда да избяга от града и да се откъсне от ежедневието. Историята на двете жени се преплита с тази на сценарист и филмов режисьор, като постепенно разкрива паралели между техните преживявания. Филмът изследва тънката и често болезнена граница между живота и художествената измислица, показвайки как те взаимно се отразяват и преливат едно в друго.","dir":"Педро Алмодовар","cast":"Барбара Лени, Леонардо Сбараглиа, Айтана Санчес-Хихон, Виктория Луенго","src":"https://programata.bg/kino/filmi/gorchiva-koleda/","pv":4},"sirat":{"synBg":"Луис заедно със сина си Естебан се отправя към мароканската пустиня, за да търси изчезналата си дъщеря Марина. Двамата се присъединяват към поредното рейв парти в пустинята. По пътя си се сблъскват с физически и емоционални изпитания, които поставят под въпрос човешките им граници и морални убеждения. Филмът е изграден върху мощна звукова и визуална конструкция и е предизвикателство за сетивата и интелекта, изискващ от зрителя да се потопи в неговия свят и да се изправи пред собствените си страхове и надежди. Испанският режисьор Оливер Ласе успява да промени възприятията за киното като сетивно преживяване. Приет с овации на кинофестивала в Кан, Сират се очертава като една от най-смелите и въздействащи творби на годината.","dir":"Оливер Лаше","cast":"Сержи Лопес (Луис), Бруно Нунес Архона (Естебан), Стефания Гада (Стеф), Джошуа Лиъм Хердерсън (Джош)","src":"https://programata.bg/kino/filmi/sirat/","pv":4},"martva-hvatka":{"synBg":"Какво се случва, когато гневът на един малък човек срещу системата се превърне в телевизионен спектакъл? МЪРТВА ХВАТКА на култовия режисьор Гас Ван Сант с участието на легендата Ал Пачино и талантливата млада звезда Бил Скарсгард гледаме от 7 август в кината. Базиран на шокиращи действителни събития от 1977 г., новият филм на Гас Ван Сант ни среща с Тони Кирицис (Бил Скарсгард) – отчаян мъж, който отвлича сина на ипотечния си брокер с помощта на самоделен спусъчен механизъм. Залогът? 5 милиона долара, извинение и… всичко това, излъчвано на живо по телевизията под студения поглед на ексцентричния баща на жертвата (Ал Пачино). „Мъртва хватка“ не е просто ретро криминална драма, а визуално зашеметяващ и дълбок коментар за корпоративната безчувственост и медийната манипулация. С брилянтен черен хумор и изключителен актьорски състав, филмът обра овациите на фестивала във Венеция. Големият Гас Ван Сант се завръща в топ форма, за да ни покаже как системите се провалят точно тогава, когато имаме най-голяма нужда от тях.","dir":"Гас Ван Сант","cast":"Ал Пачино, Бил Скарсгард, Кари Елуис, Колман Доминго","src":"https://programata.bg/kino/filmi/martva-hvatka-2/","pv":4},"zavrashtaneto":{"synBg":"Одисей пристига на бреговете на Итака. Изминали са повече от 20 години, откакто е напуснал царството си, за да се бие в Троянската война. През цялото това време неговата съпруга и царица Пенелопа го е чакала. Синът им Телемах е изгубил вяра, че баща му ще се върне и се тревожи за живота на майка си, докато група все по-напористи кандидати я притискат да избере един от тях за нов цар. Почти неразпознаваем за себе си и за хората, които някога са го почитали като могъщ воин, Одисей бавно наближава замъка, виждайки как в негово отсъствие островът се е превърнал в пустиня. С нарастващо напрежение Пенелопа тъче червено платно и обещава, че ще си избере жених, след като то бъде завършено. Когато най-накрая Одисей влиза в схватка, Пенелопа подготвя емблематичен и мигновено разпознаваем тест за своя изнемощял цар, за да докаже, че е истинският сред гъмжилото от мъже, жадни за власт.","dir":"Уберто Пазолини","cast":"Жюлиет Бинош, Ралф Файнс, Чарли Плъмър, Маруан Кензари, Клаудио Сантамария","src":"https://programata.bg/kino/filmi/zavrasthaneto/","pv":4},"malkata-ameli":{"synBg":"Адаптиран по новелата на Амели Нотомб, този кратък и семпъл анимационен филм чудесно улавя удивлението от откриването на света през очите на малката белгийка Амели, която живее в Япония. Самата тя обаче, както и историята, която разказва в своя скицник, са прекалено преждевременно развити, до степен да придобият преувеличени, почти приказни измерения. Например Амели се ражда като зеленчук, преди по-късно внезапно да оживее и да направи първите си крачки, а първата ѝ дума не само е прахосмукачка, но почти веднага след нея идват цели изречения и пълноценни разговори.","src":"https://programata.bg/kino/filmi/malkata-ameli/","dir":"Лиан-Чо Хан и Майлис Валад","genres":["Анимация"],"pv":4},"finik-2":{"synBg":"В главните роли отново се завръщат Поли Генова като безстрашната Кристин и Явор Караиванов като пакостливия Финик. Непослушният фин активира древен магически артефакт, в резултат на което губи невидимостта си и излага целия таен свят на фините на огромна опасност. Заедно с вярната си приятелка Кристин и недоверчивия и самодостатъчен Тим (озвучен от Иван Радуловски), те се отправят на вълнуващо пътешествие, изпълнено с хумор и шантави приключения.","src":"https://programata.bg/kino/filmi/tajniyat-svyat-na-finik-2/","genres":["Анимация"],"pv":4},"sarceto-na-zveyara":{"synBg":"Сърцето на звяра проследява офицера от Специалните сили Джеймс Белмонт и четириногия му боен другар Один, които след тежка самолетна катастрофа остават блокирани в един от най-дивите и негостоприемни райони в Аляска, известен с прозвището Сърцето на звяра . Изолирани от всякаква помощ и изправени пред смъртоносни природни условия, двамата трябва да използват всяко умение и всеки инстинкт, за да оцелеят. Докато се борят със студа, дивите животни и изтощението, между тях се разгръща история за вярност, приятелство и взаимно спасение.","dir":"Дейвид Ейър","cast":"Брад Пит, Дж. К. Симънс, Ана Ламбе","src":"https://programata.bg/kino/filmi/sarczeto-na-zvyara/","genres":["Драма","Екшън"],"pv":4},"chuzhdenecat":{"synBg":"През 30-те години на миналия век в Алжир французинът Мьорсо демонстрира пълно безразличие към живота. Емоционалното му отчуждение води до убийство, последвано от съдебен процес, който разглежда както състава на престъплението, така и личността на извършителя.","dir":"Франсоа Озон","cast":"Бенжамен Воазен, Пиер Лотен, Суан Арло, Дени Лаван, Ребека Мардър и др","src":"https://programata.bg/kino/filmi/chuzhdeneczat/","pv":4},"kucheto-na-zlatyu":{"synBg":"Водени от неспокойния дух на художника Златю Бояджиев, двама съвременни артисти поемат на пътешествие, за да преосмислят неговото наследство, пресичайки границите между минало и настояще, реалност и фикция, ирония и тъга.","src":"https://programata.bg/kino/filmi/kucheto-na-zlatyu/","dir":"Петър Вълчанов, Кристина Грозева","genres":["Български"],"pv":4},"bashta-majka":{"synBg":"Новият филм на Джим Джармуш е тих и съзерцателен триптих, в който семейните връзки се разгръщат през три отделни, но тематично свързани истории.Сюжетът изследва отношенията между вече порасналите деца и техните отчуждени родители, както и сложната динамика между братя и сестри.Всяка от частите носи характерния за Джармуш стил – баланс между ирония и меланхолия, внимателно наблюдение на дребните жестове и поетична тишина.На 82-ия фестивал във Венеция, филмът беше удостоен със “Златен лъв“, затвърждавайки мястото на режисьора сред най-оригиналните автори на съвременното кино.Критиката определя Баща Майка Сестра Брат като лек, но дълбоко емоционален, с типичното за Джармуш умение да превръща дребните детайли в силни човешки откровения.","dir":"Джим Джармуш","cast":"Кейт Бланшет (Тимотеа Ръсел), Адам Драйвър (Джеф), Вики Крипс (Лилит), Шарлот Рамплинг (Майката), Маим Бялик (Емили)","src":"https://programata.bg/kino/filmi/bastha-majka-sestra-brat/","pv":4},"dvama-prokurori":{"synBg":"Потресаващо актуален, Двама прокурори е адаптация по едноименната повест на Георги Демидов – съветски физик, писател, дългогодишен политически затворник, оцелял от ГУЛАГ, тормозен от държавата до смъртта си. В сценария са вплетени монолози на Гогол.","dir":"Сергей Лозница","cast":"Александър Кузнецов, Александър Филипенко, Анатолий Белий, Витоутас Канюсонис, Валентин Новополски","src":"https://programata.bg/kino/filmi/dvama-prokurori/","genres":["Драма","Исторически"],"pv":4},"lichen-zhivot":{"synBg":"Джоди Фостър е начело на звездния актьорски състав в тази хлъзгава и комична криминална мистерия с режисьор и съсценарист Ребека Злотовски („Децата на другите“). Американската актриса влиза в образа на невротизираната психиатърка Лилиан Стайнър с възхитителна лекота.","dir":"Ребека Злотовски","cast":"Джоди Фостър, Даниел Отьой, Виржини Ефира, Матю Амалрик, Венсан Лакост","src":"https://programata.bg/kino/filmi/lichen-zhivot/","genres":["Криминален"],"pv":4},"maystora":{"synBg":"Москва, 30-те години на ХХ век. Талантлив млад писател попада във водовъртежа на литературен и политически скандал. Новият му роман е съсипан от съветската цензура, тъй като яркото изображение на Христос е неприемливо и дори немислимо в страна, в която официална държавна „религия“ е атеизмът. Театралната премиера на пиесата на писателя за Пилат Понтийски също е отменена, колегите и приятелите му го избягват и за броени дни той се превръща в отшелник. Тогава замисля нова, сатирична история, в която подобен на дявол герой на име Воланд метафорично отмъщава на виновниците за забраната. Ненадейно среща красива омъжена жена, Маргарита, която го насърчава да напише книгата независимо от съдбата ѝ. По всичко личи, че двамата нямат бъдеще заедно, но нима това може да съкруши една истинска любов?","dir":"Михаил Локшин","cast":"Аугуст Дил, Юлия Снигир, Евгений Циганов, Евгений Князев, Клаес Бенг","src":"https://programata.bg/kino/filmi/maystora-i-margarita-2/","genres":["Драма","Романтика"],"pv":4},"shopen":{"synBg":"Това е нестандартна кинематографична интерпретация, която се впуска в сложния свят на гения Фредерик Шопен. Вместо да следва традиционната биографична линия, филмът предлага асоциативен, почти сюрреалистичен разказ, в който реалност и въображение се преплитат. В центъра е не само образът на композитора, но и неговите вътрешни терзания, романтичните му връзки и напрежението, породено от конфликта между личното щастие и творческата мисия. Музиката е превърната в драматургичен двигател: тя не звучи просто като фон, а оформя ритъма на кадрите, вдъхва живот на визуалните метафори и буквално потапя зрителя в музикалния свят на композитора. Това е е филм за съзиданието и саможертвата, за неизбежната цена на гения и за безсмъртието на изкуството, което продължава да вълнува далеч отвъд времето на своя автор.","dir":"Михал Квиечински","cast":"Ерик Кулм (Шопен), Ламбер Уилсън (Крал Луи Филип), Виктор Мьотле (Ференц Лист), Жозефин дьо Ла Бом (Жорж Санд)","src":"https://programata.bg/kino/filmi/shopen-sonata-v-parizh/","pv":4},"kokoshka":{"synBg":"Кокошка е зашеметяващата история на Дьорд Палфи за една неустрашима кокошка, която напуска мизерния живот в индустриална ферма и търси безопасно място, където да отгледа пиленцата си. По време на своето пътешествие тя се сблъсква с омразата и жестокостта на човешкия свят. Кацайки в едно невзрачно ресторантче в гръцко крайбрежно селце, нашата смела героиня е заловена от възрастния му собственик, който живее под гнета на опасния приятел на дъщеря си. Кокошката става свидетел на кражби и измами, но се ориентира еднакво добре както в птичата, така и в човешката йерархия.","dir":"Дьорд Палфи","cast":"Йоанис Кокиасменос, Мария Диакопанайоти, Аргирис Пантазарас","src":"https://programata.bg/kino/filmi/kokoshka/","pv":4},"lyubovta-e-ludost":{"synBg":"Забавно пътешествие в съзнанието на Пиеро и Лара след първата им романтична среща, когато мислите на всеки от тях се превръщат в арена на егоистични импулси, неизказани желания и вътрешни конфликти. За зрителя остава да проследи как всичко това ще повлияе на отношенията им.","dir":"Паоло Дженовезе","cast":"Едуардо Лео, Пилар Фолиати, Емануела Фанели, Мария Киара Джанета, Витория Пучини и др","src":"https://programata.bg/kino/filmi/lyubovta-e-ludost-3/","pv":4},"posledniyat-viking":{"synBg":"Анкер се завъща у дома, след като е излежал в затвора петнайсет години за обир на банка. Той открива, че брат му Манфред е развил дисоциативно разстройство на личността и вярва, че е Джон Ленън.Манфред е единственият, който знае къде са скрити откраднатите пари, но не може да си спомни мястото. Заедно започват пътешествие, изпълнено с абсурдни ситуации и дълбоки емоционални моменти, за да открият не само изгубеното съкровище, но и силата на братските връзки.","dir":"Андерс Томас Йенсен","cast":"Мадс Микелсен (Манфред), Николай Лие Каас (Анкер), Софи Грабол (Маргрете), Ларс Ранте (Бащата)","src":"https://programata.bg/kino/filmi/posledniyat-viking/","pv":4},"moyata-priyatelka-eva":{"synBg":"Ева живее със семейството си в Барселона – омъжена от двайсетина години, с две деца тийнейджъри. На прага на 50-ата си годишнина, по време на една командировка до Рим, тя осъзнава, че иска да се влюби отново, преди да е станало „твърде късно“. След като се връща в Барселона, Ева се впуска в нов живот, отворен за изкушения и романтика. Авантюра, която ще преобърне целия ѝ свят.","dir":"Сеск Гай","cast":"Нора Навас, Хуан Диего Бото, Родриго де ла Серна, Агата Рока, Фернанда Орази","src":"https://programata.bg/kino/filmi/moyata-priyatelka-eva/","pv":4},"prekrasno-lyato":{"synBg":"Дева Касел, която доскоро се изявяваше само като модел на „Долче и Габана“, дебютира в киното в ролята на предизвикателния модел Амелия. Тя въвежда по-малката си приятелка Джиния в свят на артисти бохеми, където влюбването се оказва неизбежно. Действието се развива в Торино през лятото на 1938 г., в навечерието на Втората световна война и присъединяването на фашистка Италия към Тристранния пакт.","dir":"Лаура Лукети","cast":"Дева Касел, Йил Яра Вианело, Андреа Боска, Алесандро Пиавани, Анна Белато","src":"https://programata.bg/kino/filmi/prekrasno-lyato/","genres":["Драма"],"pv":4},"nay-bogatata-zhena":{"synBg":"На 13 февруари тръгва в разпространение бляскавата комедийна драма Най-богатата жена на света с грандамата на френското кино Изабел Юпер . Създаден въз основа на действителната история на Лилиан Бетанкур, филмът е екстравагантен и остроумен театър на жестокостта, където трима души търсят любов, но не са сигурни нито как да я получат, нито как да я дадат.","dir":"Тиери Клифа","cast":"Изабел Юпер, Лоран Лафит, Марина Фойс, Ан Броше, Рафаел Персонас","src":"https://programata.bg/kino/filmi/naj-bogatata-zhena-na-sveta/","pv":4},"cvetovete-na-vremeto":{"synBg":"В наши дни група далечни братовчеди наследяват изоставена къща в Нормандия. Сред тях са Себ, Абделкрим, Селин и Ги. Те се събират, за да огледат и да преценят какво могат да запазят от наследството – не само материално, но и емоционално. През 1895 г. Адел, тяхна предшественичка, напуска родната Нормандия и се отправя към Париж, за да търси майка си, изгубена в морето на новите възможности. Така Адел ще се докосне до импресионизма, революционните промени в изкуството и фотографията в един град, който преоткрива себе си.","dir":"Седрик Клапиш","cast":"Сюзан Лендон (Адел), Абрам Вапле (Клод Моне), Венсан Макан (Ги), Жюлия Пиатон (Селин)","src":"https://programata.bg/kino/filmi/czvetovete-na-vremeto/","pv":4},"istorii-kojto-ne-sa":{"synBg":"Пет комични истории се кръстосват по случайност, фокусирани върху емоциите на главните герои. Някои от тях бъркат реалността с желанието, други лъжат повече, отколкото говорят. Историите, които „не са за разказване“, съдържат ситуации на публично унижение, неизповядани тайни, социални предразсъдъци, изневери, ревност и сплетни. Преживявания, с които всеки може да се идентифицира. Режисьорът Сеск Гай този път е създал сардонична, същевременно напоена със съчувствие ода за неспособността на хората да управляват собствените си емоции. Според автора на Сантиментално ( Съседите отгоре ) филмът Истории, които не са за разказване се занимава с всичко, което стои между това, което сме, и онова, в което вярваме.","dir":"Сеск Гай","cast":"Анна Кастийо, Чино Дарин, Хавиер Камара, Марибел Верду, Хавиер Рей","src":"https://programata.bg/kino/filmi/istorii-koito-ne-sa-za-razkazvane/","genres":["Екшън","Комедия","Приключенски"],"pv":4},"sentimentalno":{"synBg":"Две двойки изследват сложността на съвременните взаимоотношения в тази бляскава комедия, сравнима с Перфектни непознати на Паоло Дженовезе. Сантиментално е адаптация на първата театрална пиеса на Сеск Гай.","dir":"Сеск Гай","cast":"Хавиер Камара, Белен Куеста, Алберто Сан Хуан, Гризелда Сицилиан","src":"https://programata.bg/kino/filmi/santimentalno/","genres":["Комедия"],"pv":4},"gospodin-aznavur":{"synBg":"От бедното му детство до възхода към славата, от триумфите до провалите, от Париж до Ню Йорк, преживейте изключителната история на един творец. Интензивен, напрегнат, уязвим и несъкрушим, отдаден на изкуството си до самия край, това е един от най-незабравимите певци на всички времена: Шарл Азнавур.","dir":"Гран Кор Малад, Мехди Идир","cast":"Тахар Рахим (Шарл Азнавур), Бастиен Буйон (Пиер Рош), Мари-Жюли Бо (Едит Пиаф), Лионел Сесилио (Жилбер Беко)","src":"https://programata.bg/kino/filmi/gospodin-aznavur/","pv":4},"potop":{"synBg":"В свят без хора, една изключително упорита котка едва оцелява след голямо наводнение. Помагат ѝ сънлива капибара, лемур, обсебен от лъскави предмети, прекалено дружелюбен лабрадор и огромна птица секретар*. Невероятната менажерия няма друг избор, освен да остане заедно на една разнебитена лодка, докато се ориентира в странната и бързо променяща се околна среда.","src":"https://programata.bg/kino/filmi/potop/","dir":"Гинтс Зилбалодис","genres":["Анимация"],"pv":4},"chist-kasmet":{"synBg":"Фани и Жан са идеалната семейна двойка – и двамата са професионално осъществени, живеят в прекрасен апартамент в скъп квартал на Париж и изглеждат влюбени също толкова, колкото при запознанството си. Но Фани внезапно е разтърсена от случайната среща с Ален, бивш съученик от гимназията…","dir":"Уди Алън","cast":"Лу дьо Лааж, Нилс Шнайдер, Мелвил Пупо, Валери Льомерсие, Елза Зилберщайн","src":"https://programata.bg/kino/filmi/chist-kasmet/","genres":["Драма"],"pv":4},"praznenstvoto":{"synBg":"Действието се развива в края на 70-те години на миналия век на частен остров в Средиземно море. Маркос Тимолеон, влиятелен магнат от ранга на Аристотел Онасис, е домакин на пищно и екстравагантно парти за 25-ия рожден ден на дъщеря си София – негова единствена наследница. Празненството e идеален повод за някои гости да постигнат собствените си цели, ухажвайки домакина. Изведнъж забавата секва заради непредвидени събития, които не само ще разклатят властта на Маркос, но ще поставят под въпрос устоите на целия му живот. Райският остров пред очите на всички се превръща в затвор.","dir":"Мигел Анхел Хименес","cast":"Уилям Дефо, Вик Кармен Соне","src":"https://programata.bg/kino/filmi/praznenstvoto-2/","genres":["Драма"],"pv":4},"pomilvane":{"synBg":"Един от безспорните фаворити на публиката за изминалата година, филмът откри триумфално кинофестивала във Венеция и беше удостоен със седем награди. За наситения с вътрешен драматизъм образ на италианския президент Мариано де Сантис актьорът Тони Сервило грабна купа „Волпи“. Критиците са единодушни, че това е най-силният и въздействащ филм на Сорентино от „Великата красота“  насам. Италианският визионер е сътворил нов кинематографичен шедьовър –  мъдра и обаятелна история за любов, прошка, милост и равносметка.","dir":"Паоло Сорентино","cast":"Тони Сервило, Анна Ферцети, Орландо Чинкуе, Масимо Вентуриело, Милвия Марилиано","src":"https://programata.bg/kino/filmi/pomilvane/","pv":4},"zhestokiyat-pat":{"synBg":"1984 година. В сянката на Желязната завеса, една нация дръзва да предизвика боговете. По случай 40-годишнината от социалистическата революция, България изправя своите най-добри алпинисти пред най-голямото изпитание на планетата – смъртоносния връх Джомолунгма, познат като Еверест. Но това не е просто изкачване.","src":"https://programata.bg/kino/filmi/zhestokiyat-pat/","genres":["Документален"],"pv":4},"digar":{"synBg":"Най-влиятелният мъж на света ще се впусне в трескава надпревара с времето, преди бедствието, което самият той е причинил, да разруши всичко.","dir":"Алехандро Г. Иняриту","cast":"Том Круз, Джеси Племънс, Сандра Хюлер, Риз Ахмед, Софи Уайлд","src":"https://programata.bg/kino/filmi/digar/","genres":["Драма","Комедия"],"pv":4},"tigrite":{"synBg":"В Тигрите (Los tigres) Алберто Родригес се завръща към територията, която познава добре — испанския трилър, в който криминалната интрига върви ръка за ръка с човешката драма. Този път режисьорът на Минималният остров пренася историята си в индустриалните пейзажи на Уелва, сред петролни танкери, рафинерии и мрачните, блестящи под слънцето морски води.","dir":"Алберто Родригес","cast":"Антонио де ла Торе, Барбара Ленѝ","src":"https://programata.bg/kino/filmi/tigrite/","genres":["Трилър"],"pv":4},"milen-filmat":{"synBg":"От създателите на Моралът е доброто , превърнал се в културен феномен и най-гледания документален филм у нас през 2022 г., Милен проследява живота и професионалния път на Милен Цветков на фона на историческите събития в България, променили публицистиката и пазара на медиите в страната, след 1989 година. Лентата цели да разкаже на обществото за развитието на публицистиката през последните десетилетия, кои са хората, променили средата, какви са грешките, които са допуснати, кои са постиженията. Основна тема във филма е борбата за свобода на словото в България.","dir":"Веселин Диманов, Димитър Стафидов","src":"https://programata.bg/kino/filmi/milen-filmut/","genres":["Български","Документален"],"pv":4},"matriarhat":{"synBg":"В края на 70-те жителите на село Югла са предимно жени – Жела, Станка, Бона, Ганета, баба Йорданка. Останали сами, без мъжете си – кой по строежите, кой на работа в града – те носят на плещите си цялата работа в стопанството. Ганета е съпруга на местния кръчмар, който системно и незаконно забогатява.","src":"https://programata.bg/kino/filmi/matriarhat/","pv":4},"moralat-e-dobroto":{"synBg":"От детската стая, през ученическия чин и студентска скамейка, до преподавателската катедра и обществената трибуна – филмът Моралът е доброто проследява житейския път на доц. Кристиан Таков на фона на историческите събития от последните десетилетия в България.","dir":"Веселин Диманов","src":"https://programata.bg/kino/filmi/moralt-e-dobroto/","genres":["Български","Документален"],"pv":4},"shibil":{"synBg":"Любовта между страховития Шибил и Рада – жената, заради която той е готов да се откаже от всичко и да се предаде. Спретнат и нагизден Шибил се задава от планината. В селото го чака Рада. И баща й. И тяхната смърт.","dir":"Захари Жандов","cast":"Петър Слабаков, Доротея Тончева, Стойчо Мазгалов, Елена Хранова, Стефан Пейчев","src":"https://programata.bg/kino/filmi/shibil/","genres":["Български","Драма"],"pv":4},"syankata-na-karavadzho":{"synBg":"Италия, началото на XVII век. Караваджо не само е един от най-виртуозните художници на своето време, но и бунтар срещу догмите на църквата, които налагат как да бъдат изобразявани религиозните сюжети.","dir":"Микеле Плачидо","cast":"Рикардо Скамарчо, Луи Гарел, Изабел Юпер, Микаела Рамацоти, Тедуа","src":"https://programata.bg/kino/filmi/syankata-na-karavadzho/","genres":["Биографичен","Исторически"],"pv":4},"ulitsa-malaga":{"synBg":"Мария Анхелес е силно независима възрастна жена, която живее в испанския квартал на Танжер. Когато дъщеря ѝ Клара пристига на дългоочаквано посещение, тя има конкретна цел – да притисне Мария да продаде дома си, оставен на името на Клара от покойния ѝ баща, за да компенсира собствените си финансови затруднения след развода. Но Мария, дълбоко свързана с общността и обичана от съседите си, взема решение да остане.","dir":"Мариам Тузани","cast":"Кармен Маура, Марта Етура, Ахмед Булан, Мария Алфонса Росо","src":"https://programata.bg/kino/filmi/ulicza-malaga/","pv":4},"frants":{"synBg":"Завладяваща история, вдъхновена от живота и творческото въображение на Франц Кафка – писателя, изпреварил своето време. Вегетарианец, работохолик, интроверт, аутсайдер, влюбен мъж и чиновник, заключен в кошмар.","dir":"Агнешка Холанд","cast":"Идан Вайс, Карел Добри, Петер Курт, Юрай Лой, Карол Шулер","src":"https://programata.bg/kino/filmi/francz/","pv":4},"magyosnika-ot-kremal":{"synBg":"Русия, началото на 90-те години. На фона на постсъветския хаос един обаятелен млад мъж, Вадим Баранов, проправя стремително своя професионален път. Първоначално човек на изкуството, след това продуцент на риалити телевизия, той става политически консултант на изгряващия агент на КГБ Владимир Путин. Вече в сърцето на властта, Баранов участва активно в изграждането на имиджа на една „нова Русия“, размивайки границите между истината и лъжата, вярата и манипулацията. Само магнетичната Ксения е извън неговия контрол и го изкушава да се отдалечи от тази опасна игра. Години по-късно, след като се е оттеглил в мълчание и личността му е обвита в мистерия, Баранов най-накрая проговаря и разкрива мрачните тайни на режима, за чието налагане е работил.","dir":"Оливие Асаяс","cast":"Джуд Лоу, Алисия Викандер, Пол Дейно, Том Стъридж, Джефри Райт","src":"https://programata.bg/kino/filmi/magosnika-ot-kremal/","pv":4},"v-bryuzh":{"synBg":"След провалена мисия двамата наемни убийци Рей и Кен са изпратени да се покрият в Брюж и да чакат следващи инструкции. За по-възрастния Кен средновековният град е място, което си струва да бъде видяно. За Рей е последното място на света, на което би бил в този момент.","dir":"Мартин Макдона","cast":"Колин Фарел, Брендън Глийсън, Рейф Файнс, Клеманс Поези","src":"https://programata.bg/kino/filmi/v-bryuzh/","genres":["Комедия"],"pv":4},"doza-shtastie":{"synBg":"Когато става въпрос за игрален филм, който е прям относно хероиновата зависимост, повечето от нас се сещат за Трейнспотинг . Ако обаче ви е попадал немският Кристиане Ф. – Ние, децата от гара Берлин от 1981, вече сте наясно какво означава силна социална драма в контекста на комунистическа държава – така важна, че е показвана и до днес в училищата в Германия.","src":"https://programata.bg/kino/filmi/doza-shastie/","pv":4},"lorans-arabski":{"synBg":"Филмът пресъздава истинската история на знаменития британски офицер Т. Е. Лорънс, който обединява враждуващите арабски племена и победоносно ги повежда срещу войските на Османската империя по време на Първата световна война.","dir":"Дейвид Лийн","cast":"Питър О'Тул, Алек Гинес, Омар Шариф","src":"https://programata.bg/kino/filmi/lorans-arabski/","pv":4},"ostrovat-na-zabravata":{"synBg":"Островът на забравата проследява историята на приятелките от училище Джо и Раиса, които в нощта преди да поемат по различни пътища в живота, попадат на мистериозен портал, който ги отвежда на острова Накали – място, изпълнено с магически и митологични създания, за които са слушали в разказите на своите семейства. Заедно с добронамереното, но непохватно куче-върколак Роу и малка, но силна група съюзници, Джо и Раиса трябва да се изправят срещу Ужасяващата Мананангал – най-страшното създание на острова. Когато двете разбират, че цената за връщането им у дома са спомените за цялото им приятелство, Джо и Раиса се впускат в надпревара с времето, за да намерят изход от острова, преди да се забравят една друга завинаги.","src":"https://programata.bg/kino/filmi/ostrovat-na-zabravata/","dir":"Джоел Крофорд и Жануел Меркадо","pv":4},"veriti":{"synBg":"Верити разказва за младата писателка Лоуен Ашли, която е наета да довърши последната книга от успешната поредица на прочутата авторка Верити Крофорд, след като тя изпада в кома вследствие на мистериозен инцидент. За да работи по романа, Лоуен се мести в отдалеченото имение на семейство Крофорд и там открива обезпокоителни бележки, изглеждащи като лични изповеди на Верити. В тях се разкриват смущаващи подробности за брака ѝ с Джеръми Крофорд, а с всяка нова страница Лоуен потъва все по-дълбоко в свят на съмнения и манипулации и все по-трудно различава къде свършва измислицата и къде започва реалността.","dir":"J. Alex Finch, Michael Showalter, Ivan J. Fonseca","cast":"Anne Hathaway, Ismael Cruz Córdova, Josh Hartnett, Michael Abbott Jr., Dakota Johnson","src":"https://programata.bg/kino/filmi/veriti/","genres":["Мистерия","Трилър"],"pv":4},"zooekspres":{"synBg":"Когато един влак неочаквано потегля, взимайки със себе си само домашни любимци, животните откриват, че зад всичко стои Ханс – язовец, който таи злоба. Докато изглежда, че сблъсъкът е неизбежен, животните могат да разчитат на Фалкън – хитър миещ мечок, който ще направи всичко възможно, за да ги спаси.","dir":"Benoît Daffis, Jean-Christian Tassy","cast":"Alexis Victor, Sébastien Desjours, Emmanuel Curtil, Kaycie Chase, Barbara Tissier","src":"https://programata.bg/kino/filmi/zooekspres/","genres":["Анимация"],"pv":4},"sradlyo":{"cast":"г-н Рибстин, Георги Георгиев, Гого Пип, Диляна Спасова Бенджи, Симеон Дамянов Хектор","src":"https://vlaikovacinema.com/screening/%d1%81%d1%80%d1%8a%d0%b4%d0%bb%d1%8c%d0%be/","pv":4},"nina-roza":{"synBg":"Михаил напуска България през 90-е години след смъртта на съпругата си и отглежда дъщеря си Роза сам в Монреал. Далеч от дома, той става специалист по френско и съвременно изкуство. Колекционер му възлага да удостовери автентичността на творбите на осемгодишната Нина от едно българско село, чиито картини са добили огромна популярност в интернет. Първоначално неохотно, Михаил се съгласява да отиде. Срещата с Нина го разтърсва дълбоко; зрялото дете му напомня за Роза на същата възраст. По време на престоя си той се сблъсква с призраците от миналото си, докато разкрива тайната на Нина: дали тя наистина е художничката, или някой ѝ е помогнал?","dir":"Женвивев Дулуд дьо Сел","cast":"Галин Стоев, Екатерина Станина, Киара Касели, Мишел Цончев","src":"https://programata.bg/kino/filmi/nina-roza/","genres":["Български"],"pv":4},"evropeyski-kinoklasiki-alis-v-gradovete-1974":{"dir":"Вим Вендерс Сценаристи","cast":"Рюдигер Фоглер","src":"https://vlaikovacinema.com/screening/%d0%b5%d0%b2%d1%80%d0%be%d0%bf%d0%b5%d0%b9%d1%81%d0%ba%d0%b8-%d0%ba%d0%b8%d0%bd%d0%be%d0%ba%d0%bb%d0%b0%d1%81%d0%b8%d0%ba%d0%b8-%d0%b0%d0%bb%d0%b8%d1%81-%d0%b2-%d0%b3%d1%80%d0%b0%d0%b4%d0%be%d0%b2/","pv":4},"evropeyski-kinoklasiki-moyat-lyav-krak-1989":{"dir":"Джим Шеридан Сценаристи","cast":"Даниъл Дей-Люис, Бренда Фрикър, Хю О`Конър","src":"https://vlaikovacinema.com/screening/%d0%b5%d0%b2%d1%80%d0%be%d0%bf%d0%b5%d0%b9%d1%81%d0%ba%d0%b8-%d0%ba%d0%b8%d0%bd%d0%be%d0%ba%d0%bb%d0%b0%d1%81%d0%b8%d0%ba%d0%b8-%d0%bc%d0%be%d1%8f%d1%82-%d0%bb%d1%8f%d0%b2-%d0%ba%d1%80%d0%b0%d0%ba-1/","pv":4},"sinelibri-2026-pepel":{"dir":"Ойер Плаза Сценаристи","src":"https://vlaikovacinema.com/screening/%d1%81%d0%b8%d0%bd%d0%b5%d0%bb%d0%b8%d0%b1%d1%80%d0%b8-2026-%d0%bf%d0%b5%d0%bf%d0%b5%d0%bb/","pv":4},"sinelibri-2026-nozh-razmisli-sled-opit-za-ubiystvo":{"dir":"Алекс Гибни Сценарист","cast":"Салман Рушди, Рейчъл","src":"https://vlaikovacinema.co
