и, като го кара да върши вандалски постъпки и по-лошо.","dir":"Ричард Кели","cast":"Джейк Джиленхол, Джена Малоун, Дрю Баримор","src":"https://programata.bg/kino/filmi/doni-darko/","pv":4},"naza":{"synBg":"Заснет нощем по покривите на Тел Авив, филмът разкрива в детайли системите, които стоят зад организираното масово избиване на палестински цивилни в Газа от страна на Израел.","src":"https://programata.bg/kino/filmi/naza/","dir":"Ювал Абрахам, Рейчъл Шор","genres":["Документален"],"pv":4},"tayni-i-lazhi":{"synBg":"Млада и вече успяла в живота чернокожа жена, която е била осиновена след  раждането си, решава да издири истинската си майка. Но тя се оказва…  бяла и… насилена от чернокож на младини.","src":"https://programata.bg/kino/filmi/tajni-i-lzhi/","pv":4},"goli":{"synBg":"Джони (Дейвид Тюлис) бяга от Манчестър, за да се спаси от гнева на семейство, чиято дъщеря изнасилва на улицата. Той отсяда при бивше гадже, но после решава да обикаля сам из Лондон.","dir":"Майк Лий","cast":"Дейвид Тюлис, Лесли Шарп, Катрин Картлидж, Грег Крътуел","src":"https://programata.bg/kino/filmi/goli/","genres":["Драма"],"pv":4},"houp":{"synBg":"В Хоуп Харбър – малко градче близо до демилитаризирана зона, полицейски началник получава притеснителна информация от местните. След като мистериозно същество опустошава селището, жителите са обзети от паника, а полицията трябва да се сблъска с неизвестното.","dir":"На Хонг-джин","cast":"Хуанг Чонг-мин, Чо Ин-сонг, Чон Хо-йон, Тейлър Ръсел, Камерън Бритън","src":"https://programata.bg/kino/filmi/houp-2/","genres":["Екшън"],"pv":4},"kes":{"synBg":"Петнадесетгодишният Били е син на миньор, чиято връзка с див керкенез му осигурява духовно бягство от задъненото му съществуване. Кес изкарва на голям екран социополитическата ангажираност, характерна за работата на Лоуч в БиБиСи и извежда до ново ниво на автентичност британските филми от 60-те за гневни млади хора. Тази трогателна драма за съзряването, използваща реални локации и непрофесионални актьори, остава най-обичаният и влиятелен филм на вече легендарния режисьор.","dir":"Кен Лоуч","cast":"Дейвид Брадли, Фреди Флечър, Лин Пери, Колин Уеланд, Брайън Гловър","src":"https://programata.bg/kino/filmi/kes/","pv":4},"sinelibri-2026-embargo-predstavyane-na-tvorchestvoto-na-zhoz":{"dir":"Антонио Ферейра Сценаристи","cast":"Филипе Коща, Клаудия Карвальо, Педру Диогу, Жозе Рапозу, Фернанду Таборда","src":"https://vlaikovacinema.com/screening/%d1%81%d0%b8%d0%bd%d0%b5%d0%bb%d0%b8%d0%b1%d1%80%d0%b8-2026-%d0%b5%d0%bc%d0%b1%d0%b0%d1%80%d0%b3%d0%be/","pv":4},"animatsionni-filmi-na-stoyan-dukov":{"synBg":"Ан пасан – 1976, 10’ Златното съкровище – 1964, 7’ Браво, брависимо! – 1986, 2’ Га, га, ура! – 1988, 8’ Къщи крепости – 1967, 8’ Ревност – 1963, 7’ Мини Миди Макси – 1971, 8’ Музикална история – 1976, 7’","src":"https://programata.bg/kino/filmi/animaczionni-filmi-na-stoyan-dukov/","pv":4},"animatsionni-filmi-na-nastimir-tsachev-i-vyara-doneva":{"synBg":"Часовник – 2006, 2’ Terraforming – 2017, 10’ Гнездо – 2023, 7’ Коминочистачът – 2026, 8’","src":"https://programata.bg/kino/filmi/animaczionni-filmi-na-nastimir-czachev-i-vyara-doneva/","pv":4},"s-vnimanie-kam-detayla":{"synBg":"Филм за един от пионерите на операторското майсторство в България. Георги Карайорданов въвежда в света на киното едни от най-прочутите днес филмови оператори в България като Емил Христов, Иван Варимезов, Константин Занков, Емилия Стоева, Георги Николов, Калин Иванов, Красимир Андонов, Рали Ралчев.","dir":"Деси Томбушева","src":"https://programata.bg/kino/filmi/s-vnimanie-km-detajla/","genres":["Български","Документален"],"pv":4},"da-zhivee-balgariya":{"synBg":"В продължение на три години е проследено развитието на няколко младежи от София, Стара Загора и Пловдив, които определят себе си като патриоти и по-често като националисти. Водени от патриотични чувства и желание да утвърдят собствената си идентичност, тези млади хора прекрачват тънката граница между патриотизма и откровения национализъм. Безразличието или нескритата подкрепа на „възрастните“ ги лишават от коректив, а това означава, че в България днес расте поколение, склонно към шовинизъм и агресивен национализъм. Всички те смятат, че бъдещето им принадлежи. Въпросът е обаче: какво бъдеще да очакваме ние? И още: Къде е границата между патриотизма и национализма? Кога и как започва осъзнаването в патриотизъм и как – в национализъм?","dir":"Адела Пеева","cast":"Адела Пеева","src":"https://programata.bg/kino/filmi/da-zhivee-bulgaria/","genres":["Български","Документален"],"pv":4},"dahomey":{"synBg":"Ноември 2021 г. 26 кралски съкровища на Кралство Дахомей са на път да напуснат Париж и да се върнат в родната си страна – днешната Република Бенин. Заедно с хиляди други, тези артефакти са ограбени от френските колониални войски през 1892 г. Какво трябва да е отношението към завръщането на това ценно материално наследство в страна, която е трябвало да се развива в негово отсъствие? Дебатът се разгаря сред студентите в университета на Абомей-Калави.","dir":"Мати Диоп","cast":"Гилдас Аданну, Хабиб Ахандеси, Жозеа Гедже","src":"https://programata.bg/kino/filmi/dahomej/","pv":4},"tova-se-sluchi-na-ulitsata":{"synBg":"Той се влюбва в Катерина, но се чувства недостоен за нейната любов. Започва да работи съвестно и става първенец. Институтът, където работи Катерина, получава нова апаратура, но няма превоз. Тя моли Мишо за услуга. Това е повод за него да ѝ определи среща. В любовното си въодушевление той неволно допуска повреда на камиона и го уволняват от гаража. Мишо се срамува да признае това на Катерина и не отива на поредната среща. Тя решава, че Мишо я мами с нейна приятелка и го напуска. Колективът се застъпва за младежа и го връщат на работа. Приятелите му убеждават Катерина, че греши. Помирителната им целувка предизвиква улично задръстване.","dir":"Янко Янков","cast":"Апостол Карамитев, Петрана Ламбринова, Жени Божинова, Стефан Пейчев, Любомир Шарланджиев","src":"https://programata.bg/kino/filmi/tova-se-sluchi-na-ulicata/","genres":["Комедия"],"pv":4},"sledovatelyat-i-gorata":{"synBg":"Награди: Варна, 1976г. – награда за режисура на Рангел Вълчанов СБФД, 1975г. – награда за режисура на Рангел Вълчанов","src":"https://programata.bg/kino/filmi/sledovatelyat-i-gorata/","pv":4},"hroniki-za-neudobnata-istina-istinata-za-balgarskiyat-cherno":{"synBg":"Документалният филм проследява реакцията на българските власти и информационното затъмнение по време на аварията в Чернобил през 1986 г. Лентата използва държавни архиви, секретни документи и лични свидетелства на специалисти, за да разкрие премълчаваните рискове за здравето на населението.","src":"https://programata.bg/kino/filmi/hroniki-za-neudobnata-istina-istinata-za-balgarskiyat-chernobil/","dir":"Калоян Николов","genres":["Български"],"pv":4},"bez-konkurentsiya":{"synBg":"Чан-уук Парк, режисьор на южнокорейски класики като Oldboy и Sympathy for Mr. Vengeance, разказва историята на дългогодишен мениджър в хартиена фабрика, който след внезапно уволнение решава да премахне конкуренцията си, за да осигури работа и бъдеще за семейството си.","dir":"Парк Чан-Уук","cast":"Бьонг-хън Ли (Ман-су), Йе-джин Сон (Ми-ри), Хи-сун Парк (Сьон-чул Чой), Сонг-мин Ли (Бьом-мо Гу)","src":"https://programata.bg/kino/filmi/bez-konkurencziya/","pv":4},"kitovete-paziteli-na-planetata":{"synBg":"Вдъхновен от поемата „Whale Nation“ на английския поет Хийткоут Уилямс, филмът ни предоставя превъзходни кадри с китове, заснети в четирите краища на света. Фокусиран по-специално върху песента на гигантските бозайници, с гърбати китове като главни герои, първоначално киноподходът е класически, но скоро предлага изобретателна гледна точка. Визуалната красота, разказът и чудесната музика (режисьорското решение „изтупва прахта“ от ритъма на документалното кино, преминавайки от поп към джаз), привличат зрителското внимание към важната тема за дивата природа, която волно или неволно съсипваме и унищожаваме, въпреки че е от съществено значение и за човешкото оцеляване.","src":"https://programata.bg/kino/filmi/kitovete-paziteli-na-planetata/","dir":"Жан-Албер Лиевр","genres":["Документален"],"pv":4},"kotki-v-muzeya-2-sakrovishtata-na-egipet":{"synBg":"Преди две години нашите герои спасиха Мона Лиза. Днес мишката Морис няма търпение да се докаже отново, а Винсънт и Клеопатра са родители на две палави котенца и очакват нови приключения. Следващото им пътешествие ще ги постави в съревнование един срещу друг…","src":"https://programata.bg/kino/filmi/kotki-v-muzeya-2-sakrovisthata-na-egipet/","dir":"Василий Ровенски","genres":["Анимация"],"pv":4},"kina-i-yuk-lisitsite-ot-dalechniya-sever":{"synBg":"Приключенската история е за двойка лисици – Кина и Юк, които се готвят да станат родители за първи път във време, когато глобалното затопляне променя правилата за всички.","dir":"Гийом Майдачевски","src":"https://programata.bg/kino/filmi/kina-i-yuk-lisitsite-ot-dalechnia-sever/","genres":["Драма","Приключенски"],"pv":4},"diamanti":{"synBg":"Режисьор събира любимите си актриси – тези, с които е работил, и тези, които е обичал. Той иска да направи филм за жените, но не разкрива много: наблюдава ги, възприема реплики, докато въображението му не ги запрати в друга епоха. В минало, в което шумът на шевните машини изпълва работното място, управлявано и обитавано от жени, мъжете имат второстепенни и маргинални роли, а киното може да бъде разказано от друга гледна точка – тази на костюма. Между самотата, страстите, тревогите, сърцераздирателното отсъствие и неразрушимите връзки проникват реалност и фантазия, както и животът на актрисите и този на героините, съперничеството и сестринството, видимото и невидимото.","dir":"Ферзан Йозпетек","cast":"Луиза Раниери, Жасмин Тринка, Сара Бози, Лоредана Каната, Джепи Кучари","src":"https://programata.bg/kino/filmi/diamanti/","pv":4},"alehandro-hodorovski-kartitsata-1970":{"src":"https://www.ndk.bg/en/event/alexandro-xodorovski-kierticata-1970","pv":4,"img":"https://ndk.bg/storage/thumbnails/2026/08/28/ /* Build the day-strip for the typographic header.
   Shows "Цялата седмица" + each day from TODAY to the coming Sunday.
   Only shown for S.day==="week" and for a single specific day within the current week. */
function buildDayStrip(){
  const L=t();
  /* Determine the week: Mon before TODAY to Sun after TODAY */
  const dow=dUTC(TODAY).getUTCDay(); /* 0=Sun … 6=Sat */
  const weekStart=addDays(TODAY,-(dow===0?6:dow-1)); /* Monday */
  const weekEnd=addDays(weekStart,6);                 /* Sunday */
  /* Only show the strip when in week or single-day-within-week mode */
  const inWeekDay=S.day!=="week"&&/^\d{4}-\d{2}-\d{2}$/.test(S.day)&&S.day>=weekStart&&S.day<=weekEnd;
  if(S.day!=="week"&&!inWeekDay)return"";
  /* Gather which days have screenings/performances */
  const hasData=datesWith();
  const pills=[];
  /* "Whole week" pill */
  const allPill=`<button class="dspill" data-day="week" aria-pressed="${S.day==="week"}">${esc(L.dsAllWeek||"Цялата седмица")}</button>`;
  pills.push(allPill);
  /* Start from TODAY — no past-day pills */
  const daysLeft=weekEnd>=TODAY?Math.round((dUTC(weekEnd)-dUTC(TODAY))/864e5)+1:0; /* dUTC: ISO parse works in every engine (Safari rejects 'YYYY-MM-DD UTC') */
  for(let i=0;i<daysLeft;i++){
    const d=addDays(TODAY,i);
    if(d>LASTDAY)break;
    const active=S.day===d;
    const hasSc=hasData.has(d);
    const isToday=d===TODAY;
    const label=fmtDay(d,false); /* e.g. "ср 7" */
    const todayMark=isToday?`<span class="ds-today">${esc(L.dsToday||"днес")}</span>`:"";
    pills.push(`<button class="dspill"${hasSc?"":' disabled'} data-day="${esc(d)}" aria-pressed="${active}">${esc(label)}${todayMark}</button>`);
  }
  return`<div class="daystrip">${pills.join("")}</div>`;}

function periodBanner(){

  const evLive=e=>(e.scope==="both"||e.scope===S.mode)&&e.to>=NOW_DATE&&e.from<=evE&&e.to>=evS;
  const act=EVENTS.filter(e=>evLive(e)&&e.from<=TODAY).sort((a,b)=>a.to.localeCompare(b.to));
  const soon=EVENTS.filter(e=>evLive(e)&&e.from>TODAY).sort((a,b)=>a.from.localeCompare(b.from));
  /* push a rail descriptor only if it has content — emptiness is known from the
     item count, so no card HTML is built for empty or not-yet-visible rails */
  const pushRail=(title,sub,items,fn)=>{ if(items&&items.length) out.push({t:title,s:sub,items,fn}); };
  if(S.mode==="cinema"){
    const vis=visibleFilms();
    /* filmRowsInPeriod: screenings for a film within the selected period, filtered by venue */
    const filmRowsInPeriod=fid=>{
      let rows=_frows(fid).filter(r=>inRange(r[2])&&withinHorizon(r[1],r[2]));
      if(S.fVenues.length)rows=rows.filter(r=>venueOk(r[1]));
      return upcomingRows(rows);};
    /* "За теб днес" = films with a screening still to come TODAY. Decoupled from
       the selected-day filter (scoreFilm returns -1 off the selected day, which
       would wrongly empty the rail on any day but today); the drawer filters
       (venue chain, genre, strand) still apply. Ranked by how many screenings
       remain today, then IMDb. Each card shows only today's remaining times. */
    const todayItems=FILMS.map(f=>{
        let rows=filmTimesToday(f.id);
        if(S.fVenues.length)rows=rows.filter(r=>venueOk(r[1]));
        return{f,rows};}).filter(o=>o.rows.length)
      .filter(o=>{
        if(S.fGenres.length&&!genreHit(o.f.genres))return false;
        if(S.fStrands.length&&!S.fStrands.some(s=>filmInStrand(o.f,s)))return false;

      .sort((a,b)=>{const na=a.rows.reduce((n,r)=>n+r[3].length,0),nb=b.rows.reduce((n,r)=>n+r[3].length,0);
        return nb-na||((imdbOf(b.f)||0)-(imdbOf(a.f)||0));}).slice(0,14);

      const TOMORROW=addDays(NOW_DATE,1);
      if(TOMORROW<=LASTDAY){
        const filmTimesTomorrow=fid=>upcomingRows(_frows(fid).filter(r=>r[2]===TOMORROW&&withinHorizon(r[1],r[2])));
        const tomorrowItems=FILMS.map(f=>{

    const popularItems=vis.map(f=>{

    if(!S.fVenues.length&&!S.fGenres.length){

    /* Section A: По жанр — collapsible, CLOSED by default. */

            if(!cRows.length)return filmCard(f,day,undefined);

        });
      }
      return secToggleHTML("Venues",L.secByCinema||"По кино",null,S.secVenues)
        +`<div id="sec-Venues-content" class="sec-content"${S.secVenues?"":" hidden"}>${inner}</div>`;
    }});
    /* Section C: Всичко в програмата — collapsible, CLOSED by default (secAll) */

    if(!S.fVenues.length&&!S.fGenres.length){

    const prem=vis.filter(s=>s.badge);

    if(!S.fVenues.length&&!S.fGenres.length){
      pushRail(L.railSoon,S.lang==="bg"?"извън тази седмица":"beyond this week",soon,eventCard);}
    const visSet=new Set(vis.map(s=>s.id));
    /* Section A: По жанр — collapsible, CLOSED by default. */
    const genreRails=[];
    genresFor("theatre").forEach(g=>{
      if(S.fGenres.length&&!S.fGenres.includes(g.id))return;
      const ss=vis.filter(s=>s.genres.some(x=>g.m.includes(x)));
      if(ss.length)genreRails.push({t:S.lang==="bg"?g.bg:g.en,s:`${ss.length}`,items:ss,fn:s=>showCard(s,day)});});
    out.push({html:()=>{
      const inner=genreRails.map(r=>rail(r.t,r.s,r.items.map(r.fn))).join("");
      return secToggleHTML("Genres",L.secByGenre||"По жанр",genreRails.length,S.secGenres)
        +`<div id="sec-Genres-content" class="sec-content"${S.secGenres?"":" hidden"}>${inner}</div>`;
    }});
    /* Section B: По театър — closed by default; theatre sub-grouping. */
    out.push({html:()=>{

        const stateTheatres=allState.filter(thFilter),indieTheatres=allIndie.filter(thFilter);

        stateTheatres.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)stateRails.push({th,ss});});
        indieTheatres.forEach(th=>{const ss=showsAtTheatre(th.id).filter(s=>visSet.has(s.id));if(ss.length)indieRails.push({th,ss});});
        if(stateRails.length)inner+=`<div class="sec-subhead">${esc(L.subStateTheatres||"Държавни и общински")}</div>`
          +stateRails.map(({th,ss})=>rail(thName(th),th.area,ss.map(s=>showCard(s,day)))).join("");
        if(indieRails.length)inner+=`<div class="sec-subhead">${esc(L.subIndependent||"Независими")}</div>`
          +indieRails.map(({th,ss})=>rail(thName(th),th.area,ss.map(s=>showCard(s,day)))).join("");
      }
      return secToggleHTML("Venues",L.secByTheatre||"По театър",null,S.secVenues)
        +`<div id="sec-Venues-content" class="sec-content"${S.secVenues?"":" hidden"}>${inner}</div>`;
    }});
    /* Section C: Всичко в програмата — collapsible, CLOSED by default (secAll) */
    out.push({html:()=>{
      const inner=S.secAll?(vis.length?`<div class="grid">${vis.slice(0,S.limit).map(s=>showCard(s,day)).join("")}</div>
        ${vis.length>S.limit?`<div style="text-align:center;margin-top:18px">
          <button class="btn sm" data-more>${esc(L.more)} (${vis.length-S.limit})</button></div>`:""}`:emptyState()):"";
      return`<section class="rail">`
        +secToggleHTML("All",L.allTitles,vis.length,S.secAll)
        +`<div id="sec-All-content" class="sec-content"${S.secAll?"":" hidden"}>${inner}</div></section>`;
    }});
  }
  RAILS=out; railIdx=Math.min(RAIL_FIRST,out.length);
  return out.slice(0,railIdx).map(matRail).join("")
    +(railIdx<out.length?`<div id="rail-sentinel" aria-hidden="true"></div>`:"");
}
/* stream deferred category rails in, in batches, ahead of the viewport so the
   scroll never reaches an unbuilt section — building each batch's cards lazily */
function mountProgressive(){
  if(railObs){railObs.disconnect();railObs=null;}
  const sent=document.getElementById("rail-sentinel");
  if(!sent||railIdx>=RAILS.length)return;
  const pump=()=>{
    /* keep appending batches until the sentinel is pushed below the prefetch
       zone (or everything is mounted) — handles batches shorter than a screen */
    let guard=0;
    while(railIdx<RAILS.length && guard++<=RAILS.length){
      if(sent.getBoundingClientRect().top > window.innerHeight+RAIL_LEAD) break;
      const batch=RAILS.slice(railIdx,railIdx+RAIL_MORE).map(matRail).join("");
      railIdx+=RAIL_MORE;
      sent.insertAdjacentHTML("beforebegin",batch);
    }
    if(railIdx>=RAILS.length && railObs){railObs.disconnect();railObs=null;sent.remove();}
  };
  railObs=new IntersectionObserver(function(entries){
    if(entries.some(en=>en.isIntersecting))pump();
  },{rootMargin:RAIL_LEAD+"px 0px"});
  railObs.observe(sent);
}

/* ===================== ticketing ===================== */
function bookUrl(vid,date){
  const b=BOOKING[vid]; if(!b)return null;
  if(b.deep&&date)return b.deep.replace("{date}",date);
  return b.url;}
/* Per-title ticket links: point at the specific film/play/event page (harvested
   from official sites) instead of the venue homepage. Falls back to bookUrl when
   we have no specific page for that title. Accuracy rule: only verified links here. */
const TIX={
  show:{
    "uroci":"https://sofiatheatre.eu/repertoires/120/uroci",
    "posledniyat-strasten":"https://sofiatheatre.eu/repertoires/119/posledniyat-strasten-lyubovnik"
  },
  event:{},
  film:{
    "in-the-mood":"https://www.ndk.bg/en/event/uong-karvai-v-nastroenie-za-liubov-200-eng-sub"
  }
};
/* VLINK_MAP: keyed by "filmId|venueId" → the film-specific page at that venue */
const VLINK_MAP=(()=>{
  const m={};
  if(typeof VLINKS!=="undefined"&&Array.isArray(VLINKS))
    VLINKS.forEach(([fid,vid,u])=>{m[fid+"|"+vid]=u;});
  return m;
})();
/* Film-specific resolver (never uses LINK_MAP — that mapped one global URL per film,
   causing all venues to link to the wrong cinema page).
   Priority: VLINKS entry → BOOKING deep link with date → BOOKING tix → BOOKING url */
function filmTixUrl(filmId,venueId,date){
  const vk=filmId+"|"+venueId;
  if(VLINK_MAP[vk])return VLINK_MAP[vk];
  const b=BOOKING[venueId]; if(!b)return null;
  if(b.deep&&date)return b.deep.replace("{date}",date);
  if(b.tix)return b.tix;
  return b.url||null;
}
function tixUrl(kind,id,venueId,date){
  /* Films: per-venue resolver — never LINK_MAP */
  if(kind==="film")return filmTixUrl(id,venueId,date);
  const specific=LINK_MAP[id]||(TIX[kind]||{})[id];
  return specific||bookUrl(venueId,date);
}
/* Festivals / one-off screenings that unambiguously belong to one catalogued
   venue: link the event straight to that venue's own ticketing (verified audit).
   Events with no single host (city-wide festivals, multi-cinema runs) are left
   out and show provenance only — never a generic aggregator. */
const EVENT_VENUE={
  "fizika-na-tagata":"national",
  "lumiere-retro":"lumiere",
  "retro-70mm":"dom-kino",
  "panair-na-kuklite":"kuklen",
  "sneakpeak-fest":"toplo",
  "cirkolyuciya":"toplo"
};
function busiestVenue(rows){
  const tally={}; rows.forEach(r=>tally[r[1]]=(tally[r[1]]||0)+r[3].length);
  return Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];}
/* Theatre/show buy box (single venue) — unchanged */
function buyBox(vid,date,isCinema,specificUrl){
  const L=t(),b=BOOKING[vid]; if(!b)return"";
  /* Only the venue's own ticketing — never generic aggregators. */
  return`<div class="buybox">

    </div>

/* Film buy box: compact pills per cinema, sorted by screening count desc then name */
function filmBuyBox(f,rows){
  const L=t();
  /* Count screenings per venue */
  const cnt={};
  rows.forEach(r=>{cnt[r[1]]=(cnt[r[1]]||0)+(r[3]?r[3].length:1);});
  const vids=[...new Set(rows.map(r=>r[1]))].sort((a,b)=>{
    const dc=(cnt[b]||0)-(cnt[a]||0); if(dc)return dc;
    const ca=cinById[a],cb=cinById[b];
    const na=(S.lang==="bg"?ca&&ca.name:ca&&(ca.nameEn||ca.name))||a;
    const nb=(S.lang==="bg"?cb&&cb.name:cb&&(cb.nameEn||cb.name))||b;
    return na.localeCompare(nb);
  });
  if(!vids.length)return"";
  let hasEpay=false;
  const items=vids.map(vid=>{
    const b=BOOKING[vid],c=cinById[vid]; if(!b)return"";
    const cname=(S.lang==="bg"?c&&c.name:c&&(c.nameEn||c.name))||b.label;
    const viaEpay=b.via==="epaygo.bg"&&!VLINK_MAP[f.id+"|"+vid];
    if(viaEpay)hasEpay=true;
    if(b.inPerson){
      return`<span class="buylink inperson">${esc(cname)} — ${esc(S.lang==="bg"?"на касата":"box office")}</span>`;
    }
    const u=filmTixUrl(f.id,vid,null)||b.url;
    if(!u)return"";
    return`<a class="buylink" href="${esc(u)}" target="_blank" rel="noopener">${esc(cname)} ↗</a>`;
  }).filter(Boolean);
  if(!items.length)return"";
  const epayNote=hasEpay?`<div class="buynote">${esc(S.lang==="bg"?"Кино Люмиер: билети чрез epaygo.bg":"Lumière: tickets via epaygo.bg")}</div>`:"";
  return`<div class="buybox"><div class="bl">${esc(L.buyAt)}</div>
    <div class="buylinks">${items.join("")}</div>
    ${epayNote}</div>`;}

/* task 7 — single scrollable month with ‹ › arrows + from–to range highlight */
function calView(){
  const L=t(),has=datesWith();
  const idx=Math.max(0,Math.min(S.calMonth||0,MONTHS.length-1));
  const m=MONTHS[idx];
  const fd=dUTC(m+"-01");
  const offset=(fd.getUTCDay()+6)%7;
  const dim=new Date(Date.UTC(fd.getUTCFullYear(),fd.getUTCMonth()+1,0)).getUTCDate();
  const lo=S.rFrom, hi=S.rTo, isRange=S.day==="range";
  let cells="";
  for(let i=0;i<offset;i++)cells+=`<button disabled></button>`;
  for(let d=1;d<=dim;d++){
    const iso=`${m}-${String(d).padStart(2,"0")}`;
    const ok=iso>=TODAY&&iso<=LASTDAY;
    let cls=has.has(iso)?"has":"";
    let pressed=false;
    if(isRange&&lo){
      const top=hi||lo;
      if(iso>lo&&iso<top)cls+=" inrange";
      if(iso===lo){pressed=true;cls+=" rstart";if(hi&&hi!==lo)cls+=" inrange";}
      if(iso===top&&top!==lo){pressed=true;cls+=" rend inrange";}
    }else{pressed=S.day===iso;}
    cells+=`<button ${ok?"":"disabled"} class="${cls.trim()}" data-pick="${iso}" aria-pressed="${pressed}">${d}</button>`;
  }
  const dows=S.lang==="bg"?["пн","вт","ср","чт","пт","сб","нд"]:["Mo","Tu","We","Th","Fr","Sa","Su"];
  const hint=isRange
    ? (lo&&hi?`${fmtDay(lo,true)} – ${fmtDay(hi,true)}`
       : lo?(S.lang==="bg"?"Изберете крайна дата":"Pick an end date")
       : (S.lang==="bg"?"Изберете начална дата":"Pick a start date"))
    : (S.lang==="bg"?"Докоснете начало и край за период":"Tap a start and an end for a range");
  return `<div class="calnav">
      <button class="calarrow" data-calstep="-1" ${idx>0?"":"disabled"} aria-label="prev">‹</button>
      <div class="calmon">${esc(L.months[Number(m.slice(5,7))-1])} ${m.slice(0,4)}</div>
      <button class="calarrow" data-calstep="1" ${idx<MONTHS.length-1?"":"disabled"} aria-label="next">›</button></div>
    <div class="caldow">${dows.map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal">${cells}</div>
    <div class="calhint">${esc(hint)}</div>`;
}

/* Re-render while keeping the filter drawer where the user left it. The drawer
   lives inside #app, so a plain render() rebuilds it at scrollTop 0 and the list
   jumps to the top on every chip tap — which made multi-selecting genres/venues
   feel broken. Capture and restore the drawer's scroll position across render. */
function renderKeepDrawer(){
  const d=document.querySelector(".drawer");
  const top=d?d.scrollTop:0;
  render();
  const d2=document.querySelector(".drawer");
  if(d2)d2.scrollTop=top;
}

/* ===================== sheet open + animation ===================== */
let sheetOpen=false;
/* which detail entity the open sheet shows — {kind:"film"|"show"|"event",id},
   so the sheet can be regenerated in place when the language is toggled. */
let curSheet=null;
function sheetHTMLFor(c){
  if(!c)return null;
  if(c.kind==="film"&&filmById[c.id])return sheetFilm(filmById[c.id]);
  if(c.kind==="show"&&showById[c.id])return sheetShow(showById[c.id]);
  if(c.kind==="event"){const ev=EVENTS.find(x=>x.id===c.id);if(ev)return sheetEvent(ev);}
  return null;
}
/* Post-render decoration shared by openSheet and the in-place re-render: add the
   back bar + grab handle + swipe-to-close, and collapse read-more toggles whose
   text does not actually overflow. */
function decorateSheet(s){
  const sheet=s.querySelector(".sheet");
  if(sheet&&!sheet.querySelector(".sbar")){
    const bar=document.createElement("div");bar.className="sbar";
    bar.innerHTML=`<button class="sback" data-close>&#8249;&nbsp;${esc(t().back)}</button>`;
    const grab=document.createElement("div");grab.className="sgrab";
    sheet.insertBefore(bar,sheet.firstChild);
    sheet.insertBefore(grab,sheet.firstChild);
    swipeToClose(sheet);
  }
  s.querySelectorAll(".synwrap").forEach(w=>{
    const body=w.querySelector(".synbody"),btn=w.querySelector(".readmore");
    if(body&&btn&&body.scrollHeight<=body.clientHeight+2){btn.style.display="none";w.classList.remove("clamp");}
  });
}
function openSheet(html,fromEl){
  let s=document.getElementById("scrim");
  if(!s){s=document.createElement("div");s.id="scrim";s.className="scrim";document.body.appendChild(s);}
  s.innerHTML=html;s.hidden=false;document.body.style.overflow="hidden";
  /* a detail view must always have a visible way out: the back bar is the
     reliable one, history and swipe are conveniences on top of it */
  decorateSheet(s);
  if(!sheetOpen){try{history.pushState({ss:"sheet"},"");}catch(e){}}
  sheetOpen=true;
  animateOpen(s,fromEl);
}
/* Regenerate the open sheet's contents in the current language without the
   open animation or a new history entry — used by the language toggle so an
   open card flips language (synopsis, weekday, every label) immediately. */
function rerenderOpenSheet(){
  if(!sheetOpen||!curSheet)return;
  const s=document.getElementById("scrim"),html=sheetHTMLFor(curSheet);
  if(s&&html){s.innerHTML=html;decorateSheet(s);}
}
function closeSheet(fromPop){
  const s=document.getElementById("scrim");
  if(s){s.hidden=true;s.innerHTML="";}
  document.body.style.overflow="";curSheet=null;
  const was=sheetOpen; sheetOpen=false;
  if(was&&!fromPop){try{history.back();}catch(e){}}
}
window.addEventListener("popstate",()=>{
  if(sheetOpen){closeSheet(true);return;}
});
/* deep links: #film=id / #show=id / #event=id open the matching detail sheet,
   so a shared URL lands directly on that title */
function openFromHash(){
  const m=/^#(film|show|event)=(.+)$/.exec(location.hash||"");
  if(!m)return false;
  const kind=m[1],id=decodeURIComponent(m[2]);
  let html=null;
  if(kind==="film"&&filmById[id])html=sheetFilm(filmById[id]);
  else if(kind==="show"&&showById[id])html=sheetShow(showById[id]);
  else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);if(ev)html=sheetEvent(ev);}
  if(html){curSheet={kind,id};openSheet(html,null);return true;}
  return false;
}
function shareItem(kind,id,title){
  const url=location.origin+location.pathname+location.search+"#"+kind+"="+encodeURIComponent(id);
  try{history.replaceState(history.state,"",url);}catch(e){}
  const data={title:"Sofia Gleda — "+(title||""),text:title||"",url:url};
  if(navigator.share){navigator.share(data).catch(()=>{});return;}
  const done=()=>toast(S.lang==="bg"?"Копиран линк":"Link copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,()=>toast(url));}
  else toast(url);
}
function toast(msg){
  let el=document.getElementById("sg-toast");
  if(!el){el=document.createElement("div");el.id="sg-toast";el.className="toast";document.body.appendChild(el);}
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200);
}
window.addEventListener("hashchange",()=>{ if(!sheetOpen)openFromHash(); });
function swipeToClose(sheet){
  let y0=null;
  sheet.addEventListener("touchstart",e=>{y0=sheet.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
  sheet.addEventListener("touchmove",e=>{
    if(y0==null)return;
    if(e.touches[0].clientY-y0>90){y0=null;closeSheet();}},{passive:true});
  sheet.addEventListener("touchend",()=>{y0=null;},{passive:true});
}
/* Plain neutral expand: scrim fades in, sheet grows in — no themed effects. */
function animateOpen(scrim,fromEl){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const sheet=scrim.querySelector(".sheet"); if(!sheet)return;
  scrim.animate([{opacity:0},{opacity:1}],{duration:150,easing:"ease-out"});
  /* mobile bottom-sheet: slide up; desktop: opacity + subtle scale */
  const isMobile=innerWidth<=620;
  if(isMobile){
    sheet.animate([{opacity:0,transform:"translateY(32px)"},{opacity:1,transform:"translateY(0)"}],
      {duration:200,easing:"ease-out",fill:"backwards"});
  }else{
    sheet.animate([{opacity:0,transform:"translateY(14px) scale(.96)"},{opacity:1,transform:"none"}],
      {duration:200,easing:"ease-out",fill:"backwards"});
  }
}

const CAL_T={
bg:{addCal:"Добави в календара",google:"Google Календар",apple:"Apple Календар (.ics)",outlook:"Outlook"},
en:{addCal:"Add to calendar",google:"Google Calendar",apple:"Apple Calendar (.ics)",outlook:"Outlook"}
};
/* Track the currently open cal panel {row el, kind, id, venue, date, time} */
let _calPanel=null;

/* DST-correct UTC offset for Europe/Sofia on a given date+time string */
function _sofiaOffset(dateStr,timeStr){
  /* Use Intl to resolve the actual UTC offset for this local moment */
  const dtStr=dateStr+"T"+timeStr+":00";
  /* Intl.DateTimeFormat can tell us the UTC offset via the "timeZoneName: 'shortOffset'" trick */
  try{
    const fmt=new Intl.DateTimeFormat("en",{timeZone:"Europe/Sofia",timeZoneName:"shortOffset",hour:"numeric"});
    /* Create a Date from the ISO string treating it as UTC, then check Sofia offset */
    /* We iterate seconds to find the exact local→UTC mapping */
    /* Simpler approach: parse the date and use formatToParts */
    const [y,mo,d]=dateStr.split("-").map(Number);
    const [hh,mm]=(timeStr||"00:00").split(":").map(Number);
    /* Try UTC offset +2 and +3, pick the one where Sofia local time matches */
    for(const off of [3,2]){
      const utcMs=Date.UTC(y,mo-1,d,hh-off,mm,0);
      const sofParts=new Intl.DateTimeFormat("en",{
        timeZone:"Europe/Sofia",year:"numeric",month:"2-digit",day:"2-digit",
        hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(utcMs));
      const pp=Object.fromEntries(sofParts.map(p=>[p.type,p.value]));
      const mh=pp.hour==="24"?"00":pp.hour;
      if(pp.year===String(y)&&Number(pp.month)===mo&&Number(pp.day)===d&&Number(mh)===hh){
        return off;
      }
    }
  }catch(e){}
  return 3; /* fallback */
}

/* Build a calendar event object from row data */
function calEvent(kind,id,venueId,dateStr,timeStr){
  let title,venue,area,url,runtimeMin;
  if(kind==="film"){
    const f=filmById[id]; if(!f)return null;
    const c=cinById[venueId]; if(!c)return null;
    title=filmTitle(f);
    venue=(S.lang==="bg"?c.name:(c.nameEn||c.name));
    area=c.area||"";
    url=filmTixUrl(id,venueId,dateStr)||"";
    runtimeMin=f.runtime||120;
  } else {
    const sh=showById[id]; if(!sh)return null;
    const th=thById[sh.theatre]||thById[venueId]; if(!th)return null;
    /* find hall from matching performance row */
    const perf=(PERFORMANCES||[]).find(p=>p[0]===id&&p[1]===dateStr&&p[2]===timeStr);
    title=titleOf(sh);
    const hallSuffix=perf&&perf[3]&&perf[3]!==th.name?" — "+perf[3]:"";
    venue=(S.lang==="bg"?th.name:(th.nameEn||th.name));
    area=(th.area||"")+hallSuffix;
    url=tixUrl("show",id,sh.theatre)||"";
    runtimeMin=sh.duration||120;
  }
  const fullTitle=title+" — "+venue;
  const location=venue+(area?", "+area:"");
  const description=(url?url+"\n":"")+"Sofia Gleda";
  const off=_sofiaOffset(dateStr,timeStr);
  /* Compute end time */
  const [y,mo,d]=dateStr.split("-").map(Number);
  const [hh,mm]=(timeStr||"00:00").split(":").map(Number);
  const startMs=Date.UTC(y,mo-1,d,hh-off,mm,0);
  const endMs=startMs+runtimeMin*60000;
  function toLocal(ms){
    const dt=new Date(ms);
    /* Recompute offset for end time */
    const eOff=_sofiaOffset(
      [dt.getUTCFullYear(),String(dt.getUTCMonth()+1).padStart(2,"0"),String(dt.getUTCDate()).padStart(2,"0")].join("-"),
      [String(dt.getUTCHours()+off).padStart(2,"0"),String(dt.getUTCMinutes()).padStart(2,"0")].join(":")
    );
    return{
      gcal:()=>{
        const ld=new Date(ms);
        const lh=ld.getUTCHours()+off,lm=ld.getUTCMinutes(),ls=ld.getUTCSeconds();
        return[
          String(ld.getUTCFullYear()),
          String(ld.getUTCMonth()+1).padStart(2,"0"),
          String(ld.getUTCDate()).padStart(2,"0"),
          "T",
          String(lh).padStart(2,"0"),
          String(lm).padStart(2,"0"),
          String(ls).padStart(2,"0")
        ].join("");},
      outlook(){
        const ld=new Date(ms);
        const lh=ld.getUTCHours()+off,lm=ld.getUTCMinutes();
        const eoffStr=(eOff>=0?"+":"-")+String(Math.abs(eOff)).padStart(2,"0")+":00";
        return[
          ld.getUTCFullYear(),"-",
          String(ld.getUTCMonth()+1).padStart(2,"0"),"-",
          String(ld.getUTCDate()).padStart(2,"0"),"T",
          String(lh).padStart(2,"0"),":",
          String(lm).padStart(2,"0"),":00",eoffStr
        ].join("");},
      utcZ(){
        const ld=new Date(ms);
        return[
          String(ld.getUTCFullYear()),
          String(ld.getUTCMonth()+1).padStart(2,"0"),
          String(ld.getUTCDate()).padStart(2,"0"),
          "T",
          String(ld.getUTCHours()).padStart(2,"0"),
          String(ld.getUTCMinutes()).padStart(2,"0"),
          String(ld.getUTCSeconds()).padStart(2,"0"),
          "Z"
        ].join("");}
    };
  }
  const startObj=toLocal(startMs);
  const endObj=toLocal(endMs);
  return{kind,id,venueId,dateStr,timeStr,fullTitle,location,description,url,
    startGcal:startObj.gcal(),endGcal:endObj.gcal(),
    startOutlook:startObj.outlook(),endOutlook:endObj.outlook(),
    startUtcZ:startObj.utcZ(),endUtcZ:endObj.utcZ(),
    off};
}

function calGoogleUrl(ev){
  if(!ev)return"";
  const e=encodeURIComponent;
  return"https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+e(ev.fullTitle)
    +"&dates="+ev.startGcal+"/"+ev.endGcal
    +"&ctz=Europe/Sofia"
    +"&location="+e(ev.location)
    +"&details="+e(ev.description);
}

function calOutlookUrl(ev){
  if(!ev)return"";
  const e=encodeURIComponent;
  return"https://outlook.live.com/calendar/0/action/compose"
    +"?subject="+e(ev.fullTitle)
    +"&startdt="+e(ev.startOutlook)
    +"&enddt="+e(ev.endOutlook)
    +"&location="+e(ev.location)
    +"&body="+e(ev.description);
}

function calIcs(ev){
  if(!ev)return"";
  /* RFC 5545 escaping: \ ; , and newline */
  function rfcEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
  /* RFC 5545 line folding: max 75 octets (UTF-8), fold with CRLF + SPACE */
  function fold(line){
    const out=[];
    let buf="",bytes=0;
    for(const ch of line){
      const enc=new TextEncoder().encode(ch);
      if(bytes+enc.length>75){out.push(buf);buf=" "+ch;bytes=1+enc.length;}
      else{buf+=ch;bytes+=enc.length;}
    }
    if(buf)out.push(buf);
    return out.join("\r\n");
  }
  const now=new Date();
  const dtstamp=[
    String(now.getUTCFullYear()),
    String(now.getUTCMonth()+1).padStart(2,"0"),
    String(now.getUTCDate()).padStart(2,"0"),
    "T",
    String(now.getUTCHours()).padStart(2,"0"),
    String(now.getUTCMinutes()).padStart(2,"0"),
    String(now.getUTCSeconds()).padStart(2,"0"),
    "Z"
  ].join("");
  const uid=ev.kind+"-"+ev.id+"-"+ev.venueId+"-"+ev.dateStr+"-"+(ev.timeStr||"").replace(/:/g,"")+"-sg@sofia-gleda";
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-" + "//Sofia Gleda//BG",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    fold("UID:"+uid),
    "DTSTAMP:"+dtstamp,
    "DTSTART:"+ev.startUtcZ,
    "DTEND:"+ev.endUtcZ,
    fold("SUMMARY:"+rfcEsc(ev.fullTitle)),
    fold("LOCATION:"+rfcEsc(ev.location)),
    fold("DESCRIPTION:"+rfcEsc(ev.description)),
    fold("URL:"+rfcEsc(ev.url)),
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  return lines.join("\r\n")+"\r\n";
}

function _calSvg(){
  return`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
    <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    <line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>`;
}

/* Render the calendar button HTML (not inside an <a>) */
function calBtnHtml(kind,id,venueId,dateStr){
  const L=CAL_T[S.lang];
  return`<button type="button" class="cal-btn" data-cal="${esc(kind+":"+id+"|"+venueId+"|"+dateStr)}" aria-label="${esc(L.addCal)}" title="${esc(L.addCal)}">${_calSvg()}</button>`;
}

/* Render the open panel HTML inside a row */
function calPanelHtml(kind,id,venueId,dateStr,times,selTime){
  const L=CAL_T[S.lang];
  const t=selTime||(times&&times[0])||"";
  const timePicker=times&&times.length>1
    ?`<div class="cal-times">${times.map(tm=>`<button type="button" data-caltm="${esc(tm)}" class="cal-times-btn${tm===t?" sel":""}">${esc(tm)}</button>`).join("")}</div>`
    :"";
  const ev=t?calEvent(kind,id,venueId,dateStr,t):null;
  const gUrl=ev?calGoogleUrl(ev):"";
  const oUrl=ev?calOutlookUrl(ev):"";
  const icsOk=!!ev;
  const icsData=ev?JSON.stringify({kind,id,venueId,dateStr,timeStr:t}):"{}";
  return`<div class="cal-panel">
    <h5>${esc(L.addCal)}<button type="button" class="cal-x" data-calclose aria-label="Затвори">✕</button></h5>
    ${timePicker}
    <div class="cal-apps">
      <button type="button" data-calg href="${esc(gUrl)}" data-calurl="${esc(gUrl)}">${_calSvg()}${esc(L.google)}</button>
      ${icsOk?`<button type="button" data-calics data-calev="${esc(icsData)}" data-calid="${esc(kind+"-"+id+"-"+venueId+"-"+dateStr+"-"+(t||"").replace(/:/g,""))}">${_calSvg()}${esc(L.apple)}</button>`:`<button type="button" disabled>${_calSvg()}${esc(L.apple)}</button>`}
      <button type="button" data-calo data-calurl="${esc(oUrl)}">${_calSvg()}${esc(L.outlook)}</button>
    </div>
  </div>`;
}

/* Open or close the calendar panel for a row */
function toggleCalPanel(btn,kind,id,venueId,dateStr,times){
  /* Close any open panel */
  const prev=document.querySelector(".cal-panel");
  if(prev){
    const wasBtn=_calPanel&&_calPanel.btn;
    prev.remove();
    _calPanel=null;
    if(wasBtn===btn)return; /* toggle off */
  }
  /* Build panel and insert after the vrow */
  const row=btn.closest(".vrow");
  if(!row)return;
  const t=times&&times[0]||"";
  const html=calPanelHtml(kind,id,venueId,dateStr,times,t);
  const wrap=document.createElement("div");
  wrap.innerHTML=html;
  row.after(wrap.firstElementChild);
  _calPanel={btn,kind,id,venueId,dateStr,times,selTime:t};
}

/* Calendar export click handler — own listener, no edits to main handler */
document.addEventListener("click",e=>{
  const q=sel=>e.target.closest(sel);
  /* Cal close button */
  if(q("[data-calclose]")){const p=q(".cal-panel");if(p){p.remove();_calPanel=null;}return;}
  /* Time selector inside panel */
  const tm=q(".cal-times-btn");
  if(tm&&_calPanel){
    _calPanel.selTime=tm.dataset.caltm;
    const panel=tm.closest(".cal-panel");
    if(panel){
      panel.outerHTML=calPanelHtml(_calPanel.kind,_calPanel.id,_calPanel.venueId,_calPanel.dateStr,_calPanel.times,_calPanel.selTime);
      /* re-bind _calPanel to new panel */
      const newP=document.querySelector(".cal-panel");
      if(newP)newP._calState=_calPanel;
    }
    return;
  }
  /* Google Calendar button */
  const cg=q("[data-calg]");
  if(cg){const u=cg.dataset.calurl;if(u)window.open(u,"_blank","noopener");return;}
  /* Outlook button */
  const co=q("[data-calo]");
  if(co){const u=co.dataset.calurl;if(u)window.open(u,"_blank","noopener");return;}
  /* Apple ICS download */
  const ci=q("[data-calics]");
  if(ci){
    try{
      const d=JSON.parse(ci.dataset.calev||"{}");
      const ev=calEvent(d.kind,d.id,d.venueId,d.dateStr,d.timeStr);
      if(!ev)return;
      const ics=calIcs(ev);
      const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      const fname="sofia-gleda-"+d.id+"-"+d.dateStr+"-"+(d.timeStr||"").replace(/:/g,"")+".ics";
      a.download=fname;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }catch(err){console.error("cal ics",err);}
    return;
  }
  /* Calendar open/toggle button */
  const cb=q("[data-cal]");
  if(cb){
    const v=cb.dataset.cal; /* "film:id|venue|date" or "show:id|venue|date" */
    const[kindraw,...rest]=v.split(":");
    const parts=rest.join(":").split("|");
    const kind=kindraw,id=parts[0],venueId=parts[1],dateStr=parts[2];
    /* Gather times for this row */
    let times=[];
    if(kind==="film"){
      const rows=SHOWTIMES.filter(r=>r[0]===id&&r[1]===venueId&&r[2]===dateStr);
      if(rows.length)times=rows[0][3]||[];
    }else{
      times=PERFORMANCES.filter(p=>p[0]===id&&p[1]===dateStr&&(p[0]===id)).map(p=>p[2]).filter((x,i,a)=>a.indexOf(x)===i);
    }
    toggleCalPanel(cb,kind,id,venueId,dateStr,times);
    return;
  }
});
/* Escape key closes open panel */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&_calPanel){
    const p=document.querySelector(".cal-panel");
    if(p){p.remove();_calPanel=null;e.stopPropagation();}
  }
},{capture:true});

/* ===================== events ===================== */
document.addEventListener("click",e=>{
  const q=sel=>e.target.closest(sel);
  if(q("[data-close]")||e.target.id==="scrim"){_sheetShowAllCinemas=false;closeSheet();return;}
  if(q(".time")||q(".buylink"))return;            /* let real links through */

  const rm=q("[data-readmore]");
  if(rm){const w=rm.closest(".synwrap");if(w){const on=w.classList.toggle("clamp");
    rm.textContent=on?rm.dataset.moreLabel:rm.dataset.lessLabel;}return;}
  const shr=q("[data-share]");
  if(shr){const[kind,...rest]=shr.dataset.share.split(":");const id=rest.join(":");
    let title="";
    if(kind==="film"&&filmById[id])title=filmTitle(filmById[id]);
    else if(kind==="show"&&showById[id])title=showById[id].title;
    else if(kind==="event"){const ev=EVENTS.find(x=>x.id===id);title=ev?(S.lang==="bg"?ev.title:ev.titleEn):"";}
    shareItem(kind,id,title);return;}

  if(q("[data-home]")){S.q="";S.qFocus=false;S.searchOpen=false;S.fGenres=[];S.fVenues=[];S.fStrands=[];
    S.day="week";S.rFrom=S.rTo=null;S.calMonth=null;S.limit=30;S.drawer=false;
    if(location.hash)history.replaceState(null,"",location.pathname+location.search);
    save();render();window.scrollTo({top:0,behavior:"smooth"});return;}

  const sw=q("[data-switch]");
  if(sw){S.mode=sw.dataset.switch;S.fGenres=[];S.fVenues=[];S.fStrands=[];S.limit=30;save();render();window.scrollTo({top:0});return;}
  if(q("[data-more]")){S.limit+=30;render();return;}
  if(q("[data-drawer]")){S.drawer=true;S.qFocus=false;render();return;}
  if(q("[data-dclose]")){S.drawer=false;render();return;}
  const rg=q("[data-range]"); if(rg){S.day=rg.dataset.range;S.rFrom=S.rTo=null;S.limit=30;render();return;}
  const cstep=q("[data-calstep]"); if(cstep&&!cstep.disabled){
    S.calMonth=Math.max(0,Math.min((S.calMonth||0)+Number(cstep.dataset.calstep),MONTHS.length-1));render();return;}
  const pk=q("[data-pick]"); if(pk&&!pk.disabled){
    const iso=pk.dataset.pick; S.limit=30;
    /* first tap starts a range, second tap ends it (swap if reversed),
       a tap after a complete range starts fresh */
    if(S.day!=="range"||!S.rFrom||S.rTo){S.day="range";S.rFrom=iso;S.rTo=null;}
    else if(iso<S.rFrom){S.rTo=S.rFrom;S.rFrom=iso;}
    else{S.rTo=iso;}
    render();return;}
  const st=q("[data-strand]"); if(st){const v=st.dataset.strand;S.fStrands=v?toggleArr(S.fStrands,v):[];S.qFocus=false;S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  /* search icon button is a TOGGLE: open when closed, close+clear when open */
  if(q("[data-search-open]")){
    if(S.searchOpen){S.q="";S.searchOpen=false;}else{S.searchOpen=true;}
    S.qFocus=false;render();return;}
  if(q("[data-qclear-m]")){S.q="";S.qFocus=false;S.searchOpen=false;render();return;}
  if(q("[data-qclear]")){S.q="";S.qFocus=false;render();return;}
  const d=q("[data-day]"); if(d){S.day=d.dataset.day;render();return;}
  const gf=q("[data-genre]"); if(gf){const v=gf.dataset.genre;S.fGenres=v?toggleArr(S.fGenres,v):[];S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  const vf=q("[data-venue]"); if(vf){const v=vf.dataset.venue;S.fVenues=v?toggleArr(S.fVenues,v):[];S.limit=30;(S.drawer?renderKeepDrawer():render());return;}
  if(q("[data-clearf]")){S.fGenres=[];S.fVenues=[];S.fStrands=[];S.day="week";S.rFrom=S.rTo=null;render();return;}
  if(q("[data-lang]")){S.lang=S.lang==="bg"?"en":"bg";save();render();rerenderOpenSheet();return;}
  /* collapsible section toggle — keep the header button at the same viewport position */
  const st2=q("[data-sectoggle]");
  if(st2){
    const key=st2.dataset.sectoggle;
    const hdrTop=st2.getBoundingClientRect().top;
    if(key==="Genres")S.secGenres=!S.secGenres;
    else if(key==="Venues")S.secVenues=!S.secVenues;
    else if(key==="All")S.secAll=!S.secAll;
    /* materialise the toggled section before restoring scroll */
    render();
    /* after render, scroll so the toggled header stays at the same viewport y */
    const newHdr=document.querySelector(`[data-sectoggle="${key}"]`);
    if(newHdr){const delta=newHdr.getBoundingClientRect().top-hdrTop;window.scrollBy({top:delta,behavior:"instant"});}
    return;}

  const sc=q("[data-scroll]");
  if(sc){const tr=sc.parentElement.querySelector(".rtrack");
    tr.scrollBy({left:Number(sc.dataset.scroll)*tr.clientWidth*.82,behavior:"smooth"});return;}

  if(q("[data-sheetshowallcin]")){_sheetShowAllCinemas=true;
    const shBody=document.querySelector(".sheet .sbody");
    if(shBody&&curSheet&&curSheet.kind==="film"&&filmById[curSheet.id]){
      const newSheet=document.createElement("div");newSheet.innerHTML=sheetFilm(filmById[curSheet.id]);
      const newSec=newSheet.querySelector(".sec:last-child");
      const oldSec=shBody.querySelector(".sec:last-child");
      if(oldSec&&newSec)oldSec.replaceWith(newSec);}return;}
  const fc=q("[data-film]"); if(fc){_sheetShowAllCinemas=false;curSheet={kind:"film",id:fc.dataset.film};openSheet(sheetFilm(filmById[fc.dataset.film]),fc);return;}
  const shc=q("[data-show]"); if(shc){curSheet={kind:"show",id:shc.dataset.show};openSheet(sheetShow(showById[shc.dataset.show]),shc);return;}
  const ec=q("[data-event]"); if(ec){curSheet={kind:"event",id:ec.dataset.event};openSheet(sheetEvent(EVENTS.find(x=>x.id===ec.dataset.event)),ec);return;}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(document.getElementById("scrim")&&!document.getElementById("scrim").hidden){closeSheet();return;}
  if(S.drawer){S.drawer=false;render();return;}
  if(S.searchOpen){S.q="";S.searchOpen=false;render();}
});
/* live search */
let qTimer=null;
document.addEventListener("input",e=>{
  if(e.target.id!=="q"&&e.target.id!=="q-m")return;
  S.q=e.target.value; S.qFocus=true;
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>render(),160);
});

function fatal(e){
  const msg=(e&&(e.message||e))+"";
  if(window.__sofiaPanel){window.__sofiaPanel(msg);return;}
  const app=document.getElementById("app");
  if(!app)return;
  app.innerHTML=`<div style="max-width:560px;margin:56px auto;padding:0 20px;font:15px/1.6 system-ui;color:#B6ABBC">
    <div style="font:700 13px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:#E0163A;margin-bottom:14px">Sofia Gleda</div>
    <h1 style="font:600 20px/1.3 system-ui;color:#F4EFF6;margin:0 0 10px">Приложението не можа да се зареди</h1>
    <p style="margin:0 0 16px">Най-честата причина са запазени стари настройки. Изчистването им решава проблема и
       зарежда програмата наново.</p>
    <button id="hardreset" style="padding:11px 20px;border-radius:10px;background:#E0163A;color:#fff;border:0;
      font:600 14px system-ui;cursor:pointer">Изчисти и опитай пак</button>
    <details style="margin-top:22px"><summary style="cursor:pointer;font-size:13px">Техническа подробност</summary>
      <pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#7E7386;margin-top:8px">${
        String(msg).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</pre></details>
  </div>`;
  const rb=document.getElementById("hardreset");
  if(rb)rb.onclick=()=>{try{localStorage.removeItem(LS);}catch(e){}location.reload();};
}
/* Part 0b: re-render when the viewport crosses 760 px (mobile ↔ desktop header switch).
   Keep any open drawer/sheet alive; just rebuild the header HTML. */
try{
  const mqMob=window.matchMedia("(max-width:760px)");
  const onMqChange=()=>{ if(!sheetOpen) render(); };
  if(mqMob.addEventListener) mqMob.addEventListener("change",onMqChange);
  else if(mqMob.addListener) mqMob.addListener(onMqChange);
}catch(e){}
function boot(){ render(); }
const origRender=render;
render=function(){
  try{ origRender();mountProgressive(); }
  catch(e){ fatal(e); }
};
try{ boot(); openFromHash(); }catch(e){ fatal(e); }
window.addEventListener("error",e=>{
  const app=document.getElementById("app");
  if(app&&app.innerHTML.indexOf("Зареждане на програмата")>-1) fatal(e.error||e.message);
});
</script>

}
