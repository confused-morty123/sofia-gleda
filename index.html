no/filmi/pes-patrul-dino-filmat/","genres":["Анимация"],"pv":5},"buntovnikat":{"synBg":"Коул Рийд e енигматичен мъж със силно чувство за дълг и лоялност, който попада в центъра на международен заговор, след като неговият работодател е убит пред очите му. Обвинен несправедливо и превърнат в издирван беглец, той е принуден да действа извън закона, докато постепенно разкрива мрежа от престъпни интереси, корупция и трафик на хора. В хода на своето бягство, Коул се превръща в човек с ясна цел – да извади истината наяве, независимо от цената.","dir":"Жан-Франсоа Рише","cast":"Джейсън Стейтъм, Анабел Уолис, Роланд Мьолер, Джейсън Уонг","src":"https://programata.bg/kino/filmi/buntovnikat/","genres":["Екшън"],"pv":5},"padane-2":{"synBg":"Съкрушена от смъртта на сестра си Хънтър, Джакс (Хариет Слейтър) се сближава с безстрашната ѝ приятелка Лус (Арсема Томас).","dir":"Майкъл Спириг, Питър Спириг","cast":"Хариет Слейтър, Арсема Томас, Том Бритни","src":"https://programata.bg/kino/filmi/padane-2-martva-tochka/","genres":["Драма","Приключенски","Трилър"],"pv":5},"terminator-2":{"synBg":"През 1997 г. оцелелите от ядрения апокалипсис водят безмилостна война срещу роботите и машините, които сами са създали. За да убият окончателно Джон Конър — водача на човешката съпротива — в миналото са изпратени два „киборга“. Тяхната мисия е да убият Конър, докато той все още е дете. Първият модел от серията „Терминатор“ се проваля през 1984 г. Вторият модел, изграден от променящ се течен метал, е много по-напреднал и започва преследване на детето и неговата майка Сара през 90-те години. Хората от бъдещето изпращат Терминатор, който да защити младия Конър. Двубоят между двата робота придобива титанични измерения. Докато момчето учи Терминатора на човечност, майка му се опитва да предотврати създаването на първите интелигентни машини. Заедно с Терминатора, когото са научили на човешки ценности, те ще се борят, за да променят бъдещето.","dir":"Джеймс Камерън","cast":"Арнолд Шварценегер, Линда Хамилтън, Едуард Фърлонг, Робърт Патрик, Ърл Боен","src":"https://programata.bg/kino/filmi/terminator-2-strashniyat-sad/","genres":["Екшън"],"pv":5},"kolite":{"synBg":"Първокласната състезателна кола – новобранец Маккуин светкавицата живее живот на бързи обороти, докато не се отклонява по пътя към най-важното състезание в живота си. Заседнал в Радиатор спрингс, забравен град по стария маршрут 66, той среща Сали, Матю, Док Хъдсън и множество странни същества, които му помагат да открие, че животът е нещо повече от трофеи и слава…","dir":"John Lasseter","src":"https://programata.bg/kino/filmi/kolite-20-godini-ot-premierata/","genres":["Анимация"],"pv":5},"prada-2":{"synBg":"Този април едно от най-емблематичните заглавия на XXI век се завръща на големия екран. Дяволът носи Прада 2 отново ни отвежда в безкомпромисния свят на висшата мода – място, където стилът е оръжие, амбицията е валута, а всяко решение има своята цена. Продължението на модерната класика от 2006 г. обещава нов поглед към познатата вселена, в която блясъкът върви ръка за ръка с напрежението, а успехът никога не идва без жертви.","dir":"Дейвид Франкел","cast":"Мерил Стрийп, Ан Хатауей, Емили Блънт, Станли Тучи, Джъстин Теру","src":"https://programata.bg/kino/filmi/dyavolat-nosi-prada-2/","genres":["Комедия"],"pv":5},"minoni":{"synBg":"Този юли в кината пристига най-новото щуро приключение от любимата анимационна поредица – Миньони & чудовища . Филмът ни връща назад във времето – в бляскавия Холивуд на 20-е години, когато киното тепърва се превръща в глобален феномен. Именно тогава миньоните откриват мечтаното място за своя хаос и не след дълго се превръщат в истински сензации на големия екран. Но както винаги при тях, пътят към славата бързо излиза извън контрол и води до поредица от катастрофални последствия.","dir":"Пиер Кофен","cast":"български дублаж: Весела Манолова, Георги Стоянов, Даниел Кукушев, Елена Бойчева, Константин Икономов и др","src":"https://programata.bg/kino/filmi/minoni-i-chudovistha/","pv":5},"naslednikat":{"synBg":"В изолиран аристократичен вампирски орден осемнадесетгодишният Виктор Мордем е откъснат от човешкия си живот и хвърлен в древен ритуал, който определя кой е достоен да наследи властта. Неподготвен и презиран като „смеска“, той трябва да оцелее в три изпитания, където съюзите са крехки, предателството е неизбежно, а животът няма стойност. Докато благородната фасада на традицията започва да се пропуква, Виктор разбира, че зад езика на честта и морала се крие система, създадена да пази привилегиите на „чистите“. В свят, в който оцеляването изисква съучастие, той трябва да избере какво е готов да изгуби – живота си или човечността си.","dir":"Денислав Димчев","cast":"Башар Рахал, Йоана Буковска, Асен Блатечки, Калин Врачански, Китодар Тодоров","src":"https://programata.bg/kino/filmi/naslednikat/","genres":["Български"],"pv":5},"sablezab":{"synBg":"Капитан Саблезъб и неговата весела шайка пирати се завръщат в ново приключение, изпълнено с още повече обрати, още повече смях и още повече забавление за цялото семейство. И разбира се, с още повече ПИРАТСКИ ПЕСНИ!!!","dir":"Are Austnes, Yaprak Morali и Rasmus A. Sivertsen","cast":"Дублаж - Христо Узунов, Симона Стоянова, Даниела Йорданова, Варвара Панкова, Елисавета Господинова","src":"https://programata.bg/kino/filmi/kapitan-sablezab-i-grafinyata-na-grel/","genres":["Анимация"],"pv":5},"spa-uikend":{"synBg":"В духа на Палави мамчета и Последният ергенски запой , Спа уикенд е едновременно смешна и трогателна комедия за четири приятелки от детинство, които осъзнават, че някъде между кариерите, връзките, семействата и ежедневните отговорности са забравили как да се грижат за себе си и една за друга.","dir":"Скот Мур, Джон Лукас","cast":"Ясмин Касим, Мишел Буто, Лесли Ман, Айла Фишер, Ана Фарис","src":"https://programata.bg/kino/filmi/spa-uikend/","genres":["Комедия"],"pv":5},"palestina-36":{"synBg":"Редки архивни кадри подготвят разгръщането на сюжета и представляват удивителен контрапункт на драматичното действие: животът на смесица от народи в Йерусалим след разпадането на Османската империя, миграцията на европейските евреи, бягащи от нацистите, и британските опити да наложат колониално управление.","dir":"Анемари Жасир","cast":"Джереми Айрънс, Робърт Арамайо, Лиъм Кънингам, Хиам Абас, Били Хаул","src":"https://programata.bg/kino/filmi/palestina-36/","pv":5},"sasedite":{"synBg":"Бракът на Джо и Анджела е на ръба на пропастта.  Идва момент, в който всичко може да се срине тотално – денят, в който съседите от горния етаж идват на гости за вечеря. Ден, в който всичко, което може да се обърка, се обърква още повече…","cast":"Оливия Уайлд, Пенелопе Крус, Сет Роугън, Едуард Нортън","src":"https://programata.bg/kino/filmi/sasedite-otgore/","genres":["Драма","Комедия","Романтика"],"pv":5},"gorchiva-koleda":{"synBg":"Елза е арт директор в рекламна агенция, чиято майка умира по време на дългата коледна ваканция. Погълната от работа и непрекъснато темпо, тя не си дава време да осъзнае и преживее загубата. След лична криза Елза решава да замине за остров Лансароте заедно със своята приятелка Патриша, която също има нужда да избяга от града и да се откъсне от ежедневието. Историята на двете жени се преплита с тази на сценарист и филмов режисьор, като постепенно разкрива паралели между техните преживявания. Филмът изследва тънката и често болезнена граница между живота и художествената измислица, показвайки как те взаимно се отразяват и преливат едно в друго.","dir":"Педро Алмодовар","cast":"Барбара Лени, Леонардо Сбараглиа, Айтана Санчес-Хихон, Виктория Луенго","src":"https://programata.bg/kino/filmi/gorchiva-koleda/","pv":5},"sirat":{"synBg":"Луис заедно със сина си Естебан се отправя към мароканската пустиня, за да търси изчезналата си дъщеря Марина. Двамата се присъединяват към поредното рейв парти в пустинята. По пътя си се сблъскват с физически и емоционални изпитания, които поставят под въпрос човешките им граници и морални убеждения. Филмът е изграден върху мощна звукова и визуална конструкция и е предизвикателство за сетивата и интелекта, изискващ от зрителя да се потопи в неговия свят и да се изправи пред собствените си страхове и надежди. Испанският режисьор Оливер Ласе успява да промени възприятията за киното като сетивно преживяване. Приет с овации на кинофестивала в Кан, Сират се очертава като една от най-смелите и въздействащи творби на годината.","dir":"Оливер Лаше","cast":"Сержи Лопес (Луис), Бруно Нунес Архона (Естебан), Стефания Гада (Стеф), Джошуа Лиъм Хердерсън (Джош)","src":"https://programata.bg/kino/filmi/sirat/","pv":5},"martva-hvatka":{"synBg":"Какво се случва, когато гневът на един малък човек срещу системата се превърне в телевизионен спектакъл? МЪРТВА ХВАТКА на култовия режисьор Гас Ван Сант с участието на легендата Ал Пачино и талантливата млада звезда Бил Скарсгард гледаме от 7 август в кината. Базиран на шокиращи действителни събития от 1977 г., новият филм на Гас Ван Сант ни среща с Тони Кирицис (Бил Скарсгард) – отчаян мъж, който отвлича сина на ипотечния си брокер с помощта на самоделен спусъчен механизъм. Залогът? 5 милиона долара, извинение и… всичко това, излъчвано на живо по телевизията под студения поглед на ексцентричния баща на жертвата (Ал Пачино). „Мъртва хватка“ не е просто ретро криминална драма, а визуално зашеметяващ и дълбок коментар за корпоративната безчувственост и медийната манипулация. С брилянтен черен хумор и изключителен актьорски състав, филмът обра овациите на фестивала във Венеция. Големият Гас Ван Сант се завръща в топ форма, за да ни покаже как системите се провалят точно тогава, когато имаме най-голяма нужда от тях.","dir":"Гас Ван Сант","cast":"Ал Пачино, Бил Скарсгард, Кари Елуис, Колман Доминго","src":"https://programata.bg/kino/filmi/martva-hvatka-2/","pv":5},"zavrashtaneto":{"synBg":"Одисей пристига на бреговете на Итака. Изминали са повече от 20 години, откакто е напуснал царството си, за да се бие в Троянската война. През цялото това време неговата съпруга и царица Пенелопа го е чакала. Синът им Телемах е изгубил вяра, че баща му ще се върне и се тревожи за живота на майка си, докато група все по-напористи кандидати я притискат да избере един от тях за нов цар. Почти неразпознаваем за себе си и за хората, които някога са го почитали като могъщ воин, Одисей бавно наближава замъка, виждайки как в негово отсъствие островът се е превърнал в пустиня. С нарастващо напрежение Пенелопа тъче червено платно и обещава, че ще си избере жених, след като то бъде завършено. Когато най-накрая Одисей влиза в схватка, Пенелопа подготвя емблематичен и мигновено разпознаваем тест за своя изнемощял цар, за да докаже, че е истинският сред гъмжилото от мъже, жадни за власт.","dir":"Уберто Пазолини","cast":"Жюлиет Бинош, Ралф Файнс, Чарли Плъмър, Маруан Кензари, Клаудио Сантамария","src":"https://programata.bg/kino/filmi/zavrasthaneto/","pv":5},"malkata-ameli":{"synBg":"Адаптиран по новелата на Амели Нотомб, този кратък и семпъл анимационен филм чудесно улавя удивлението от откриването на света през очите на малката белгийка Амели, която живее в Япония. Самата тя обаче, както и историята, която разказва в своя скицник, са прекалено преждевременно развити, до степен да придобият преувеличени, почти приказни измерения. Например Амели се ражда като зеленчук, преди по-късно внезапно да оживее и да направи първите си крачки, а първата ѝ дума не само е прахосмукачка, но почти веднага след нея идват цели изречения и пълноценни разговори.","src":"https://programata.bg/kino/filmi/malkata-ameli/","dir":"Лиан-Чо Хан и Майлис Валад","genres":["Анимация"],"pv":5},"finik-2":{"synBg":"В главните роли отново се завръщат Поли Генова като безстрашната Кристин и Явор Караиванов като пакостливия Финик. Непослушният фин активира древен магически артефакт, в резултат на което губи невидимостта си и излага целия таен свят на фините на огромна опасност. Заедно с вярната си приятелка Кристин и недоверчивия и самодостатъчен Тим (озвучен от Иван Радуловски), те се отправят на вълнуващо пътешествие, изпълнено с хумор и шантави приключения.","src":"https://programata.bg/kino/filmi/tajniyat-svyat-na-finik-2/","genres":["Анимация"],"pv":5},"sarceto-na-zveyara":{"synBg":"Сърцето на звяра проследява офицера от Специалните сили Джеймс Белмонт и четириногия му боен другар Один, които след тежка самолетна катастрофа остават блокирани в един от най-дивите и негостоприемни райони в Аляска, известен с прозвището Сърцето на звяра . Изолирани от всякаква помощ и изправени пред смъртоносни природни условия, двамата трябва да използват всяко умение и всеки инстинкт, за да оцелеят. Докато се борят със студа, дивите животни и изтощението, между тях се разгръща история за вярност, приятелство и взаимно спасение.","dir":"Дейвид Ейър","cast":"Брад Пит, Дж. К. Симънс, Ана Ламбе","src":"https://programata.bg/kino/filmi/sarczeto-na-zvyara/","genres":["Драма","Екшън"],"pv":5},"chuzhdenecat":{"synBg":"През 30-те години на миналия век в Алжир французинът Мьорсо демонстрира пълно безразличие към живота. Емоционалното му отчуждение води до убийство, последвано от съдебен процес, който разглежда както състава на престъплението, така и личността на извършителя.","dir":"Франсоа Озон","cast":"Бенжамен Воазен, Пиер Лотен, Суан Арло, Дени Лаван, Ребека Мардър и др","src":"https://programata.bg/kino/filmi/chuzhdeneczat/","pv":5},"kucheto-na-zlatyu":{"synBg":"Водени от неспокойния дух на художника Златю Бояджиев, двама съвременни артисти поемат на пътешествие, за да преосмислят неговото наследство, пресичайки границите между минало и настояще, реалност и фикция, ирония и тъга.","src":"https://programata.bg/kino/filmi/kucheto-na-zlatyu/","dir":"Петър Вълчанов, Кристина Грозева","genres":["Български"],"pv":5},"bashta-majka":{"synBg":"Новият филм на Джим Джармуш е тих и съзерцателен триптих, в който семейните връзки се разгръщат през три отделни, но тематично свързани истории.Сюжетът изследва отношенията между вече порасналите деца и техните отчуждени родители, както и сложната динамика между братя и сестри.Всяка от частите носи характерния за Джармуш стил – баланс между ирония и меланхолия, внимателно наблюдение на дребните жестове и поетична тишина.На 82-ия фестивал във Венеция, филмът беше удостоен със “Златен лъв“, затвърждавайки мястото на режисьора сред най-оригиналните автори на съвременното кино.Критиката определя Баща Майка Сестра Брат като лек, но дълбоко емоционален, с типичното за Джармуш умение да превръща дребните детайли в силни човешки откровения.","dir":"Джим Джармуш","cast":"Кейт Бланшет (Тимотеа Ръсел), Адам Драйвър (Джеф), Вики Крипс (Лилит), Шарлот Рамплинг (Майката), Маим Бялик (Емили)","src":"https://programata.bg/kino/filmi/bastha-majka-sestra-brat/","pv":5},"dvama-prokurori":{"synBg":"Потресаващо актуален, Двама прокурори е адаптация по едноименната повест на Георги Демидов – съветски физик, писател, дългогодишен политически затворник, оцелял от ГУЛАГ, тормозен от държавата до смъртта си. В сценария са вплетени монолози на Гогол.","dir":"Сергей Лозница","cast":"Александър Кузнецов, Александър Филипенко, Анатолий Белий, Витоутас Канюсонис, Валентин Новополски","src":"https://programata.bg/kino/filmi/dvama-prokurori/","genres":["Драма","Исторически"],"pv":5},"lichen-zhivot":{"synBg":"Джоди Фостър е начело на звездния актьорски състав в тази хлъзгава и комична криминална мистерия с режисьор и съсценарист Ребека Злотовски („Децата на другите“). Американската актриса влиза в образа на невротизираната психиатърка Лилиан Стайнър с възхитителна лекота.","dir":"Ребека Злотовски","cast":"Джоди Фостър, Даниел Отьой, Виржини Ефира, Матю Амалрик, Венсан Лакост","src":"https://programata.bg/kino/filmi/lichen-zhivot/","genres":["Криминален"],"pv":5},"maystora":{"synBg":"Москва, 30-те години на ХХ век. Талантлив млад писател попада във водовъртежа на литературен и политически скандал. Новият му роман е съсипан от съветската цензура, тъй като яркото изображение на Христос е неприемливо и дори немислимо в страна, в която официална държавна „религия“ е атеизмът. Театралната премиера на пиесата на писателя за Пилат Понтийски също е отменена, колегите и приятелите му го избягват и за броени дни той се превръща в отшелник. Тогава замисля нова, сатирична история, в която подобен на дявол герой на име Воланд метафорично отмъщава на виновниците за забраната. Ненадейно среща красива омъжена жена, Маргарита, която го насърчава да напише книгата независимо от съдбата ѝ. По всичко личи, че двамата нямат бъдеще заедно, но нима това може да съкруши една истинска любов?","dir":"Михаил Локшин","cast":"Аугуст Дил, Юлия Снигир, Евгений Циганов, Евгений Князев, Клаес Бенг","src":"https://programata.bg/kino/filmi/maystora-i-margarita-2/","genres":["Драма","Романтика"],"pv":5},"shopen":{"synBg":"Това е нестандартна кинематографична интерпретация, която се впуска в сложния свят на гения Фредерик Шопен. Вместо да следва традиционната биографична линия, филмът предлага асоциативен, почти сюрреалистичен разказ, в който реалност и въображение се преплитат. В центъра е не само образът на композитора, но и неговите вътрешни терзания, романтичните му връзки и напрежението, породено от конфликта между личното щастие и творческата мисия. Музиката е превърната в драматургичен двигател: тя не звучи просто като фон, а оформя ритъма на кадрите, вдъхва живот на визуалните метафори и буквално потапя зрителя в музикалния свят на композитора. Това е е филм за съзиданието и саможертвата, за неизбежната цена на гения и за безсмъртието на изкуството, което продължава да вълнува далеч отвъд времето на своя автор.","dir":"Михал Квиечински","cast":"Ерик Кулм (Шопен), Ламбер Уилсън (Крал Луи Филип), Виктор Мьотле (Ференц Лист), Жозефин дьо Ла Бом (Жорж Санд)","src":"https://programata.bg/kino/filmi/shopen-sonata-v-parizh/","pv":5},"kokoshka":{"synBg":"Кокошка е зашеметяващата история на Дьорд Палфи за една неустрашима кокошка, която напуска мизерния живот в индустриална ферма и търси безопасно място, където да отгледа пиленцата си. По време на своето пътешествие тя се сблъсква с омразата и жестокостта на човешкия свят. Кацайки в едно невзрачно ресторантче в гръцко крайбрежно селце, нашата смела героиня е заловена от възрастния му собственик, който живее под гнета на опасния приятел на дъщеря си. Кокошката става свидетел на кражби и измами, но се ориентира еднакво добре както в птичата, така и в човешката йерархия.","dir":"Дьорд Палфи","cast":"Йоанис Кокиасменос, Мария Диакопанайоти, Аргирис Пантазарас","src":"https://programata.bg/kino/filmi/kokoshka/","pv":5},"lyubovta-e-ludost":{"synBg":"Забавно пътешествие в съзнанието на Пиеро и Лара след първата им романтична среща, когато мислите на всеки от тях се превръщат в арена на егоистични импулси, неизказани желания и вътрешни конфликти. За зрителя остава да проследи как всичко това ще повлияе на отношенията им.","dir":"Паоло Дженовезе","cast":"Едуардо Лео, Пилар Фолиати, Емануела Фанели, Мария Киара Джанета, Витория Пучини и др","src":"https://programata.bg/kino/filmi/lyubovta-e-ludost-3/","pv":5},"posledniyat-viking":{"synBg":"Анкер се завъща у дома, след като е излежал в затвора петнайсет години за обир на банка. Той открива, че брат му Манфред е развил дисоциативно разстройство на личността и вярва, че е Джон Ленън.Манфред е единственият, който знае къде са скрити откраднатите пари, но не може да си спомни мястото. Заедно започват пътешествие, изпълнено с абсурдни ситуации и дълбоки емоционални моменти, за да открият не само изгубеното съкровище, но и силата на братските връзки.","dir":"Андерс Томас Йенсен","cast":"Мадс Микелсен (Манфред), Николай Лие Каас (Анкер), Софи Грабол (Маргрете), Ларс Ранте (Бащата)","src":"https://programata.bg/kino/filmi/posledniyat-viking/","pv":5},"moyata-priyatelka-eva":{"synBg":"Ева живее със семейството си в Барселона – омъжена от двайсетина години, с две деца тийнейджъри. На прага на 50-ата си годишнина, по време на една командировка до Рим, тя осъзнава, че иска да се влюби отново, преди да е станало „твърде късно“. След като се връща в Барселона, Ева се впуска в нов живот, отворен за изкушения и романтика. Авантюра, която ще преобърне целия ѝ свят.","dir":"Сеск Гай","cast":"Нора Навас, Хуан Диего Бото, Родриго де ла Серна, Агата Рока, Фернанда Орази","src":"https://programata.bg/kino/filmi/moyata-priyatelka-eva/","pv":5},"prekrasno-lyato":{"synBg":"Дева Касел, която доскоро се изявяваше само като модел на „Долче и Габана“, дебютира в киното в ролята на предизвикателния модел Амелия. Тя въвежда по-малката си приятелка Джиния в свят на артисти бохеми, където влюбването се оказва неизбежно. Действието се развива в Торино през лятото на 1938 г., в навечерието на Втората световна война и присъединяването на фашистка Италия към Тристранния пакт.","dir":"Лаура Лукети","cast":"Дева Касел, Йил Яра Вианело, Андреа Боска, Алесандро Пиавани, Анна Белато","src":"https://programata.bg/kino/filmi/prekrasno-lyato/","genres":["Драма"],"pv":5},"nay-bogatata-zhena":{"synBg":"На 13 февруари тръгва в разпространение бляскавата комедийна драма Най-богатата жена на света с грандамата на френското кино Изабел Юпер . Създаден въз основа на действителната история на Лилиан Бетанкур, филмът е екстравагантен и остроумен театър на жестокостта, където трима души търсят любов, но не са сигурни нито как да я получат, нито как да я дадат.","dir":"Тиери Клифа","cast":"Изабел Юпер, Лоран Лафит, Марина Фойс, Ан Броше, Рафаел Персонас","src":"https://programata.bg/kino/filmi/naj-bogatata-zhena-na-sveta/","pv":5},"cvetovete-na-vremeto":{"synBg":"В наши дни група далечни братовчеди наследяват изоставена къща в Нормандия. Сред тях са Себ, Абделкрим, Селин и Ги. Те се събират, за да огледат и да преценят какво могат да запазят от наследството – не само материално, но и емоционално. През 1895 г. Адел, тяхна предшественичка, напуска родната Нормандия и се отправя към Париж, за да търси майка си, изгубена в морето на новите възможности. Така Адел ще се докосне до импресионизма, революционните промени в изкуството и фотографията в един град, който преоткрива себе си.","dir":"Седрик Клапиш","cast":"Сюзан Лендон (Адел), Абрам Вапле (Клод Моне), Венсан Макан (Ги), Жюлия Пиатон (Селин)","src":"https://programata.bg/kino/filmi/czvetovete-na-vremeto/","pv":5},"istorii-kojto-ne-sa":{"synBg":"Пет комични истории се кръстосват по случайност, фокусирани върху емоциите на главните герои. Някои от тях бъркат реалността с желанието, други лъжат повече, отколкото говорят. Историите, които „не са за разказване“, съдържат ситуации на публично унижение, неизповядани тайни, социални предразсъдъци, изневери, ревност и сплетни. Преживявания, с които всеки може да се идентифицира. Режисьорът Сеск Гай този път е създал сардонична, същевременно напоена със съчувствие ода за неспособността на хората да управляват собствените си емоции. Според автора на Сантиментално ( Съседите отгоре ) филмът Истории, които не са за разказване се занимава с всичко, което стои между това, което сме, и онова, в което вярваме.","dir":"Сеск Гай","cast":"Анна Кастийо, Чино Дарин, Хавиер Камара, Марибел Верду, Хавиер Рей","src":"https://programata.bg/kino/filmi/istorii-koito-ne-sa-za-razkazvane/","genres":["Екшън","Комедия","Приключенски"],"pv":5},"sentimentalno":{"synBg":"Две двойки изследват сложността на съвременните взаимоотношения в тази бляскава комедия, сравнима с Перфектни непознати на Паоло Дженовезе. Сантиментално е адаптация на първата театрална пиеса на Сеск Гай.","dir":"Сеск Гай","cast":"Хавиер Камара, Белен Куеста, Алберто Сан Хуан, Гризелда Сицилиан","src":"https://programata.bg/kino/filmi/santimentalno/","genres":["Комедия"],"pv":5},"gospodin-aznavur":{"synBg":"От бедното му детство до възхода към славата, от триумфите до провалите, от Париж до Ню Йорк, преживейте изключителната история на един творец. Интензивен, напрегнат, уязвим и несъкрушим, отдаден на изкуството си до самия край, това е един от най-незабравимите певци на всички времена: Шарл Азнавур.","dir":"Гран Кор Малад, Мехди Идир","cast":"Тахар Рахим (Шарл Азнавур), Бастиен Буйон (Пиер Рош), Мари-Жюли Бо (Едит Пиаф), Лионел Сесилио (Жилбер Беко)","src":"https://programata.bg/kino/filmi/gospodin-aznavur/","pv":5},"potop":{"synBg":"В свят без хора, една изключително упорита котка едва оцелява след голямо наводнение. Помагат ѝ сънлива капибара, лемур, обсебен от лъскави предмети, прекалено дружелюбен лабрадор и огромна птица секретар*. Невероятната менажерия няма друг избор, освен да остане заедно на една разнебитена лодка, докато се ориентира в странната и бързо променяща се околна среда.","src":"https://programata.bg/kino/filmi/potop/","dir":"Гинтс Зилбалодис","genres":["Анимация"],"pv":5},"chist-kasmet":{"synBg":"Фани и Жан са идеалната семейна двойка – и двамата са професионално осъществени, живеят в прекрасен апартамент в скъп квартал на Париж и изглеждат влюбени също толкова, колкото при запознанството си. Но Фани внезапно е разтърсена от случайната среща с Ален, бивш съученик от гимназията…","dir":"Уди Алън","cast":"Лу дьо Лааж, Нилс Шнайдер, Мелвил Пупо, Валери Льомерсие, Елза Зилберщайн","src":"https://programata.bg/kino/filmi/chist-kasmet/","genres":["Драма"],"pv":5},"praznenstvoto":{"synBg":"Действието се развива в края на 70-те години на миналия век на частен остров в Средиземно море. Маркос Тимолеон, влиятелен магнат от ранга на Аристотел Онасис, е домакин на пищно и екстравагантно парти за 25-ия рожден ден на дъщеря си София – негова единствена наследница. Празненството e идеален повод за някои гости да постигнат собствените си цели, ухажвайки домакина. Изведнъж забавата секва заради непредвидени събития, които не само ще разклатят властта на Маркос, но ще поставят под въпрос устоите на целия му живот. Райският остров пред очите на всички се превръща в затвор.","dir":"Мигел Анхел Хименес","cast":"Уилям Дефо, Вик Кармен Соне","src":"https://programata.bg/kino/filmi/praznenstvoto-2/","genres":["Драма"],"pv":5},"pomilvane":{"synBg":"Един от безспорните фаворити на публиката за изминалата година, филмът откри триумфално кинофестивала във Венеция и беше удостоен със седем награди. За наситения с вътрешен драматизъм образ на италианския президент Мариано де Сантис актьорът Тони Сервило грабна купа „Волпи“. Критиците са единодушни, че това е най-силният и въздействащ филм на Сорентино от „Великата красота“  насам. Италианският визионер е сътворил нов кинематографичен шедьовър –  мъдра и обаятелна история за любов, прошка, милост и равносметка.","dir":"Паоло Сорентино","cast":"Тони Сервило, Анна Ферцети, Орландо Чинкуе, Масимо Вентуриело, Милвия Марилиано","src":"https://programata.bg/kino/filmi/pomilvane/","pv":5},"zhestokiyat-pat":{"synBg":"1984 година. В сянката на Желязната завеса, една нация дръзва да предизвика боговете. По случай 40-годишнината от социалистическата революция, България изправя своите най-добри алпинисти пред най-голямото изпитание на планетата – смъртоносния връх Джомолунгма, познат като Еверест. Но това не е просто изкачване.","src":"https://programata.bg/kino/filmi/zhestokiyat-pat/","genres":["Документален"],"pv":5},"digar":{"synBg":"Най-влиятелният мъж на света ще се впусне в трескава надпревара с времето, преди бедствието, което самият той е причинил, да разруши всичко.","dir":"Алехандро Г. Иняриту","cast":"Том Круз, Джеси Племънс, Сандра Хюлер, Риз Ахмед, Софи Уайлд","src":"https://programata.bg/kino/filmi/digar/","genres":["Драма","Комедия"],"pv":5},"tigrite":{"synBg":"В Тигрите (Los tigres) Алберто Родригес се завръща към територията, която познава добре — испанския трилър, в който криминалната интрига върви ръка за ръка с човешката драма. Този път режисьорът на Минималният остров пренася историята си в индустриалните пейзажи на Уелва, сред петролни танкери, рафинерии и мрачните, блестящи под слънцето морски води.","dir":"Алберто Родригес","cast":"Антонио де ла Торе, Барбара Ленѝ","src":"https://programata.bg/kino/filmi/tigrite/","genres":["Трилър"],"pv":5},"milen-filmat":{"synBg":"От създателите на Моралът е доброто , превърнал се в културен феномен и най-гледания документален филм у нас през 2022 г., Милен проследява живота и професионалния път на Милен Цветков на фона на историческите събития в България, променили публицистиката и пазара на медиите в страната, след 1989 година. Лентата цели да разкаже на обществото за развитието на публицистиката през последните десетилетия, кои са хората, променили средата, какви са грешките, които са допуснати, кои са постиженията. Основна тема във филма е борбата за свобода на словото в България.","dir":"Веселин Диманов, Димитър Стафидов","src":"https://programata.bg/kino/filmi/milen-filmut/","genres":["Български","Документален"],"pv":5},"matriarhat":{"synBg":"В края на 70-те жителите на село Югла са предимно жени – Жела, Станка, Бона, Ганета, баба Йорданка. Останали сами, без мъжете си – кой по строежите, кой на работа в града – те носят на плещите си цялата работа в стопанството. Ганета е съпруга на местния кръчмар, който системно и незаконно забогатява.","src":"https://programata.bg/kino/filmi/matriarhat/","pv":4},"moralat-e-dobroto":{"synBg":"От детската стая, през ученическия чин и студентска скамейка, до преподавателската катедра и обществената трибуна – филмът Моралът е доброто проследява житейския път на доц. Кристиан Таков на фона на историческите събития от последните десетилетия в България.","dir":"Веселин Диманов","src":"https://programata.bg/kino/filmi/moralt-e-dobroto/","genres":["Български","Документален"],"pv":5},"shibil":{"synBg":"Любовта между страховития Шибил и Рада – жената, заради която той е готов да се откаже от всичко и да се предаде. Спретнат и нагизден Шибил се задава от планината. В селото го чака Рада. И баща й. И тяхната смърт.","dir":"Захари Жандов","cast":"Петър Слабаков, Доротея Тончева, Стойчо Мазгалов, Елена Хранова, Стефан Пейчев","src":"https://programata.bg/kino/filmi/shibil/","genres":["Български","Драма"],"pv":5},"syankata-na-karavadzho":{"synBg":"Италия, началото на XVII век. Караваджо не само е един от най-виртуозните художници на своето време, но и бунтар срещу догмите на църквата, които налагат как да бъдат изобразявани религиозните сюжети.","dir":"Микеле Плачидо","cast":"Рикардо Скамарчо, Луи Гарел, Изабел Юпер, Микаела Рамацоти, Тедуа","src":"https://programata.bg/kino/filmi/syankata-na-karavadzho/","genres":["Биографичен","Исторически"],"pv":5},"ulitsa-malaga":{"synBg":"Мария Анхелес е силно независима възрастна жена, която живее в испанския квартал на Танжер. Когато дъщеря ѝ Клара пристига на дългоочаквано посещение, тя има конкретна цел – да притисне Мария да продаде дома си, оставен на името на Клара от покойния ѝ баща, за да компенсира собствените си финансови затруднения след развода. Но Мария, дълбоко свързана с общността и обичана от съседите си, взема решение да остане.","dir":"Мариам Тузани","cast":"Кармен Маура, Марта Етура, Ахмед Булан, Мария Алфонса Росо","src":"https://programata.bg/kino/filmi/ulicza-malaga/","pv":5},"frants":{"synBg":"Завладяваща история, вдъхновена от живота и творческото въображение на Франц Кафка – писателя, изпреварил своето време. Вегетарианец, работохолик, интроверт, аутсайдер, влюбен мъж и чиновник, заключен в кошмар.","dir":"Агнешка Холанд","cast":"Идан Вайс, Карел Добри, Петер Курт, Юрай Лой, Карол Шулер","src":"https://programata.bg/kino/filmi/francz/","pv":5},"v-bryuzh":{"synBg":"След провалена мисия двамата наемни убийци Рей и Кен са изпратени да се покрият в Брюж и да чакат следващи инструкции. За по-възрастния Кен средновековният град е място, което си струва да бъде видяно. За Рей е последното място на света, на което би бил в този момент.","dir":"Мартин Макдона","cast":"Колин Фарел, Брендън Глийсън, Рейф Файнс, Клеманс Поези","src":"https://programata.bg/kino/filmi/v-bryuzh/","genres":["Комедия"],"pv":4},"doza-shtastie":{"synBg":"Когато става въпрос за игрален филм, който е прям относно хероиновата зависимост, повечето от нас се сещат за Трейнспотинг . Ако обаче ви е попадал немският Кристиане Ф. – Ние, децата от гара Берлин от 1981, вече сте наясно какво означава силна социална драма в контекста на комунистическа държава – така важна, че е показвана и до днес в училищата в Германия.","src":"https://programata.bg/kino/filmi/doza-shastie/","pv":5},"lorans-arabski":{"synBg":"Филмът пресъздава истинската история на знаменития британски офицер Т. Е. Лорънс, който обединява враждуващите арабски племена и победоносно ги повежда срещу войските на Османската империя по време на Първата световна война.","dir":"Дейвид Лийн","cast":"Питър О'Тул, Алек Гинес, Омар Шариф","src":"https://programata.bg/kino/filmi/lorans-arabski/","pv":5},"ostrovat-na-zabravata":{"synBg":"Островът на забравата проследява историята на приятелките от училище Джо и Раиса, които в нощта преди да поемат по различни пътища в живота, попадат на мистериозен портал, който ги отвежда на острова Накали – място, изпълнено с магически и митологични създания, за които са слушали в разказите на своите семейства. Заедно с добронамереното, но непохватно куче-върколак Роу и малка, но силна група съюзници, Джо и Раиса трябва да се изправят срещу Ужасяващата Мананангал – най-страшното създание на острова. Когато двете разбират, че цената за връщането им у дома са спомените за цялото им приятелство, Джо и Раиса се впускат в надпревара с времето, за да намерят изход от острова, преди да се забравят една друга завинаги.","src":"https://programata.bg/kino/filmi/ostrovat-na-zabravata/","dir":"Джоел Крофорд и Жануел Меркадо","pv":5},"veriti":{"synBg":"Верити разказва за младата писателка Лоуен Ашли, която е наета да довърши последната книга от успешната поредица на прочутата авторка Верити Крофорд, след като тя изпада в кома вследствие на мистериозен инцидент. За да работи по романа, Лоуен се мести в отдалеченото имение на семейство Крофорд и там открива обезпокоителни бележки, изглеждащи като лични изповеди на Верити. В тях се разкриват смущаващи подробности за брака ѝ с Джеръми Крофорд, а с всяка нова страница Лоуен потъва все по-дълбоко в свят на съмнения и манипулации и все по-трудно различава къде свършва измислицата и къде започва реалността.","dir":"J. Alex Finch, Michael Showalter, Ivan J. Fonseca","cast":"Anne Hathaway, Ismael Cruz Córdova, Josh Hartnett, Michael Abbott Jr., Dakota Johnson","src":"https://programata.bg/kino/filmi/veriti/","genres":["Мистерия","Трилър"],"pv":5},"zooekspres":{"synBg":"Когато един влак неочаквано потегля, взимайки със себе си само домашни любимци, животните откриват, че зад всичко стои Ханс – язовец, който таи злоба. Докато изглежда, че сблъсъкът е неизбежен, животните могат да разчитат на Фалкън – хитър миещ мечок, който ще направи всичко възможно, за да ги спаси.","dir":"Benoît Daffis, Jean-Christian Tassy","cast":"Alexis Victor, Sébastien Desjours, Emmanuel Curtil, Kaycie Chase, Barbara Tissier","src":"https://programata.bg/kino/filmi/zooekspres/","genres":["Анимация"],"pv":5},"sradlyo":{"cast":"г-н Рибстин, Георги Георгиев, Гого Пип, Диляна Спасова Бенджи, Симеон Дамянов Хектор","src":"https://programata.bg/kino/filmi/sradlo/","pv":5,"synBg":"Запознайте се с вечно намръщения самотник г-н Рибстин  и неговия нов (и силно нежелан) съсед Пип — хиперактивно и неуморно морско драконче, което иска да бъде приятел с всеки.","dir":"Ricard Cussó, Rio Harrington"},"nina-roza":{"synBg":"Михаил напуска България през 90-е години след смъртта на съпругата си и отглежда дъщеря си Роза сам в Монреал. Далеч от дома, той става специалист по френско и съвременно изкуство. Колекционер му възлага да удостовери автентичността на творбите на осемгодишната Нина от едно българско село, чиито картини са добили огромна популярност в интернет. Първоначално неохотно, Михаил се съгласява да отиде. Срещата с Нина го разтърсва дълбоко; зрялото дете му напомня за Роза на същата възраст. По време на престоя си той се сблъсква с призраците от миналото си, докато разкрива тайната на Нина: дали тя наистина е художничката, или някой ѝ е помогнал?","dir":"Женвивев Дулуд дьо Сел","cast":"Галин Стоев, Екатерина Станина, Киара Касели, Мишел Цончев","src":"https://programata.bg/kino/filmi/nina-roza/","genres":["Български"],"pv":5},"evropeyski-kinoklasiki-alis-v-gradovete-1974":{"dir":"Вим Вендерс Сценаристи","cast":"Рюдигер Фоглер","src":"https://vlaikovacinema.com/screening/%d0%b5%d0%b2%d1%80%d0%be%d0%bf%d0%b5%d0%b9%d1%81%d0%ba%d0%b8-%d0%ba%d0%b8%d0%bd%d0%be%d0%ba%d0%bb%d0%b0%d1%81%d0%b8%d0%ba%d0%b8-%d0%b0%d0%bb%d0%b8%d1%81-%d0%b2-%d0%b3%d1%80%d0%b0%d0%b4%d0%be%d0%b2/","pv":5},"evropeyski-kinoklasiki-moyat-lyav-krak-1989":{"dir":"Джим Шеридан Сценаристи","cast":"Даниъл Дей-Люис, Бренда Фрикър, Хю О`Конър","src":"https://vlaikovacinema.com/screening/%d0%b5%d0%b2%d1%80%d0%be%d0%bf%d0%b5%d0%b9%d1%81%d0%ba%d0%b8-%d0%ba%d0%b8%d0%bd%d0%be%d0%ba%d0%bb%d0%b0%d1%81%d0%b8%d0%ba%d0%b8-%d0%bc%d0%be%d1%8f%d1%82-%d0%bb%d1%8f%d0%b2-%d0%ba%d1%80%d0%b0%d0%ba-1/","pv":5},"sinelibri-2026-pepel":{"dir":"Ойер Плаза Сценаристи","src":"https://vlaikovacinema.com/screening/%d1%81%d0%b8%d0%bd%d0%b5%d0%bb%d0%b8%d0%b1%d1%80%d0%b8-2026-%d0%bf%d0%b5%d0%bf%d0%b5%d0%bb/","pv":5},"sinelibri-2026-nozh-razmisli-sled-opit-za-ubiystvo":{"dir":"Алекс Гибни Сценарист","cast":"Салман Рушди, Рейчъл","src":"https://vlaikovacinema.com/screening/%d1%81%d0%b8%d0%bd%d0%b5%d0%bb%d0%b8%d0%b1%d1%80%d0%b8-2026-%d0%bd%d0%be%d0%b6-%d1%80%d0%b0%d0%b7%d0%bc%d0%b8%d1%81%d0%bb%d0%b8-%d1%81%d0%bb%d0%b5%d0%b4-%d0%be%d0%bf%d0%b8%d1%82-%d0%b7%d0%b0-%d1%83/","pv":4},"sinelibri-2026-shte-se-sluchi-tazi-vecher":{"dir":"Нани Морети В ролите","cast":"Луи Гарел, Жасмин Тринка, Анджела Финокиаро, Елена Лиети, Антонио Де Матео и др","src":"https://vlaikovacinema.com/screening/%d1%81%d0%b8%d0%bd%d0%b5%d0%bb%d0%b8%d0%b1%d1%80%d0%b8-2026-%d1%89%d0%b5-%d1%81%d0%b5-%d1%81%d0%bb%d1%83%d1%87%d0%b8-%d1%82%d0%b0%d0%b7%d0%b8-%d0%b2%d0%b5%d1%87%d0%b5%d1%80/","pv":4,"img":"https://www.cinemacity.bg/xmedia-cw/repo/feats/posters/8511S2R.jpg"},"sinelibri-2026-metropolis":{"dir":"Фриц Ланг Сценарист","cast":"Алфред Абел, Густав Фрьолих, Бригите Хелм и др","src":"https://vlaikovacinema.com/screening/%d1%81%d0%b8%d0%bd%d0%b5%d0%bb%d0%b8%d0%b1%d1%80%d0%b8-2026-%d0%bc%d0%b5%d1%82%d1%80%d0%be%d0%bf%d0%be%d0%bb%d0%b8%d1%81/","pv":5},"akira-kurosava-sanishta-1990":{"dir":"Akira Kurosawa","cast":"Akira Terao, Mitsuko Baisho, Mie Harada, Chishu Ryu, Martin Scorsese","src":"https://www.ndk.bg/en/event/akira-kurosava-sienishha-1990","pv":5,"img":"https://ndk.bg/storage/thumbnails/2026/08/31/38393/group-55-kinocult-festival-20260831-064826_resize1000x1000.jpg?v=1788158928"},"doni-darko":{"synBg":"Една вечер, по време на президентските избори през 1988, тийнейджър на име Дони Дарко, излиза от къщата си, докато спи, и вижда огромен, демоничен заек на име Франк. Заекът му казва, че светът ще свърши след 28 дни, 6 часа, 42 минути и 12 секунди. Дони се връща у дома на следващата сутрин и намира разбит джет в стаята му. Докато се опитва да разбере как е оцелял, да оправи проблемите си с училищния побойник и със здравния му учител, заекът Франк продължава да контролира Дони, като го кара да върши вандалски постъпки и по-лошо.","dir":"Ричард Кели","cast":"Джейк Джиленхол, Джена Малоун, Дрю Баримор","src":"https://programata.bg/kino/filmi/doni-darko/","pv":5},"naza":{"synBg":"Заснет нощем по покривите на Тел Авив, филмът разкрива в детайли системите, които стоят зад организираното масово избиване на палестински цивилни в Газа от страна на Израел.","src":"https://programata.bg/kino/filmi/naza/","dir":"Ювал Абрахам, Рейчъл Шор","genres":["Документален"],"pv":5},"tayni-i-lazhi":{"synBg":"Млада и вече успяла в живота чернокожа жена, която е била осиновена след  раждането си, решава да издири истинската си майка. Но тя се оказва…  бяла и… насилена от чернокож на младини.","src":"https://programata.bg/kino/filmi/tajni-i-lzhi/","pv":5},"goli":{"synBg":"Джони (Дейвид Тюлис) бяга от Манчестър, за да се спаси от гнева на семейство, чиято дъщеря изнасилва на улицата. Той отсяда при бивше гадже, но после решава да обикаля сам из Лондон.","dir":"Майк Лий","cast":"Дейвид Тюлис, Лесли Шарп, Катрин Картлидж, Грег Крътуел","src":"https://programata.bg/kino/filmi/goli/","genres":["Драма"],"pv":5},"houp":{"synBg":"В Хоуп Харбър – малко градче близо до демилитаризирана зона, полицейски началник получава притеснителна информация от местните. След като мистериозно същество опустошава селището, жителите са обзети от паника, а полицията трябва да се сблъска с неизвестното.","dir":"На Хонг-джин","cast":"Хуанг Чонг-мин, Чо Ин-сонг, Чон Хо-йон, Тейлър Ръсел, Камерън Бритън","src":"https://programata.bg/kino/filmi/houp-2/","genres":["Екшън"],"pv":5},"kes":{"synBg":"Петнадесетгодишният Били е син на миньор, чиято връзка с див керкенез му осигурява духовно бягство от задъненото му съществуване. Кес изкарва на голям екран социополитическата ангажираност, характерна за работата на Лоуч в БиБиСи и извежда до ново ниво на автентичност британските филми от 60-те за гневни млади хора. Тази трогателна драма за съзряването, използваща реални локации и непрофесионални актьори, остава най-обичаният и влиятелен филм на вече легендарния режисьор.","dir":"Кен Лоуч","cast":"Дейвид Брадли, Фреди Флечър, Лин Пери, Колин Уеланд, Брайън Гловър","src":"https://programata.bg/kino/filmi/kes/","pv":5},"sinelibri-2026-embargo-predstavyane-na-tvorchestvoto-na-zhoz":{"dir":"Антонио Ферейра Сценаристи","cast":"Филипе Коща, Клаудия Карвальо, Педру Диогу, Жозе Рапозу, Фернанду Таборда","src":"https://vlaikovacinema.com/screening/%d1%81%d0%b8%d0%bd%d0%b5%d0%bb%d0%b8%d0%b1%d1%80%d0%b8-2026-%d0%b5%d0%bc%d0%b1%d0%b0%d1%80%d0%b3%d0%be/","pv":5},"animatsionni-filmi-na-stoyan-dukov":{"synBg":"Ан пасан – 1976, 10’ Златното съкровище – 1964, 7’ Браво, брависимо! – 1986, 2’ Га, га, ура! – 1988, 8’ Къщи крепости – 1967, 8’ Ревност – 1963, 7’ Мини Миди Макси – 1971, 8’ Музикална история – 1976, 7’","src":"https://programata.bg/kino/filmi/animaczionni-filmi-na-stoyan-dukov/","pv":5},"animatsionni-filmi-na-nastimir-tsachev-i-vyara-doneva":{"synBg":"Часовник – 2006, 2’ Terraforming – 2017, 10’ Гнездо – 2023, 7’ Коминочистачът – 2026, 8’","src":"https://programata.bg/kino/filmi/animaczionni-filmi-na-nastimir-czachev-i-vyara-doneva/","pv":5},"s-vnimanie-kam-detayla":{"synBg":"Филм за един от пионерите на операторското майсторство в България. Георги Карайорданов въвежда в света на киното едни от най-прочутите днес филмови оператори в България като Емил Христов, Иван Варимезов, Константин Занков, Емилия Стоева, Георги Николов, Калин Иванов, Красимир Андонов, Рали Ралчев.","dir":"Деси Томбушева","src":"https://programata.bg/kino/filmi/s-vnimanie-km-detajla/","genres":["Български","Документален"],"pv":5},"da-zhivee-balgariya":{"synBg":"В продължение на три години е проследено развитието на няколко младежи от София, Стара Загора и Пловдив, които определят себе си като патриоти и по-често като националисти. Водени от патриотични чувства и желание да утвърдят собствената си идентичност, тези млади хора прекрачват тънката граница между патриотизма и откровения национализъм. Безразличието или нескритата подкрепа на „възрастните“ ги лишават от коректив, а това означава, че в България днес расте поколение, склонно към шовинизъм и агресивен национализъм. Всички те смятат, че бъдещето им принадлежи. Въпросът е обаче: какво бъдеще да очакваме ние? И още: Къде е границата между патриотизма и национализма? Кога и как започва осъзнаването в патриотизъм и как – в национализъм?","dir":"Адела Пеева","cast":"Адела Пеева","src":"https://programata.bg/kino/filmi/da-zhivee-bulgaria/","genres":["Български","Документален"],"pv":5},"dahomey":{"synBg":"Ноември 2021 г. 26 кралски съкровища на Кралство Дахомей са на път да напуснат Париж и да се върнат в родната си страна – днешната Република Бенин. Заедно с хиляди други, тези артефакти са ограбени от френските колониални войски през 1892 г. Какво трябва да е отношението към завръщането на това ценно материално наследство в страна, която е трябвало да се развива в негово отсъствие? Дебатът се разгаря сред студентите в университета на Абомей-Калави.","dir":"Мати Диоп","cast":"Гилдас Аданну, Хабиб Ахандеси, Жозеа Гедже","src":"https://programata.bg/kino/filmi/dahomej/","pv":5},"tova-se-sluchi-na-ulitsata":{"synBg":"Той се влюбва в Катерина, но се чувства недостоен за нейната любов. Започва да работи съвестно и става първенец. Институтът, където работи Катерина, получава нова апаратура, но няма превоз. Тя моли Мишо за услуга. Това е повод за него да ѝ определи среща. В любовното си въодушевление той неволно допуска повреда на камиона и го уволняват от гаража. Мишо се срамува да признае това на Катерина и не отива на поредната среща. Тя решава, че Мишо я мами с нейна приятелка и го напуска. Колективът се застъпва за младежа и го връщат на работа. Приятелите му убеждават Катерина, че греши. Помирителната им целувка предизвиква улично задръстване.","dir":"Янко Янков","cast":"Апостол Карамитев, Петрана Ламбринова, Жени Божинова, Стефан Пейчев, Любомир Шарланджиев","src":"https://programata.bg/kino/filmi/tova-se-sluchi-na-ulicata/","genres":["Комедия"],"pv":5},"sledovatelyat-i-gorata":{"synBg":"Награди: Варна, 1976г. – награда за режисура на Рангел Вълчанов СБФД, 1975г. – награда за режисура на Рангел Вълчанов","src":"https://programata.bg/kino/filmi/sledovatelyat-i-gorata/","pv":5},"hroniki-za-neudobnata-istina-istinata-za-balgarskiyat-cherno":{"synBg":"Документалният филм проследява реакцията на българските власти и информационното затъмнение по време на аварията в Чернобил през 1986 г. Лентата използва държавни архиви, секретни документи и лични свидетелства на специалисти, за да разкрие премълчаваните рискове за здравето на населението.","src":"https://programata.bg/kino/filmi/hroniki-za-neudobnata-istina-istinata-za-balgarskiyat-chernobil/","dir":"Калоян Николов","genres":["Български"],"pv":5},"bez-konkurentsiya":{"synBg":"Чан-уук Парк, режисьор на южнокорейски класики като Oldboy и Sympathy for Mr. Vengeance, разказва историята на дългогодишен мениджър в хартиена фабрика, който след внезапно уволнение решава да премахне конкуренцията си, за да осигури работа и бъдеще за семейството си.","dir":"Парк Чан-Уук","cast":"Бьонг-хън Ли (Ман-су), Йе-джин Сон (Ми-ри), Хи-сун Парк (Сьон-чул Чой), Сонг-мин Ли (Бьом-мо Гу)","src":"https://programata.bg/kino/filmi/bez-konkurencziya/","pv":5},"kitovete-paziteli-na-planetata":{"synBg":"Вдъхновен от поемата „Whale Nation“ на английския поет Хийткоут Уилямс, филмът ни предоставя превъзходни кадри с китове, заснети в четирите краища на света. Фокусиран по-специално върху песента на гигантските бозайници, с гърбати китове като главни герои, първоначално киноподходът е класически, но скоро предлага изобретателна гледна точка. Визуалната красота, разказът и чудесната музика (режисьорското решение „изтупва прахта“ от ритъма на документалното кино, преминавайки от поп към джаз), привличат зрителското внимание към важната тема за дивата природа, която волно или неволно съсипваме и унищожаваме, въпреки че е от съществено значение и за човешкото оцеляване.","src":"https://programata.bg/kino/filmi/kitovete-paziteli-na-planetata/","dir":"Жан-Албер Лиевр","genres":["Документален"],"pv":5},"kotki-v-muzeya-2-sakrovishtata-na-egipet":{"synBg":"Преди две години нашите герои спасиха Мона Лиза. Днес мишката Морис няма търпение да се докаже отново, а Винсънт и Клеопатра са родители на две палави котенца и очакват нови приключения. Следващото им пътешествие ще ги постави в съревнование един срещу друг…","src":"https://programata.bg/kino/filmi/kotki-v-muzeya-2-sakrovisthata-na-egipet/","dir":"Василий Ровенски","genres":["Анимация"],"pv":5},"kina-i-yuk-lisitsite-ot-dalechniya-sever":{"synBg":"Приключенската история е за двойка лисици – Кина и Юк, които се готвят да станат родители за първи път във време, когато глобалното затопляне променя правилата за всички.","dir":"Гийом Майдачевски","src":"https://programata.bg/kino/filmi/kina-i-yuk-lisitsite-ot-dalechnia-sever/","genres":["Драма","Приключенски"],"pv":5},"diamanti":{"synBg":"Режисьор събира любимите си актриси – тези, с които е работил, и тези, които е обичал. Той иска да направи филм за жените, но не разкрива много: наблюдава ги, възприема реплики, докато въображението му не ги запрати в друга епоха. В минало, в което шумът на шевните машини изпълва работното място, управлявано и обитавано от жени, мъжете имат второстепенни и маргинални роли, а киното може да бъде разказано от друга гледна точка – тази на костюма. Между самотата, страстите, тревогите, сърцераздирателното отсъствие и неразрушимите връзки проникват реалност и фантазия, както и животът на актрисите и този на героините, съперничеството и сестринството, видимото и невидимото.","dir":"Ферзан Йозпетек","cast":"Луиза Раниери, Жасмин Тринка, Сара Бози, Лоредана Каната, Джепи Кучари","src":"https://programata.bg/kino/filmi/diamanti/","pv":5},"sinelibri-2026-tesniyat-pat-kam-dalechniya-sever":{"dir":"Джъстин Кързел Сценарист","cast":"Джейкъб Елорди, Киърън Хайндс, Одеса Йънг, Оливия ДеДжондж, Хедър Мичъл","src":"https://vlaikovacinema.com/screening/%d1%81%d0%b8%d0%bd%d0%b5%d0%bb%d0%b8%d0%b1%d1%80%d0%b8-2026-%d1%82%d0%b5%d1%81%d0%bd%d0%b8%d1%8f%d1%82-%d0%bf%d1%8a%d1%82-%d0%ba%d1%8a%d0%bc-%d0%b4%d0%b0%d0%bb%d0%b5%d1%87%d0%bd%d0%b8%d1%8f-%d1%81/","pv":5},"el-topo":{"src":"https://www.ndk.bg/en/event/alexandro-xodorovski-kierticata-1970","pv":5},"holy-mountain":{"src":"https://www.ndk.bg/en/event/alexandro-xodorovski-sveshhenata-planina-1973","pv":5},"kosa":{"dir":"Милош Форман Сценарист","src":"https://vlaikovacinema.com/screening/%d0%ba%d0%b8%d0%bd%d0%be-%d0%be%d1%82-70-%d1%82%d0%b5-%d0%ba%d0%be%d1%81%d0%b0-1979/","pv":5},"magyosnika":{"synBg":"Русия, началото на 90-те години. На фона на постсъветския хаос един обаятелен млад мъж, Вадим Баранов, проправя стремително своя професионален път. Първоначално човек на изкуството, след това продуцент на риалити телевизия, той става политически консултант на изгряващия агент на КГБ Владимир Путин. Вече в сърцето на властта, Баранов участва активно в изграждането на имиджа на една „нова Русия“, размивайки границите между истината и лъжата, вярата и манипулацията. Само магнетичната Ксения е извън неговия контрол и го изкушава да се отдалечи от тази опасна игра. Години по-късно, след като се е оттеглил в мълчание и личността му е обвита в мистерия, Баранов най-накрая проговаря и разкрива мрачните тайни на режима, за чието налагане е работил.","dir":"Оливие Асаяс","cast":"Джуд Лоу, Алисия Викандер, Пол Дейно, Том Стъридж, Джефри Райт","src":"https://programata.bg/kino/filmi/magosnika-ot-kremal/","pv":5},"zarazno-zlo":{"synBg":"В центъра на Заразно зло е Брайън – куриер, чиято привидно обикновена задача да достави медицински пакет го въвлича в поредица от ужасяващи събития, които завинаги ще променят живота му. Попаднал в Ракуун Сити в момент, когато градът е обхванат от хаос и поголовна смърт, Брайън трябва да разчита единствено на инстинктите си, за да оцелее сред кошмара, който се разгръща около него.","dir":"Зак Крегър","cast":"Остин Ейбрамс, Зак Чери, Кали Рейс, Пол Уолтър Хаузър","genres":["Хорър"],"src":"https://programata.bg/kino/filmi/zarazno-zlo/","pv":5,"img":"https://programata.bg/wp-content/uploads/2026/09/ekranna-snimka-2026-09-17-120618.png"},"otmastitelite-krayat-spetsialno-izdanie":{"synBg":"След опустошителните събития на Avengers: Infinity War (2018), вселената е в руини. С помощта на останалите съюзници, Отмъстителите се събират отново, за да обърнат действията на Танос и да възстановят баланса във вселената.","dir":"Антъни Русо и Джо Русо","cast":"Робърт Дауни-младши, Крис Еванс, Марк Ръфало, Крис Хемсуърт, Скарлет Йохансон","genres":["Екшън","Приключенски"],"src":"https://programata.bg/kino/filmi/otmastitelite-krayat-speczialno-izdanie/","pv":5,"img":"https://programata.bg/wp-content/uploads/2026/09/original.jpg"},"payatsi":{"synBg":"Продуцентите зад екшън поредицата John Wick са готови да превземат киносалоните този октомври с хорър-трилъра Crawlers (Паяци) . Лента const SYN_EN = {"kucheto-na-zlatyu":"Guided by the restless spirit of the artist Zlatyu Boyadzhiev, two contemporary artists embark on a journey to reinterpret his legacy, blurring the boundaries between past and present, reality and fiction, irony and sadness.","cherno-more":"Drama on the Black Sea coast.","kokoshka":"A Balkan tragicomedy.","sbogom-buenos-ayres":"Buenos Aires, 2001. Tango, crisis and the decision whether to leave.","sentimentalno":"Two couples explore the complexities of modern relationships in this dazzling comedy, comparable to Paolo Genovese’s *Perfect Strangers*. *Sentimentale* is an adaptation of Cesc Gay’s first play.","pomilvane":"One of the undisputed audience favourites of the past year, the film made a triumphant opening at the Venice Film Festival and was honoured with seven awards. For his portrayal of the Italian president Mariano De Santis, a character brimming with inner drama, actor Toni Servillo won the Volpi Cup. Critics are unanimous in their view that this is Sorrentino’s most powerful and moving film since *The Great Beauty*. The Italian visionary has created a new cinematic masterpiece – a wise and enchanting story of love, forgiveness, mercy and reckoning.","tigrite":"In *Los tigres*, Alberto Rodríguez returns to a genre he knows well — the Spanish thriller, in which criminal intrigue goes hand in hand with human drama. This time, the director of *The Minimal Island* sets his story against the industrial backdrop of Huelva, amidst oil tankers, refineries and the sombre, sun-glistening waters of the sea.","milen-filmat":"From the makers of *Morality Is Good*, which became a cultural phenomenon and the most-watched documentary in Bulgaria in 2022, Milen traces the life and career of Milen Tsvetkov against the backdrop of the historical events in Bulgaria that transformed journalism and the media landscape in the country after 1989. The film aims to inform the public about the development of journalism over recent decades, the people who have shaped the landscape, the mistakes that have been made, and the achievements. A central theme of the film is the struggle for freedom of speech in Bulgaria.","syankata-na-karavadzho":"Italy, early 17th century. Caravaggio was not only one of the most accomplished artists of his time, but also a rebel against the dogmas of the Church, which dictated how religious subjects were to be depicted.","ulitsa-malaga":"María Ángeles is a very independent elderly woman who lives in the Spanish quarter of Tangier. When her daughter Clara arrives for a long-awaited visit, she has a specific aim – to pressure María into selling her house, which was left to Clara by her late father, to help her cope with her own financial difficulties following her divorce. But Maria, deeply rooted in the community and loved by her neighbours, decides to stay.","zooekspres":"When a train unexpectedly sets off, carrying only pets, the animals discover that Hans – a badger harbouring a grudge – is behind it all. Whilst it seems that a clash is inevitable, the animals can count on Falcon – a cunning raccoon – who will do everything in his power to save them.","naza":"Filmed at night on the rooftops of Tel Aviv, the film reveals in detail the systems behind Israel’s organised mass slaughter of Palestinian civilians in Gaza.","animatsionni-filmi-na-stoyan-dukov":"An Pasán – 1976, 10’ The Golden Treasure – 1964, 7’ Well done, well done indeed! – 1986, 2’ Ga, ga, hurrah! – 1988, 8’ Houses as Fortresses – 1967, 8’ Jealousy – 1963, 7’ Mini Midi Maxi – 1971, 8’ A Musical Story – 1976, 7’","animatsionni-filmi-na-nastimir-tsachev-i-vyara-doneva":"The Clock – 2006, 2’ Terraforming – 2017, 10’ The Nest – 2023, 7’ The Chimney Sweep – 2026, 8’","s-vnimanie-kam-detayla":"A film about one of the pioneers of cinematography in Bulgaria. Georgi Karayordanov introduced some of Bulgaria’s most renowned cinematographers of today to the world of cinema, including Emil Hristov, Ivan Varimezov, Konstantin Zankov, Emilia Stoeva, Georgi Nikolov, Kalin Ivanov, Krasimir Andonov and Rali Ralchev.","dahomey":"November 2021. Twenty-six royal treasures from the Kingdom of Dahomey are set to leave Paris and return to their country of origin – the present-day Republic of Benin. Along with thousands of others, these artefacts were looted by French colonial troops in 1892. How should we view the return of this valuable material heritage to a country that has had to develop without it? The debate is raging amongst students at the University of Abomey-Calavi.","hroniki-za-neudobnata-istina-istinata-za-balgarskiyat-cherno":"The documentary traces the reaction of the Bulgarian authorities and the information blackout during the Chernobyl disaster in 1986. The film draws on state archives, classified documents and personal accounts from experts to reveal the risks to public health that were kept under wraps.","kitovete-paziteli-na-planetata":"Inspired by the poem ‘Whale Nation’ by the English poet Heathcote Williams, the film treats us to superb footage of whales, filmed in the four corners of the globe. Focusing in particular on the songs of these giant mammals, with humpback whales as the main protagonists, the film’s approach is initially classic, but soon offers an inventive perspective. The visual beauty, the narrative and the wonderful music (the director’s decision to ‘shake the dust off’ the rhythm of documentary cinema, shifting from pop to jazz), draw the audience’s attention to the important theme of wildlife, which we are, willingly or unwillingly, ruining and destroying, even though it is essential to human survival.","kotki-v-muzeya-2-sakrovishtata-na-egipet":"Two years ago, our heroes saved the Mona Lisa. Today, Maurice the mouse can’t wait to prove himself once again, whilst Vincent and Cleopatra are the parents of two mischievous kittens and are looking forward to new adventures. Their next journey will pit them against one another…","kina-i-yuk-lisitsite-ot-dalechniya- rmance.","kontrabasat":"A musician from the orchestra and the instrument that has shaped his entire life.","golemanov":"Bulgarian political comedy — the man who wants to become a minister at any cost.","lisicheta":"A family that is tearing itself apart over money.","karakondzhul":"A Bulgarian drama.","piano-v-trevata":"Friends meet up after many years and realise they no longer get on.","zhenata-konbini":"A woman works in a Japanese 24-hour shop, and this suits her better than society would have us believe.","bashtata":"Dementia, as experienced from the inside — the viewer loses their bearings alongside the protagonist.","belezhkite":"What remains below the line.","bezkraynite-sceni":"In and around the theatre.","venecianskiyat":"The loan, the fragment of flesh, and the court that decides what mercy means.","narodat-na-vazov":"Vazov’s characters, gathered on one stage.","kogato-gram-udari":"Based on a story by Yordan Yovkov.","violonchelo":"A comedy about a quartet and a problem.","creve-coeur":"Four women in St Louis in the 1930s, and the Sunday that saves none of them.","nyakoy-shte-doyde":"Two people are buying a house far away from everyone. Someone will come.","kaligula":"The emperor who sets out to prove that freedom without limits is unbearable.","rozenkranc":"‘Hamlet’ as seen through the eyes of two minor characters who don’t understand what’s going on.","opit-za-letene":"Based on a work by Yordan Radichkov.","posledna-stapka":"Contemporary drama.","bozhe-moy":"An intimate drama.","orfey":"The descent and the only condition: don’t look back.","edni-momicheta":"A man meets up with four of his exes to make sense of himself.","elementarnite-chastici":"Based on the novel by Michel Houellebecq.","vinovniyat":"An emergency call centre operator receives a call that changes everything. Told entirely from the perspective of a single room.","kovarstvo-i-lyubov":"Love across the class divide and the intrigue that destroys it.","orazhiyata-i-chovekat":"A show about war, heroism and the chocolate soldier.","kuklen-dom-2":"Nora returns fifteen years after she slammed the door.","plach-na-angel":"An intimate drama.","hipotetichno":"A contemporary performance.","petrovi":"Based on the novel by Alexei Salnikov.","nechovek":"Contemporary drama.","dve":"Two actors, fourteen roles, one bar.","mrak-na-kraya":"Contemporary drama.","cvetat-na-dalbokite":"Drama.","albion":"An English garden and the woman trying to restore it to its former glory. An allegory of nostalgia for a country that no longer exists.","trima-krale":"A production by the Vazrazhdane Theatre.","posledniyat-strasten":"A middle-aged man makes three attempts to be unfaithful. All three fail in different ways.","ee":"A production by the Youth Theatre.","frankenshtayn":"A puppet version of Mary Shelley — the creator and the creature, and the question of which of the two is the monster.","bebe-na-borda":"Comedy."};

<script>
/* ---- failure trap: installed first, so a bad data.js still shows something ---- */
(function(){
  var LSKEY="sofia-screen-v2";
  /* Optional maps live in their own scripts and can go missing if a build step
     misfires. Falling back to {} keeps the app fully usable (no posters, no
     prices) instead of throwing inside a click handler and looking "frozen". */
  ["POSTERS","TMDBART","SHOWART","SHOWALIAS","FILMINFO","PRICES","SYN_EN","TITLE_EN","PRELIM_FROM"].forEach(function(n){
    try{ if(typeof window[n]==="undefined" && !(n in globalThis)) window[n]={}; }catch(e){ window[n]={}; }
  });
  function panel(msg){
    var app=document.getElementById("app"); if(!app)return;
    app.innerHTML='<div style="max-width:560px;margin:56px auto;padding:0 20px;font:15px/1.6 system-ui;color:#B6ABBC">'
     +'<div style="font:700 13px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:#E0163A;margin-bottom:14px">Sofia Gleda</div>'
     +'<h1 style="font:600 20px/1.3 system-ui;color:#F4EFF6;margin:0 0 10px">Приложението не можа да се зареди</h1>'
     +'<p style="margin:0 0 16px">Опитай да презаредиш. Ако се повтаря, изчистването на запазените настройки обикновено помага.</p>'
     +'<button id="hardreset" style="padding:11px 20px;border-radius:10px;background:#E0163A;color:#fff;border:0;font:600 14px system-ui;cursor:pointer">Изчисти и опитай пак</button>'
     +'<details style="margin-top:22px"><summary style="cursor:pointer;font-size:13px">Техническа подробност</summary>'
     +'<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#7E7386;margin-top:8px"></pre></details></div>';
    var pre=app.querySelector("pre"); if(pre)pre.textContent=String(msg||"");
    var rb=document.getElementById("hardreset");
    if(rb)rb.onclick=function(){try{localStorage.removeItem(LSKEY);}catch(e){}location.reload();};
  }
  window.__sofiaPanel=panel;
  window.addEventListener("error",function(e){
    var app=document.getElementById("app");
    if(app&&app.innerHTML.indexOf("Зареждане на програмата")>-1)
      panel((e&&(e.message||e.error))||"script error");
  });
  var missing=[];
  ["FILMS","SHOWTIMES","CINEMAS","SHOWS","PERFORMANCES","THEATRES","EVENTS",
   "BOOKING","TICKET_HUBS","TASTE_FILMS","TASTE_SHOWS","SNAPSHOT"].forEach(function(n){
    try{ if(typeof window[n]==="undefined"&&typeof eval("typeof "+n)==="undefined")missing.push(n); }
    catch(err){ missing.push(n); }
  });
  if(missing.length){ panel("Данните не се заредиха: "+missing.join(", ")); throw new Error("data missing"); }
})();

   trusting the snapshot's start date — otherwise the app forever thinks "today"
   is the day the data was captured and keeps showing screenings that have long
   since passed. Date maths elsewhere stays UTC/ISO-string based (see dUTC). */
const NOW_SOFIA=(()=>{
  try{const p={};
    new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Sofia",year:"numeric",month:"2-digit",
      day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})
      .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
    return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour==="24"?"00":p.hour}:${p.minute}`};
  }catch(e){return{date:SNAPSHOT.window.from,time:"00:00"};}
})();
const NOW_DATE=NOW_SOFIA.date, NOW_TIME=NOW_SOFIA.time;
/* Lower bound clamped into the snapshot so the month/day helpers never run off
   the front of the data; if "now" is already past the window the app simply
   shows an empty, honest programme rather than stale past dates. */
const TODAY=NOW_DATE<SNAPSHOT.window.from?SNAPSHOT.window.from:NOW_DATE;
const LASTDAY=SNAPSHOT.window.to;
/* UTC throughout: parsing as local time and reporting as UTC shifts the date
   in any timezone east of Greenwich. */
const dUTC=iso=>new Date(iso+"T00:00:00Z");
const addDays=(iso,n)=>{const d=dUTC(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
/* Hide what has already happened: whole days in the past, and today's start
   times that are behind the Sofia clock. upcomingRows narrows each showtime
   row's time list; a row left with no upcoming time is dropped entirely. */
const timeIsUpcoming=(d,tm)=>d>NOW_DATE||(d===NOW_DATE&&(!tm||tm>=NOW_TIME));
function upcomingRows(rows){const out=[];for(const r of rows){if(r[2]<NOW_DATE)continue;
  const tms=r[2]===NOW_DATE?r[3].filter(tm=>tm>=NOW_TIME):r[3];
  if(tms.length)out.push([r[0],r[1],r[2],tms]);}return out;}
const upcomingPerfs=ps=>ps.filter(p=>timeIsUpcoming(p[1],p[2]));
const MONTHS=(()=>{
  const out=[],seen=new Set();
  let d=TODAY, guard=0;
  while(d<=LASTDAY && guard++<400){                 /* guard: never hang the page */
    const m=d.slice(0,7); if(!seen.has(m)){seen.add(m);out.push(m);}
    const next=addDays(d,1);
    if(next<=d) break;                               /* refuses to advance — bail out */
    d=next;

})();

/* translitBG: official Bulgarian Streamlined System transliteration.
   Handles capitalisation; "ия" at word end → "ia". */
function translitBG(s){
 if(!s)return s;
 const MAP={
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y",
  "к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u",
  "ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a","ь":"y","ю":"yu","я":"ya"
 };
 /* Handle "ия" at word-end → "ia" */
 s=s.replace(/ия(?=\b|[^а-яА-ЯъьюяЮЯ]|$)/gi,(m,o,str)=>{
  const isUpper=str[o]==="И";return isUpper?"IA":"ia";});
 let out="";
 for(let i=0;i<s.length;i++){
  const c=s[i],lo=c.toLowerCase();
  if(MAP[lo]){
   const tr=MAP[lo];
   /* Preserve capitalisation: uppercase if source char is uppercase */
   out+=c===lo?tr:tr[0].toUpperCase()+tr.slice(1);
  }else{out+=c;}
 }
 return out;
}

/* ===================== scoring ===================== */
function genreHits(genres){let n=0;
  S.prefs.genres.forEach(id=>{const g=GENRES.find(x=>x.id===id);if(g&&g.m.some(m=>genres.includes(m)))n++;});
  return n;}
function moodHits(genres){let n=0;const all=[...MOODS.cinema,...MOODS.theatre];
  S.prefs.mood.forEach(id=>{const m=all.find(x=>x.id===id);if(m&&m.m.some(x=>genres.includes(x)))n++;});
  return n;}
const TASTE_BY_ID=Object.fromEntries([...TASTE_FILMS,...TASTE_SHOWS].map(x=>[x.id,x]));
function tasteHits(genres){
  let n=0;
  S.prefs.taste.forEach(tid=>{
    const o=TASTE_BY_ID[tid]||filmById[tid]||showById[tid]; if(!o)return;
    const og=o.genres||[]; og.forEach(x=>{if(genres.includes(x))n++;});});
  return n;}
function withBonus(genres){const w=S.prefs.with;
  if(w==="kids")return genres.some(g=>["Анимация","Семеен","Детски","Куклен","Приказка","Улично"].includes(g))?5:-4;
  if(w==="date")return genres.some(g=>["Романтика","Драма","Комедия","Музикален"].includes(g))?2:0;
  if(w==="friends")return genres.some(g=>["Комедия","Екшън","Хорър","Концерт","Танц","Фестивал"].includes(g))?2:0;
  if(w==="solo")return genres.some(g=>["Драма","Артхаус","Документален","Класика","Експериментален"].includes(g))?2:0;
  return 0;}
function scoreFilm(f,day){
  const rows=filmTimes(f.id,day); if(!rows.length)return -1;
  let s=genreHits(f.genres)*4.5+moodHits(f.genres)*3+tasteHits(f.genres)*2.2+withBonus(f.genres);
  if(rows.some(r=>r[3].some(inWhen)))s+=3;
  {const _im=imdbOf(f);if(_im!=null)s+=(_im-6)*1.5;}
  s+=Math.min(rows.reduce((n,r)=>n+r[3].length,0),12)*0.1;
  if(S.prefs.taste.includes(f.id))s+=6;
  return s;}
function scoreShow(sh,day){
  const p=showPerfs(sh.id,day); if(!p.length)return -1;
  let s=genreHits(sh.genres)*4.5+moodHits(sh.genres)*3+tasteHits(sh.genres)*2.2+withBonus(sh.genres);
  if(p.some(x=>inWhen(x[2])))s+=3;
  if(sh.badge)s+=2;
  if(sh.reviews&&sh.reviews.length>1)s+=1;
  if(S.prefs.taste.includes(sh.id))s+=6;
  return s;}

function genreHit(genres){/* OR across selected genres */ return S.fGenres.some(gid=>{const g=GENRES.find(x=>x.id===gid);return g&&g.m.some(m=>genres.includes(m));});}

/* Format a date range including month name; same-month → month at end only.
   fmtDay(iso,false) gives e.g. "ср 7"; fmtDay(iso,true) gives "7 октомври".
   Result: "ср 7 – нд 11 октомври" (same month) or "пн 26 октомври – нд 1 ноември" */
function fmtRange(isoA,isoB){
  const L=t(),dA=dUTC(isoA),dB=dUTC(isoB);
  const mA=dA.getUTCMonth(),mB=dB.getUTCMonth();
  const dowA=L.dows[dA.getUTCDay()],dowB=L.dows[dB.getUTCDay()];
  const mnA=L.months[mA],mnB=L.months[mB];
  if(mA===mB)return`${dowA} ${dA.getUTCDate()} – ${dowB} ${dB.getUTCDate()} ${mnB}`;
  return`${dowA} ${dA.getUTCDate()} ${mnA} – ${dowB} ${dB.getUTCDate()} ${mnB}`;}
/* Period banner text: headline + date subtitle */

  if(S.day==="month"){

  if(S.day==="all"){
    return{title:L.bannerAll,dates:fmtDay(LASTDAY,true)};}

    const d=S.rTo?fmtRange(S.rFrom,S.rTo):fmtDay(S.rFrom,true);
    return{title:L.bannerCustom,dates:d};}
  if(/^\d{4}-\d{2}-\d{2}$/.test(S.day)){
    const dD=dUTC(S.day);return{title:L.bannerToday,dates:`${L.dows[dD.getUTCDay()]} ${dD.getUTCDate()} ${L.months[dD.getUTCMonth()]}`};}
  return{title:L.bannerWeek,dates:fmtRange(TODAY,WEEK_END)};}
/* Build the day-strip for the typographic header.
   Shows "Цялата седмица" + each day from TODAY to the coming Sunday.
   Only shown for S.day==="week" and for a single specific day within the current week. */
function buildDayStrip(){
  const L=t();
  /* Determine the week: Mon before TODAY to Sun after TODAY */
  const dow=dUTC(TODAY).getUTCDay(); /* 0=Sun … 6=Sat */
  const weekStart=addDays(TODAY,-(dow===0?6:dow-1)); /* Monday */
  const weekEnd=addDays(weekStart,6);                 /* Sunday */
  /* Only show the strip when in week or single-day-within-week mode */
  const inWeekDay=S.day!=="week"&&/^\d{4}-\d{2}-\d{2}$/.test(S.day)&&S.day>=weekStart&&S.day<=weekEnd;
  if(S.day!=="week"&&!inWeekDay)return"";
  /* Gather which days have screenings/performances */
  const hasData=datesWith();
  const pills=[];
  /* "Whole week" pill */
  const allPill=`<button class="dspill" data-day="week" aria-pressed="${S.day==="week"}">${esc(L.dsAllWeek||"Цялата седмица")}</button>`;
  pills.push(allPill);
  /* Start from TODAY — no past-day pills */
  const daysLeft=weekEnd>=TODAY?Math.round((dUTC(weekEnd)-dUTC(TODAY))/864e5)+1:0; /* dUTC: ISO parse works in every engine (Safari rejects 'YYYY-MM-DD UTC') */
  for(let i=0;i<daysLeft;i++){
    const d=addDays(TODAY,i);
    if(d>LASTDAY)break;
    const active=S.day===d;
    const hasSc=hasData.has(d);
    const isToday=d===TODAY;
    const label=fmtDay(d,false); /* e.g. "ср 7" */
    const todayMark=isToday?`<span class="ds-today">${esc(L.dsToday||"днес")}</span>`:"";
    pills.push(`<button class="dspill"${hasSc?"":' disabled'} data-day="${esc(d)}" aria-pressed="${active}">${esc(label)}${todayMark}</button>`);
  }
  return`<div class="daystrip">${pills.join("")}</div>`;}

function periodBanner(){
  const L=t();
  /* Build title and date range */
  let mainTitle="",dateStr="",eyebrow=L.pheadEyebrow||"Програмата",showStrip=false;
  if(S.day==="week"){
    mainTitle=L.pheadThisWeek||(S.lang==="bg"?"Тази седмица":"This week");
    dateStr=fmtRange(TODAY,WEEK_END);
    showStrip=true;
  } else if(S.day===TODAY||S.day===NOW_DATE){
    const dT=dUTC(TODAY);
    mainTitle=L.pheadToday||(S.lang==="bg"?"Днес":"Today");
    dateStr=`${L.dows[dT.getUTCDay()]} ${dT.getUTCDate()} ${L.months[dT.getUTCMonth()]}`;
    showStrip=true;
  } else if(S.day==="month"){
    mainTitle=L.pheadThisMonth||(S.lang==="bg"?"Този месец":"This month");
    dateStr=fmtRange(TODAY,lastOfMonth(TODAY));
  } else if(S.day==="all"){
    mainTitle=L.pheadAll||(S.lang==="bg"?"Цялата програма":"Full programme");
    dateStr=`${S.lang==="bg"?"до":"until"} ${fmtDay(LASTDAY,true)}`;
  } else if(S.day==="range"&&S.rFrom){
    mainTitle=L.pheadCustom||(S.lang==="bg"?"Избран период":"Selected period");
    dateStr=S.rTo?fmtRange(S.rFrom,S.rTo):fmtDay(S.rFrom,true);
  } else if(/^\d{4}-\d{2}-\d{2}$/.test(S.day)){
    /* single specific day */
    const dD=dUTC(S.day);
    const dowFull=L.dowsLong[dD.getUTCDay()];
    const cap=dowFull.charAt(0).toUpperCase()+dowFull.slice(1);
    mainTitle=`${cap}`;
    dateStr=`${dD.getUTCDate()} ${L.months[dD.getUTCMonth()]}`;
    /* show strip only if day is within current week */
    const dow=dUTC(TODAY).getUTCDay();
    const weekStart=addDays(TODAY,-(dow===0?6:dow-1));
    const weekEnd=addDays(weekStart,6);
    if(S.day>=weekStart&&S.day<=weekEnd)showStrip=true;
  } else {
    mainTitle=L.pheadThisWeek||(S.lang==="bg"?"Тази седмица":"This week");
    dateStr=fmtRange(TODAY,WEEK_END);
    showStrip=true;
  }
  const strip=showStrip?buildDayStrip():"";
  return`<div class="phead">
    <div class="phead-eyebrow">${esc(eyebrow)}</div>
    <div class="phead-title">${esc(mainTitle)} <span class="phead-dates">${esc(dateStr)}</span></div>
    ${strip}
    <button class="phead-other" data-drawer aria-label="${esc(L.pheadOtherDates||"Друг период")}">${esc(L.pheadOtherDates||"Друг период ›")}</button>
  </div>`;}
