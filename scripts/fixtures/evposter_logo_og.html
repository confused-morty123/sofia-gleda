<!doctype html>
<!-- hand-made for scripts/test_parsers.py (fetch_event_posters): a site whose og:image and

<meta charset="utf-8">
<meta property="og:image" content="https://festival.example.bg/wp-content/uploads/2021/03/site-logo-fb.png">

<div class="text"><p>Програмата <a href="https://www.facebook.com/festival">във Facebook</a>.</p></div>
<div class="related"><a href="https://festival.example.bg/drug-post/"><img src="https://festival.example.bg/wp-content/uploads/2026/08/other-event-1200x800.jpg" class="wp-post-image" alt=""></a></div>
</body></html>
