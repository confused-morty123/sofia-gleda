<script>

function deleteAllCookies() {

    if (!confirm("Сигурни ли сте, че искате да изтриете всички бисквитки?")) {
        return;
    }

   // =========================
    // 1. DELETE ALL COOKIES
    // =========================
    var cookies = document.cookie.split(";");

    for (var i = 0; i < cookies.length; i++) {

        var cookie = cookies[i];
        var eqPos = cookie.indexOf("=");
        var name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();

        var paths = [
            "/",
            location.pathname,
            location.pathname.split('/')[1] ? "/" + location.pathname.split('/')[1] : ""
        ];

        var domains = [
            location.hostname,
            "." + location.hostname,
            ""
        ];

        for (var p = 0; p < paths.length; p++) {
            for (var d = 0; d < domains.length; d++) {

                var cookieStr = name + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=" + paths[p] + ";";

                if (domains[d] !== "") {
                    cookieStr += " domain=" + domains[d] + ";";
                }

                document.cookie = cookieStr;
            }
        }
    }

    // =========================
    // 2. CLEAR LOCAL STORAGE
    // =========================
    try {
        if (window.localStorage) {
            localStorage.clear();
        }
    } catch (e) {}

    // =========================
    // 3. CLEAR SESSION STORAGE
    // =========================
    try {
        if (window.sessionStorage) {
            sessionStorage.clear();
        }
    } catch (e) {}

    // =========================
    // 4. OPTIONAL: DELETE COOKIES BY KEY (fallback brute force)
    // =========================
    try {
        var allKeys = Object.keys ? Object.keys(localStorage || {}) : [];
        for (var k = 0; k < allKeys.length; k++) {
            localStorage.removeItem(allKeys[k]);
        }
    } catch (e) {}

    alert("Бисквитките са изтрити.");
    location.reload();
}
</script>
